urde der Prior Leonardus\r\nzu ihr gerufen. Schon läuteten aufs neue alle Glocken des Klosters,\r\nund dazwischen tönten die donnernden Töne der Orgel, die Weihgesänge\r\nder im Chor versammelten Schwestern, durch die Lüfte, als der Prior\r\nwieder in den Saal trat. Nun begaben sich die Brüder der verschiedenen\r\nOrden in feierlichem Zuge nach der Kirche, die von Menschen beinahe\r\nso überfüllt war, als sonst am Tage des heiligen Bernardus. An einer\r\nSeite des mit duftenden Rosen geschmückten Hochaltars waren erhöhte\r\nSitze für die Geistlichkeit angebracht, der Tribüne gegenüber, auf\r\nwelcher die Kapelle des Bischofs die Musik des Amts, welches er\r\nselbst hielt, ausführte. Leonardus rief mich an seine Seite, und ich\r\nbemerkte, daß er ängstlich auf mich wachte; die kleinste Bewegung\r\nerregte seine Aufmerksamkeit; er hielt mich an, fortwährend aus meinem\r\nBrevier zu beten. Die Klaren Nonnen versammelten sich in dem mit einem\r\nniedrigen Gitter eingeschlossenen Platz dicht vor dem Hochaltar, der\r\nentscheidende Augenblick kam; aus dem Innern des Klosters, durch die\r\nGittertüre hinter dem Altar, führten die Cisterziensernonnen Aurelien\r\nherbei. — Ein Geflüster rauschte durch die Menge, als sie sichtbar\r\ngeworden, die Orgel schwieg und der einfache Hymnus der Nonnen erklang\r\nin wunderbaren, tief ins Innerste dringenden Akkorden. Noch hatte ich\r\nkeinen Blick aufgeschlagen; von einer furchtbaren Angst ergriffen,\r\nzuckte ich krampfhaft zusammen, so daß mein Brevier zur Erde fiel. Ich\r\nbückte mich darnach, es aufzuheben, aber ein plötzlicher Schwindel\r\nhätte mich von dem hohen Sitz herabgestürzt, wenn Leonardus mich nicht\r\nfaßte und festhielt. „Was ist dir, Medardus,“ sprach der Prior leise,\r\n„du befindest dich in seltsamer Bewegung, widerstehe dem bösen Feinde,\r\nder dich treibt.“ Ich faßte mich mit aller Kraft zusammen, ich schaute\r\nauf, und erblickte Aurelien, vor dem Hochaltar knieend. O Herr des\r\nHimmels, in hoher Schönheit und Anmut strahlte sie mehr als je! Sie war\r\nbräutlich — ach! ebenso wie an jenem verhängnisvollen Tage, da sie\r\nmein werden sollte, gekleidet. Blühende Myrten und Rosen im künstlich\r\ngeflochtenen Haar. Die Andacht, das Feierliche des Moments, hatte\r\nihre Wangen höher gefärbt, und in dem zum Himmel gerichteten Blick\r\nlag der volle Ausdruck himmlischer Lust. Was waren jene Augenblicke,\r\nals ich Aurelien zum erstenmal, als ich sie am Hofe des Fürsten sah,\r\ngegen dieses Wiedersehen. Rasender als jemals flammte in mir die Glut\r\nder Liebe — der wilden Begier auf — O Gott — o, all ihr Heiligen!\r\nlaßt mich nicht wahnsinnig werden, nur nicht wahnsinnig — rettet\r\nmich, rettet mich von dieser Pein der Hölle. — Nur nicht wahnsinnig\r\nlaßt mich werden — denn das Entsetzliche muß ich sonst tun, und\r\nmeine Seele preisgeben der ewigen Verdammnis! — So betete ich im\r\nInnern, denn ich fühlte, wie immer mehr und mehr der böse Geist über\r\nmich Herr werden wollte. — Es war mir als habe Aurelie teil an dem\r\nFrevel, den ich nur beging, als sei das Gelübde, das sie zu leisten\r\ngedachte, in ihren Gedanken nur der feierliche Schwur, vor dem Altar\r\ndes Herrn <em class=\"gesperrt\">mein<\/em> zu sein. — Nicht die Christusbraut, des Mönchs\r\nder sein Gelübde brach verbrecherisches Weib sah ich in ihr. — Sie\r\nmit aller Inbrunst der wütenden Begier umarmen und dann ihr den Tod\r\ngeben — <em class=\"gesperrt\">der<\/em> Gedanke erfaßte mich unwiderstehlich. Der böse\r\nGeist trieb mich wilder und wilder — schon wollte ich schreien:\r\n„Haltet ein, verblendete Toren, nicht die von irdischem Triebe reine\r\nJungfrau, die Braut des Mönchs wollt ihr erheben zur Himmelsbraut!“\r\n— mich hinabstürzen unter die Nonnen, sie herausreißen — ich faßte\r\nin die Kutte, ich suchte nach dem Messer, da war die Zeremonie so\r\nweit gediehen, daß Aurelie anfing das Gelübde zu sprechen. — Als ich\r\nihre Stimme hörte, war es, als bräche milder Mondesglanz durch die\r\nschwarzen, von wildem Sturm gejagten Wetterwolken. Licht wurde es\r\nin mir, und ich erkannte den bösen Geist, dem ich mit aller Gewalt\r\nwiderstand. — Jedes Wort Aureliens gab mir neue Kraft, und im heißen\r\nKampf wurde ich bald Sieger. Entflohen war jeder schwarze Gedanke des\r\nFrevels, jede Regung der irdischen Begier. — Aurelie war die fromme\r\nHimmelsbraut, deren Gebet mich retten konnte von ewiger Schmach und\r\nVerderbnis. — Ihr Gelübde war mein Trost, meine Hoffnung, und hell\r\nging in mir die Heiterkeit des Himmels auf. Leonardus, den ich nun erst\r\nwieder bemerkte, schien die Änderung in meinem Innern wahrzunehmen,\r\ndenn mit sanfter Stimme sprach er: „Du hast dem Feinde widerstanden,\r\nmein Sohn! das war wohl die letzte schwere Prüfung, die dir die ewige\r\nMacht auferlegt!“ —<\/p>\r\n<p>Das Gelübde war gesprochen; während eines Wechselgesanges, den die\r\nKlaren Schwestern anstimmten, wollte man Aurelien das Nonnengewand\r\nanlegen. Schon hatte man die Myrten und Rosen aus dem Haar geflochten,\r\nschon stand man im Begriff die herabwallenden Locken abzuschneiden,\r\nals ein Getümmel in der Kirche entstand — ich sah, wie die Menschen\r\nauseinander gedrängt und zu Boden geworfen wurden; — näher und\r\nnäher wirbelte der Tumult. — Mit rasender Gebärde, — mit wildem,\r\nentsetzlichen Blick drängte sich ein halbnackter Mensch (die Lumpen\r\neines Kapuzinerrocks hingen ihm um den Leib), alles um sich her mit\r\ngeballten Fäusten niederstoßend, durch die Menge. — Ich erkannte\r\nmeinen gräßlichen Doppelgänger, aber in demselben Moment, als ich,\r\nEntsetzliches ahnend, hinabspringen und mich ihm entgegenwerfen wollte,\r\nhatte der wahnsinnige Unhold die Galerie, die den Platz des Hochaltars\r\neinschloß, übersprungen. Die Nonnen stäubten schreiend auseinander;\r\ndie Äbtissin hatte Aurelien fest in ihre Arme eingeschlossen. — „Ha\r\nha ha!“ — kreischte der Rasende mit gellender Stimme, „wollt ihr\r\nmir die Prinzessin rauben? — Ha ha ha! — die Prinzessin ist mein\r\nBräutchen, mein Bräutchen“ — und damit riß er Aurelien empor und\r\nstieß ihr das Messer, das er hochgeschwungen in der Hand hielt, bis an\r\ndas Heft in die Brust, daß des Blutes Springquell hoch emporspritzte.\r\n„Juchhe — Juch Juch — nun hab’ ich mein Bräutchen, nun hab’ ich die\r\nPrinzessin gewonnen!“ — So schrie der Rasende auf und sprang hinter\r\nden Hochaltar, durch die Gittertüre fort in die Klostergänge. Voll\r\nEntsetzen kreischten die Nonnen auf. — „Mord — Mord am Altar des\r\nHerrn,“ schrie das Volk, nach dem Hochaltar stürmend. „Besetzt die\r\nAusgänge des Klosters, daß der Mörder nicht entkomme,“ rief Leonardus\r\nmit lauter Stimme, und das Volk stürzte hinaus und wer von den Mönchen\r\nrüstig war, ergriff die im Winkel stehenden Prozessionsstäbe und\r\nsetzte dem Unhold nach durch die Gänge des Klosters. Alles war die Tat\r\neines Augenblicks; bald kniete ich neben Aurelien, die Nonnen hatten\r\nmit weißen Tüchern die Wunde, so gut es gehen wollte, verbunden, und\r\nstanden der ohnmächtigen Äbtissin bei. Eine starke Stimme sprach neben\r\nmir: „<span class=\"antiqua\">Sancta Rosalia, ora pro nobis<\/span>,“ und alle die noch in der\r\nKirche geblieben, riefen laut: „Ein Mirakel — ein Mirakel, ja sie ist\r\neine Märtyrin — <span class=\"antiqua\">Sancta Rosalia, ora pro nobis<\/span>.“ — Ich schaute\r\nauf. — Der alte Maler stand neben mir, aber ernst und mild, so wie er\r\nmir im Kerker erschien. — Kein irdischer Schmerz über Aureliens Tod,\r\nkein Entsetzen über die Erscheinung des Malers konnte mich fassen, denn\r\nin meiner Seele dämmerte es auf, wie nun die rätselhaften Schlingen,\r\ndie die dunkle Macht geknüpft, sich lösten.<\/p>\r\n<p>Mirakel, Mirakel! schrie das Volk immerfort; seht ihr wohl den alten\r\nMann im violetten Mantel? — der ist aus dem Bilde des Hochaltars\r\nherabgestiegen — ich habe es gesehen — ich auch, ich auch —\r\nriefen mehrere Stimmen durcheinander und nun stürzte alles auf die\r\nKnie nieder und das verworrene Getümmel verbrauste und ging über in\r\nein von heftigem Schluchzen und Weinen unterbrochenes Gemurmel des\r\nGebets. Die Äbtissin erwachte aus der Ohnmacht, und sprach mit dem\r\nherzzerschneidenden Ton des tiefen, gewaltigen Schmerzes: „Aurelie!\r\nmein Kind! meine fromme Tochter! — ewiger Gott — es ist dein\r\nRatschluß!“ — Man hatte eine mit Polstern und Decken belegte Bahre\r\nherbeigebracht. Als man Aurelien hinaufhob, seufzte sie tief und\r\nschlug die Augen auf. Der Maler stand hinter ihrem Haupte, auf das er\r\nseine Hand gelegt. Er war anzusehen wie ein mächtiger Heiliger, und\r\nalle, selbst die Äbtissin, schienen von wunderbarer, scheuer Ehrfurcht\r\ndurchdrungen. — Ich kniete beinahe dicht an der Seite der Bahre.\r\nAureliens Blick fiel auf mich, da erfaßte mich tiefer Jammer über der\r\nHeiligen schmerzliches Märtyrertum. Keines Wortes mächtig, war es nur\r\nein dumpfer Schrei, den ich ausstieß. Da sprach Aurelie sanft und\r\nleise: „Was klagst du über die, welche von der ewigen Macht des Himmels\r\ngewürdigt wurde von der Erde zu scheiden in dem Augenblick, als sie\r\ndie Nichtigkeit alles Irdischen erkannt, als die unendliche Sehnsucht\r\nnach dem Reich der ewigen Freude und Seligkeit ihre Brust erfüllte?“ —\r\nIch war aufgestanden, ich war dicht an die Bahre getreten. „Aurelie,“\r\nsprach ich, — „heilige Jungfrau! Nur einen einzigen Augenblick senke\r\ndeinen Blick herab aus den hohen Regionen, sonst muß ich vergehen\r\nin — meine Seele, mein innerstes Gemüt zerrüttenden, verderbenden\r\nZweifeln. — Aurelie! verachtest du den Frevler der, wie der böse\r\nFeind selbst, in dein Leben trat? — Ach! schwer hat er gebüßt — aber\r\ner weiß es wohl, daß alle Buße seiner Sünden Maß nicht mindert —\r\nAurelie! bist du versöhnt im Tode?“ — Wie von Engelsfittichen berührt,\r\nlächelte Aurelie und schloß die Augen. „O, — Heiland der Welt —\r\nheilige Jungfrau — so bleibe ich zurück, ohne Trost der Verzweiflung\r\nhingegeben! — O Rettung! — Rettung von höllischem Verderben!“ So\r\nbetete ich inbrünstig, da schlug Aurelie noch einmal die Augen auf\r\nund sprach: „Medardus — nachgegeben hast du der bösen Macht! aber\r\nblieb ich denn rein von der Sünde, als ich irdisches Glück zu erlangen\r\nhoffte in meiner verbrecherischen Liebe? — Ein besonderer Ratschluß\r\ndes Ewigen hatte uns bestimmt, schwere Verbrechen unseres freveligen\r\nStammes zu sühnen, und so vereinigte uns das Band der Liebe, die nur\r\nüber den Sternen thront und nichts gemein hat mit irdischer Lust. Aber\r\ndem listigen Feinde gelang es, die tiefe Bedeutung unserer Liebe uns\r\nzu verhüllen, ja uns auf entsetzliche Weise zu verlocken, daß wir\r\ndas Himmlische nur deuten konnten auf irdische Weise. — Ach! war\r\n<em class=\"gesperrt\">ich<\/em> es denn nicht, die dir ihre Liebe bekannte im Beichtstuhl,\r\naber statt den Gedanken der ewigen Liebe in dir zu entzünden, die\r\nhöllische Glut der Lust in dir entflammte, welche du, da sie dich\r\nverzehren wollte, durch Verbrechen zu löschen gedachtest? Fasse Mut,\r\nMedardus! der wahnsinnige Tor, den der böse Feind verlockt hat zu\r\nglauben, er sei du, und müsse vollbringen, was du begonnen, war das\r\nWerkzeug des Himmels, durch das sein Ratschluß vollendet wurde. —\r\nFasse Mut, Medardus — bald bald ...“ Aurelie, die das letzte schon\r\nmit geschlossenen Augen und hörbarer Anstrengung gesprochen, wurde\r\nohnmächtig, doch der Tod konnte sie noch nicht erfassen. „Hat sie Euch\r\ngebeichtet, ehrwürdiger Herr? hat sie Euch gebeichtet?“ so frugen\r\nmich neugierig die Nonnen. „Mit nichten,“ erwiderte ich: „nicht ich,\r\n<em class=\"gesperrt\">sie<\/em> hat meine Seele mit himmlischem Trost erfüllt.“ — „Wohl\r\ndir, Medardus, bald ist deine Prüfungszeit beendet — und wohl mir\r\ndann!“ Es war der Maler, der diese Worte sprach. Ich trat auf ihn\r\nzu: „So verlaßt mich nicht, wunderbarer Mann.“ — Ich weiß selbst\r\nnicht, wie meine Sinne, indem ich weiter sprechen wollte, auf seltsame\r\nWeise betäubt worden; ich geriet in einen Zustand zwischen Wachen und\r\nTräumen, aus dem mich ein lautes Rufen und Schreien erweckte. Ich sah\r\nden Maler nicht mehr. Bauern — Bürgersleute — Soldaten waren in die\r\nKirche gedrungen und verlangten durchaus, daß ihnen erlaubt werden\r\nsolle, das ganze Kloster zu durchsuchen, um den Mörder Aureliens,\r\nder noch im Kloster sein müsse, aufzufinden. Die Äbtissin, mit Recht\r\nUnordnungen befürchtend, verweigerte dies, aber ihres Ansehens\r\nunerachtet vermochte sie nicht die erhitzten Gemüter zu beschwichtigen.\r\nMan warf ihr vor, daß sie aus kleinlicher Furcht den Mörder verhehle,\r\nweil er ein Mönch sei, und immer heftiger tobend schien das Volk sich\r\nzum Stürmen des Klosters aufzuregen. Da bestieg Leonardus die Kanzel\r\nund sagte dem Volk nach einigen kräftigen Worten über die Entweihung\r\nheiliger Stätten, daß der Mörder keineswegs ein Mönch, sondern ein\r\nWahnsinniger sei, den er im Kloster zur Pflege aufgenommen, den er, als\r\ner tot geschienen, im Ordenshabit nach der Totenkammer bringen lassen,\r\nder aber aus dem todähnlichen Zustande erwacht und entsprungen sei.\r\nWäre er noch im Kloster, so würden es ihm die getroffenen Maßregeln\r\nunmöglich machen, zu entspringen. Das Volk beruhigte sich, und\r\nverlangte nur, daß Aurelie nicht durch die Gänge, sondern über den\r\nHof in feierlicher Prozession nach dem Kloster gebracht werden solle.\r\nDies geschah. Die verschüchterten Nonnen hoben die Bahre auf, die man\r\nmit Rosen bekränzt hatte. Auch Aurelie war, wie vorher, mit Myrten und\r\nRosen geschmückt. Dicht hinter der Bahre, über welche vier Nonnen den\r\nBaldachin trugen, schritt die Äbtissin von zwei Nonnen unterstützt,\r\ndie übrigen folgten mit den Klaren Schwestern, dann die Brüder der\r\nverschiedenen Orden, ihnen schloß sich das Volk an, und so bewegte sich\r\nder Zug durch die Kirche. Die Schwester, welche die Orgel spielte,\r\nmußte sich auf den Chor begeben haben, denn, sowie der Zug in der\r\nMitte der Kirche war, ertönten dumpf und schauerlich tiefe Orgeltöne\r\nvom Chor herab. Aber siehe, da richtete sich Aurelie langsam auf, und\r\nerhob die Hände betend zum Himmel, und aufs neue stürzte alles Volk auf\r\ndie Kniee nieder und rief <span class=\"antiqua\">Sancta Rosalia, ora pro nobis<\/span>. — So\r\nwurde <em class=\"gesperrt\">das<\/em> wahr, was ich, als ich Aurelien zum erstenmal sah, in\r\nsatanischer Verblendung nur frevelig heuchelnd, verkündet.<\/p>\r\n<p>Als die Nonnen in dem untern Saal des Klosters die Bahre niedersetzten,\r\nals Schwestern und Brüder betend im Kreis umherstanden, sank Aurelie\r\nmit einem tiefen Seufzer der Äbtissin, die neben ihr kniete, in die\r\nArme. — Sie war tot! — Das Volk wich nicht von der Klosterpforte,\r\nund als nun die Glocken den irdischen Untergang der frommen Jungfrau\r\nverkündeten, brach alles aus in Schluchzen und Jammergeschrei. — Viele\r\ntaten das Gelübde, bis zu Aureliens Exequien in dem Dorf zu bleiben,\r\nund erst nach denselben in die Heimat zurückzufahren, während der Zeit\r\naber strenge zu fasten. Das Gerücht von der entsetzlichen Untat, und\r\nvon dem Martyrium der Braut des Himmels, verbreitete sich schnell, und\r\nso geschah es, daß Aureliens Exequien, die nach vier Tagen begangen\r\nwurden, einem hohen, die Verklärung einer Heiligen feiernden Jubelfest\r\nglichen. Denn schon tags vorher war die Wiese vor dem Kloster, wie\r\nsonst am Bernardustage, mit Menschen bedeckt, die, sich auf dem Boden\r\nlagernd, den Morgen erwarteten. Nur statt des frohen Getümmels hörte\r\nman fromme Seufzer und ein dumpfes Murmeln. — Von Mund zu Mund ging\r\ndie Erzählung von der entsetzlichen Tat am Hochaltar der Kirche, und\r\nbrach einmal eine laute Stimme hervor, so geschah es in Verwünschungen\r\ndes Mörders, der spurlos verschwunden blieb. —<\/p>\r\n<p>Von tieferer Einwirkung auf das Heil meiner Seele waren wohl diese vier\r\nTage, die ich meistens einsam in der Kapelle des Gartens zubrachte,\r\nals die lange, strenge Buße im Kapuzinerkloster bei Rom. Aureliens\r\nletzte Worte hatten mir das Geheimnis meiner Sünden erschlossen\r\nund ich erkannte, daß ich, ausgerüstet mit aller Kraft der Tugend\r\nund Frömmigkeit, doch wie ein mutloser Feigling dem Satan, der den\r\nverbrecherischen Stamm zu hegen trachtete, daß er fort und fort\r\ngedeihe, nicht zu widerstehen vermochte. Gering war der Keim des Bösen\r\nin mir, als ich des Konzertmeisters Schwester sah, als der frevelige\r\nStolz in mir erwachte, aber da spielte mir der Satan jenes Elixier in\r\ndie Hände, das mein Blut wie ein verdammtes Gift in Gärung setzte.\r\nNicht achtete ich des unbekannten Malers, des Priors, der Äbtissin\r\nernste Mahnung. — Aureliens Erscheinung am Beichtstuhl vollendete\r\nden Verbrecher. Wie eine physische Krankheit, von jenem Gift erzeugt,\r\nbrach die Sünde hervor. Wie konnte der dem Satan Ergebene das Band\r\nerkennen, das die Macht des Himmels als Symbol der ewigen Liebe um\r\nmich und Aurelien geschlungen? — Schadenfroh fesselte mich der Satan\r\nan einen Verruchten, in dessen Sein mein Ich eindringen, so wie er\r\ngeistig auf mich einwirken mußte. Seinen scheinbaren Tod, vielleicht\r\ndas leere Blendwerk des Teufels, mußte ich <em class=\"gesperrt\">mir<\/em> zuschreiben.\r\nDie Tat machte mich vertraut mit dem Gedanken des Mordes, der dem\r\nteuflischen Trug folgte. So war der in verruchter Sünde erzeugte Bruder\r\ndas vom Teufel beseelte Prinzip, das mich in die abscheulichsten Frevel\r\nstürzte und mich mit den gräßlichsten Qualen umhertrieb. Bis dahin,\r\nals Aurelie nach dem Ratschluß der ewigen Macht ihr Gelübde sprach,\r\nwar mein Inneres nicht rein von der Sünde; bis dahin hatte der Feind\r\nMacht über mich, aber die wunderbare innere Ruhe, die wie von oben\r\nherabstrahlende Heiterkeit, die über mich kam, als Aurelie die letzten\r\nWorte gesprochen, überzeugte mich, daß Aureliens Tod die Verheißung\r\nder Sühne sei. — Als in dem feierlichen Requiem der Chor die Worte\r\nsang: <span class=\"antiqua\">Confutatis maledictis flammis acribus addictis<\/span>, fühlte\r\nich mich erbeben, aber bei dem <span class=\"antiqua\">Voca me cum benedictis<\/span> war es\r\nmir, als sehe ich in himmlischer Sonnenklarheit Aurelien, wie sie erst\r\nauf mich niederblickte und dann ihr von einem strahlenden Sternenringe\r\numgebenes Haupt zum höchsten Wesen erhob, um für das ewige Heil meiner\r\nSeele zu bitten! — <span class=\"antiqua\">Oro supplex et acclinis cor contritum quasi\r\ncinis!<\/span> — Nieder sank ich in den Staub, aber wie wenig glich\r\nmein inneres Gefühl, mein demütiges Flehen, jener leidenschaftlichen\r\nZerknirschung, jenen grausamen, wilden Bußübungen im Kapuzinerkloster.\r\nErst jetzt war mein Geist fähig, das Wahre von dem Falschen zu\r\nunterscheiden, und bei diesem klaren Bewußtsein mußte jede neue Prüfung\r\ndes Feindes wirkungslos bleiben. — Nicht Aureliens Tod, sondern nur\r\ndie als gräßlich und entsetzlich erscheinende Art desselben hatte mich\r\nin den ersten Augenblicken so tief erschüttert; aber wie bald erkannte\r\nich, daß die Gunst der ewigen Macht sie das Höchste bestehen ließ! —\r\nDas Martyrium der geprüften, entsündigten Christusbraut! — War sie\r\ndenn für mich untergegangen? Nein! jetzt erst, nachdem sie der Erde\r\nvoller Qual entrückt, wurde sie mir der reine Strahl der ewigen Liebe,\r\nder in meiner Brust aufglühte. Ja! Aureliens Tod war das Weihfest jener\r\nLiebe, die, wie Aurelie sprach, nur über den Sternen thront, und nichts\r\ngemein hat mit dem Irdischen. — Diese Gedanken erhoben mich über mein\r\nirdisches Selbst, und so waren wohl jene Tage im Cisterzienserkloster\r\ndie wahrhaft seligsten meines Lebens.<\/p>\r\n<p>Nach der Exportation, welche am folgenden Morgen stattfand, wollte\r\nLeonardus mit den Brüdern nach der Stadt zurückkehren; die Äbtissin\r\nließ mich, als schon der Zug beginnen sollte, zu sich rufen. Ich fand\r\nsie allein in ihrem Zimmer, sie war in der höchsten Bewegung, die\r\nTränen stürzten ihr aus den Augen. „Alles — alles weiß ich jetzt,\r\nmein Sohn Medardus! Ja, ich nenne dich so wieder, denn überstanden\r\nhast du die Prüfungen, die über dich Unglücklichen, Bedauernswürdigen\r\nergingen! Ach, Medardus, nur <em class=\"gesperrt\">sie<\/em>, nur <em class=\"gesperrt\">sie<\/em>, die am Throne\r\nGottes unsere Fürsprecherin sein mag, ist rein von der Sünde. Stand ich\r\nnicht am Rande des Abgrundes, als ich, von dem Gedanken an irdische\r\nLust erfüllt, dem Mörder mich verkaufen wollte? — Und doch — Sohn\r\nMedardus! — verbrecherische Tränen hab’ ich geweint, in einsamer\r\nZelle, deines Vaters gedenkend! — Gehe, Sohn Medardus! Jeder Zweifel,\r\ndaß ich vielleicht, zur mir selbst anzurechnenden Schuld in dir den\r\nfreveligsten Sünder erzog, ist aus meiner Seele verschwunden.“ —<\/p>\r\n<p>Leonardus, der gewiß der Äbtissin alles enthüllt hatte, was ihr aus\r\nmeinem Leben noch unbekannt geblieben, bewies mir durch sein Betragen,\r\ndaß auch er mir verziehen und dem Höchsten anheimgestellt hatte, wie\r\nich vor seinem Richterstuhl bestehen werde. Die alte Ordnung des\r\nKlosters war geblieben, und ich trat in die Reihe der Brüder ein, wie\r\nsonst. Leonardus sprach eines Tages zu mir: „ich möchte dir, Bruder\r\nMedardus, wohl noch eine Bußübung aufgeben.“ Demütig frug ich, worin\r\nsie bestehen solle. „Du magst,“ erwiderte der Prior, „die Geschichte\r\ndeines Lebens genau aufschreiben. Keiner der merkwürdigen Vorfälle,\r\nauch selbst der unbedeutenderen, vorzüglich nichts, was dir im\r\nbunten Weltleben widerfuhr, darfst du auslassen. Die Fantasie wird\r\ndich wirklich in die Welt zurückführen, du wirst alles Grauenvolle,\r\nPossenhafte, Schauerliche und Lustige noch einmal fühlen, ja es ist\r\nmöglich, daß du im Moment Aurelien anders, nicht als die Nonne Rosalia,\r\ndie das Martyrium bestand, erblickst; aber hat der Geist des Bösen dich\r\nganz verlassen, hast du dich ganz vom Irdischen abgewendet, so wirst\r\ndu, wie ein höheres Prinzip über allem schweben, und so wird jener\r\nEindruck keine Spur hinterlassen.“ Ich tat, wie der Prior geboten. Ach!\r\n— wohl geschah es so, wie er es ausgesprochen! — Schmerz und Wonne,\r\nGrauen und Lust — Entsetzen und Entzücken stürmten in meinem Innern,\r\nals ich mein Leben schrieb. — Du, der du einst diese Blätter liesest,\r\nich sprach zu dir von der Liebe höchster Sonnenzeit, als Aureliens\r\nBild mir im regen Leben aufging! — Es gibt Höheres als irdische Lust,\r\ndie meistens nur Verderben bereitet dem leichtsinnigen, blödsinnigen\r\nMenschen, und <em class=\"gesperrt\">das<\/em> ist jene höchste Sonnenzeit, wenn fern von dem\r\nGedanken freveliger Begier die Geliebte, wie ein Himmelsstrahl, alles\r\nHöhere, alles, was aus dem Reich der Liebe segensvoll herabkommt auf\r\nden armen Menschen, in deiner Brust entzündet. — Dieser Gedanke hat\r\nmich erquickt, wenn bei der Erinnerung an die herrlichsten Momente,\r\ndie mir die Welt gab, heiße Tränen den Augen entstürzten und alle\r\nlängst verharschte Wunden aufs neue bluteten.<\/p>\r\n<p>Ich weiß, daß vielleicht noch im Tode der Widersacher Macht haben wird,\r\nden sündigen Mönch zu quälen, aber standhaft, ja mit inbrünstiger\r\nSehnsucht erwarte ich den Augenblick, der mich der Erde entrückt, denn\r\nes ist der Augenblick der Erfüllung alles dessen, was mir Aurelie, ach!\r\ndie heilige Rosalia selbst im Tode verheißen. Bitte — bitte für mich,\r\no heilige Jungfrau, in der dunklen Stunde, daß die Macht der Hölle, der\r\nich so oft erlegen, nicht mich bezwinge und hinabreiße in den Pfuhl\r\newiger Verderbnis!<\/p>\r\n<p class=\"center mtop1\"><em class=\"gesperrt\">Nachtrag des Paters Spiridion,\r\nBibliothekar des Kapuzinerklosters zu B.<\/em><\/p>\r\n<p>In der Nacht vom dritten auf den vierten September des Jahres 17**\r\nhat sich viel Wunderbares in unserm Kloster ereignet. Es mochte wohl\r\num Mitternacht sein, als ich in der, neben der meinigen liegenden,\r\nZelle des Bruders Medardus ein seltsames Kichern und Lachen, und\r\nwährenddessen ein dumpfes, klägliches Ächzen vernahm. Mir war es,\r\nals höre ich deutlich von einer sehr häßlichen, widerwärtigen Stimme\r\ndie Worte sprechen: „Komm mit mir, Brüderchen Medardus, wir wollen\r\ndie Braut suchen.“ Ich stand auf und wollte mich zum Bruder Medardus\r\nbegeben, da überfiel mich aber ein besonderes Grauen, so daß ich wie\r\nvom Frost eines Fiebers ganz gewaltig durch alle Glieder geschüttelt\r\nwurde; ich ging demnach, statt in des Medardus Zelle, zum Prior\r\nLeonardus, weckte ihn nicht ohne Mühe, und erzählte ihm, was ich\r\nvernommen. Der Prior erschrak sehr, sprang auf und sagte, ich solle\r\ngeweihte Kerzen holen und wir wollten uns beide dann zum Bruder\r\nMedardus begeben. Ich tat, wie mir geheißen, zündete die Kerzen an der\r\nLampe des Mutter-Gottesbildes auf dem Gange an, und wir stiegen die\r\nTreppe hinauf. So sehr wir aber auch horchen mochten, die abscheuliche\r\nStimme, die ich vernommen, ließ sich nicht wieder hören. Statt dessen\r\nhörten wir leise, liebliche Glockenklänge, und es war so, als verbreite\r\nsich ein feiner Rosenduft. Wir traten näher, da öffnete sich die Türe\r\nder Zelle, und ein wunderlicher großer Mann, mit weißem krausen Bart,\r\nin einem violetten Mantel, schritt heraus; ich war sehr erschrocken,\r\ndenn ich wußte wohl, daß der Mann ein drohendes Gespenst sein mußte,\r\nda die Klosterpforten fest verschlossen waren, mithin kein Fremder\r\neindringen konnte; aber Leonardus schaute ihn keck an, jedoch ohne ein\r\nWort zu sagen. „Die Stunde der Erfüllung ist nicht mehr fern,“ sprach\r\ndie Gestalt sehr dumpf und feierlich, und verschwand in dem dunklen\r\nGange, so daß meine Bangigkeit noch stärker wurde und ich schier hätte\r\ndie Kerze aus der zitternden Hand fallen lassen mögen. Aber der Prior,\r\nder, ob seiner Frömmigkeit und Stärke im Glauben, nach den Gespenstern\r\nnicht viel frägt, faßte mich beim Arm und sagte: „nun wollen wir in\r\ndie Zelle des Bruders Medardus treten.“ Das geschah denn auch. Wir\r\nfanden den Bruder, der schon seit einiger Zeit sehr schwach worden, im\r\nSterben, der Tod hatte ihm die Zunge gebunden, er röchelte nur noch was\r\nweniges. Leonardus blieb bei ihm, und ich weckte die Brüder, indem ich\r\ndie Glocke stark anzog und mit lauter Stimme rief: „Steht auf! — steht\r\nauf! — Der Bruder Medardus liegt im Tode!“ Sie standen auch wirklich\r\nauf, so daß nicht ein einziger fehlte, als wir mit angebrannten Kerzen\r\nuns zu dem sterbenden Bruder begaben. Alle, auch ich, der ich dem\r\nGrauen endlich widerstanden, überließen uns vieler Betrübnis. Wir\r\ntrugen den Bruder Medardus auf einer Bahre nach der Klosterkirche, und\r\nsetzten ihn vor dem Hochaltar nieder. Da erholte er sich zu unserm\r\nErstaunen und fing an zu sprechen, so daß Leonardus selbst, sogleich\r\nnach vollendeter Beichte und Absolution, die letzte Ölung vornahm.\r\nNachher begaben wir uns, während Leonardus unten blieb und immerfort\r\nmit dem Bruder Medardus redete, in den Chor und sangen die gewöhnlichen\r\nTotengesänge für das Heil der Seele des sterbenden Bruders. Gerade als\r\ndie Glocke des Klosters den andern Tag, nämlich am fünften September\r\ndes Jahres 17** mittags zwölfe schlug, verschied Bruder Medardus in\r\ndes Priors Armen. Wir bemerkten, daß es Tag und Stunde war, in der\r\nvoriges Jahr die Nonne Rosalia auf entsetzliche Weise, gleich nachdem\r\nsie das Gelübde abgelegt, ermordet wurde. Bei dem Requiem und der\r\nExportation hat sich noch folgendes ereignet. Bei dem Requiem nämlich\r\nverbreitete sich ein sehr starker Rosenduft, und wir bemerkten, daß\r\nan dem schönen Bilde der heiligen Rosalia, das von einem sehr alten,\r\nunbekannten italienischen Maler verfertigt sein soll, und das unser\r\nKloster von den Kapuzinern in der Gegend von Rom für erkleckliches\r\nGeld erkaufte, so daß sie nur eine Kopie des Bildes behielten, ein\r\nStrauß der schönsten, in dieser Jahreszeit seltenen Rosen befestigt\r\nwar. Der Bruder Pförtner sagte, daß am frühen Morgen ein zerlumpter,\r\nsehr elend aussehender Bettler, von uns unbemerkt, hinaufgestiegen und\r\nden Strauß an das Bild geheftet habe. Derselbe Bettler fand sich bei\r\nder Exportation ein und drängte sich unter die Brüder. Wir wollten\r\nihn zurückweisen, als aber der Prior Leonardus ihn scharf angeblickt\r\nhatte, befahl er, ihn unter uns zu leiden. Er nahm ihn als Laienbruder\r\nim Kloster auf; wir nannten ihn Bruder Peter, da er im Leben Peter\r\nSchönfeld geheißen, und gönnten ihm den stolzen Namen, weil er überaus\r\nstill und gutmütig war, wenig sprach und nur zuweilen sehr possierlich\r\nlachte, welches, da es gar nichts Sündliches hatte, uns sehr ergötzte.\r\nDer Prior Leonardus sprach einmal: des Peters Licht sei im Dampf der\r\nNarrheit verlöscht, in die sich in seinem Innern die Ironie des Lebens\r\numgestaltet. Wir verstanden alle nicht, was der gelehrte Leonardus\r\ndamit sagen wollte, merkten aber wohl, daß er mit dem Laienbruder\r\nPeter längst bekannt sein müsse. So habe ich den Blättern, die des\r\nBruders Medardi Leben enthalten sollen, die ich aber nicht gelesen,\r\ndie Umstände seines Todes sehr genau und nicht ohne Mühe <span class=\"antiqua\">ad majorem\r\ndei gloriam<\/span> hinzugefügt. Friede und Ruhe dem entschlafenen Bruder\r\nMedardus, der Herr des Himmels lasse ihn dereinst fröhlich auferstehen\r\nund nehme ihn auf in den Chor heiliger Männer, da er sehr fromm\r\ngestorben.<\/p>\r\n<figure class=\"figcenter illowe15 padtop1\">\r\n  <img alt=\"Schlussvignette: Blumengirlande\" class=\"w100\" src=\"images/illu_304_gross.jpg\">\r\n<\/figure>\r\n<p class=\"s5 center mtop3\">Typographmaschinensatz der Deutschen Buch- und\r\nKunstdruckerei, G. m. b. H., Zossen-Berlin\r\n<span class=\"antiqua\">SW.<\/span> 11.<\/p>"}];
window.PREP=[[],[],[],[{"w":"wunderbar","art":"","ipa":"/ˈvʊndəʁˌbaːʁ/","m":"wonderful","f":"wunderbare","s":"— So ist es mir, als hätte ich selbst einmal in der öden Kirche die wunderbare Gestalt eines ernsten Mannes gesehen, und es sei eben der fremde Maler gewesen, der in uralter Zeit, als eben die Kirche gebaut, erschien, dessen Sprache niemand verstehen konnte …","n":17},{"w":"Seele","art":"die","ipa":"/ˈzeːlə/","m":"soul; mind, spirit; human being, soul; bore","f":"Seele","s":"Jedes ihrer Worte blieb tief in meiner Seele zurück, noch den ganzen Tag über, wenn ich sie gesprochen, befand ich mich in wunderbarer feierlicher Stimmung und ihre Gestalt begleitete mich auf den Spaziergängen, die ich dann besuchte.","n":20},{"w":"tief","art":"","ipa":"/tiːf/","m":"deep; deep, profound; low","f":"tiefen","s":"Nie hat mir meine Mutter gesagt, in welchen Verhältnissen mein Vater in der Welt lebte; rufe ich mir aber alles das ins Gedächtnis zurück, was sie mir schon in meiner frühesten Jugend von ihm erzählte, so muß ich wohl glauben, daß es ein mit tiefen Kenntniss…","n":20},{"w":"Kraft","art":"die","ipa":"/kʁaft/","m":"power, force, strength; force; worker, employee","f":"Kraft","s":"Ist es nicht herrlich, lieber Bruder Medardus, daß unsere Kirche darnach trachtet, jene geheimnisvollen Fäden zu erfassen, die das Sinnliche mit dem Übersinnlichen verknüpfen, ja unseren zum irdischen Leben und Sein gediehenen Organismus so anzuregen, daß se…","n":13},{"w":"Geist","art":"der","ipa":"/ɡaɪ̯st/","m":"spirit; the Holy Spirit; Holy Ghost; essence","f":"Geiste","s":"Noch ist es mir unerklärlich, wie meine Mutter darauf verfiel, mich aufzufordern, der Fürstin von den schönen herrlichen Dingen meines Geburtsortes zu erzählen, und ich, wie von einer höheren Macht inspiriert, ihr die schönen Bilder des fremden unbekannten M…","n":17},{"w":"öffnen","art":"","ipa":"/ˈœfnən/","m":"to open; to open, get, or answer the door","f":"öffne","s":"— war es nicht, als öffne sich die Wolkenglorie über dem Hochaltar?","n":9},{"w":"Kirche","art":"die","ipa":"/ˈkɪʁçə/","m":"church; an assembly","f":"Kirche","s":"— Mit dem ersten Bewußtsein dämmern in mir die lieblichen Bilder von dem Kloster, und von der herrlichen Kirche in der heiligen Linde, auf.","n":30},{"w":"ewig","art":"","ipa":"/ˈeːvɪç/","m":"eternal, everlasting; constant, frequent","f":"ewig","s":"— Ach, wie ein fernes herrliches Land, wo die Freude wohnt und die ungetrübte Heiterkeit des kindlichen unbefangenen Sinns, liegt die Heimat weit, weit hinter mir, aber wenn ich zurückblicke, da gähnt mir die Kluft entgegen, die mich auf ewig von ihr geschie…","n":8},{"w":"Wein","art":"der","ipa":"/vaɪ̯n/","m":"wine","f":"Wein","s":"— Eine Schwester brachte Zuckerwerk und süßen Wein, ich ließ mich, jetzt schon dreister geworden, nicht lange nötigen, sondern naschte tapfer von den Süßigkeiten, die mir die holde Frau, welche sich gesetzt und mich auf den Schoß genommen hatte, selbst in de…","n":15},{"w":"Blick","art":"der","ipa":"[blɪk]","m":"glance, look; view","f":"Blick","s":"Sie sah mich mit einem ernsten, bis ins Innerste dringenden Blick an, und frug: „Ist das euer Sohn?“","n":14},{"w":"indem","art":"","ipa":"/ɪnˈdeːm/","m":"by; while, at the time that","f":"indem","s":"Einer von ihnen rief, indem er uns gewahr wurde, lachend: „Sieh da!","n":9},{"w":"treten","art":"","ipa":"[ˈtʰʁ̥eːtn̩]","m":"to step, to walk; to appear; to step; to tread","f":"traten","s":"Da traten einige Jünglinge aus dem Gebüsch, die, nach ihrer Kleidung und nach ihrem ganzen Wesen zu urteilen, wohl nur aus Neugierde und Schaulust nach der heiligen Linde gekommen waren.","n":9},{"w":"Flasche","art":"die","ipa":"/ˈflaʃə/","m":"bottle; flask; flagon; loser; wimp","f":"Flaschen","s":"Allerlei lustige Erzählungen, Späße und Schwänke wechselten unter dem lauten Gelächter der Gäste, wobei die Flaschen fleißig geleert wurden bis der Abend hereinbrach und die Wagen zur Abfahrt bereit standen.","n":20},{"w":"steigen","art":"","ipa":"/ˈʃtaɪ̯ɡən/","m":"to ascend, to climb, to rise; to rise","f":"stieg","s":"Endlich stieg ich, an der Hand meiner Mutter, die breiten, steinernen Treppen herauf und trat in das hohe, gewölbte, mit heiligen Bildern ausgeschmückte Gemach, in dem wir die Fürstin fanden.","n":10},{"w":"scheinen","art":"","ipa":"/ˈʃaɪnən/","m":"to shine; to gleam; to seem; to appear; to look","f":"schien","s":"Der herrliche Klostergarten mit der Aussicht in die Gebirge hinein schien mir jedesmal, wenn ich in den langen Alleen wandelte und bald bei dieser, bald bei jener üppigen Baumgruppe stehen blieb, in neuer Schönheit zu erglänzen.","n":16},{"w":"heiligen","art":"","ipa":"/ˈhaɪ̯lɪɡən/","m":"to hallow; to make holy","f":"heilige","s":"— Auf der beschwerlichen Wanderung dahin fühlte meine Mutter nach mehreren Jahren der Ehe zum erstenmal, daß diese nicht unfruchtbar bleiben würde, wie mein Vater befürchtet, und seiner Dürftigkeit unerachtet war er hoch erfreut, weil nun eine Vision in Erfü…","n":10},{"w":"drücken","art":"","ipa":"/ˈdʁʏkən/","m":"to press, to push; to squeeze; to hug","f":"drückte","s":"und hob mich auf und drückte mich heftig an sich, aber in dem Augenblick preßte mir ein jäher Schmerz, den ich am Halse fühlte, einen starken Schrei aus, so daß die Fürstin erschrocken mich losließ, und die durch mein Betragen ganz bestürzt gewordene Mutter …","n":8},{"w":"Kiste","art":"die","ipa":"/ˈkɪstə/","m":"chest, box; crate, case; bed, sleeping furniture","f":"Kistchen","s":"Endlich nahm er aus einem wohlverschlossenen Schranke ein Kistchen heraus und sagte.","n":12},{"w":"Brust","art":"die","ipa":"/bʁʊst/","m":"chest; breast; side of the chest; bosom","f":"Brust","s":"Die Fürstin ließ das nicht zu; es fand sich, daß das diamantne Kreuz, welches die Fürstin auf der Brust trug, mich, indem sie heftig mich an sich drückte, am Halse so stark beschädigt hatte, daß die Stelle ganz rot und mit Blut unterlaufen war.","n":8},{"w":"Schrank","art":"der","ipa":"/ʃʁaŋk/","m":"cupboard; wardrobe, closet; bookcase; locker","f":"Schranke","s":"Endlich nahm er aus einem wohlverschlossenen Schranke ein Kistchen heraus und sagte.","n":12},{"w":"befinden","art":"","ipa":"/bəˈfɪndn̩/","m":"to occupy a place; to be located; to be situated","f":"befand","s":"Jedes ihrer Worte blieb tief in meiner Seele zurück, noch den ganzen Tag über, wenn ich sie gesprochen, befand ich mich in wunderbarer feierlicher Stimmung und ihre Gestalt begleitete mich auf den Spaziergängen, die ich dann besuchte.","n":8},{"w":"desto","art":"","ipa":"/ˈdɛstoː/","m":"the","f":"desto","s":"In der heiligen Linde erkrankte mein Vater, und je weniger er die vorgeschriebenen beschwerlichen Andachtsübungen seiner Schwäche unerachtet aussetzen wollte, desto mehr nahm das Übel überhand; er starb entsündigt und getröstet in demselben Augenblick, als i…","n":7},{"w":"Zelle","art":"die","ipa":"/ˈtsɛlə/","m":"in a monastery or convent; in a prison; cell","f":"Zelle","s":"— Ich war wie vernichtet, ein Eisstrom goß sich durch mein Inneres — besinnungslos stürzte ich fort ins Kollegium — in meine Zelle.","n":7},{"w":"vermögen","art":"","ipa":"[fɛəˈmøːɡŋ̩]","m":"to be able to; may; to cause, to force, to impel","f":"vermochte","s":"Eine innere Scham, die ich nicht zu überwinden vermochte, hielt mich zurück ihm die Wahrheit zu sagen, dagegen erzählte ich ihm mit dem Feuer der Exaltation, das noch in mir glühte, die wunderbaren Begebenheiten meiner Kinderjahre, welche alle auf meine Best…","n":7},{"w":"Heil","art":"das","ipa":"/haɪ̯l/","m":"health, salvation, well-being, happiness, a state of intactness and prosperity","f":"Heil","s":"— Das was darinnen enthalten, stammt unmittelbar von dem Widersacher her aus jener Zeit, als er noch sichtlich gegen das Heil der Menschen zu kämpfen vermochte.“","n":10},{"w":"gewiss","art":"","ipa":"/ɡəˈvɪs/","m":"certain","f":"gewiß","s":"— So gedenke ich ferner noch eines alten fremdartig gekleideten Pilgers mit langem grauem Barte, der mich oft auf den Armen umhertrug, im Walde allerlei bunte Moose und Steine suchte, und mit mir spielte; unerachtet ich gewiß glaube, daß nur aus der Beschrei…","n":19},{"w":"erfüllen","art":"","ipa":"/ɛrˈfʏlən/","m":"to fill; to fulfill / fulfil; to come true","f":"erfüllte","s":"— Aber finstre Gestalten steigen auf, und immer dichter und dichter sich zusammendrängend, immer enger und enger mich einschließend, versperren sie die Aussicht und befangen meinen Sinn mit den Drangsalen der Gegenwart, daß selbst die Sehnsucht, welche mich …","n":12},{"w":"besondere","art":"","ipa":"","m":"special, particular, extraordinary","f":"besondere","s":"Als ich einige Tropfen des süßen Getränks, das mir bis jetzt ganz unbekannt gewesen, gekostet, kehrte mein munterer Sinn, die besondere Lebendigkeit, die, nach meiner Mutter Zeugnis, von meiner frühsten Jugend mir eigen war, zurück.","n":9},{"w":"irgend","art":"","ipa":"","m":"at all; any, some","f":"irgend","s":"— Meine Mutter konnte nicht genug sagen, welchen tiefen unauslöschlichen Eindruck die Worte des Pilgers auf sie gemacht hatten; sie beschloß aber dem unerachtet meiner Neigung durchaus keinen Zwang anzutun, sondern ruhig abzuwarten, was das Geschick über mic…","n":10},{"w":"gewöhnlich","art":"","ipa":"/ɡəˈvøːnlɪç/","m":"usual, normal, ordinary, everyday","f":"gewöhnlichen","s":"— Einst hatte der Prior viel Merkwürdiges mit mir gesprochen über das profane Leben; er war eingedrungen in die schlüpfrigsten Materien, die er aber mit seiner gewöhnlichen Leichtigkeit und Anmut des Ausdrucks zu behandeln wußte, so daß er, alles nur im mind…","n":8},{"w":"Heiliger","art":"der","ipa":"/ˈhaɪ̯.lɪ.ɡɐ/","m":"saint","f":"Heiligen","s":"Noch lächeln mir die bunten Gestalten der Engel — der Heiligen — von den Wänden, von der Decke der Kirche an!","n":18},{"w":"Vision","art":"die","ipa":"/viˈzi̯oːn/","m":"vision","f":"Vision","s":"— Auf der beschwerlichen Wanderung dahin fühlte meine Mutter nach mehreren Jahren der Ehe zum erstenmal, daß diese nicht unfruchtbar bleiben würde, wie mein Vater befürchtet, und seiner Dürftigkeit unerachtet war er hoch erfreut, weil nun eine Vision in Erfü…","n":8},{"w":"herrlich","art":"","ipa":"/ˈhɛʁlɪç/","m":"fantastic; marvelous; wonderful; splendid","f":"herrlichen","s":"— Mit dem ersten Bewußtsein dämmern in mir die lieblichen Bilder von dem Kloster, und von der herrlichen Kirche in der heiligen Linde, auf.","n":22},{"w":"sowie","art":"","ipa":"[zoˈviː]","m":"as well as; as soon as","f":"sowie","s":"Schon den Tag vorher strömten aus der benachbarten Stadt sowie aus der ganzen umliegenden Gegend, eine Menge Menschen herbei und lagerten sich auf der großen blumichten Wiese, die sich an das Kloster schloß, so daß das frohe Getümmel Tag und Nacht nicht aufh…","n":12},{"w":"Kloster","art":"das","ipa":"/ˈkloːstɐ/","m":"convent, monastery, cloister","f":"Kloster","s":"— Mit dem ersten Bewußtsein dämmern in mir die lieblichen Bilder von dem Kloster, und von der herrlichen Kirche in der heiligen Linde, auf.","n":46},{"w":"jener","art":"","ipa":"/ˈjeːnɐ/","m":"that, that one","f":"jener","s":"Die Zeit von jener Begebenheit mit dem alten Pilger, welche ich in der Tat aus eigner Anschauung weiß, so daß sie meine Mutter nur rücksichts der Reden des Malers und des alten Pilgers ergänzt hat, bis zu dem Moment, als mich meine Mutter zum erstenmal zur Ä…","n":33},{"w":"Fürst","art":"der","ipa":"/fʏɐ̯st/","m":"prince","f":"Fürstin","s":"Endlich stieg ich, an der Hand meiner Mutter, die breiten, steinernen Treppen herauf und trat in das hohe, gewölbte, mit heiligen Bildern ausgeschmückte Gemach, in dem wir die Fürstin fanden.","n":23},{"w":"Gebet","art":"das","ipa":"/ɡəˈbeːt/","m":"prayer","f":"Gebet","s":"Lustiger Gesang, fromme Lieder, die inbrünstigen Seufzer der Büßenden, das Gelächter der Fröhlichen, Klagen, Jauchzen, Jubel, Scherze, Gebet erfüllen wie in wunderbarem betäubendem Konzert die Lüfte!","n":8},{"w":"ergreifen","art":"","ipa":"/ɛʁˈɡʁaɪfən/","m":"to seize, capture; to take up","f":"ergriffen","s":"— Ihre Stimme, ihr ganzes Ansehn — selbst die fremde Umgebung, das hohe Gemach, die Bilder, alles wirkte so auf mich, daß ich, von dem Gefühl eines inneren Grauens ergriffen, bitterlich zu weinen anfing.","n":8},{"w":"fremd","art":"","ipa":"/fʁɛmt/","m":"strange; foreign; external","f":"fremde","s":"— So ist es mir, als hätte ich selbst einmal in der öden Kirche die wunderbare Gestalt eines ernsten Mannes gesehen, und es sei eben der fremde Maler gewesen, der in uralter Zeit, als eben die Kirche gebaut, erschien, dessen Sprache niemand verstehen konnte …","n":10},{"w":"heilig","art":"","ipa":"","m":"holy; sacred","f":"heiligen","s":"Eben aus diesen Erzählungen und einzelnen Äußerungen meiner Mutter, über ihr früheres Leben, die mir erst später verständlich worden, weiß ich, daß meine Eltern von einem bequemen Leben, welches sie im Besitz vielen Reichtums führten, herabsanken in die drüc…","n":29},{"w":"Gestalt","art":"die","ipa":"/ɡəˈʃtalt/","m":"shape, form, figure, outline","f":"Gestalten","s":"Noch lächeln mir die bunten Gestalten der Engel — der Heiligen — von den Wänden, von der Decke der Kirche an!","n":12},{"w":"entsetzlich","art":"","ipa":"/ɛntˈzɛt͡slɪç/","m":"horrible, terrible, horrendous, appalling","f":"entsetzlich","s":"Überall erklangen um mich Stimmen, die mich verspotteten, verhöhnten; ich war im Begriff mich durch das Fenster zu stürzen, zum Glück verhinderten mich die Eisenstäbe daran, mein Zustand war in der Tat entsetzlich.","n":8},{"w":"geistig","art":"","ipa":"/ˈɡaɪ̯stɪç/","m":"mental; intellectual; spiritual","f":"geistigen","s":"Ohne dem Irdischen einen falschen Wert zu verleihen, mußten sie in der verschiedenen, aus dem Innern bestimmten Lebensweise der Menschen, die Notwendigkeit einer solchen Strahlenbrechung des geistigen Prinzips, ohne welche alles farb- und glanzlos geblieben …","n":15},{"w":"Begeisterung","art":"die","ipa":"/bəˈɡaɪ̯stəʁʊŋ/","m":"enthusiasm, zeal, zest; rapture, ecstasy","f":"Begeisterung","s":"Die Fürstin, selbst meine Mutter, blickten mich voll Erstaunen an, aber je mehr ich sprach, deste höher stieg meine Begeisterung, und als mich endlich die Fürstin frug: „Sage mir liebes Kind, woher weißt du denn das alles?“","n":8},{"w":"Weiser","art":"der","ipa":"/ˈvaɪ̯zɐ/","m":"sage","f":"Weise","s":"— Die Fürstin war auf besondere Weise bewegt, ihre Stimme zitterte vor Wehmut, als sie noch salbungsvolle Worte der Ermahnung sprach.","n":13},{"w":"eigen","art":"","ipa":"/ˈaɪ̯ɡən/","m":"own, peculiar or private to someone, idiosyncratic, proper or proprietary","f":"eigner","s":"Die Zeit von jener Begebenheit mit dem alten Pilger, welche ich in der Tat aus eigner Anschauung weiß, so daß sie meine Mutter nur rücksichts der Reden des Malers und des alten Pilgers ergänzt hat, bis zu dem Moment, als mich meine Mutter zum erstenmal zur Ä…","n":8},{"w":"geheimnisvoll","art":"","ipa":"/ɡəˈhaɪ̯mnɪsˌfɔl/","m":"mysterious, cryptic, arcane, enigmatic","f":"geheimnisvollen","s":"Sechzehn Jahre war ich alt geworden, als der Pfarrer erklärte, daß ich nun vorbereitet genug sei, die höheren theologischen Studien in dem Seminar der benachbarten Stadt zu beginnen: ich hatte mich nämlich ganz für den geistlichen Stand entschieden und dies …","n":9},{"w":"dringen","art":"","ipa":"/ˈdʁɪŋən/","m":"to insist; to press; to ooze; to seep","f":"gedrungen","s":"— Die Erzählungen meiner Mutter von dem wundervollen Kloster, wo ihrem tiefsten Schmerz gnadenreicher Trost zuteil wurde, sind so in mein Innres gedrungen, daß ich alles selbst gesehen, selbst erfahren zu haben glaube, unerachtet es unmöglich ist, daß meine …","n":9},{"w":"Abt","art":"der","ipa":"/apt/","m":"abbot","f":"Äbtissin","s":"— Meine Erinnerungen aus deutlicher selbst gemachter Erfahrung heben von dem Zeitpunkt an, als meine Mutter auf der Heimreise in das Cisterzienser Nonnenkloster gekommen war, dessen gefürstete Äbtissin, die meinen Vater gekannt hatte, sie freundlich aufnahm.","n":11}],[{"w":"Verbindung","art":"die","ipa":"/fɛɐ̯ˈbɪndʊŋ(k)/","m":"connection; compound; accession","f":"Verbindung","s":"Sein Vater hatte seine Verbindung mit einer ihm befreundeten Familie durch eine Heirat gewünscht, und um so freudiger erfüllte er diesen Willen, als er in der ihm bestimmten Braut ein herrliches, von der Natur reich ausgestattetes Wesen fand, zu dem er sich …","n":8},{"w":"seltsam","art":"","ipa":"/ˈzɛltˌzaːm/","m":"strange, weird, odd, funny, curious","f":"seltsame","s":"Ganz entkräftet setzte ich mich auf ein Felsstück und konnte nicht widerstehen einen Zug aus der Korbflasche zu tun, unerachtet ich das seltsame Getränk soviel nur möglich aufsparen wollte.","n":11},{"w":"Geheimnis","art":"das","ipa":"/ɡəˈhaɪmnɪs/","m":"secret; mystery","f":"Geheimnisses","s":"Er ist ruhig, aber läßt nicht ab von der einmal gefaßten Idee, und alle Bemühungen das Ereignis zu erforschen, das ihn in diesen Zustand versetzt, bleiben fruchtlos, unerachtet die Entdeckung dieses Geheimnisses vielleicht am ersten auf wirksame Mittel führe…","n":9},{"w":"anderer","art":"","ipa":"/ˈandərər/","m":"other, different; second","f":"andrer","s":"— Nie war mir so zu Mute gewesen, ich schien mir selbst ein andrer, und, wie von neuerweckter Kraft beseelt und begeistert schritt ich rasch fort durch den Wald, den Berg herab.","n":9},{"w":"Schritt","art":"der","ipa":"[ʃʁɪtʰ]","m":"step, footstep; walk; crotch; a pace","f":"Schritte","s":"Ich trat einige Schritte weiter und erstarrte beinahe vor Schreck, als ich dicht an einem jähen, entsetzlichen Abgrund stand, in den sich, zwischen schroffen, spitzen Felsen, ein Waldbach zischend und brausend hinabstürzte, dessen donnerndes Getöse ich schon…","n":11},{"w":"nah","art":"","ipa":"/naː/","m":"near, close, nearby","f":"nahen","s":"Es war mir klar, daß eine große Ähnlichkeit meiner Gesichtszüge und meiner Gestalt mit der des unglücklichen Grafen den Jäger getäuscht, und der Graf gerade die Verkleidung als Kapuziner gewählt haben müsse, um irgend ein Abenteuer in dem nahen Schlosse zu b…","n":16},{"w":"daher","art":"","ipa":"/ˈdaːheːɐ̯/","m":"from there, thence; therefore; because of that","f":"daher","s":"Als die Lobrede geendet, antwortete er, wie er sich auch nicht im mindesten von Euphemien angezogen fühle, sie niemals lieben könne, und daher recht herzlich bitte, den Plan jeder näheren Verbindung mit ihr aufzugeben.","n":9},{"w":"Schloss","art":"das","ipa":"/ʃlɔs/","m":"lock, padlock; lock; castle","f":"Schlosse","s":"Da fuhr der junge Mensch fort: „Nun gnädiger Herr, reite ich den Fahrweg herab nach dem Städtchen, wo ich mich in dem Hause dicht vor dem Tor linker Hand verborgen halten will, Sie werden wohl gleich herab nach dem Schlosse wandeln, man wird Sie wohl schon e…","n":17},{"w":"Zufall","art":"der","ipa":"/ˈt͡suːˌfal/","m":"chance, coincidence, randomness","f":"Zufalls","s":"Als ich mich von meiner Betäubung erholt und die ganze Begebenheit überdachte, mußte ich mir wohl eingestehen, daß ich bloß dem Spiel des Zufalls, der mich mit einem Ruck in das sonderbarste Verhältnis geworfen, nachgegeben.","n":13},{"w":"wahnsinnig","art":"","ipa":"/ˈvaːnˌzɪnɪç/","m":"mad, insane; incredible, unbelievable","f":"wahnsinnige","s":"Nun brach aber das Unglück und die Trauer ein in unser Haus, denn bald schrieb Euphemie dem Baron, wie Hermogen plötzlich von einer oft in wahnsinnige Wut ausbrechenden Melancholie befallen, wie er einsam umherirre, sich und sein Geschick verwünsche und wie …","n":11},{"w":"Gang","art":"der","ipa":"/ɡaŋ/","m":"motion, movement, progress, way, going; course","f":"Gängen","s":"Bald befand ich mich in den Gängen des Parks, welcher das Schloß umgab; in einer dunklen Seitenallee sah ich zwei Männer wandeln, von denen der eine wie ein Weltgeistlicher gekleidet war.","n":11},{"w":"Wesen","art":"das","ipa":"/ˈveːzən/","m":"creature, being; essence, substance; character","f":"Wesens","s":"Die plötzliche Änderung Ihres ganzen Wesens hat indessen nur zu deutlich gezeigt, daß irgend ein Ereignis das Sie uns hartnäckig verschweigen, Ihr Inneres auf furchtbare Weise erschüttert hat und nun zerstörend fortarbeitet.","n":9},{"w":"wild","art":"","ipa":"/vɪlt/","m":"wild; wild, unrestrained, raucous; strange","f":"wilden","s":"Ich konnte den wilden Flug nicht mehr aufhalten, es war zu spät.","n":9},{"w":"werfen","art":"","ipa":"/ˈvɛrfən/","m":"to throw; to cast; to project; to give birth","f":"geworfen","s":"— Sowie ich ihn berührte, fuhr er aus tiefem Schlafe, aber in demselben Augenblick stürzte er, das Gleichgewicht verlierend, hinab in den Abgrund, daß, von Felsenspitze zu Felsenspitze geworfen, die zerschmetterten Glieder zusammenkrachten; sein schneidendes…","n":7},{"w":"Park","art":"der","ipa":"/paʁk/","m":"park; park, grounds","f":"Parks","s":"Bald befand ich mich in den Gängen des Parks, welcher das Schloß umgab; in einer dunklen Seitenallee sah ich zwei Männer wandeln, von denen der eine wie ein Weltgeistlicher gekleidet war.","n":7},{"w":"Wahnsinn","art":"der","ipa":"/ˈvaːnzɪn/","m":"insanity, madness","f":"Wahnsinn","s":"Tief bewunderte ich die Weisheit des Priors, der das richtige Mittel zu meiner Heilung wählte, denn, in den Klostermauern eingeschlossen, immer von denselben Gegenständen umgeben, immer brütend und hineinzehrend in das Innere, hätte mich jene Vision, der die…","n":7},{"w":"tausend","art":"","ipa":"/ˈtaʊ̯zənt/","m":"thousand","f":"tausend","s":"Die Sonne trat in flammender Glut hinter der Stadt hervor, ihr funkelndes Gold erglänzte in den Bäumen und in freudigem Rauschen fielen die Tautropfen wie glühende Diamanten herab auf tausend bunte Insektlein, die sich schwirrend und sumsend erhoben.","n":7},{"w":"erscheinen","art":"","ipa":"/ɛɐ̯ˈʃaɪ̯nən/","m":"to appear; to come out, be released","f":"erschien","s":"— Überall wo sie erschien ging ein neues herrliches Leben auf und man huldigte ihr mit dem glühendsten Enthusiasmus; den Unbedeutendsten, Leblosesten wußte sie selbst in sein eignes Inneres hinein zu entzünden, daß er, wie inspiriert, sich über die eigne Dür…","n":8},{"w":"Weib","art":"das","ipa":"/vaɪ̯p/","m":"woman, broad; woman, wife","f":"Weibes","s":"Bald war ich überzeugt, daß jene Erscheinung des unbekannten Weibes nur eine Vision gewesen, die Folge gar zu großer Anstrengung, und statt, wie ich sonst getan haben würde, das verführerische, verderbliche Trugbild der steten Verfolgung des Widersachers zuz…","n":8},{"w":"derselbe","art":"","ipa":"/deːɐ̯ˈzɛlbə/","m":"the same; selfsame; idem","f":"denselben","s":"Tief bewunderte ich die Weisheit des Priors, der das richtige Mittel zu meiner Heilung wählte, denn, in den Klostermauern eingeschlossen, immer von denselben Gegenständen umgeben, immer brütend und hineinzehrend in das Innere, hätte mich jene Vision, der die…","n":10},{"w":"entgegen","art":"","ipa":"[ʔɛntˈɡeːɡŋ̩]","m":"against","f":"entgegen","s":"Leblos vor Schreck und Entsetzen stand ich da, endlich ergriff ich den Hut, den Degen, das Portefeuille und wollte mich schnell von dem Unglücksorte entfernen, da trat mir ein junger Mensch aus dem Tannenwalde entgegen, wie ein Jäger gekleidet, schaute mir e…","n":11},{"w":"Baron","art":"der","ipa":"[baˈʁoːn]","m":"baron","f":"Baron","s":"Auf, Baron!","n":65},{"w":"erheben","art":"","ipa":"[ʔɛʁˈheːbn̩]","m":"to raise, lift; to levy, charge; to bring","f":"erhoben","s":"Die Sonne trat in flammender Glut hinter der Stadt hervor, ihr funkelndes Gold erglänzte in den Bäumen und in freudigem Rauschen fielen die Tautropfen wie glühende Diamanten herab auf tausend bunte Insektlein, die sich schwirrend und sumsend erhoben.","n":8},{"w":"Verhältnis","art":"das","ipa":"/fɛɐ̯ˈhɛltnɪs/","m":"relation, ratio; relationship; affair","f":"Verhältnis","s":"Als ich mich von meiner Betäubung erholt und die ganze Begebenheit überdachte, mußte ich mir wohl eingestehen, daß ich bloß dem Spiel des Zufalls, der mich mit einem Ruck in das sonderbarste Verhältnis geworfen, nachgegeben.","n":14},{"w":"Hauptstadt","art":"die","ipa":"/ˈhaʊ̯ptˌʃtat/","m":"capital","f":"Hauptstadt","s":"Mehrenteils brachten wir den Winter in der benachbarten Hauptstadt zu, als aber bald nach Aureliens Geburt die Baronesse zu kränkeln anfing, blieben wir auch den Sommer über in der Stadt, da sie unausgesetzt des Beistandes geschickter Ärzte bedurfte.","n":9},{"w":"Abgrund","art":"der","ipa":"/ˈapˌɡʁʊnt/","m":"abyss, precipice","f":"Abgrund","s":"Ich trat einige Schritte weiter und erstarrte beinahe vor Schreck, als ich dicht an einem jähen, entsetzlichen Abgrund stand, in den sich, zwischen schroffen, spitzen Felsen, ein Waldbach zischend und brausend hinabstürzte, dessen donnerndes Getöse ich schon…","n":14},{"w":"Erscheinung","art":"die","ipa":"/ɛɐ̯ˈʃaɪ̯nʊŋ/","m":"appearance; apparition, vision; phenomenon","f":"Erscheinungen","s":"antwortete ich, und es war mir, als trete ein neues Leben, voll Lust und Freiheit, mit tausend holdseligen Erscheinungen auf mich ein!","n":10},{"w":"Genuss","art":"der","ipa":"/ɡəˈnʊs/","m":"enjoyment, pleasure; consumption","f":"Genüssen","s":"— Überall wo sie erschien ging ein neues herrliches Leben auf und man huldigte ihr mit dem glühendsten Enthusiasmus; den Unbedeutendsten, Leblosesten wußte sie selbst in sein eignes Inneres hinein zu entzünden, daß er, wie inspiriert, sich über die eigne Dür…","n":9},{"w":"Inneres","art":"das","ipa":"","m":"inside, interior; bowels, innards","f":"Innere","s":"Tief bewunderte ich die Weisheit des Priors, der das richtige Mittel zu meiner Heilung wählte, denn, in den Klostermauern eingeschlossen, immer von denselben Gegenständen umgeben, immer brütend und hineinzehrend in das Innere, hätte mich jene Vision, der die…","n":27},{"w":"fromm","art":"","ipa":"/fʁɔm/","m":"pious, religious, devout; righteous","f":"frommen","s":"In blauen Duft gehüllt, lag das Kloster unter mir im Tale; der frische Morgenwind rührte sich und trug, die Lüfte durchstreichend, die frommen Gesänge der Brüder zu mir herauf.","n":10},{"w":"Arm","art":"der","ipa":"/arm/","m":"an arm; a sleeve; an arm of a creek or a river","f":"Arme","s":"Der Alte stand auf und wollte fortgehen, der Jüngling fiel ihm in die Arme.","n":6},{"w":"Pferd","art":"das","ipa":"/pfeːrt/","m":"horse; knight; pommel horse; a woman","f":"Pferd","s":"Immer dichter und dichter wurde der Tannenwald, im tiefsten Dickicht rauschte es, und bald darauf wieherte laut ein Pferd, das dort angebunden.","n":6},{"w":"Lust","art":"die","ipa":"/lʊst/","m":"desire; the wish to do or have something","f":"Lust","s":"Die Vögel erwachten und flatterten, singend und jubilierend sich in froher Lust liebkosend, durch den Wald!","n":6},{"w":"bewegen","art":"","ipa":"/bəˈveːɡən/","m":"to motivate; to persuade; to prompt; to make","f":"bewegten","s":"Es fehlte natürlicherweise nicht an Anbetern, die täglich zu der Gottheit mit Inbrunst flehten; man konnte indessen nie mit Bestimmtheit sagen, daß sie diesen oder jenen besonders auszeichne, vielmehr wußte sie mit schalkhafter Ironie, die, ohne zu beleidige…","n":6},{"w":"Gesellschaft","art":"die","ipa":"/ɡəˈzɛlʃaft/","m":"company; society, the public; society","f":"Gesellschaft","s":"Sie wußte dem blöden unerfahrnen Mädchen in glänzender Gesellschaft auf eine so feine Art beizustehen, daß dieser Beistand statt bemerkt zu werden, nur dazu diente, Aureliens natürlichen Verstand und tiefes richtiges Gefühl so herauszuheben, daß man sie bald…","n":6},{"w":"statt","art":"","ipa":"/ʃtat/","m":"instead of","f":"statt","s":"Es war mir jetzt selbst unbegreiflich, mit welcher Langmut der Prior das alles ertragen und mich statt der wohlverdienten Strafe in die Welt geschickt hatte.","n":6},{"w":"leise","art":"","ipa":"/ˈlaɪ.zə/","m":"quiet, soft, low; slight, faint, light","f":"leisen","s":"Von der Zeit, als dieses Gespräch, das mir der Baron gleich wieder erzählte, stattgefunden, verdoppelte Euphemie ihre Aufmerksamkeit für den Baron und Aurelien, ja in manchen leisen Andeutungen führte sie den Baron darauf, daß eine Verbindung mit ihm selbst …","n":6},{"w":"brechen","art":"","ipa":"/ˈbʁɛçən/","m":"to break; to refract; to vomit; to fold","f":"gebrochen","s":"sagte der Alte, „Sie bringen durch Ihr starrsinniges Schweigen Ihre Familie zur Verzweiflung, Ihre düstre Schwermut steigt mit jedem Tage, Ihre jugendliche Kraft ist gebrochen, die Blüte verwelkt, Ihr Entschluß den geistlichen Stand zu wählen zerstört alle H…","n":6},{"w":"Hut","art":"der","ipa":"/huːt/","m":"hat; head, top","f":"Hut","s":"Dicht, dicht an dem Sturz, saß auf einem über die Tiefe hervorragenden Felsenstück ein junger Mann in Uniform, der Hut mit dem hohen Federbusch, der Degen, ein Portefeuille lagen neben ihm.","n":6},{"w":"Wunsch","art":"der","ipa":"/vʊnʃ/","m":"wish","f":"Wünsche","s":"sagte der Alte, „Sie bringen durch Ihr starrsinniges Schweigen Ihre Familie zur Verzweiflung, Ihre düstre Schwermut steigt mit jedem Tage, Ihre jugendliche Kraft ist gebrochen, die Blüte verwelkt, Ihr Entschluß den geistlichen Stand zu wählen zerstört alle H…","n":6},{"w":"Zweifel","art":"der","ipa":"/ˈtsvaɪ̯fəl/","m":"doubt","f":"Zweifel","s":"Der innere, unwiderstehliche Drang in mir, wie es jenes Verhängnis zu wollen schien, die Rolle des Grafen fortzuspielen, überwog jeden Zweifel und übertäubte die innere Stimme, welche mich des Mordes und des frechen Frevels bezieh.","n":6},{"w":"schweigen","art":"","ipa":"/ˈʃvaɪ̯ɡən/","m":"to be silent; to keep quiet; to stop talking","f":"schweigen","s":"Sie schweigen?","n":6},{"w":"selten","art":"","ipa":"/ˈzɛltən/","m":"rare, infrequent, uncommon, scarce","f":"seltener","s":"Sie liebten sonst Ihren Vater mit seltener Innigkeit, ist es Ihnen aber jetzt unmöglich geworden ihm Ihr Herz zu erschließen, so quälen Sie ihn wenigstens nicht durch den Anblick Ihres Rocks, der auf den für ihn entsetzlichen Entschluß hindeutet.","n":6},{"w":"Pater","art":"der","ipa":"/ˈpaːtər/","m":"father; Father","f":"Pater","s":"Endlich brach er los: „Mein Gott, ehrwürdiger Herr, alles müßte mich trügen, wenn Sie nicht der Pater Medardus aus dem Kapuzinerkloster in ..","n":6},{"w":"Mittel","art":"das","ipa":"/ˈmɪtəl/","m":"agent, appliance; means; medicament, remedy","f":"Mittel","s":"Tief bewunderte ich die Weisheit des Priors, der das richtige Mittel zu meiner Heilung wählte, denn, in den Klostermauern eingeschlossen, immer von denselben Gegenständen umgeben, immer brütend und hineinzehrend in das Innere, hätte mich jene Vision, der die…","n":6},{"w":"Gedanke","art":"der","ipa":"/ɡəˈdaŋkə/","m":"idea, plan; concept","f":"Gedanke","s":"Schon war ich eine ziemliche Strecke einsam fortgewandelt, als mir erst der Gedanke an die Unbekannte und an den fantastischen Plan sie aufzusuchen, wiederkam.","n":6},{"w":"Graf","art":"der","ipa":"/ɡraːf/","m":"count; earl","f":"Grafen","s":"In mich gekehrt, immer in den Abgrund starrend, ob der blutige Leichnam des Grafen sich nicht mir drohend erheben werde, stand ich da.","n":7},{"w":"verbergen","art":"","ipa":"/fɛɐ̯ˈbɛʁɡn̩/","m":"to hide, conceal from view, keep secret","f":"verborgen","s":"Da fuhr der junge Mensch fort: „Nun gnädiger Herr, reite ich den Fahrweg herab nach dem Städtchen, wo ich mich in dem Hause dicht vor dem Tor linker Hand verborgen halten will, Sie werden wohl gleich herab nach dem Schlosse wandeln, man wird Sie wohl schon e…","n":7},{"w":"brennen","art":"","ipa":"/ˈbʁɛnən/","m":"to burn; to light on fire; to be on fire","f":"brannte","s":"Es war hoher Mittag, die Sonne brannte auf mein unbedecktes Haupt, ich lechzte vor Durst, aber keine Quelle war in der Nähe und noch immer konnte ich nicht das Dorf erreichen, auf das ich stoßen sollte.","n":7},{"w":"Anblick","art":"der","ipa":"/ˈʔanblɪk/","m":"view, sight, look","f":"Anblick","s":"Sie liebten sonst Ihren Vater mit seltener Innigkeit, ist es Ihnen aber jetzt unmöglich geworden ihm Ihr Herz zu erschließen, so quälen Sie ihn wenigstens nicht durch den Anblick Ihres Rocks, der auf den für ihn entsetzlichen Entschluß hindeutet.","n":7}],[{"w":"legen","art":"","ipa":"/ˈleːɡən/","m":"causative of liegen: to lay; to lie down","f":"legte","s":"— Mit diesen Worten zog ich den Geldbeutel hervor, legte drei blanke Dukaten auf den Tisch und der gravitätische Ernst des Herrn Richters verzog sich zum schmunzelnden Lächeln.","n":8},{"w":"Richter","art":"der","ipa":"/ˈʁɪçtɐ/","m":"judge","f":"Richter","s":"Ihr kommt nicht eher von hinnen, bis Ihr uns, dem Richter hier am Orte umständlich gesagt, wer Ihr seid, mit allen Qualitäten, was Geburt, Stand und Würde anbelangt, auch woher Ihr gekommen und wohin Ihr zu reisen gedenkt, nach allen Qualitäten, der Lage des…","n":16},{"w":"Wald","art":"der","ipa":"/valt/","m":"forest; woods; woodland","f":"Waldes","s":"Bald war ich am Ausgange des Waldes und der in der Ferne aufsteigende Dampf, sowie das helle Glockengeläute, das zu mir herübertönte, ließen mich ein Dorf in der Nahe vermuten.","n":25},{"w":"beginnen","art":"","ipa":"/bəˈɡɪnən/","m":"to begin; to commence; to be started","f":"begann","s":"— Die Kutte hatte ich in einen hohlen Baum verborgen und mit ihr all die feindseligen Erscheinungen auf dem Schlosse in den finstern Wald gebannt; denn ich fühlte mich froh und mutig und es war mir, als habe nur meine überreizte Fantasie mir Viktorins blutig…","n":8},{"w":"schreien","art":"","ipa":"/ˈʃʁaɪ̯ən/","m":"to shout; to yell; to cry; to scream; to howl","f":"schrie","s":"schrie der Richter, aber die Alte kreischte: „Der Blutbruder hat mir keinen Groschen gegeben, seht ihr nicht den toten Menschen vor mir liegen?","n":9},{"w":"Haar","art":"das","ipa":"/haːr/","m":"hair","f":"Haare","s":"— Ich beschloß, mich sogleich umzukleiden; mit Hilfe der kleinen Schere und des Kamms den ich in einem Besteck gefunden, verschnitt ich den Bart und brachte die Haare so gut es gehen wollte in Ordnung.","n":10},{"w":"Tor","art":"das","ipa":"/toːr/","m":"gate, archway; gate, door; gateway; goal, net","f":"Tor","s":"Rasch wollte ich durch das Tor sprengen, aber das Pferd fing an sich zu bäumen, meine Unwissenheit, meine Ungeschicklichkeit im Reiten versagte mir jedes Mittel es von der Stelle zu bringen, im Kreise drehte es sich mit mir herum und warf mich endlich, unter…","n":9},{"w":"hinein","art":"","ipa":"[hɪˈnaɪ̯n]","m":"in","f":"hinein","s":"Geheimnisse offenbaren,“ sprach der Richter, „ich merke schon, was das sein wird; nun, geht nun hinaus, ihr Leute, bewacht die Türe und die Fenster und laßt niemanden hinein und heraus!“","n":8},{"w":"mehrere","art":"","ipa":"/meːrərə/","m":"multiple, several; more than one; a number of","f":"mehrere","s":"Während daß ich mein Frühstück verzehrte und mein Pferd gefüttert wurde, versammelten sich mehrere Bauern in der Wirtsstube, die, mit scheuen Blicken mich anschielend, miteinander flüsterten.","n":9},{"w":"Hof","art":"der","ipa":"/hoːf/","m":"yard, court, courtyard; court; farmyard","f":"Hof","s":"Als der Schwarm vorüber, führte man mich eine Seitentreppe hinab in den Hof, und dann durch das Hintergebäude auf die Straße.","n":8},{"w":"springen","art":"","ipa":"/ˈʃpʁɪŋən/","m":"to spring; to leap; to bounce; to dive; to jump","f":"sprang","s":"Da griff ich in die Tasche und warf ihr Geld in den Schoß und jubelnd und jauchzend sprang die Alte auf in die Lüfte und schrie: „Seht die schönen Groschen die mir der Blutbruder gegeben, seht die schönen Groschen!“","n":11},{"w":"Ton","art":"der","ipa":"/toːn/","m":"clay; tone; note","f":"Ton","s":"Da räusperte sich der ernsthafte Mann und sprach, indem er sich bemühte in den Ton seiner Stimme recht viel Gewichtiges zu legen.","n":10},{"w":"Bart","art":"der","ipa":"/baːrt/","m":"beard; bit","f":"Bart","s":"— Ich beschloß, mich sogleich umzukleiden; mit Hilfe der kleinen Schere und des Kamms den ich in einem Besteck gefunden, verschnitt ich den Bart und brachte die Haare so gut es gehen wollte in Ordnung.","n":10},{"w":"nieder","art":"","ipa":"/ˈniː.dɐ/","m":"low; mean; menial","f":"nieder","s":"Über den kann der Blutbruder nicht wegspringen, der tote Mensch richtet sich auf, aber ich drücke ihn nieder, wenn mir der Blutbruder einen Groschen gibt.“","n":8},{"w":"schlagen","art":"","ipa":"/ˈʃlaːɡŋ̩/","m":"to beat; to hit; to knock; to strike; to punch","f":"schlug","s":"Ich schlug den breiten Weg ein, der sich hinabschlängelte und sobald der Abhang weniger steil wurde, schwang ich mich aufs Pferd um soviel möglich mich an das mir ganz fremde Reiten zu gewöhnen.","n":7},{"w":"erkennen","art":"","ipa":"/ɛɐ̯ˈkɛnən/","m":"to recognize, perceive","f":"erkannte","s":"Ich warf die Kutte ab, in welcher ich noch das kleine verhängnisvolle Messer, Viktorins Portefeuille sowie die Korbflasche mit dem Rest des Teufels-Elixiers vorfand, und bald stand ich da in weltlicher Kleidung mit der Reisemütze auf dem Kopf, so daß ich mic…","n":7},{"w":"Messer","art":"das","ipa":"/ˈmɛsɐ/","m":"knife; measurer, surveyor; gauge, meter","f":"Messer","s":"Ich warf die Kutte ab, in welcher ich noch das kleine verhängnisvolle Messer, Viktorins Portefeuille sowie die Korbflasche mit dem Rest des Teufels-Elixiers vorfand, und bald stand ich da in weltlicher Kleidung mit der Reisemütze auf dem Kopf, so daß ich mic…","n":7},{"w":"Dorf","art":"das","ipa":"/dɔrf/","m":"village; backwater","f":"Dorf","s":"Bald war ich am Ausgange des Waldes und der in der Ferne aufsteigende Dampf, sowie das helle Glockengeläute, das zu mir herübertönte, ließen mich ein Dorf in der Nahe vermuten.","n":7},{"w":"Zustand","art":"der","ipa":"/ˈt͡suːˌʃtant/","m":"condition; state; state pattern","f":"Zustande","s":"rief der Förster, „du verruchter, gotteslästerlicher Mensch, du wagst es, hier wieder mit deinem rasenden Beginnen unter fromme Leute zu treten, du wagst es, mir, der ich dich aus viehischem Zustande, aus der ewigen Verderbnis errettet, aufs neue nach dem Le…","n":7},{"w":"schwarz","art":"","ipa":"/ʃvarts/","m":"black, reflecting little or no light; illegal","f":"schwarzer","s":"„Sie kennen,“ nahm der Fremde wieder das Wort, „wohl alle wahrscheinlich, wenn Sie die Reise durch das Gebirge machten, jene wilde, schauerliche Gegend, in der, wenn der Wanderer aus dem dicken Tannenwalde auf die hohen Felsenmassen tritt, sich ihm ein tiefe…","n":7},{"w":"einsam","art":"","ipa":"/ˈaɪ̯nzaːm/","m":"lonely, lone","f":"einsam","s":"sagte der Förster, „einsam ist es hier wohl gar nicht, Sie müßten denn so nach den gewöhnlichen Begriffen der Städter jede Wohnung einsam nennen, die im Walde liegt, unerachtet es denn doch sehr darauf ankommt, wer sich darin aufhält.","n":7},{"w":"Gewehr","art":"das","ipa":"/ɡəˈveːɐ̯/","m":"rifle, long gun; tusks","f":"Gewehr","s":"„Aber,“ fuhr er fort, „die Spitzbuben können mir nichts anhaben, denn mit der Hilfe Gottes verwalte ich mein Amt treu und redlich, und im Glauben und im Vertrauen auf ihn, auf mein gut Gewehr, biete ich ihnen Trotz.“","n":7},{"w":"solch","art":"","ipa":"/zɔlç/","m":"such","f":"solch","s":"Ihr merkt nun selbst, woher das Auffallende in meinem Äußern rührt, das mich bei Euch in solch bösen Verdacht gebracht hat.","n":7},{"w":"Stimmung","art":"die","ipa":"","m":"mood; lively atmosphere; vibe; exuberance; trend","f":"Stimmung","s":"Das Gewühl der Menschen, der fortdauernde Lärm des Gewerbes, das sich auf den Straßen rührte, alles war mir neu und ganz dazu geeignet, die heitre Stimmung zu erhalten, in die mich der komische Kleine versetzt.","n":7},{"w":"Bursche","art":"der","ipa":"/ˈbʊrʃə/","m":"boy, young man; student; boy, young servant","f":"Bursch","s":"— Damon maß mich mit den Augen und suchte dann selbst aus dem Paket, das ihm ein Bursch nachgetragen, Kleidungsstücke heraus, die den Wünschen, welche ich ihm eröffnet, ganz entsprachen.","n":10},{"w":"stürzen","art":"","ipa":"/ˈʃtyʁtsən/","m":"to fall down, to drop, to tumble; to upturn","f":"stürzte","s":"Unsinnig vor Wut und Verzweiflung riß ich das Messer, womit ich Hermogen getötet, und das ich stets bei mir zu tragen pflegte, aus der Seitentasche und stürzte mich auf den Maler, aber ein Schlag warf mich nieder und der Maler lachte im fürchterlichen Hohn, …","n":8},{"w":"Fremder","art":"der","ipa":"","m":"stranger; stranger, foreigner","f":"Fremde","s":"— Ich hatte noch gar nicht daran gedacht, daß es nötig sei irgend einen Namen anzunehmen und noch weniger war mir eingefallen, daß das Sonderbare, Fremde meines Äußern — welches durch die Kleidung, der sich mein mönchischer Anstand nicht fügen wollte, sowie …","n":8},{"w":"Turm","art":"der","ipa":"/tʊʁm/","m":"tower, spire; steeple; rook; diving platform","f":"Turm","s":"Also nur ohne alle weitere Umstände und zeremonische Worte den Paß oder in den Turm!“","n":8},{"w":"bemerken","art":"","ipa":"/bəˈmɛʁkən/","m":"to notice, to perceive","f":"bemerkte","s":"— Ich bemerkte, daß die Leute welche mir begegneten, still standen und mir verwundert nachsahen, ja, daß der Wirt im Dorfe vor Erstaunen über meinen Anblick kaum Worte finden konnte, welches mich nicht wenig ängstigte.","n":11},{"w":"hervor","art":"","ipa":"/hɛrˈfoːr/","m":"forth","f":"hervor","s":"— Mit diesen Worten zog ich den Geldbeutel hervor, legte drei blanke Dukaten auf den Tisch und der gravitätische Ernst des Herrn Richters verzog sich zum schmunzelnden Lächeln.","n":8},{"w":"Satan","art":"der","ipa":"/ˈzaːtan/","m":"Satan, the Devil; a satan, a devil","f":"Satan","s":"— „Hebe dich weg,“ schrie ich außer mir, „du bist der Satan, du bist der frevelnde Mord, aber über mich hast du keine Macht!“","n":11},{"w":"Maler","art":"der","ipa":"/ˈmaːlər/","m":"painter","f":"Maler","s":"— Seit mehreren Abenden sprach man in der Gesellschaft, die ich besuchte, viel von einem fremden Maler, der angekommen und eine Ausstellung seiner Gemälde veranstaltet habe: Alle außer mir hatten die Gemälde schon gesehen und rühmten ihre Vortrefflichkeit so…","n":19},{"w":"Mönch","art":"der","ipa":"/mœnç/","m":"monk; blackcap","f":"Mönche","s":"“ — Diese Worte sang der Kleine mit heisrer, quäkender Stimme, indem er mit treuster Wahrheit, Stellung und Gebärde der Mönche nachahmte.","n":39},{"w":"Anstand","art":"der","ipa":"/ˈan.ʃtant/","m":"decency, manners; offense, objection","f":"Anstand","s":"— Ich hatte noch gar nicht daran gedacht, daß es nötig sei irgend einen Namen anzunehmen und noch weniger war mir eingefallen, daß das Sonderbare, Fremde meines Äußern — welches durch die Kleidung, der sich mein mönchischer Anstand nicht fügen wollte, sowie …","n":10},{"w":"Porträt","art":"das","ipa":"/pɔrˈtrɛː/","m":"portrait","f":"Porträt","s":"Das Gefühl der tiefsten Wehmut durchdrang mich, aber eines lauten Ausrufs konnte ich mich nicht erwehren, als mein Blick auf ein lebensgroßes Porträt fiel, in dem ich die Fürstin, meine Pflegemutter, erkannte.","n":9},{"w":"vorzüglich","art":"","ipa":"","m":"splendid, first-rate, exquisite, five-star, delicious","f":"vorzüglich","s":"— Der ganze Vorfall im Dorfe, vorzüglich die verhängnisvollen Worte des wahnsinnigen Weibes hatten mich nicht wenig aufgeregt.","n":8},{"w":"Förster","art":"der","ipa":"/ˈfœʁstɐ/","m":"forester","f":"Förster","s":"— Unwillkürlich schob ich, wie ich es noch oft aus alter Gewohnheit nicht lassen konnte, einige salbungsvolle Worte über die Kraft des Vertrauens auf Gott ein, und der Förster erheiterte sich immer mehr und mehr.","n":25},{"w":"Zug","art":"der","ipa":"/t͡suːk/","m":"train; platoon; pull; draught; drag, draught","f":"Züge","s":"Sehen Sie, mein Herr, sagte der Kleine, das sind die Hauptingredienzien Ihres äußern Anstandes, und wenn Sie es wünschen, so will ich, Ihre Züge, Ihre Gestalt, Ihre Sinnesart beachtend, etwas Caracalla, Abälard und Boccaz zusammengießen, und so in der Glut, …","n":6},{"w":"Schlaf","art":"der","ipa":"/ʃlaːf/","m":"sleep; temple","f":"Schlafe","s":"Meinen Protestationen unerachtet weckte er seine Frau, eine betagte, aber muntre, rührige Matrone, die, wiewohl aus dem Schlafe gestört, doch freundlich den Gast bewillkommnete und auf des Mannes Geheiß sogleich ein Abendessen zu bereiten anfing.","n":6},{"w":"rot","art":"","ipa":"/roːt/","m":"red; red-haired; redskin; Native American","f":"rote","s":"Eine spitze rote Nase, ein paar kleine, funkelnde Augen, ein langes Kinn und dazu ein aufgetürmtes, gepudertes Toupet, das, wie ich nachher wahrnahm, ganz unvermuteterweise hinten in einen Titus ausging, ein großes Jabot, ein brennend rotes Gilet, unter dem …","n":6},{"w":"Kunst","art":"die","ipa":"/kʊnst/","m":"art; artworks, works of art; craft","f":"Kunst","s":"— Sie ist fremd dem Pietro Belcampo, den die Kunst, die heilige, durchdringt.","n":6},{"w":"lebendig","art":"","ipa":"/leˈbɛndɪç/","m":"living, alive, animate","f":"lebendiger","s":"Immer lebendiger und lebendiger wurde die Heerstraße, und alles kündigte schon in der Ferne die reiche, lebhafte Handelsstadt an, der ich mich jetzt näherte.","n":6},{"w":"packen","art":"","ipa":"/ˈpakən/","m":"to pack; to get packed; to take; to beat it","f":"packen","s":"Endlich waren wir in meinem Zimmer; Belcampo half mir packen, bald war alles zur Reise bereit, ich drückte dem Kleinen mehrere Dukaten in die Hand, er sprang hoch auf vor Freude und rief laut: „Heisa, nun habe ich ehrenwertes Geld, lauter flimmerndes Gold mi…","n":6},{"w":"hell","art":"","ipa":"/hɛl/","m":"clear, bright, light; quick, clever; great","f":"hell","s":"Als die ersten Strahlen der Sonne durch den finstern Tannenwald brachen, befand ich mich an einem frisch und hell über glatte Kieselsteine dahinströmenden Bach.","n":7},{"w":"heulen","art":"","ipa":"/ˈhɔʏ̯lən/","m":"to howl, to whine; to weep, to cry","f":"heulte","s":"Eine helle Glocke im Hause schlug drei Uhr, da heulte er wie von entsetzlicher Qual ergriffen, aber dann brach er wieder aus in das schneidende Gelächter, wie ich es im Traum gehört, er schwenkte sich in wilden Sprüngen, er trank aus der Flasche und rannte d…","n":7},{"w":"Huhn","art":"das","ipa":"/huːn/","m":"chicken; hen","f":"Hühner","s":"Bis dahin tritt die Dämmerung ein, dann gehen wir auf den Anstand, da es, wie mir Franz sagt, Hühner gibt.","n":7},{"w":"stoßen","art":"","ipa":"/ˈʃtoːsn̩/","m":"to push; to shove; to thrust; to bump; to knock","f":"stieß","s":"— Ich fühlte mich von den Gästen angepackt, da ermannte ich mich, und wie ein wütender Stier drängte und stieß ich gegen die Menge, daß mehrere zur Erde stürzten und ich mir den Weg zur Tür bahnte.","n":7},{"w":"Qualität","art":"die","ipa":"/ˌkvaliˈtɛːt/","m":"quality","f":"Qualitäten","s":"Ihr kommt nicht eher von hinnen, bis Ihr uns, dem Richter hier am Orte umständlich gesagt, wer Ihr seid, mit allen Qualitäten, was Geburt, Stand und Würde anbelangt, auch woher Ihr gekommen und wohin Ihr zu reisen gedenkt, nach allen Qualitäten, der Lage des…","n":7},{"w":"Locke","art":"die","ipa":"/ˈlɔkə/","m":"curl","f":"Löckchen","s":"— Sie verstehen mich, mein Herr, denn Sie scheinen mir ein denkender Kopf, wie ich aus dem Löckchen schließe, das sich rechter Hand über Dero verehrte Stirn gelegt.“","n":7},{"w":"Ungetüm","art":"das","ipa":"[ˈʊnɡətyːm]","m":"monster","f":"Ungetüm","s":"— Aber ich erkannte die Nähe des Feindes, der mich in die wogende Flut der ich kaum entronnen, gewaltsam hineindrängen, mich vernichten wollte, und mir kam der Mut wieder, mich aufzulehnen gegen das Ungetüm, das in geheimnisvollem Dunkel auf mich einstürmte.","n":9}],[{"w":"Dame","art":"die","ipa":"/ˈdaːmə/","m":"lady; madam; queen; king; Dame; draughts","f":"Damen","s":"— Die Damen umringten sie, man stellte sich vor, sie sah mich an mit einem Blick, der Erstaunen, eine innere Bewegung verriet; sie lispelte einige Worte, die ich nicht verstand und kehrte sich dann zu einer alten Dame, der sie etwas leise sagte, worüber dies…","n":15},{"w":"Karte","art":"die","ipa":"/ˈkartə/","m":"card","f":"Karten","s":"Der Fürst rief mich zu sich, ich mußte neben ihm stehen, und er wählte meine Karten, nachdem er mir in kurzen Worten das Mechanische des Spiels erklärt.","n":11},{"w":"erhalten","art":"","ipa":"/ɛʁˈhaltən/","m":"to receive; to receive, to win","f":"erhielt","s":"Man sah wohl, wie die anständige Haltung in einer gewissen Ruhe und anspruchslosen Zierlichkeit, in der sich die Residenz erhielt, von dem Hofe ausging.","n":10},{"w":"Prinzessin","art":"die","ipa":"/pʁɪnˈt͡sɛsɪn/","m":"princess","f":"Prinzessinnen","s":"wo sind die Prinzessinnen?","n":32},{"w":"Gespräch","art":"das","ipa":"/ɡəˈʃpʁɛːç/","m":"conversation, chat, talk","f":"Gespräch","s":"Sie redete liebreich mit mehreren Frauenzimmern, die sich eben in der Allee befanden, während der Fürst mit einem ernsten Mann im interessanten, eifrigen Gespräch begriffen schien.","n":9},{"w":"Prinz","art":"der","ipa":"/pʁɪnt͡s/","m":"prince","f":"Prinzen","s":"Ich versuchte ihn über den Verlust dieses wackern Prinzen des längst vergangenen Jahrhunderts möglichst zu trösten, aber es war vergebens.","n":16},{"w":"ebenso","art":"","ipa":"/ˈeːbənzoː/","m":"equally, as much; likewise","f":"ebenso","s":"Er schrieb und zeichnete den Baumeistern mit ängstlicher Genauigkeit jedes Detail der Gebäude vor und jede geringe Abweichung von dem aufgestellten Muster, das er mühsam aus allen nur möglichen antiquarischen Werken herausgesucht, konnte ihn ebenso ängstigen…","n":10},{"w":"geheim","art":"","ipa":"/ɡəˈhaɪ̯m/","m":"secret, clandestine; familiar, dear","f":"geheimeren","s":"Diese Standbilder sind deshalb verbannt worden, und Sie finden nun nur einige gute Kopien nach der Antike, die der Fürst gewisser, ihm teurer Erinnerungen wegen gern im Park behalten wollte, die aber die Fürstin so geschickt — mit zartem Sinn des Fürsten inn…","n":8},{"w":"Verlust","art":"der","ipa":"[fɛɐ̯ˈlʊst]","m":"loss","f":"Verlust","s":"Gewinn und Verlust sind die beiden Angeln, auf denen sich die geheimnisvolle Maschine bewegt, die wir angestoßen, und die nun der ihr einwohnende Geist nach Willkür forttreibt.","n":11},{"w":"Wissenschaft","art":"die","ipa":"/ˈvɪsənʃaft/","m":"science; science, the sciences taken as a whole","f":"Wissenschaften","s":"Der Fürst liebt Künste und Wissenschaften, daher ist ihm jeder geschickte Künstler, jeder geistreiche Gelehrte willkommen, und der Grad seines Wissens nur ist die Ahnenprobe, die die Fähigkeit bestimmt, in der nächsten Umgebung des Fürsten erscheinen zu dürf…","n":8},{"w":"durchaus","art":"","ipa":"/dʊrçˈaʊ̯s/","m":"absolutely,
