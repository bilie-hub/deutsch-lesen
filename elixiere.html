fully, entirely","f":"durchaus","s":"Er schrieb und zeichnete den Baumeistern mit ängstlicher Genauigkeit jedes Detail der Gebäude vor und jede geringe Abweichung von dem aufgestellten Muster, das er mühsam aus allen nur möglichen antiquarischen Werken herausgesucht, konnte ihn ebenso ängstigen…","n":8},{"w":"Green","art":"das","ipa":"/ɡʁiːn/","m":"green, putting green","f":"Green","s":"Sollten Sie aber glauben, daß hier im Amtshause sich, beinahe ebenso lange als Herr Ewson bei mir ist, ein englischer Doktor aufhält, der Green heißt und mit Herrn Ewson darin sympathisiert, daß er ebenso originell, ebenso voll sonderbaren Humors ist?","n":8},{"w":"blasen","art":"","ipa":"/ˈblaːzən/","m":"to blow; to play","f":"geblasen","s":"Ermüdet, ja zerschlagen von der weiten Reise, warf ich mich in meinem Zimmer gleich ins Bette, um recht auszuschlafen, aber es mochte eben Eins geschlagen haben, als mich eine Flöte, die dicht neben mir geblasen wurde, weckte.","n":8},{"w":"Wirt","art":"der","ipa":"/vɪʁt/","m":"pubkeeper; innkeeper; host; agent; caretaker","f":"Wirt","s":"; ich entschloß mich in den stattlichen Gasthof einzukehren, wo mich ein freundlicher, aufgeweckter Wirt empfing.","n":23},{"w":"Kapelle","art":"die","ipa":"[kaˈpɛlə]","m":"chapel; band, ensemble","f":"Kapelle","s":"Als der Park angelegt wurde, war er leidenschaftlicher Baumeister und Gärtner, dann begeisterte ihn der Schwung, den seit einiger Zeit die Musik genommen, und dieser Begeisterung verdanken wir die Einrichtung einer ganz vorzüglichen Kapelle.","n":9},{"w":"Perücke","art":"die","ipa":"/peˈrʏkə/","m":"wig; periwig; peruke","f":"Perücke","s":"— Damit sprang ein kleiner, winddürrer Mann, in einem kaffeebraunen Rocke und fuchsroter runder Perücke, auf die er einen grauen Hut ganz schief und martialisch gestülpt, schnell zum Hause hinaus und lief nach dem Stalle, aus dem ich ihn bald auf einem zieml…","n":8},{"w":"gnädig","art":"","ipa":"/ˈɡnɛːdɪç/","m":"gracious; propitious; merciful","f":"gnädigster","s":"— „Mag das sein, gnädigster Herr,“ erwiderte ich, „aber ich fühle nur zu lebhaft, daß es nicht sowohl die Gefahr ist, durch bedeutenden Verlust in die übelste Lage zu geraten, welche dieses Spiel so verderblich macht, sondern vielmehr die Kühnheit, geradezu …","n":8},{"w":"äußern","art":"","ipa":"/ˈɔʏ̯sɐn/","m":"to utter; to say; to express","f":"äußere","s":"Selbst in der Kleidung und in dem Anstande der Einwohner bis auf den gemeinen Mann herrschte eine gewisse Zierlichkeit, ein Streben, äußere Bildung zu zeigen.","n":14},{"w":"Gemahl","art":"der","ipa":"/ɡəˈmaːl/","m":"spouse; husband","f":"Gemahlin","s":"Ich eilte um die bestimmte Stunde in den Park, der Fürst trat mit seiner Gemahlin und einer geringen Umgebung aus dem Schlosse.","n":10},{"w":"Zirkel","art":"der","ipa":"/ˈt͡sɪrkəl/","m":"pair of compasses, compass; circle","f":"Zirkel","s":"Ich äußerte ihm, als wir bei der Mahlzeit vertrauter geworden, meinen herzlichen Wunsch, der fürstlichen Familie näher zu treten, und er versicherte, daß nichts leichter sei als dieses, da jeder gebildete, geistreiche Fremde im Zirkel des Hofes willkommen wä…","n":9},{"w":"manch","art":"","ipa":"/manç/","m":"many a; many; some","f":"manche","s":"Zufällig stand ich bei einem aufgeweckten Mann, der mir auf alle mögliche Fragen Bescheid gab und manche muntere Anmerkung einzuflechten wußte.","n":9},{"w":"Residenz","art":"die","ipa":"/ʁeziˈdɛnt͡s/","m":"residence, abode; residency; capital","f":"Residenz","s":"Die Residenz des Fürsten bildete gerade den Gegensatz zu der Handelsstadt, die ich verlassen.","n":8},{"w":"geistreich","art":"","ipa":"[ˈɡaɪstˌʁaɪç]","m":"witty","f":"geistreichen","s":"— Die einfachsten, anspruchslosesten Gartenhäuser, Strohdächer auf Baumstämme gestützt und in anmutige Gebüsche versteckt, die eben jenen angedeuteten Zweck erreichten, meinte ich dagegen, wären mir lieber, als alle jene Tempelchen und Kapellchen; und sollte…","n":9},{"w":"Italienerin","art":"die","ipa":"","m":"female Italian","f":"Italienerin","s":"Franceskos Betragen änderte sich bald nach der Ankunft der Italienerin auf eine ganz auffallende Weise; es war, als zehre ein geheimer Gram an seiner Lebensblüte, er wurde mürrisch, verschlossen, er vernachlässigte seine fürstliche Geliebte.","n":8},{"w":"beweisen","art":"","ipa":"/bəˈvaɪ̯zən/","m":"to prove; to display, to show, to demonstrate","f":"bewies","s":"Das Gespräch wandte sich zur Kunst, ich bewies mich als guter Kenner der Malerei und als praktischer Tonkünstler, ich wagte manchen Widerspruch gegen seine Urteile, die geistreich und präcis seine innere Überzeugung aussprachen, aber auch wahrnehmen ließen, …","n":6},{"w":"Nase","art":"die","ipa":"/ˈnaːzə/","m":"nose; snout; dummy; a mild insult; common nase","f":"Nase","s":"Vorzüglich war es ein kleiner Mann mit gestützter Nase und lebhaft funkelnden Augen, schwarz gekleidet, den langen Stahldegen an der Seite, der, indem er sich mit unglaublicher Schnelle durch die Gesellschaft wand und schlängelte, und bald hier, bald dort wa…","n":6},{"w":"Gebäude","art":"das","ipa":"/ɡəˈbɔɪ̯də/","m":"building, edifice, structure","f":"Gebäude","s":"Der fürstliche Palast war nichts weniger als groß, auch nicht im großen Stil erbaut, aber Rücksichts der Eleganz, der richtigen Verhältnisse, eines der schönsten Gebäude, die ich jemals gesehen; an ihn schloß sich ein anmutiger Park, den der liberale Fürst d…","n":6},{"w":"freundlich","art":"","ipa":"/ˈfʁɔɪ̯ntlɪç/","m":"friendly, benign; nice, pleasant","f":"freundliche","s":"— Jedes Gesicht ist kunstmäßig in freundliche Falten gelegt, aber im Herzen Lug und Trug; sie schmelzen vor Freundschaft und Zärtlichkeit, sie bücken und krümmen sich, aber jeder ist des andern unversöhnlicher Feind und sucht ihm hinterlistig ein Bein zu ste…","n":6},{"w":"Rock","art":"der","ipa":"/ʁɔk/","m":"skirt; jacket; dress; rock","f":"Röcken","s":"So wie nach meiner, aus Romanen und Komödien gezogenen Theorie, der Fürst, als er mit mir im Park sprach, bei den Worten: ich bin der Fürst, eigentlich den Oberrock rasch aufknöpfen, und mir einen großen Stern entgegenblitzen lassen mußte, so sollten auch al…","n":6},{"w":"treiben","art":"","ipa":"/ˈtʁaɪ̯bm̩/","m":"to drive; to propel; to force; to put forth","f":"getrieben","s":"Die Freiheit, alles zu äußern was man denkt; die Geringfügigkeit der Abgaben und der daraus entspringende niedrige Preis aller Lebensbedürfnisse; das gänzliche Zurücktreten der Polizei, die nur dem boshaften Übermute ohne Geräusch Schranken setzt und weit en…","n":6},{"w":"wirken","art":"","ipa":"/ˈvɪrkən/","m":"to function, to be effective, to work","f":"wirken","s":"Diese Standbilder sind deshalb verbannt worden, und Sie finden nun nur einige gute Kopien nach der Antike, die der Fürst gewisser, ihm teurer Erinnerungen wegen gern im Park behalten wollte, die aber die Fürstin so geschickt — mit zartem Sinn des Fürsten inn…","n":6},{"w":"Spieler","art":"der","ipa":"/ˈʃpiːlɐ/","m":"agent noun of spielen; player","f":"Spieler","s":"— Sonst wurde viel getanzt, jetzt wird an Gesellschaftstagen eine Farobank gehalten, und der Fürst, ohne im mindesten eigentlicher Spieler zu sein, ergötzt er sich an den sonderbaren Verknüpfungen des Zufalls, doch bedarf es nur irgend eines Impulses, um wie…","n":7},{"w":"Umgebung","art":"die","ipa":"/ʊmˈɡeːbʊŋ/","m":"environment, vicinity, surroundings","f":"Umgebung","s":"Ich eilte um die bestimmte Stunde in den Park, der Fürst trat mit seiner Gemahlin und einer geringen Umgebung aus dem Schlosse.","n":7},{"w":"Begriff","art":"der","ipa":"/bəˈɡʁɪf/","m":"term, word; concept","f":"Begriff","s":"Schon im Begriff mich zu verlassen, kehrte der Fürst sich noch zu mir und frug: „Mit wem habe ich aber gesprochen?“","n":7},{"w":"heftig","art":"","ipa":"/ˈhɛftɪç/","m":"fierce, heavy, vehement, severe, violent","f":"heftig","s":"„Was Adel, was Adel,“ rief der Fürst heftig, „Sie sind, wie ich mich überzeugt habe, ein sehr unterrichteter, geistreicher Mann.","n":7},{"w":"Leibarzt","art":"der","ipa":"","m":"personal physician","f":"Leibarzt","s":"Es war des Fürsten Leibarzt.","n":16},{"w":"fürstlich","art":"","ipa":"","m":"princely; lavish, luxuriant","f":"fürstlichen","s":"Das Leben am fürstlichen Hofe.","n":13},{"w":"indessen","art":"","ipa":"","m":"nevertheless, and yet; while","f":"indessen","s":"„Ich bin ganz Ihrer Meinung,“ erwiderte mein Begleiter, „indessen rühren alle diese Gebäude, ja die Anlage des ganzen Parks von dem Fürsten selbst her, und dieser Umstand beschwichtigt, wenigstens bei uns Einheimischen, jeden Tadel.","n":9},{"w":"inner","art":"","ipa":"/ˈɪnɐ/","m":"inner","f":"innerste","s":"Diese Standbilder sind deshalb verbannt worden, und Sie finden nun nur einige gute Kopien nach der Antike, die der Fürst gewisser, ihm teurer Erinnerungen wegen gern im Park behalten wollte, die aber die Fürstin so geschickt — mit zartem Sinn des Fürsten inn…","n":11},{"w":"Irländer","art":"der","ipa":"/ˈɪʁlɛndɐ/","m":"synonym of Ire","f":"Irländer","s":"Offenbar war es, wie ich nachher einsah, Bosheit des Wirts, daß er das Gespräch geschickt auf nationelle Eigentümlichkeiten lenkte, und mich geradezu frug, ob ich wohl schon Irländer kennen gelernt und von ihren sogenannten Bulls etwas wisse?","n":10},{"w":"Amtmann","art":"der","ipa":"/ˈamtˌman/","m":"bailiff","f":"Amtmann","s":"Es fällt mir eben ein, daß Herr Ewson auf heute abend einen Punsch bei mir bestellt hat, zu dem er den Amtmann und den Doktor Green eingeladen.","n":9},{"w":"Flöte","art":"die","ipa":"/ˈfløːtə/","m":"flute; whistle","f":"Flöte","s":"Ermüdet, ja zerschlagen von der weiten Reise, warf ich mich in meinem Zimmer gleich ins Bette, um recht auszuschlafen, aber es mochte eben Eins geschlagen haben, als mich eine Flöte, die dicht neben mir geblasen wurde, weckte.","n":7},{"w":"lebhaft","art":"","ipa":"[ˈleːphaft]","m":"lively, active, buoyant or agile; brisk; allegro","f":"lebhaften","s":"— Der Fürst lächelte, und fuhr, mich mit seinen lebhaften, klaren Augen scharf anblickend, fort: „Ei, das sind kindische Seelen, die das behaupten, aber am Ende halten Sie mich wohl für einen Spieler, der Sie ins Garn locken will.","n":7},{"w":"neben","art":"","ipa":"/ˈneːbən/","m":"next to, beside, alongside, adjacent to, near, near to","f":"neben","s":"Der Fürst rief mich zu sich, ich mußte neben ihm stehen, und er wählte meine Karten, nachdem er mir in kurzen Worten das Mechanische des Spiels erklärt.","n":5},{"w":"Fuß","art":"der","ipa":"/fuːs/","m":"foot; footing; pedestal; metrical foot","f":"Fuß","s":"— Es kam mir ferner der herrliche Bull jenes Irländers in den Sinn, der mit einem jähzornigen Schotten zusammen in einem Bette schlief und den bloßen Fuß unter der Decke hervorgestreckt hatte.","n":5},{"w":"ähnlich","art":"","ipa":"/ˈɛːnlɪç/","m":"similar, alike, resembling","f":"ähnlich","s":"— bald sah ich nichts mehr als die Fürstin, sie, die meiner Pflegemutter so ähnlich war!","n":5},{"w":"Unterhaltung","art":"die","ipa":"","m":"conversation; entertainment","f":"Unterhaltungen","s":"Was aber den Wechsel der Unterhaltungen bei Hofe betrifft, so ist das wohl ein heitres Spiel im Leben, das jeder dem regsamen Fürsten zur Erholung vom ernsten, oft mühevollen Geschäft recht herzlich gönnen mag.“","n":5},{"w":"einzig","art":"","ipa":"/ˈaɪ̯nt͡sɪç/","m":"only, sole; unique","f":"einzigen","s":"Sie ließ sich alsbald in ein Gespräch mit mir ein, das, so schlau sie es anfing, bald den einzigen Zweck verriet, mich über meine Lebensverhältnisse auszufragen.","n":6},{"w":"unterbrechen","art":"","ipa":"/ʊntərˈbrɛçən/","m":"to interrupt","f":"unterbrochen","s":"Mehrere Straßen, worin Alleen gepflanzt, schienen mehr Anlagen eines Parks zu sein, als zur Stadt zu gehören; alles bewegte sich still und feierlich, selten von dem rasselnden Geräusch eines Wagens unterbrochen.","n":6},{"w":"versichert","art":"","ipa":"/fɛɐ̯ˈzɪçɐt/","m":"insured, covered","f":"versicherte","s":"Ich äußerte ihm, als wir bei der Mahlzeit vertrauter geworden, meinen herzlichen Wunsch, der fürstlichen Familie näher zu treten, und er versicherte, daß nichts leichter sei als dieses, da jeder gebildete, geistreiche Fremde im Zirkel des Hofes willkommen wä…","n":6}],[{"w":"Hals","art":"der","ipa":"/hals/","m":"neck; throat","f":"Halses","s":"Doch hat Medardus das rote Zeichen eines Kreuzes an der linken Seite des Halses, und wenn dieser Mann ...“","n":9},{"w":"herein","art":"","ipa":"[hɛˈʁaɪ̯n]","m":"in","f":"herein","s":"Mehrere Männer traten herein; bei dem Leuchten der Laterne, die einer von ihnen trug, erkannte ich sie für Polizeisoldaten.","n":9},{"w":"Verbrechen","art":"das","ipa":"/fərˈbrɛçən/","m":"a felony, indictable offence; a crime; crime","f":"Verbrechen","s":"Der Richter forderte mich auf, meine bisherigen Lebensverhältnisse genau anzugeben; ich bat ihn, mir erst die Ursache meiner plötzlichen Verhaftung zu sagen, er erwiderte, daß ich über das mir schuld gegebene Verbrechen zu seiner Zeit genau genug vernommen w…","n":14},{"w":"rennen","art":"","ipa":"[ˈʁɛnən]","m":"to run; to race; to sprint; to run over","f":"rannte","s":"Ich fühlte es, daß Aurelie nicht mehr in meiner Nähe war, doch wagte ich es nicht, aufzublicken, ich rannte fort durch die erleuchteten Säle.","n":8},{"w":"Wand","art":"die","ipa":"/vant/","m":"wall, partition","f":"Wände","s":"In den wunderlichen Reflexen, die der düstere, flackernde Schein der Lampe an Wände und Decke warf, grinsten mich allerlei verzerrte Gesichter an; ich löschte die Lampe aus, ich barg mich in die Strohkissen, aber gräßlicher tönte dann das dumpfe Stöhnen, das…","n":10},{"w":"Gewalt","art":"die","ipa":"/ɡəˈvalt/","m":"strong or violent force; violence; authority","f":"Gewalt","s":"— Mit aller Gewalt raffte ich mich zusammen.","n":9},{"w":"Braut","art":"die","ipa":"/bʁaʊ̯t/","m":"bride; a woman taking part in a marriage","f":"Braut","s":"Nun bist du seine Braut ...","n":8},{"w":"dunkel","art":"","ipa":"/ˈdʊŋkəl/","m":"dark; deep; vague, faint","f":"dunklen","s":"— So verkünden es uns die dunklen, weissagenden Stimmen, die aus jener, keinem irdischen Maßstab meßlichen Urzeit zu uns herübertönen, und wie in den Mysterien, die die Säuglinge der Natur feierten, ist uns ja auch der Tod das Weihfest der Liebe!","n":12},{"w":"klopfen","art":"","ipa":"/ˈklɔpfən/","m":"to knock, to rap; to throb","f":"klopfte","s":"— Eben schlich ich eines Tages durch den Park, nachsinnend, ob es ratsam sei, die Abendgesellschaft zu besuchen, die der Fürst ansagen lassen, als man von hinten her auf meine Schulter klopfte.","n":12},{"w":"Prozess","art":"der","ipa":"/pʁoˈt͡sɛs/","m":"lawsuit; process, procedure","f":"Prozesses","s":"Ich wußte, daß man hier gefährliche Verbrecher während des Prozesses einsperre.","n":10},{"w":"beinahe","art":"","ipa":"/baɪ̯ˈnaːə/","m":"almost; nearly","f":"beinahe","s":"es gibt die wunderlichsten Täuschungen, mein Herr Leonard; beinahe ist’s mir gewiß, daß man auf augenblicklichen Eindruck eine Hypothese gebaut hat, die vielleicht in wenigen Minuten in Nichts zerfällt.","n":10},{"w":"deutlich","art":"","ipa":"","m":"articulate, clear; distinct; considerable","f":"deutliches","s":"Ohne deutliches Bewußtsein, was mir drohen könne, glaubte ich zu fühlen, daß ich nun verloren sei.","n":9},{"w":"B","art":"das","ipa":"/beː/","m":"B-flat; B","f":"B","s":"In dem Augenblick kam mir auch ein junger Pole ins Gedächtnis, mit dem ich auf dem Seminar in B.","n":15},{"w":"Brief","art":"der","ipa":"/ˈbʁiːf/","m":"letter","f":"Briefe","s":"Nur einige mir unverständliche Notizen und mehrere an einen Grafen Viktorin gerichtete Briefe befanden sich darin.","n":7},{"w":"Schmerz","art":"der","ipa":"/ʃmɛʁts/","m":"physical pain, ache; physical pain","f":"Schmerz","s":"hat dich je solch namenloser Schmerz zermalmt, so stimme ein in den trostlosen Jammer des ergrauten Mönchs, der in finstrer Zelle der Sonnenzeit seiner Liebe gedenkend, das harte Lager mit blutigen Tränen netzt, dessen bange Todesseufzer in stiller Nacht dur…","n":7},{"w":"albern","art":"","ipa":"/ˈalbərn/","m":"goofy, silly, childish","f":"alberner","s":"Gewiß ist es am Ende ein alberner Tor, der ...“","n":7},{"w":"Verbrecher","art":"der","ipa":"/fɛɐ̯ˈbʁɛçɐ/","m":"criminal","f":"Verbrecher","s":"Ich wußte, daß man hier gefährliche Verbrecher während des Prozesses einsperre.","n":8},{"w":"unheimlich","art":"","ipa":"/ˈʊnˌhaɪ̯m.lɪç/","m":"uncanny, creepy, eerie; incredible, massive","f":"unheimlich","s":"Wohl mag mein ganzes Wesen gar unheimlich erschienen sein; denn ich bemerkte, wie mir alles scheu auswich, als ich die breite Haupttreppe mehr herabsprang als herabstieg.","n":8},{"w":"Kreuz","art":"das","ipa":"/ˈkʁɔʏ̯ts/","m":"cross; clubs; sharp sign, ♯; lower back","f":"Kreuzes","s":"Doch hat Medardus das rote Zeichen eines Kreuzes an der linken Seite des Halses, und wenn dieser Mann ...“","n":8},{"w":"wenden","art":"","ipa":"/ˈvɛndən/","m":"to turn something so as to cook or roast it from both sides","f":"wenden","s":"Überdem waren aller Augen auf Aurelien gerichtet, und so gelang es mir, im Kreise gleichgültiger Menschen mich zu drehen und zu wenden, ohne daß irgend einer mich sonderlich bemerkt oder gar angeredet hätte, welches mir unerträglich gewesen sein würde, da ic…","n":11},{"w":"blicken","art":"","ipa":"[ˈblɪkŋ̩]","m":"to look; to get, to understand","f":"blickend","s":"fing er sogleich an, und griff, starr mir ins Auge blickend, nach meinem Arm.","n":10},{"w":"gestehen","art":"","ipa":"/ɡəˈʃteːən/","m":"to confess, to admit; to make known","f":"gestehen","s":"— „Ich weiß,“ sagte ich, mich ziemlich unsanft losmachend, „ich weiß Ihre wunderlichen Reden nicht zu deuten, mein Herr, aber ich muß gestehen, daß, als ich Aurelien von den geschmückten Herrn umlagert sah, denen, wie Sie witzig bemerken, das Liebesfeuer aus…","n":13},{"w":"verderben","art":"","ipa":"/fɛɐ̯ˈdɛʁbən/","m":"to deprive of; to rob of; to ruin; to corrupt","f":"Verderben","s":"„Bin ich denn schuld an euerm Verderben?","n":8},{"w":"sanft","art":"","ipa":"/zanft/","m":"gentle","f":"sanft","s":"— Ich weiß nicht, ob ich diese Worte wirklich sprach, aber ich hörte mich selbst lachen und fuhr auf wie aus tiefem Traum, als der alte Hofmarschall, sanft meine Hand fassend, frug: „Worüber erfreuen Sie sich so, lieber Herr Leonard?“","n":10},{"w":"ahnen","art":"","ipa":"/ˈʔaːnən/","m":"to suspect, guess","f":"ahnen","s":"„Wenigstens hätten Sie aber doch gleich ahnen, daß man Sie mit dem wahnsinnigen Mönch verwechsle, und diesen als den Kapuziner Medardus bezeichnen sollen?“","n":8},{"w":"widerstehen","art":"","ipa":"/viːdəʁˈʃteːn/","m":"to withstand, to resist","f":"widerstehen","s":"— — Man sage nicht, daß das einfache Hauskleid das wahrhaft schöne Mädchen am besten ziere, der Putz der Weiber übt einen geheimnisvollen Zauber, dem wir nicht leicht widerstehen können.","n":10},{"w":"Unbekannte","art":"die","ipa":"","m":"female equivalent of Unbekannter: female stranger","f":"Unbekannter","s":"Unbekannter!","n":8},{"w":"F","art":"das","ipa":"/ɛf/","m":"F","f":"F","s":"Er nannte die Gegend, wo die Güter des Barons F.","n":10},{"w":"Geliebter","art":"der","ipa":"/ɡəˈliːptɐ/","m":"lover, romantic partner","f":"Geliebte","s":"— Als du die Geliebte zum erstenmal geschmückt sahst, fröstelte da nicht ein unerklärlich Gefühl dir durch Nerv und Adern?","n":8},{"w":"starren","art":"","ipa":"/ˈʃtarən/","m":"to stare, to gaze","f":"starr","s":"fing er sogleich an, und griff, starr mir ins Auge blickend, nach meinem Arm.","n":12},{"w":"Vermutung","art":"die","ipa":"[fɛɐ̯ˈmuːtʊŋ]","m":"guess; supposition; suspicion; conjecture","f":"Vermutungen","s":"Meinen ehemaligen Verhältnissen bei Hofe und der allgemeinen Achtung, die ich in der Tat so lange genossen hatte, mochte ich die höfliche Art danken, mit der man mich behandelte, wiewohl ich auch die Überzeugung darauf baute, daß nur Vermutungen, die hauptsä…","n":8},{"w":"fürchterlich","art":"","ipa":"/ˈfʏʁçtɐlɪç/","m":"frightening","f":"fürchterlich","s":"Darauf mich stützend, wollte ich auf irgend eine Weise ein Zusammentreffen mit Viktorin, ja selbst mit dem Medardus, für den man mich hielt, vorgeben; jenes Abenteuer auf dem Schlosse, das so fürchterlich endete, als von Hörensagen erzählen, und mich selbst,…","n":8},{"w":"Ähnlichkeit","art":"die","ipa":"/ˈɛːnlɪçkaɪ̯t/","m":"similarity, resemblance","f":"Ähnlichkeit","s":"Es muß also ein Fremder sein, der mich eines in früherer Zeit begangenen Verbrechens anklagt, und da ich mich von aller Schuld völlig rein fühle, so hat vielleicht nur eine unglückliche Ähnlichkeit die Vermutung meiner Schuld erregt; um so härter finde ich e…","n":11},{"w":"Kerker","art":"der","ipa":"/ˈkɛrkər/","m":"dungeon","f":"Kerker","s":"Ich wurde in den Kerker zurückgeführt.","n":10},{"w":"erwachen","art":"","ipa":"/ɛɐ̯ˈvaxn̩/","m":"to awake","f":"erwachte","s":"Als ich am hellen Morgen erwachte, kam mir nur nach und nach die Erinnerung dessen, was geschehen und wo ich hingebracht worden.","n":8},{"w":"erwidern","art":"","ipa":"/ɛrˈviːdərn/","m":"to reciprocate, return, to react with something analogous","f":"erwiderte","s":"Er frug mich, was ich da mache, ich erwiderte, daß ich nur hinausschauen wollen; schweigend trug er Tisch, Bette und den Stuhl fort und schloß mich sogleich wieder ein.","n":12},{"w":"Doppelgänger","art":"der","ipa":"/ˈdɔpl̩ɡɛŋɐ/","m":"doppelganger, doppelgänger","f":"Doppelgänger","s":"Er hielt mich für seinen Doppelgänger, dessen Erscheinung ihm den Tod verkünde.","n":11},{"w":"Adel","art":"der","ipa":"/ˈaːdəl/","m":"nobility","f":"Adel","s":"Nun, Herr Leonard, oder vielmehr Herr von Krczynski, Sie sind von Adel, ich fixiere Sie bei Hofe auf eine Art, die Ihnen angenehm sein soll.","n":10},{"w":"herauf","art":"","ipa":"/hɛˈʁaʊ̯f/","m":"up, upwards","f":"herauf","s":"— Der Abend kam, die Nacht brach ein, da hörte ich die Haustüre aufschließen, mehrere Stimmen murmelten und flüsterten durcheinander, es wandte und tappte die Treppe herauf — endlich pochte man an meine Türe und befahl mir, im Namen der Obrigkeit, aufzumachen.","n":10},{"w":"vergebens","art":"","ipa":"/fɛrˈɡeːbəns/","m":"in vain","f":"vergebens","s":"Er blieb in seiner ruhigen Dolcezza , obgleich erwähnter Konsistorialpräsident wirklich meinte, der Teufel habe aus Ihnen, mein Teurer, auf seine Art gelächelt und unsere schöne Aurelie von solchem Grausen und Entsetzen ergriffen wurde, daß alle Bemühungen d…","n":11},{"w":"Träne","art":"die","ipa":"/ˈtrɛːnə/","m":"tear","f":"Tränen","s":"hat dich je solch namenloser Schmerz zermalmt, so stimme ein in den trostlosen Jammer des ergrauten Mönchs, der in finstrer Zelle der Sonnenzeit seiner Liebe gedenkend, das harte Lager mit blutigen Tränen netzt, dessen bange Todesseufzer in stiller Nacht dur…","n":11},{"w":"vernehmen","art":"","ipa":"/fɛʁˈneːmən/","m":"to hear; to question, to examine","f":"vernommen","s":"Der Richter forderte mich auf, meine bisherigen Lebensverhältnisse genau anzugeben; ich bat ihn, mir erst die Ursache meiner plötzlichen Verhaftung zu sagen, er erwiderte, daß ich über das mir schuld gegebene Verbrechen zu seiner Zeit genau genug vernommen w…","n":10},{"w":"Umstand","art":"der","ipa":"/ˈʊmʃtant/","m":"circumstance; fuss, trouble, bother","f":"Umstande","s":"Jetzt komme es nur darauf an, meinen ganzen Lebenslauf bis zur Ankunft in der Residenz auf das genaueste zu wissen, und er müsse mich daran erinnern, daß es dem Kriminalgericht nicht an Mitteln fehlen würde, auch dem kleinsten von mir angegebenen Umstande na…","n":11},{"w":"entsetzen","art":"","ipa":"/ɛntˈzɛtsən/","m":"to shock, horrify, appall; to relieve","f":"Entsetzen","s":"Er blieb in seiner ruhigen Dolcezza , obgleich erwähnter Konsistorialpräsident wirklich meinte, der Teufel habe aus Ihnen, mein Teurer, auf seine Art gelächelt und unsere schöne Aurelie von solchem Grausen und Entsetzen ergriffen wurde, daß alle Bemühungen d…","n":17},{"w":"Geistlicher","art":"der","ipa":"/ˈɡaɪ̯stlɪçɐ/","m":"priest, clergyman, clergyperson, cleric","f":"Geistlichen","s":"Mein Vater, selbst ziemlich unterrichtet, billigte meinen entschiedenen Hang zu den Wissenschaften, und wollte mich eben nach Krakau zu einem ihm verwandten Geistlichen, Stanislaw Krczynski, schicken, als er starb.","n":9},{"w":"trostlos","art":"","ipa":"/ˈtʁoːstloːs/","m":"dreary, bleak, desolate, dismal; depressing","f":"trostlosen","s":"hat dich je solch namenloser Schmerz zermalmt, so stimme ein in den trostlosen Jammer des ergrauten Mönchs, der in finstrer Zelle der Sonnenzeit seiner Liebe gedenkend, das harte Lager mit blutigen Tränen netzt, dessen bange Todesseufzer in stiller Nacht dur…","n":9},{"w":"erblicken","art":"","ipa":"[ɛɐ̯ˈblɪkn̩]","m":"to sight, catch sight of","f":"erblickte","s":"Doch besser, wie damals, als ich Aurelien zum erstenmal im Schlosse des Barons erblickte, hemmte ich den Ausbruch meiner wahnsinnigen Leidenschaft.","n":9},{"w":"klein","art":"","ipa":"/klaɪ̯n/","m":"small, little, wee; small, little, young","f":"kleinsten","s":"Jetzt komme es nur darauf an, meinen ganzen Lebenslauf bis zur Ankunft in der Residenz auf das genaueste zu wissen, und er müsse mich daran erinnern, daß es dem Kriminalgericht nicht an Mitteln fehlen würde, auch dem kleinsten von mir angegebenen Umstande na…","n":6},{"w":"dauern","art":"","ipa":"/ˈdaʊ̯ɐn/","m":"to last, to continue, to persist; to grieve","f":"dauerte","s":"Nicht lange dauerte es, so wurde mein Bette gebracht und der Gefangenwärter frug mich, ob ich noch etwas zu meiner Bequemlichkeit wünsche?","n":6},{"w":"halb","art":"","ipa":"","m":"half, halfway","f":"halb","s":"— In der neunten Nacht mochte es sein, als ich, halb ohnmächtig von Grauen und Entsetzen, auf dem kalten Boden des Gefängnisses ausgestreckt lag.","n":6}],[{"w":"Rom","art":"der","ipa":"/ʁoːm/","m":"Rom, Romani","f":"Rom","s":"Haben wir das Glück, Euch ganz zu heilen, so könnt Ihr ruhig Eure Straße fortwandeln, denn wie ich höre, wollt Ihr nach Rom!“","n":11},{"w":"Gnade","art":"die","ipa":"/ˈɡnaːdə/","m":"grace, mercy, graciousness; pardon, clemency","f":"Gnade","s":"Dank sei es der ewigen Langmut und Gnade des Herren, Dank sei es der Fürsprache der Gebenedeiten und der Heiligen, daß ich errettet worden bin!“","n":9},{"w":"Ei","art":"das","ipa":"/aɪ̯/","m":"egg; something egg-shaped; testicle, ball; bucks","f":"Ei","s":"„Ei,“ sprach er, „wie sollen wir denn Euern Namen nicht wissen?","n":10},{"w":"Kleid","art":"das","ipa":"/klaɪ̯t/","m":"dress, gown; garment; clothes; pelt, plumage","f":"Kleid","s":"Ehrwürden wundern sich merklich über das schöne Kleid, das Ihnen angelegt worden, es scheint Ihnen überall wunderbar anzustehen und zu passen, besser als jenes nußbraune Kleid mit schnöden besponnenen Knöpfen, das mein ernsthafter, vernünftiger Damon Ihnen a…","n":7},{"w":"fliehen","art":"","ipa":"/ˈfliː.ən/","m":"to flee; to escape; to fly; to diverge; to avoid","f":"Fliehen","s":"„Fliehen, weiter fort!","n":7},{"w":"aufnehmen","art":"","ipa":"/ˈʔaʊ̯fneːmən/","m":"to pick up, lift up; to record, to take","f":"aufnehme","s":"Es wurde mir klar, daß mein bewußtloser Zustand eine Zeitlang gedauert haben, und daß ich in demselben auf diese oder jene Weise in ein Kloster gebracht sein mußte, das Kranke aufnehme.","n":7},{"w":"Höhle","art":"die","ipa":"/ˈhøːlə/","m":"cave; cavity","f":"Höhle","s":"Eine gute Strecke von Rom fand er eine Höhle, in die er sich ermüdet und ermattet verbarg.","n":10},{"w":"Sünde","art":"die","ipa":"/ˈzʏndə/","m":"sin","f":"Sünde","s":"„Du scheinst, mein Bruder,“ fing er an, „von schwerer Sünde belastet, denn nur die tiefste, trostloseste Reue über eine entsetzliche Tat kann sich so gebärden.","n":13},{"w":"malen","art":"","ipa":"/ˈmaːlən/","m":"to paint; to draw, depict","f":"malen","s":"Er half dem Alten manch wichtiges großes Werk vollenden, und es geschah, daß der Schüler, sich hinaufschwingend zu der Höhe des Meisters, berühmt wurde, und manches Altarblatt für Kirchen und Klöster malen mußte.","n":13},{"w":"Trost","art":"der","ipa":"/tʁoːst/","m":"consolation","f":"Trost","s":"— Keine Gnade — kein Trost mehr, hier und dort!","n":8},{"w":"Reue","art":"die","ipa":"/ˈʁɔɪ̯ə/","m":"repentance; remorse, regret","f":"Reue","s":"„Du scheinst, mein Bruder,“ fing er an, „von schwerer Sünde belastet, denn nur die tiefste, trostloseste Reue über eine entsetzliche Tat kann sich so gebärden.","n":8},{"w":"Qual","art":"die","ipa":"/kvaːl/","m":"agony, anguish, torment, torture","f":"Qual","s":"aber das fühlst du nicht, denn das ist nicht deine Qual — deine Qual ist in dir, und tötet dich nicht, denn du lebst in ihr.","n":9},{"w":"gedenken","art":"","ipa":"/ɡəˈdɛŋkŋ̩/","m":"to remember, to commemorate; to intend","f":"gedachte","s":"Dort mußte man den Ordensbruder aufnehmen, und ich gedachte, mich in voller Gemächlichkeit recht auszupflegen.","n":13},{"w":"Knabe","art":"der","ipa":"/ˈknaːbə/","m":"knave, boy, lad","f":"Knäblein","s":"Ein dumpfes, angstvolles Stöhnen weckte in einer Nacht den Francesko aus dem Schlafe; als er erschrocken aufsprang und mit der Leuchte in der Hand nach seinem Weibe sah, hatte sie ihm ein Knäblein geboren.","n":12},{"w":"Buße","art":"die","ipa":"[ˈbuːsə]","m":"penance; fine","f":"Buße","s":"Die Buße.","n":11},{"w":"genesen","art":"","ipa":"/ɡəˈneːzən/","m":"to recover; to recuperate","f":"genesen","s":"— „Ei, lieber Bruder Medardus,“ fing er plötzlich sehr ernst an, „du willst mich fortschicken, nun du genesen, und mußtest mich doch in deiner Nähe leiden, als du krank dalagst und ich dein Stubenkamerad war und in jenem Bette schlief.“","n":8},{"w":"Prior","art":"der","ipa":"","m":"prior","f":"Prior","s":"Mit der Freundlichkeit, die den italienischen Mönchen eigen, bewirtete man mich reichlich, und der Prior erklärte, daß, insofern mich nicht vielleicht die Erfüllung eines Gelübdes weiter zu pilgern nötige, ich als Fremder so lange im Kloster bleiben könne, a…","n":14},{"w":"Jüngling","art":"der","ipa":"/ˈjʏŋlɪŋ/","m":"youth, youngling, stripling, sapling","f":"Jüngling","s":"Francesko war sonst ein stolzer, übermütiger Jüngling gewesen, nur der alte Leonardo zähmte seinen wilden Sinn, und als Francesko dem fürstlichen Stand entsagt hatte, wurde er Leonardos frommer, treuer Sohn.","n":21},{"w":"Richtung","art":"die","ipa":"/ˈʁɪçtʊŋ/","m":"direction; school of thought, branch, subfield","f":"Richtung","s":"Ihr gingt, wenn man Euch führte, Ihr bliebt stehen, wenn man Euch losließ, Ihr setztet, Ihr legtet Euch nieder, wenn man Euch die Richtung gab.","n":6},{"w":"lächeln","art":"","ipa":"/ˈlɛçəln/","m":"to smile","f":"lächelte","s":"— Der Arzt lächelte zufrieden und rief dem Geistlichen zu: „Gut, sehr gut!“","n":6},{"w":"fern","art":"","ipa":"/fɛʁn/","m":"remote; far away","f":"ferner","s":"Der Geistliche öffnete ein Fenster, eine warme, herrliche Luft, wie ich sie nie geatmet, strömte herein, ein Garten schloß sich an das Gebäude, herrliche fremde Bäume grünten und blühten, Weinlaub rangte sich üppig an der Mauer empor, vor allem aber war mir …","n":6},{"w":"Schönheit","art":"die","ipa":"/ˈʃøːn.haɪ̯t/","m":"beauty, beautifulness","f":"Schönheit","s":"Ich sah Euphemien, wie sie in üppiger Schönheit mir nahte, aber laut schrie ich auf: „Was willst du von mir, Verruchte!","n":6},{"w":"Mantel","art":"der","ipa":"/ˈmantəl/","m":"coat, overcoat; lateral surface","f":"Mantel","s":"Einmal begegnete mir, als ich schon im Begriff stand in das Haus zurückzukehren, ein langer, hagerer Mann, in einem seltsamen erdgelben Mantel, der wurde von zwei Geistlichen bei den Armen geführt, und nach jedem Schritt machte er einen possierlichen Sprung,…","n":6},{"w":"West","art":"der","ipa":"/ˈvɛst/","m":"a wind coming from the west","f":"W","s":"Theodor, Fürst von W.","n":6},{"w":"Frevel","art":"der","ipa":"/fʁeːfəl/","m":"outrage, crime, sin; sacrilege, iniquity","f":"Frevel","s":"Mein ganzes Leben — meine tausendfachen Frevel — meine Missetaten — Hermogens — Aureliens Mord — alles — alles nur ein entsetzlicher Gedanke, und der durchfuhr wie ein spitzes, glühendes Eisen mein Gehirn.","n":17},{"w":"ehrwürdig","art":"","ipa":"/ˈeːɐ̯ˌvʏʁdɪç/","m":"venerable, reverend","f":"ehrwürdiger","s":"Ihr befindet Euch, ehrwürdiger Herr!","n":11},{"w":"Narrheit","art":"die","ipa":"","m":"foolishness","f":"Narrheiten","s":"— „Laßt die Narrheiten,“ fuhr ich auf, „laßt die Narrheiten, Schönfeld“ ...","n":11},{"w":"verrucht","art":"","ipa":"/fɛɐ̯ˈʁuːχt/","m":"heinous, despicable","f":"verruchten","s":"— Zur Hölle — zur Hölle — ewige Verdammnis über mich verruchten Sünder beschlossen!“","n":10},{"w":"Graph","art":"der","ipa":"/ɡʁaːf/","m":"graph; glyph","f":"Graf","s":"Es begab sich, daß der Graf Filippo S.","n":20},{"w":"himmlisch","art":"","ipa":"[ˈhɪm.lɪʃ]","m":"celestial, heavenly; divine","f":"himmlischem","s":"Er schaute mich an mit unbeschreiblich mildem Ernst, er faßte meine Hände, und es war, als halte ein Heiliger, von himmlischem Mitleid erfüllt, den Verlorenen in den Lüften über dem Flammenpfuhl fest, in den er hinabstürzen wollte.","n":7},{"w":"Ehe","art":"die","ipa":"/ˈeːə/","m":"marriage","f":"Ehe","s":"Er umarmte das Weib voll inbrünstiger Liebe und wollte sie sogleich nach der Kirche führen, damit ein Priester sie durch das heilige Sakrament der Ehe auf ewig binde.","n":5},{"w":"wohnen","art":"","ipa":"/ˈvoːnən/","m":"to live, reside, dwell; to stay","f":"wohnen","s":"„Wo bin ich denn,“ rief ich voll Entzücken aus, „haben mich die Heiligen gewürdigt, in einem Himmelslande zu wohnen?“","n":5},{"w":"vollkommen","art":"","ipa":"","m":"perfect; complete","f":"vollkommenen","s":"Nur einige Minuten hatte ich so, zum vollkommenen Bewußtsein erwacht, gelegen, als ich Tritte vernahm, die sich wie auf einem langen Gange näherten.","n":5},{"w":"Flucht","art":"die","ipa":"/flʊxt/","m":"escape, flight; line, alignment; flock of birds","f":"Flucht","s":"Ich tat es, und erstarrte vor Schreck und Erstaunen, denn ich fand, daß der Name Medardus hineingenäht war, sowie mich, bei genauerer Untersuchung, untrügliche Kennzeichen wahrnehmen ließen, daß ich ganz unbezweifelt dieselbe Kutte trug, die ich auf der Fluc…","n":5},{"w":"matt","art":"","ipa":"/mat/","m":"dull; exhausted, weak, feeble","f":"matt","s":"Ich fühlte mich sehr matt, sonst aber ganz schmerzlos.","n":5},{"w":"nackt","art":"","ipa":"/nakt/","m":"nude; not wearing any clothes; bare; not covered","f":"nackte","s":"Ich schritt weiter fort, doch wie entsetzte ich mich, als ich dicht vor mir eine nackte menschliche Figur ausgestreckt auf dem Boden erblickte.","n":5},{"w":"beten","art":"","ipa":"/ˈbeːtn̩/","m":"to pray","f":"beten","s":"Ich wollte beten, da begann ein sinnverwirrendes Flüstern und Rauschen.","n":5},{"w":"wachsen","art":"","ipa":"/ˈvaksn̩/","m":"to grow; to grow, to increase; to wax","f":"wuchs","s":"Nun fingen die Gedanken der einzelnen Teile an sich zu drehen, wie leuchtende Punkte, immer schneller und schneller, so daß sie einen Feuerkreis bildeten, der wurde kleiner, sowie die Schnelligkeit wuchs, daß er zuletzt nur eine stillstehende Feuerkugel schi…","n":5},{"w":"Figur","art":"die","ipa":"/fiˈɡuːɐ̯/","m":"figure, figurine; character; piece; figure","f":"Figur","s":"— Ich lag im offenen Fenster und atmete in vollen Zügen die herrliche, warme Luft ein, die durch Mark und Adern strömend neues Leben in mir entzündete, als ich eine kleine, dürre Figur, ein spitzes Hütchen auf dem Kopfe, und in einen ärmlichen, erblichenen Ü…","n":6},{"w":"mächtig","art":"","ipa":"/ˈmɛçtɪç/","m":"powerful, mighty; capable, having command","f":"mächtig","s":"Noch war ich keines Wortes mächtig, ich warf mich vor dem Greise nieder in den Staub.","n":6},{"w":"Bewusstsein","art":"das","ipa":"/bəˈvʊstzaɪ̯n/","m":"consciousness, awareness","f":"Bewußtsein","s":"Jeder Teil hatte im eignen Regen eignes Bewußtsein des Lebens und umsonst gebot das Haupt den Gliedern, die wie untreue Vasallen sich nicht sammeln mochten unter seiner Herrschaft.","n":6},{"w":"begehen","art":"","ipa":"/bəˈɡeːən/","m":"to commit, perpetrate; to visit, to inspect","f":"beging","s":"Francesko wurde von diesen Reden des Weibes verführt, und so geschah es, daß er mit den von sündigem, freveligem Leichtsinn befangenen Jünglingen, die sich seine Freunde nannten, noch an demselben Abende sein Hochzeitsfest mit dem fremden Weibe nach heidnisc…","n":6},{"w":"italienisch","art":"","ipa":"/ˌi.taˈli̯eː.nɪʃ/","m":"Italian","f":"italienisch","s":"— Ohne mir zu antworten, wandte sich der bürgerlich gekleidete zu dem Geistlichen und sprach auf italienisch: „Das ist in der Tat erstaunenswürdig, der Blick ist ganz geändert, die Sprache rein, nur matt ...","n":6},{"w":"sinken","art":"","ipa":"/ˈzɪŋkən/","m":"to sink; to submerge; to set; to fall; to drop","f":"sank","s":"— Ich erbebte — wie vernichtet sank ich in den Stuhl, die Türe öffnete sich und hastig trat der mich pflegende Geistliche herein.","n":6},{"w":"darstellen","art":"","ipa":"/ˈdaːʁˌʃtɛlən/","m":"to depict; represent; to personate; to pose","f":"darstellten","s":"Nachdem ich mein Gebet am Hochaltar verrichtet, schritt ich durch die Seitengänge, die Altargemälde betrachtend, welche, wie gewöhnlich, die Martyrien der Heiligen, denen sie geweiht, darstellten.","n":6},{"w":"herbringen","art":"","ipa":"[ˈheːɐ̯ˌbʁɪŋən]","m":"to bring","f":"hergebracht","s":"Ihr wurdet vor drei Monaten in einem sehr bedenklichen Zustande hergebracht.","n":6},{"w":"Haupt","art":"das","ipa":"/haʊ̯pt/","m":"head; leader; chief; see haupt-","f":"Haupt","s":"Jeder Teil hatte im eignen Regen eignes Bewußtsein des Lebens und umsonst gebot das Haupt den Gliedern, die wie untreue Vasallen sich nicht sammeln mochten unter seiner Herrschaft.","n":6},{"w":"gebären","art":"","ipa":"/ɡəˈbɛːʁən/","m":"to give birth; to give birth to; to bear","f":"geboren","s":"Ein dumpfes, angstvolles Stöhnen weckte in einer Nacht den Francesko aus dem Schlafe; als er erschrocken aufsprang und mit der Leuchte in der Hand nach seinem Weibe sah, hatte sie ihm ein Knäblein geboren.","n":6},{"w":"entzünden","art":"","ipa":"[ʔɛntˈtsʏndn̩]","m":"to ignite, to inflame; to inflame","f":"entzündete","s":"— Ich lag im offenen Fenster und atmete in vollen Zügen die herrliche, warme Luft ein, die durch Mark und Adern strömend neues Leben in mir entzündete, als ich eine kleine, dürre Figur, ein spitzes Hütchen auf dem Kopfe, und in einen ärmlichen, erblichenen Ü…","n":6},{"w":"erstaunen","art":"","ipa":"[ʔɛɐ̯ˈʃtaʊ̯nən]","m":"to astonish, astound","f":"erstaunte","s":"Die Glockentöne dauerten fort — ich glaubte noch im Walde zu sein, aber wie erstaunte ich, als ich die Gegenstände rings umher, als ich mich selbst betrachtete.","n":6}],[{"w":"Volk","art":"das","ipa":"/fɔlk/","m":"people, nation, folk, tribe, race; folk, crowd","f":"Volk","s":"Es war so weit gekommen, daß überall, wo ich mich in den Straßen von Rom blicken ließ, einzelne aus dem Volk stillstanden, und in gebeugter, demütiger Stellung um meinen Segen baten.","n":17},{"w":"Feind","art":"der","ipa":"/faɪ̯nt/","m":"enemy, fiend, foe","f":"Feinden","s":"— So arbeitete meine Fantasie ein Gemälde aus, das meine Verherrlichung hienieden mit lebendigen Farben darstellte, und nicht gedenkend, nicht ahnend, wie der böse Geist des sündlichen Stolzes mich auf neue Weise zu verlocken trachte, beschloß ich, nach mein…","n":12},{"w":"Rose","art":"die","ipa":"/ˈʁoːzə/","m":"rose; erysipelas","f":"Rose","s":"da regte es sich in den Büschen — eine Rose, von himmlischer Glut hoch gefärbt, streckte ihr Haupt empor und schaute den Medardus an mit englisch mildem Lächeln, und süßer Duft umfing ihn, und der Duft war das wunderbare Leuchten des reinsten Frühlingsäthers.","n":12},{"w":"überzeugen","art":"","ipa":"/ˌyːbəʁˈtsɔʏ̯ɡən/","m":"to convince; to convince oneself","f":"überzeugen","s":"Hielt ich seine letzte Äußerung mit meinen eignen Bemerkungen über den Papst zusammen, so mußte es mir wohl klar aufgehen, daß er keineswegs der nach dem Kampf mit dem Tier gekrönte Sieger war, für den ich ihn gehalten, und ebenso mußte ich auf entsetzliche …","n":9},{"w":"merkwürdig","art":"","ipa":"/ˈmɛʁkˌvʏʁdɪç/","m":"strange, odd; remarkable, noteworthy","f":"merkwürdigen","s":"Beinahe traute ich Euch, nachdem ich Eure merkwürdigen Andachtsübungen gesehen, nicht mehr zu, daß Ihr über solche Torheiten zu lachen vermöchtet.“","n":8},{"w":"streng","art":"","ipa":"/ʃtʁɛŋ/","m":"strict, rigorous; severe, intense","f":"strengen","s":"Mocht’ es sein, daß meine strengen Bußübungen, die ich fortsetzte, schon Aufsehen erregten, aber gewiß war es, daß meine fremdartige, wunderliche Erscheinung den lebhaften fantastischen Römern bald zu einer Legende werden mußte, und daß sie mich vielleicht, …","n":8},{"w":"richten","art":"","ipa":"[ˈʁɪçtn̩]","m":"to direct, to point; to direct, to address","f":"gerichtet","s":"Nach einigen Minuten düstern ahnungsvollen Schweigens trat einer der Mönche auf mich zu und sprach mit dumpfer Stimme: „Wir haben einen Eurer Ordensbrüder gerichtet, Medardus!","n":8},{"w":"Reich","art":"das","ipa":"/ʁaɪ̯ç/","m":"empire or significant State; realm","f":"Reich","s":"— „Ich wollte,“ fuhr ich fort, „von der Weihe der Fürsten reden, deren Reich von dieser Welt ist, und dann von der heiligen, göttlichen Weihe des Statthalters des Herrn.","n":7},{"w":"Wunde","art":"die","ipa":"/ˈvʊn.də/","m":"sore, wound","f":"Wunden","s":"— „O Herr,“ fuhr Belcampo fort, „noch ist die Stelle so empfindlich, wo Euch die feindliche Macht tiefe Wunden schlug?","n":13},{"w":"Bauer","art":"der","ipa":"/ˈbaʊ̯ɐ/","m":"farmer; peasant; boor, yokel, bumpkin; pawn","f":"Bauer","s":"Als ich aus dem Schlaf, in den ich vor Ermattung gesunken, erwachte, saß ein alter Bauer neben mir, der alsbald, da er mich ermuntert sah, ehrerbietig seine Mütze abzog und im Ton der vollsten ehrlichsten Gutmütigkeit sprach: „Ei, Ihr seid wohl weit her gewa…","n":8},{"w":"Jungfrau","art":"die","ipa":"/ˈjʊŋˌfʁaʊ̯/","m":"virgin; maiden; Virgo.","f":"Jungfrau","s":"— Niedergesenkten Hauptes, den Blick zur Erde gerichtet, hörte ich die kurze Rede an, worin die Äbtissin nochmals der versammelten Geistlichkeit Aureliens Eintritt in das Kloster anzeigte, und sie aufforderte, eifrig zu beten in dem entscheidenden Augenblick…","n":8},{"w":"Papst","art":"der","ipa":"/paːpst/","m":"pope; luminary, expert, pundit","f":"Papst","s":"Ich wollte Rom verlassen, doch wie erschrak ich, als der Prior des Klosters, in dem ich mich aufhielt, mir ankündigte, daß der Papst mich hätte zu sich entbieten lassen.","n":36},{"w":"erschrecken","art":"","ipa":"/ɛʁˈʃʁɛkən/","m":"to be frightened; to be startled; to frighten","f":"erschrak","s":"Ich wollte Rom verlassen, doch wie erschrak ich, als der Prior des Klosters, in dem ich mich aufhielt, mir ankündigte, daß der Papst mich hätte zu sich entbieten lassen.","n":8},{"w":"unbekannt","art":"","ipa":"/ˈʊnbəkant/","m":"unknown, unbeknownst; unfamiliar","f":"unbekannten","s":"Auf dieses wollte er wieder aus besonderen mir unbekannten Gründen eingehen.","n":8},{"w":"ermorden","art":"","ipa":"/ɛɐ̯ˈmɔʁdn̩/","m":"to murder, to assassinate","f":"ermordet","s":"— „Nicht Heilige sind wir,“ sprach ich, „aber in unserm Kloster wurde noch nie ein Unschuldiger ermordet!","n":11},{"w":"begeben","art":"","ipa":"/bəˈɡeːbm̩/","m":"to go; to make one's way; to repair; to happen","f":"begibst","s":"— Nun ich will sanft und ruhig sein, wie ein frommes Kind, ich will mich bezähmen, ich will nicht mehr springen, weder körperlich noch geistig, und Euch, geliebter Kapuziner, bloß sagen, daß ich Euch hauptsächlich Eurer sublimen Tollheit halber so zärtlich l…","n":9},{"w":"Nonne","art":"die","ipa":"/ˈnɔnə/","m":"nun; nun moth","f":"Nonnen","s":"herbei, fest verschlossene Kutschen fuhren hinein in den Klosterhof, es waren die Klaren Nonnen aus B.","n":17},{"w":"Tugend","art":"die","ipa":"/ˈtuːɡn̩t/","m":"virtue","f":"Tugend","s":"Des Riesen Sieg ist die Tugend, der Sieg des Tieres die Sünde.“","n":8},{"w":"Gelübde","art":"das","ipa":"/ɡəˈlʏb.də/","m":"oath; vow","f":"Gelübde","s":"Die ewige Macht hat es auf wunderbare Weise offenbart, daß du zwar leichtsinnig sündigtest, indem dein Trachten darauf ausging, dein Gelübde zu brechen, daß du aber rein bist von jenen entsetzlichen Freveln.","n":12},{"w":"Statthalter","art":"der","ipa":"","m":"regent, vicegerent, viceroy, governor, proconsul","f":"Statthalter","s":"— Bist du nicht rein vor dem Herrn und vor mir, seinem Statthalter, so nimmst du bald ein schmähliches Ende, Mönch Medardus!“","n":10},{"w":"sündigen","art":"","ipa":"","m":"to sin","f":"sündigen","s":"— „Muß der vom Sünder Geborne wieder sündigen, vermöge des vererbten Organism, dann gibt es keine Sünde,“ so unterbrach ich den Papst.","n":9},{"w":"Bahre","art":"die","ipa":"","m":"bier; litter people to transport a third person)","f":"Bahre","s":"— schnell ist eine Bahre gebracht, der Körper hinaufgelegt, mit Blumen bekränzt und im Triumphzuge unter lautem Gesang und Gebet tragen ihn Jünglinge nach St.","n":8},{"w":"Greis","art":"der","ipa":"[ɡʀaɪ̯s]","m":"old person, old man","f":"Greis","s":"Ich kniete nieder bei dem frommen, ehrwürdigen Greis, ich beschwor ihn, mir nur vor allen Dingen zu sagen, wie es möglich gewesen sei, ihn einzukerkern, ihn zum Tode zu verdammen.","n":9},{"w":"arm","art":"","ipa":"[aʁm]","m":"poor; low","f":"armer","s":"wie ein armer büßender Mönch Eure Bewunderung zu erregen vermochte!“","n":6},{"w":"enden","art":"","ipa":"/ˈɛndən/","m":"to end","f":"geendet","s":"Als ich geendet, setzte er sich aufs neue.","n":6},{"w":"regen","art":"","ipa":"","m":"to move; to move, to stir","f":"regte","s":"— Mich überlief ein kalter Schauer, die Ahnung, daß man mich zum Tode führen wolle, regte sich in mir auf; doch durfte ich mich nicht weigern und folgte daher dem Vermummten, der den Schlag des Wagens öffnete, und mich nötigte einzusteigen.","n":6},{"w":"wecken","art":"","ipa":"/ˈvɛkŋ̩/","m":"to wake, to wake up","f":"weckten","s":"Oft weckten mich bange Seufzer und das Gemurmel leiser Gebete aus tiefer Betrachtung, in die ich, auf den Stufen des Altars liegend, versunken, und ich bemerkte dann, wie rings um mich her Andächtige knieten, und meine Fürbitte zu erflehen schienen.","n":7},{"w":"Amt","art":"das","ipa":"/amt/","m":"agency; department; office; post; mass; district","f":"Amtes","s":"„Nun, du ganz würdiger Vasall an dem Thron des dreifach Gekrönten, du wirst tapfer tun, was deines Amtes ist!","n":7},{"w":"Glocke","art":"die","ipa":"/ˈɡlɔkə/","m":"bell; notification bell","f":"Glocke","s":"Der Morgen brach an, und ich sah mich an der Pforte des Kapuzinerklosters liegen, dessen Glocke ich, als ich mich aufgerichtet hatte, anzog.","n":7},{"w":"versammeln","art":"","ipa":"[fɛɐ̯ˈzaml̩n]","m":"to gather, to assemble; to gather","f":"versammelt","s":"Als ich eines Tages über den spanischen Platz ging, war ein Haufen Volks um den Kasten eines Puppenspielers versammelt.","n":7},{"w":"Innerstes","art":"das","ipa":"/ˈɪnɐstəs/","m":"nominalization of innerstes; core being","f":"Innerste","s":"Verwundet bis tief in das Innerste, kehrte ich in mein Kloster zurück und betete inbrünstig in der einsamen Kirche.","n":9},{"w":"dumpf","art":"","ipa":"[dʊmpf]","m":"dull; hollow, muffled, dead; vague; nagging","f":"dumpfes","s":"Es ließ sich ein dumpfes Rauschen und Brummen hören.","n":12},{"w":"Dominikaner","art":"der","ipa":"[dominiˈkaːnɐ]","m":"Dominican","f":"Dominikaner","s":"Du bist dem Dominikaner, der jetzt des Papstes Beichtiger ist, und seinem Anhange im Wege.","n":12},{"w":"Kapuzinerkloster","art":"das","ipa":"[kapuˈt͡siːnɐˌkloːstɐ]","m":"Capuchin monastery, Capuchin friary","f":"Kapuzinerkloster","s":"So wie in jenem Kapuzinerkloster, hörte ich hinter mir rufen: il Santo!","n":8},{"w":"irdisch","art":"","ipa":"/ˈɪrdɪʃ/","m":"terrestrial, earthly; worldly, mundane","f":"irdischer","s":"— Nur kund getan in irdischer Sprache wird der Beschluß der ewigen Macht, die sich ihren würdigen Statthalter auf Erden erkor, und so, hochheiliger Herr!","n":26},{"w":"erretten","art":"","ipa":"/ɛɐ̯ˈʁɛtn̩/","m":"to save, rescue","f":"errettet","s":"Unter possierlichen Bewegungen versprach er, daß nunmehr der ungeschlachte Riese Goliath ganz gewiß erschlagen und Israel errettet werden solle.","n":9},{"w":"Kapuziner","art":"der","ipa":"/kapuˈt͡siːnɐ/","m":"Capuchin","f":"Kapuziner","s":"„Medardus,“ fing er leise und eilig an, „Medardus, du magst es nun anstellen wie du willst, um dich zu verderben, die Narrheit ist hinter dir her auf den Flügeln des Westwindes — Südwindes oder auch Süd-Südwest — oder sonst, und packt dich, ragt auch nur noc…","n":20},{"w":"Hochaltar","art":"der","ipa":"[ˈhoːχʔalˌtaːɐ̯]","m":"high altar","f":"Hochaltar","s":"— Man schmückte den Hochaltar und die Nebenaltäre mit Blumengewinden, und ein Kirchendiener sprach viel von aufgeblühten Rosen, die durchaus morgen in aller Frühe herbeigeschafft werden müßten, weil die Frau Äbtissin ausdrücklich befohlen habe, daß mit Rosen…","n":11},{"w":"empor","art":"","ipa":"/ɛmˈpoːr/","m":"up, upward","f":"empor","s":"Der Riese Goliath stieg empor mit einem ungeheuren Kopfe.","n":7},{"w":"ansehen","art":"","ipa":"/ˈʔanˌzeːən/","m":"to look at, to have a look at; to look at","f":"Ansehen","s":"Er ging von der Idee aus, daß ich mich hatte zum Heiligen aufschwingen wollen, und daß ich, da er mir aus besonderen Gründen den Weg dazu versperren mußte, nun gesonnen war, mir auf andere Weise Ansehen und Einfluß zu verschaffen.","n":5},{"w":"gleichen","art":"","ipa":"/ˈɡlaɪ̯çən/","m":"to be like, to equal to, to resemble","f":"glichen","s":"Jene Hypothese, daß Aureliens entflohener Bräutigam Graf Viktorin gewesen, brachte die Geschichte der Italienerin in frisches Andenken; selbst die früher nicht Unterrichteten wurden von denen, die nun nicht mehr schweigen zu dürfen glaubten, aufgeklärt, und …","n":5},{"w":"Tier","art":"das","ipa":"/tiːr/","m":"animal; hind","f":"Tier","s":"sprach er, „der ewige Geist schuf einen Riesen, der jenes blinde Tier, das in uns wütet, zu bändigen und in Fesseln zu schlagen vermag.","n":5},{"w":"längst","art":"","ipa":"/lɛŋst/","m":"long ago, long","f":"längst","s":"— „Ihr habt, hochheiliger Herr,“ erwiderte ich, „Euren Diener gewürdigt Eure tiefe Ansicht des menschlichen Seins zu vernehmen, und wohl mag es Euch z       add(`<b>${esc(conj.w)}</b> here means “which / who / that”: a <b>relative clause</b> describing the word before the comma. The verb goes to the <b>end</b>: <span class="gq">${span(conj, v)}</span>`, 'relativ');
    } else if (type === 'q') {
      // handled above
    } else if (type === 'main' && finite.length) {
      const v = finite[0], pos = infos.indexOf(v) - start;
      if (prevType === 'sub' && ci > 0 && pos === 0 && start === 0)
        add(`The sentence started with a side clause, so this main clause starts with the <b>verb</b>: <span class="gq">${esc(v.w)} ${esc(infos[start + 1] ? infos[start + 1].w : '')}</span> (not “${esc(infos[start + 1] ? infos[start + 1].w : '')} ${esc(v.w)}”). The verb is always in <b>position 2</b> of the sentence. ${''}`, 'verbzwei');
      else if (pos === 1 && !['Pronoun', 'Noun', 'Proper noun'].some(p => first.i.pos.has(p)) && !/^\p{Lu}/u.test(first.w) && clauses.length)
        add(`<b>${esc(first.w)}</b> comes first, so the subject moves <b>after</b> the verb: <span class="gq">${esc(first.w)} ${esc(v.w)} ${esc(infos[start + 2] ? infos[start + 2].w : '')}</span>. Rule: the verb is always in <b>position 2</b>.`, 'verbzwei');
      // separable verb: particle at the end of the main clause
      const lw = last.w.toLowerCase();
      if (last !== v && G.PARTICLES.has(lw) && !G.isFinite(last.i)) {
        const vl = G.info(v.w).lemma, combo = lw + vl;
        if (!G.lemmaIs(v.i, AUX_SEIN) && !G.lemmaIs(v.i, AUX_HABEN) && !G.lemmaIs(v.i, AUX_WERDEN)) {
          role.set(last.k, 'gv2');
          add(`<b>Separable verb</b>: <span class="gq">${esc(v.w)} … ${esc(last.w)}</span> belong together = <b>${esc(combo)}</b>. In a main clause the front part (<i>${esc(lw)}</i>) jumps to the end. ${''}`, 'trennbar');
        }
      }
    }
    // verb combinations inside the clause
    const fl2 = finite.map(t => t.i);
    if (parts.length && fl2.some(i => G.lemmaIs(i, AUX_WERDEN))) add(`<b>${esc(finite.find(t => G.lemmaIs(t.i, AUX_WERDEN)).w)} … ${esc(parts[parts.length - 1].w)}</b> = <b>Passiv</b> (something is/was done to someone).`, 'passiv');
    else if (parts.length && fl2.some(i => G.lemmaIs(i, AUX_HABEN) || G.lemmaIs(i, AUX_SEIN))) {
      const aux = finite.find(t => G.lemmaIs(t.i, AUX_HABEN) || G.lemmaIs(t.i, AUX_SEIN)), p = parts[parts.length - 1];
      const past = /^(hatte|hatten|hattest|hattet|war|waren|warst|wart)$/.test(aux.w);
      const usesSein = G.auxOf(G.info(p.w).lemma) === 'sein';
      if (G.lemmaIs(aux.i, AUX_SEIN) && !usesSein && G.auxOf(G.info(p.w).lemma) === 'haben')
        add(`<b>${esc(aux.w)} … ${esc(p.w)}</b>: <i>sein</i> + Partizip II here describes a <b>state</b>, like an adjective – not an action (compare <i>die Tür ${past ? 'war' : 'ist'} geschlossen</i> = the door ${past ? 'was' : 'is'} closed).`, 'partizip');
      else add(`<b>${esc(aux.w)} … ${esc(p.w)}</b> = <b>${past ? 'Plusquamperfekt' : 'Perfekt'}</b> ${past ? '(“had done”): something that happened even earlier.' : '(past tense with <i>haben/sein</i> + Partizip II).'}`, 'perfekt');
    }
    if (infs.length && fl2.some(i => G.lemmaIs(i, G.MODAL)) && finite.find(t => G.lemmaIs(t.i, G.MODAL)) !== infs[infs.length - 1]) add(`<b>${esc(finite.find(t => G.lemmaIs(t.i, G.MODAL)).w)} … ${esc(infs[infs.length - 1].w)}</b>: a <b>modal verb</b> (can/must/want …) sends the other verb to the end in its basic form.`, 'modal');
    if (infs.length && fl2.some(i => /^würde/.test(i.w))) add(`<b>würde … ${esc(infs[infs.length - 1].w)}</b> = “would ${esc(infs[infs.length - 1].w)}” (<b>Konjunktiv II</b>).`, 'konjunktiv');
    const zu = infos.findIndex((t, n) => t.w === 'zu' && infos[n + 1] && G.isInf(infos[n + 1].i));
    if (zu >= 0) {
      role.set(infos[zu].k, 'gc');
      const um = infos.find(t => ['um', 'ohne', 'statt'].includes(t.w.toLowerCase()));
      const vm = G.meaning(infos[zu + 1].w).replace(/^to /, '');
      add(um ? `<b>${esc(um.w)} … zu ${esc(infos[zu + 1].w)}</b> = “${um.w.toLowerCase() === 'um' ? 'in order to' : um.w.toLowerCase() === 'ohne' ? 'without' : 'instead of'} ${esc(vm)}”.` : `<b>zu ${esc(infos[zu + 1].w)}</b> = “to ${esc(vm)}” (zu + infinitive, at the end of its clause).`, 'zuinf');
    }
    if (type === 'main' || type === 'sub' || type === 'rel') prevType = type;
  });
  // coloured sentence
  let html = '';
  toks.forEach(t => { const c = role.get(t.k); html += (c ? `<span class="${c}">${esc(t.w)}</span>` : esc(t.w)) + esc(t.gap); });
  const tail = (gapAfter(b).match(/^[^\p{L}]*?[.!?…]+["“”»«’)]*/u) || [''])[0];
  html += esc(tail);
  if (!notes.length) notes.push([`A simple sentence: subject, then the verb in <b>position 2</b>.`, 'verbzwei']);
  return `<div class="gram">
    <div class="glegend"><span class="gv">Verb</span><span class="gv2">Verbteil (oft am Ende)</span><span class="gc">Bindewort</span></div>
    <p class="gsent">${html}</p>
    <ul class="gnotes">${notes.slice(0, 6).map(([t, id]) => `<li>${t} ${G.link(id)}</li>`).join('')}</ul>
    <div class="gnote-foot">Automatisch erkannt – meistens richtig, aber nicht immer. Alle Regeln: ${G.link('', 'Grammatik-Spickzettel')}</div>
  </div>`;
}

function sentenceBlock() {
  if (!curSentence) return '';
  const w = sel >= 0 ? words[sel].textContent : '';
  const r = document.createRange(); r.setStartBefore(words[curSentence.a]); r.setEndBefore(words[sel]);
  const before = r.toString().replace(/\s+/g, ' ').trimStart();
  const after = curSentence.text.slice(before.length + w.length);
  const tr = trCache[curSentence.text];
  return `<div class="sect" id="sentSect"><div class="lbl">Im Satz</div>
    <p class="sent">${esc(before)}<b>${esc(w)}</b>${esc(after)}</p>

    <div class="row-acts">
      ${tr ? '' : `<button class="pill" data-act="sent" id="sentBtn">${icon(IC.tr)} Satz übersetzen <kbd>S</kbd></button>`}
      <button class="pill" data-act="speakSent">${icon(IC.speak)} Satz anhören</button>

}

async function showWord(word) {
  const my = ++lookToken;
  current = { word, meaning: '' };
  const acts = () => `<div class="acts">
      <button class="pill ${isSaved(word) ? 'on' : ''}" data-act="save" id="saveBtn">${icon(IC.star)} ${isSaved(word) ? 'Gemerkt' : 'Merken'} <kbd>M</kbd></button>
      <button class="pill" data-act="speak">${icon(IC.speak)} Anhören <kbd>A</kbd></button></div>`;
  const local = lookupLocal(word);
  if (local === undefined) {
    setPanel(`<div>${head(word)}${acts()}<div class="sect"><div class="lbl">Bedeutung</div><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:75%"></div></div>${sentenceBlock()}</div>`);
  }
  const r = local && local.key ? local : await lookup(word);
  if (my !== lookToken) return;
  let sub = '', body = '', wantMt = false;
  const part = x => `<div class="cp"><a data-look="${esc(x.key)}">${withArt(x)}</a><div class="cm">${esc(shortMeaning(x) || shortMeaning(entry((x.l || [])[0]) || {}) || '')}</div></div>`;
  if (r.key) {
    const bits = [];
    const g = genderOf(r);
    if (r.key !== word || g) bits.push(r.key !== word ? `Wörterbuch: ${withArt(r)}` : withArt(r));
    if (r.ipa) bits.push(`<span class="ipa">${esc(r.ipa)}</span>`);
    sub = bits.join('<span class="dot">·</span>');
    if (r.e && r.e.length) body += `<div class="sect"><div class="lbl">Bedeutung</div>${defsHtml(r)}</div>`;
    current.meaning = shortMeaning(r);
    for (const l of (r.l || []).slice(0, 2)) {
      let lr = entry(l) || await lookup(l);
      if (my !== lookToken) return;
      if (!lr || !lr.key) continue;
      const same = new Set((r.e || []).map(x => x[0]));
      lr = { ...lr, e: [...(lr.e || [])].sort((a, b) => same.has(b[0]) - same.has(a[0])) };
      body += `<div class="base"><div class="bw">${withArt(lr)}<small>Grundform</small>${lr.ipa ? `<span class="ipa">${esc(lr.ipa)}</span>` : ''}</div>${defsHtml(lr, 2, 3)}</div>`;
      if (!current.meaning) current.meaning = `${lr.key}: ${shortMeaning(lr)}`;
    }
    if (r.c) {
      const [h, t] = r.c.map(entry);
      if (h && t) {
        body += `<div class="sect"><div class="lbl">Zusammengesetztes Wort</div><div class="comp">${part(h)}<span class="plus">+</span>${part(t)}</div><div id="wordMt"></div></div>`;
        if (!current.meaning) current.meaning = `${h.key} + ${t.key}`;
        wantMt = true;
      }
    }
  } else if (r.parts) {
    const ps = r.parts.map(entry).filter(Boolean);
    body += `<div class="sect"><div class="lbl">Bestandteile</div><div class="comp">${ps.map(part).join('<span class="plus">+</span>')}</div><div id="wordMt"></div></div>`;
    current.meaning = ps.map(p => p.key).join(' + ');
    wantMt = true;
  } else {
    body += `<div class="sect"><div class="lbl">Bedeutung</div><p class="none">${r.offline ? 'Keine Internetverbindung – dieses Wort ist nicht im Offline-Wörterbuch.' : 'Nicht im Wörterbuch – oft eine alte Schreibweise oder ein Name.'}</p><div id="wordMt"></div></div>`;
    wantMt = !r.offline;
  }
  const gw = grammarWord(word);
  const gram = gw.length ? `<div class="sect"><div class="lbl">Grammatik</div><ul class="gnotes gword">${gw.map(t => `<li>${t}</li>`).join('')}</ul></div>` : '';
  setPanel(`<div>${head(word, sub)}${acts()}${gram}${body}${sentenceBlock()}</div>`);
  if (wantMt) {
    mt(word).then(t => {
      if (my !== lookToken || !t || t.err || t.toLowerCase() === word.toLowerCase()) return;
      if (!current.meaning || !r.key) current.meaning = t;
      const box = $('#wordMt'); if (box) box.innerHTML = `<p class="mt swap">≈ ${esc(t)}<small>Maschinenübersetzung – kann ungenau sein</small></p>`;
    });
  }
  if (settings.autoSent && curSentence && !trCache[curSentence.text]) translateSentence();
  prefetch();
}
// Words missing from the offline dictionary are looked up online ahead of time while you read.
function prefetch() {
  for (let k = 1; k <= 3 && sel + k < words.length; k++) {
    const w = words[sel + k].textContent;
    if (lookupLocal(w) === undefined) { lookup(w); break; }
  }
}
async function showPhrase(text) {
  const my = ++lookToken;
  current = { word: text, meaning: '' };
  setPanel(`<div>${head(text, 'Auswahl', true)}<div class="sect"><div class="lbl">Übersetzung</div><div id="phr"><div class="skel"></div><div class="skel" style="width:60%"></div></div></div>
    <div class="row-acts"><button class="pill" data-act="speakPhrase">${icon(IC.speak)} Anhören</button><button class="pill" data-act="savePhrase">${icon(IC.star)} Merken</button></div></div>`);
  openDict();
  const t = await mt(text);
  if (my !== lookToken) return;
  current.meaning = t && !t.err ? t : '';
  $('#phr').innerHTML = t && !t.err ? `<p class="trans">${esc(t)}</p>` : `<p class="trans err">${esc(t ? t.err : 'Fehler')}</p>`;
}

async function mt(q) {
  q = q.slice(0, 480);
  if (trCache[q]) return trCache[q];
  try {
    const r = await fetch('https://api.mymemory.translated.net/get?langpair=de|en&q=' + encodeURIComponent(q));
    const j = await r.json();
    const t = j.responseData && j.responseData.translatedText;
    if (!t || j.responseStatus == 429 || /MYMEMORY WARNING/i.test(t)) return { err: 'Tageslimit der Übersetzung erreicht – morgen wieder verfügbar.' };
    trCache[q] = t;
    const keys = Object.keys(trCache); if (keys.length > 1500) delete trCache[keys[0]];
    store.set('tr', trCache);
    return t;
  } catch (e) { return { err: 'Keine Verbindung zum Übersetzer.' }; }
}
async function translateSentence() {
  if (!curSentence) return;
  const s = curSentence.text, btn = $('#sentBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = `${icon(IC.tr)} übersetzt …`; }
  const box0 = $('#sentTr');
  if (box0 && !trCache[s]) box0.innerHTML = '<div class="skel" style="margin-top:12px"></div><div class="skel" style="width:85%"></div><div class="skel" style="width:55%"></div>';
  const t = await mt(s);
  if (t && !t.err && settings.autoSent) prefetchNextSentence();
  if (!curSentence || curSentence.text !== s) return;
  const box = $('#sentTr');
  if (!box) return;
  box.innerHTML = t && !t.err ? `<p class="trans swap">${esc(t)}</p>` : `<p class="trans err swap">${esc(t.err)}</p>`;
  if (btn && t && !t.err) btn.remove(); else if (btn) { btn.disabled = false; btn.innerHTML = `${icon(IC.tr)} Nochmal versuchen`; }
}
function prefetchNextSentence() {
  if (!curSentence || curSentence.b + 1 >= words.length) return;
  const nxt = sentenceAround(curSentence.b + 1).text;
  if (!trCache[nxt.slice(0, 480)]) mt(nxt);
}
let deVoice = null;
function speak(text) {
  if (!('speechSynthesis' in window)) return toast('Sprachausgabe wird nicht unterstützt');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = .92;
  deVoice = deVoice || speechSynthesis.getVoices().find(v => /^de/i.test(v.lang));
  if (deVoice) u.voice = deVoice;
  speechSynthesis.speak(u);
}
function toggleSave(word = current && current.word) {
  if (!word) return;
  const idx = vocab.findIndex(v => v.w === word);
  if (idx >= 0) { vocab.splice(idx, 1); toast('Aus „Meine Wörter“ entfernt'); }
  else {
    vocab.unshift({ b: META.id, w: word, m: current.meaning || '', s: curSentence ? curSentence.text : '', ch, i: sel, t: Date.now() });
    toast('Gemerkt ✓');
  }
  store.set('vocab', vocab);
  setCount();
  const b = $('#saveBtn');
  if (b) { const on = isSaved(word); b.classList.toggle('on', on); b.innerHTML = `${icon(IC.star)} ${on ? 'Gemerkt' : 'Merken'} <kbd>M</kbd>`; }
  if ($('#drawer').classList.contains('open')) renderDrawer();
}
function openDict() { $('#dict').classList.add('open'); keepVisible(); }
function keepVisible() {
  if (document.body.classList.contains('wide') || sel < 0 || !$('#dict').classList.contains('open')) { book.style.translate = ''; return; }
  requestAnimationFrame(() => {
    if (sel < 0) return;
    const d = $('#dict'), sheetTop = innerHeight - d.offsetHeight;
    const cur = parseFloat((book.style.translate || '0 0').split(' ')[1]) || 0;
    const wb = words[sel].getBoundingClientRect().bottom - cur;
    const shift = Math.max(0, Math.min(wb + 28 - sheetTop, book.offsetHeight * .75));
    book.style.translate = shift ? `0 ${-Math.round(shift)}px` : '';
  });
}

dscroll.addEventListener('click', e => {
  const look = e.target.closest('[data-look]');
  if (look) { showWord(look.dataset.look); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'prev') moveWord(-1);
  if (a === 'next') moveWord(1);
  if (a === 'save') toggleSave();
  if (a === 'savePhrase') toggleSave();
  if (a === 'speak') speak(current.word);
  if (a === 'speakPhrase') speak(current.word);
  if (a === 'sent') translateSentence();
  if (a === 'speakSent' && curSentence) speak(curSentence.text);
  if (a === 'gram') toggleGram();
});

$('#page').addEventListener('click', e => {
  if (e.target.tagName === 'IMG') return openLightbox(e.target.src);
  const s = getSelection(); if (s && !s.isCollapsed && s.toString().trim()) return;
  const w = e.target.closest('.w');
  if (w) return w._i === sel ? deselect() : select(w._i);
  const r = $('#page').getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x < .2) turn(-1); else if (x > .8) turn(1); else if (sel >= 0) deselect();
});
$('#page').addEventListener('mouseup', () => setTimeout(() => {
  const s = getSelection(); const t = s ? s.toString().replace(/\s+/g, ' ').trim() : '';
  if (t && /\s/.test(t) && t.length < 480) {
    if (sel >= 0 && words[sel]) words[sel].classList.remove('sel');
    sel = -1; curSentence = null; if (window.CSS && CSS.highlights) CSS.highlights.delete('sent');
    showPhrase(t);
  }
}, 0));
$('#prevBtn').onclick = () => turn(-1);
$('#nextBtn').onclick = () => turn(1);
$('#scrub').addEventListener('input', e => { finishAnim(); setPage(+e.target.value - 1); });
let tx = null, ty = null;
$('#page').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('#page').addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) turn(dx < 0 ? 1 : -1);
});
function openLightbox(src) { const lb = $('#lightbox'); lb.querySelector('img').src = src; lb.classList.add('show'); }
$('#lightbox').onclick = () => $('#lightbox').classList.remove('show');

addEventListener('keydown', e => {
  if ((e.target.matches && e.target.matches('input[type=text],textarea')) || e.ctrlKey || e.metaKey || e.altKey) return;
  const drawerOpen = $('#drawer').classList.contains('open');
  if (e.key === 'Escape') {
    if ($('#lightbox').classList.contains('show')) return $('#lightbox').classList.remove('show');
    if (drawerOpen) return closeDrawer();
    if ($('#pop').classList.contains('open')) return closePop();
    return deselect();
  }
  if (drawerOpen) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowLeft') {
    e.preventDefault();
    const d = k === 'ArrowRight' ? 1 : -1;
    if (sel >= 0 && !e.shiftKey) moveWord(d); else turn(d);
  } else if (k === 'ArrowDown' && sel >= 0) { e.preventDefault(); moveSentence(1); }
  else if (k === 'ArrowUp' && sel >= 0) { e.preventDefault(); moveSentence(-1); }
  else if (k === 'PageDown' || (k === ' ' && sel < 0)) { e.preventDefault(); turn(1); }
  else if (k === 'PageUp') { e.preventDefault(); turn(-1); }
  else if (k === 'Home' && sel < 0) { finishAnim(); setPage(0); }
  else if (k === 'End' && sel < 0) { finishAnim(); setPage(pages - 1); }
  else if ((k === 's' || k === 'S' || k === 'Enter') && curSentence) { e.preventDefault(); translateSentence(); }
  else if ((k === 'm' || k === 'M') && current) toggleSave();
  else if ((k === 'a' || k === 'A') && current) speak(current.word);
  else if (k === 't' || k === 'T') openDrawer('toc');
  else if (k === 'e' || k === 'E') toggleBi();
  else if ((k === 'g' || k === 'G') && curSentence) toggleGram();
});

function setCount() {
  const b = $('#vocabCount'); b.textContent = vocab.length; b.dataset.n = vocab.length;
  const srs = store.get('srs', {}), now = Date.now();
  const due = vocab.filter(v => !srs[v.w] || srs[v.w].due <= now).length;
  const d = $('#dueCount'); d.textContent = due; d.dataset.n = due;
}
/* ---------------- toast ---------------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

/* ---------------- start ---------------- */
applyLook();
setCount();
showEmpty();
const start = () => {
  measure();
  let pos = store.get(POS_KEY, { ch: META.start, w: 0 });
  const h = location.hash.match(/^#w=(d+),(-?d+)/);   // jump from "Meine Wörter" in another book
  if (h) { pos = { ch: +h[1], w: Math.max(0, +h[2]) }; history.replaceState(null, '', location.pathname); }
  renderChapter(Math.min(pos.ch, BOOK.length - 1));
  setPage(words[pos.w] ? pageOf(words[pos.w]) : 0);
  book.classList.add('ready');
  if (!window.WOERTERBUCH) setTimeout(() => toast('Offline-Wörterbuch fehlt – Nachschlagen online (langsamer)'), 800);
};
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 2500))]).then(start);
})();
</script>
