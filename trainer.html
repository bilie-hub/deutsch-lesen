ine Qual ist in dir, und tötet dich nicht, denn du lebst in ihr.","n":9},{"w":"gedenken","art":"","ipa":"/ɡəˈdɛŋkŋ̩/","m":"to remember, to commemorate; to intend","f":"gedachte","s":"Dort mußte man den Ordensbruder aufnehmen, und ich gedachte, mich in voller Gemächlichkeit recht auszupflegen.","n":13},{"w":"Knabe","art":"der","ipa":"/ˈknaːbə/","m":"knave, boy, lad","f":"Knäblein","s":"Ein dumpfes, angstvolles Stöhnen weckte in einer Nacht den Francesko aus dem Schlafe; als er erschrocken aufsprang und mit der Leuchte in der Hand nach seinem Weibe sah, hatte sie ihm ein Knäblein geboren.","n":12},{"w":"Buße","art":"die","ipa":"[ˈbuːsə]","m":"penance; fine","f":"Buße","s":"Die Buße.","n":11},{"w":"genesen","art":"","ipa":"/ɡəˈneːzən/","m":"to recover; to recuperate","f":"genesen","s":"— „Ei, lieber Bruder Medardus,“ fing er plötzlich sehr ernst an, „du willst mich fortschicken, nun du genesen, und mußtest mich doch in deiner Nähe leiden, als du krank dalagst und ich dein Stubenkamerad war und in jenem Bette schlief.“","n":8},{"w":"Prior","art":"der","ipa":"","m":"prior","f":"Prior","s":"Mit der Freundlichkeit, die den italienischen Mönchen eigen, bewirtete man mich reichlich, und der Prior erklärte, daß, insofern mich nicht vielleicht die Erfüllung eines Gelübdes weiter zu pilgern nötige, ich als Fremder so lange im Kloster bleiben könne, a…","n":14},{"w":"Jüngling","art":"der","ipa":"/ˈjʏŋlɪŋ/","m":"youth, youngling, stripling, sapling","f":"Jüngling","s":"Francesko war sonst ein stolzer, übermütiger Jüngling gewesen, nur der alte Leonardo zähmte seinen wilden Sinn, und als Francesko dem fürstlichen Stand entsagt hatte, wurde er Leonardos frommer, treuer Sohn.","n":21},{"w":"Richtung","art":"die","ipa":"/ˈʁɪçtʊŋ/","m":"direction; school of thought, branch, subfield","f":"Richtung","s":"Ihr gingt, wenn man Euch führte, Ihr bliebt stehen, wenn man Euch losließ, Ihr setztet, Ihr legtet Euch nieder, wenn man Euch die Richtung gab.","n":6},{"w":"lächeln","art":"","ipa":"/ˈlɛçəln/","m":"to smile","f":"lächelte","s":"— Der Arzt lächelte zufrieden und rief dem Geistlichen zu: „Gut, sehr gut!“","n":6},{"w":"fern","art":"","ipa":"/fɛʁn/","m":"remote; far away","f":"ferner","s":"Der Geistliche öffnete ein Fenster, eine warme, herrliche Luft, wie ich sie nie geatmet, strömte herein, ein Garten schloß sich an das Gebäude, herrliche fremde Bäume grünten und blühten, Weinlaub rangte sich üppig an der Mauer empor, vor allem aber war mir …","n":6},{"w":"Schönheit","art":"die","ipa":"/ˈʃøːn.haɪ̯t/","m":"beauty, beautifulness","f":"Schönheit","s":"Ich sah Euphemien, wie sie in üppiger Schönheit mir nahte, aber laut schrie ich auf: „Was willst du von mir, Verruchte!","n":6},{"w":"Mantel","art":"der","ipa":"/ˈmantəl/","m":"coat, overcoat; lateral surface","f":"Mantel","s":"Einmal begegnete mir, als ich schon im Begriff stand in das Haus zurückzukehren, ein langer, hagerer Mann, in einem seltsamen erdgelben Mantel, der wurde von zwei Geistlichen bei den Armen geführt, und nach jedem Schritt machte er einen possierlichen Sprung,…","n":6},{"w":"West","art":"der","ipa":"/ˈvɛst/","m":"a wind coming from the west","f":"W","s":"Theodor, Fürst von W.","n":6},{"w":"Frevel","art":"der","ipa":"/fʁeːfəl/","m":"outrage, crime, sin; sacrilege, iniquity","f":"Frevel","s":"Mein ganzes Leben — meine tausendfachen Frevel — meine Missetaten — Hermogens — Aureliens Mord — alles — alles nur ein entsetzlicher Gedanke, und der durchfuhr wie ein spitzes, glühendes Eisen mein Gehirn.","n":17},{"w":"ehrwürdig","art":"","ipa":"/ˈeːɐ̯ˌvʏʁdɪç/","m":"venerable, reverend","f":"ehrwürdiger","s":"Ihr befindet Euch, ehrwürdiger Herr!","n":11},{"w":"Narrheit","art":"die","ipa":"","m":"foolishness","f":"Narrheiten","s":"— „Laßt die Narrheiten,“ fuhr ich auf, „laßt die Narrheiten, Schönfeld“ ...","n":11},{"w":"verrucht","art":"","ipa":"/fɛɐ̯ˈʁuːχt/","m":"heinous, despicable","f":"verruchten","s":"— Zur Hölle — zur Hölle — ewige Verdammnis über mich verruchten Sünder beschlossen!“","n":10},{"w":"Graph","art":"der","ipa":"/ɡʁaːf/","m":"graph; glyph","f":"Graf","s":"Es begab sich, daß der Graf Filippo S.","n":20},{"w":"himmlisch","art":"","ipa":"[ˈhɪm.lɪʃ]","m":"celestial, heavenly; divine","f":"himmlischem","s":"Er schaute mich an mit unbeschreiblich mildem Ernst, er faßte meine Hände, und es war, als halte ein Heiliger, von himmlischem Mitleid erfüllt, den Verlorenen in den Lüften über dem Flammenpfuhl fest, in den er hinabstürzen wollte.","n":7},{"w":"Ehe","art":"die","ipa":"/ˈeːə/","m":"marriage","f":"Ehe","s":"Er umarmte das Weib voll inbrünstiger Liebe und wollte sie sogleich nach der Kirche führen, damit ein Priester sie durch das heilige Sakrament der Ehe auf ewig binde.","n":5},{"w":"wohnen","art":"","ipa":"/ˈvoːnən/","m":"to live, reside, dwell; to stay","f":"wohnen","s":"„Wo bin ich denn,“ rief ich voll Entzücken aus, „haben mich die Heiligen gewürdigt, in einem Himmelslande zu wohnen?“","n":5},{"w":"vollkommen","art":"","ipa":"","m":"perfect; complete","f":"vollkommenen","s":"Nur einige Minuten hatte ich so, zum vollkommenen Bewußtsein erwacht, gelegen, als ich Tritte vernahm, die sich wie auf einem langen Gange näherten.","n":5},{"w":"Flucht","art":"die","ipa":"/flʊxt/","m":"escape, flight; line, alignment; flock of birds","f":"Flucht","s":"Ich tat es, und erstarrte vor Schreck und Erstaunen, denn ich fand, daß der Name Medardus hineingenäht war, sowie mich, bei genauerer Untersuchung, untrügliche Kennzeichen wahrnehmen ließen, daß ich ganz unbezweifelt dieselbe Kutte trug, die ich auf der Fluc…","n":5},{"w":"matt","art":"","ipa":"/mat/","m":"dull; exhausted, weak, feeble","f":"matt","s":"Ich fühlte mich sehr matt, sonst aber ganz schmerzlos.","n":5},{"w":"nackt","art":"","ipa":"/nakt/","m":"nude; not wearing any clothes; bare; not covered","f":"nackte","s":"Ich schritt weiter fort, doch wie entsetzte ich mich, als ich dicht vor mir eine nackte menschliche Figur ausgestreckt auf dem Boden erblickte.","n":5},{"w":"beten","art":"","ipa":"/ˈbeːtn̩/","m":"to pray","f":"beten","s":"Ich wollte beten, da begann ein sinnverwirrendes Flüstern und Rauschen.","n":5},{"w":"wachsen","art":"","ipa":"/ˈvaksn̩/","m":"to grow; to grow, to increase; to wax","f":"wuchs","s":"Nun fingen die Gedanken der einzelnen Teile an sich zu drehen, wie leuchtende Punkte, immer schneller und schneller, so daß sie einen Feuerkreis bildeten, der wurde kleiner, sowie die Schnelligkeit wuchs, daß er zuletzt nur eine stillstehende Feuerkugel schi…","n":5},{"w":"Figur","art":"die","ipa":"/fiˈɡuːɐ̯/","m":"figure, figurine; character; piece; figure","f":"Figur","s":"— Ich lag im offenen Fenster und atmete in vollen Zügen die herrliche, warme Luft ein, die durch Mark und Adern strömend neues Leben in mir entzündete, als ich eine kleine, dürre Figur, ein spitzes Hütchen auf dem Kopfe, und in einen ärmlichen, erblichenen Ü…","n":6},{"w":"mächtig","art":"","ipa":"/ˈmɛçtɪç/","m":"powerful, mighty; capable, having command","f":"mächtig","s":"Noch war ich keines Wortes mächtig, ich warf mich vor dem Greise nieder in den Staub.","n":6},{"w":"Bewusstsein","art":"das","ipa":"/bəˈvʊstzaɪ̯n/","m":"consciousness, awareness","f":"Bewußtsein","s":"Jeder Teil hatte im eignen Regen eignes Bewußtsein des Lebens und umsonst gebot das Haupt den Gliedern, die wie untreue Vasallen sich nicht sammeln mochten unter seiner Herrschaft.","n":6},{"w":"begehen","art":"","ipa":"/bəˈɡeːən/","m":"to commit, perpetrate; to visit, to inspect","f":"beging","s":"Francesko wurde von diesen Reden des Weibes verführt, und so geschah es, daß er mit den von sündigem, freveligem Leichtsinn befangenen Jünglingen, die sich seine Freunde nannten, noch an demselben Abende sein Hochzeitsfest mit dem fremden Weibe nach heidnisc…","n":6},{"w":"italienisch","art":"","ipa":"/ˌi.taˈli̯eː.nɪʃ/","m":"Italian","f":"italienisch","s":"— Ohne mir zu antworten, wandte sich der bürgerlich gekleidete zu dem Geistlichen und sprach auf italienisch: „Das ist in der Tat erstaunenswürdig, der Blick ist ganz geändert, die Sprache rein, nur matt ...","n":6},{"w":"sinken","art":"","ipa":"/ˈzɪŋkən/","m":"to sink; to submerge; to set; to fall; to drop","f":"sank","s":"— Ich erbebte — wie vernichtet sank ich in den Stuhl, die Türe öffnete sich und hastig trat der mich pflegende Geistliche herein.","n":6},{"w":"darstellen","art":"","ipa":"/ˈdaːʁˌʃtɛlən/","m":"to depict; represent; to personate; to pose","f":"darstellten","s":"Nachdem ich mein Gebet am Hochaltar verrichtet, schritt ich durch die Seitengänge, die Altargemälde betrachtend, welche, wie gewöhnlich, die Martyrien der Heiligen, denen sie geweiht, darstellten.","n":6},{"w":"herbringen","art":"","ipa":"[ˈheːɐ̯ˌbʁɪŋən]","m":"to bring","f":"hergebracht","s":"Ihr wurdet vor drei Monaten in einem sehr bedenklichen Zustande hergebracht.","n":6},{"w":"Haupt","art":"das","ipa":"/haʊ̯pt/","m":"head; leader; chief; see haupt-","f":"Haupt","s":"Jeder Teil hatte im eignen Regen eignes Bewußtsein des Lebens und umsonst gebot das Haupt den Gliedern, die wie untreue Vasallen sich nicht sammeln mochten unter seiner Herrschaft.","n":6},{"w":"gebären","art":"","ipa":"/ɡəˈbɛːʁən/","m":"to give birth; to give birth to; to bear","f":"geboren","s":"Ein dumpfes, angstvolles Stöhnen weckte in einer Nacht den Francesko aus dem Schlafe; als er erschrocken aufsprang und mit der Leuchte in der Hand nach seinem Weibe sah, hatte sie ihm ein Knäblein geboren.","n":6},{"w":"entzünden","art":"","ipa":"[ʔɛntˈtsʏndn̩]","m":"to ignite, to inflame; to inflame","f":"entzündete","s":"— Ich lag im offenen Fenster und atmete in vollen Zügen die herrliche, warme Luft ein, die durch Mark und Adern strömend neues Leben in mir entzündete, als ich eine kleine, dürre Figur, ein spitzes Hütchen auf dem Kopfe, und in einen ärmlichen, erblichenen Ü…","n":6},{"w":"erstaunen","art":"","ipa":"[ʔɛɐ̯ˈʃtaʊ̯nən]","m":"to astonish, astound","f":"erstaunte","s":"Die Glockentöne dauerten fort — ich glaubte noch im Walde zu sein, aber wie erstaunte ich, als ich die Gegenstände rings umher, als ich mich selbst betrachtete.","n":6}],[{"w":"Volk","art":"das","ipa":"/fɔlk/","m":"people, nation, folk, tribe, race; folk, crowd","f":"Volk","s":"Es war so weit gekommen, daß überall, wo ich mich in den Straßen von Rom blicken ließ, einzelne aus dem Volk stillstanden, und in gebeugter, demütiger Stellung um meinen Segen baten.","n":17},{"w":"Feind","art":"der","ipa":"/faɪ̯nt/","m":"enemy, fiend, foe","f":"Feinden","s":"— So arbeitete meine Fantasie ein Gemälde aus, das meine Verherrlichung hienieden mit lebendigen Farben darstellte, und nicht gedenkend, nicht ahnend, wie der böse Geist des sündlichen Stolzes mich auf neue Weise zu verlocken trachte, beschloß ich, nach mein…","n":12},{"w":"Rose","art":"die","ipa":"/ˈʁoːzə/","m":"rose; erysipelas","f":"Rose","s":"da regte es sich in den Büschen — eine Rose, von himmlischer Glut hoch gefärbt, streckte ihr Haupt empor und schaute den Medardus an mit englisch mildem Lächeln, und süßer Duft umfing ihn, und der Duft war das wunderbare Leuchten des reinsten Frühlingsäthers.","n":12},{"w":"überzeugen","art":"","ipa":"/ˌyːbəʁˈtsɔʏ̯ɡən/","m":"to convince; to convince oneself","f":"überzeugen","s":"Hielt ich seine letzte Äußerung mit meinen eignen Bemerkungen über den Papst zusammen, so mußte es mir wohl klar aufgehen, daß er keineswegs der nach dem Kampf mit dem Tier gekrönte Sieger war, für den ich ihn gehalten, und ebenso mußte ich auf entsetzliche …","n":9},{"w":"merkwürdig","art":"","ipa":"/ˈmɛʁkˌvʏʁdɪç/","m":"strange, odd; remarkable, noteworthy","f":"merkwürdigen","s":"Beinahe traute ich Euch, nachdem ich Eure merkwürdigen Andachtsübungen gesehen, nicht mehr zu, daß Ihr über solche Torheiten zu lachen vermöchtet.“","n":8},{"w":"streng","art":"","ipa":"/ʃtʁɛŋ/","m":"strict, rigorous; severe, intense","f":"strengen","s":"Mocht’ es sein, daß meine strengen Bußübungen, die ich fortsetzte, schon Aufsehen erregten, aber gewiß war es, daß meine fremdartige, wunderliche Erscheinung den lebhaften fantastischen Römern bald zu einer Legende werden mußte, und daß sie mich vielleicht, …","n":8},{"w":"richten","art":"","ipa":"[ˈʁɪçtn̩]","m":"to direct, to point; to direct, to address","f":"gerichtet","s":"Nach einigen Minuten düstern ahnungsvollen Schweigens trat einer der Mönche auf mich zu und sprach mit dumpfer Stimme: „Wir haben einen Eurer Ordensbrüder gerichtet, Medardus!","n":8},{"w":"Reich","art":"das","ipa":"/ʁaɪ̯ç/","m":"empire or significant State; realm","f":"Reich","s":"— „Ich wollte,“ fuhr ich fort, „von der Weihe der Fürsten reden, deren Reich von dieser Welt ist, und dann von der heiligen, göttlichen Weihe des Statthalters des Herrn.","n":7},{"w":"Wunde","art":"die","ipa":"/ˈvʊn.də/","m":"sore, wound","f":"Wunden","s":"— „O Herr,“ fuhr Belcampo fort, „noch ist die Stelle so empfindlich, wo Euch die feindliche Macht tiefe Wunden schlug?","n":13},{"w":"Bauer","art":"der","ipa":"/ˈbaʊ̯ɐ/","m":"farmer; peasant; boor, yokel, bumpkin; pawn","f":"Bauer","s":"Als ich aus dem Schlaf, in den ich vor Ermattung gesunken, erwachte, saß ein alter Bauer neben mir, der alsbald, da er mich ermuntert sah, ehrerbietig seine Mütze abzog und im Ton der vollsten ehrlichsten Gutmütigkeit sprach: „Ei, Ihr seid wohl weit her gewa…","n":8},{"w":"Jungfrau","art":"die","ipa":"/ˈjʊŋˌfʁaʊ̯/","m":"virgin; maiden; Virgo.","f":"Jungfrau","s":"— Niedergesenkten Hauptes, den Blick zur Erde gerichtet, hörte ich die kurze Rede an, worin die Äbtissin nochmals der versammelten Geistlichkeit Aureliens Eintritt in das Kloster anzeigte, und sie aufforderte, eifrig zu beten in dem entscheidenden Augenblick…","n":8},{"w":"Papst","art":"der","ipa":"/paːpst/","m":"pope; luminary, expert, pundit","f":"Papst","s":"Ich wollte Rom verlassen, doch wie erschrak ich, als der Prior des Klosters, in dem ich mich aufhielt, mir ankündigte, daß der Papst mich hätte zu sich entbieten lassen.","n":36},{"w":"erschrecken","art":"","ipa":"/ɛʁˈʃʁɛkən/","m":"to be frightened; to be startled; to frighten","f":"erschrak","s":"Ich wollte Rom verlassen, doch wie erschrak ich, als der Prior des Klosters, in dem ich mich aufhielt, mir ankündigte, daß der Papst mich hätte zu sich entbieten lassen.","n":8},{"w":"unbekannt","art":"","ipa":"/ˈʊnbəkant/","m":"unknown, unbeknownst; unfamiliar","f":"unbekannten","s":"Auf dieses wollte er wieder aus besonderen mir unbekannten Gründen eingehen.","n":8},{"w":"ermorden","art":"","ipa":"/ɛɐ̯ˈmɔʁdn̩/","m":"to murder, to assassinate","f":"ermordet","s":"— „Nicht Heilige sind wir,“ sprach ich, „aber in unserm Kloster wurde noch nie ein Unschuldiger ermordet!","n":11},{"w":"begeben","art":"","ipa":"/bəˈɡeːbm̩/","m":"to go; to make one's way; to repair; to happen","f":"begibst","s":"— Nun ich will sanft und ruhig sein, wie ein frommes Kind, ich will mich bezähmen, ich will nicht mehr springen, weder körperlich noch geistig, und Euch, geliebter Kapuziner, bloß sagen, daß ich Euch hauptsächlich Eurer sublimen Tollheit halber so zärtlich l…","n":9},{"w":"Nonne","art":"die","ipa":"/ˈnɔnə/","m":"nun; nun moth","f":"Nonnen","s":"herbei, fest verschlossene Kutschen fuhren hinein in den Klosterhof, es waren die Klaren Nonnen aus B.","n":17},{"w":"Tugend","art":"die","ipa":"/ˈtuːɡn̩t/","m":"virtue","f":"Tugend","s":"Des Riesen Sieg ist die Tugend, der Sieg des Tieres die Sünde.“","n":8},{"w":"Gelübde","art":"das","ipa":"/ɡəˈlʏb.də/","m":"oath; vow","f":"Gelübde","s":"Die ewige Macht hat es auf wunderbare Weise offenbart, daß du zwar leichtsinnig sündigtest, indem dein Trachten darauf ausging, dein Gelübde zu brechen, daß du aber rein bist von jenen entsetzlichen Freveln.","n":12},{"w":"Statthalter","art":"der","ipa":"","m":"regent, vicegerent, viceroy, governor, proconsul","f":"Statthalter","s":"— Bist du nicht rein vor dem Herrn und vor mir, seinem Statthalter, so nimmst du bald ein schmähliches Ende, Mönch Medardus!“","n":10},{"w":"sündigen","art":"","ipa":"","m":"to sin","f":"sündigen","s":"— „Muß der vom Sünder Geborne wieder sündigen, vermöge des vererbten Organism, dann gibt es keine Sünde,“ so unterbrach ich den Papst.","n":9},{"w":"Bahre","art":"die","ipa":"","m":"bier; litter people to transport a third person)","f":"Bahre","s":"— schnell ist eine Bahre gebracht, der Körper hinaufgelegt, mit Blumen bekränzt und im Triumphzuge unter lautem Gesang und Gebet tragen ihn Jünglinge nach St.","n":8},{"w":"Greis","art":"der","ipa":"[ɡʀaɪ̯s]","m":"old person, old man","f":"Greis","s":"Ich kniete nieder bei dem frommen, ehrwürdigen Greis, ich beschwor ihn, mir nur vor allen Dingen zu sagen, wie es möglich gewesen sei, ihn einzukerkern, ihn zum Tode zu verdammen.","n":9},{"w":"arm","art":"","ipa":"[aʁm]","m":"poor; low","f":"armer","s":"wie ein armer büßender Mönch Eure Bewunderung zu erregen vermochte!“","n":6},{"w":"enden","art":"","ipa":"/ˈɛndən/","m":"to end","f":"geendet","s":"Als ich geendet, setzte er sich aufs neue.","n":6},{"w":"regen","art":"","ipa":"","m":"to move; to move, to stir","f":"regte","s":"— Mich überlief ein kalter Schauer, die Ahnung, daß man mich zum Tode führen wolle, regte sich in mir auf; doch durfte ich mich nicht weigern und folgte daher dem Vermummten, der den Schlag des Wagens öffnete, und mich nötigte einzusteigen.","n":6},{"w":"wecken","art":"","ipa":"/ˈvɛkŋ̩/","m":"to wake, to wake up","f":"weckten","s":"Oft weckten mich bange Seufzer und das Gemurmel leiser Gebete aus tiefer Betrachtung, in die ich, auf den Stufen des Altars liegend, versunken, und ich bemerkte dann, wie rings um mich her Andächtige knieten, und meine Fürbitte zu erflehen schienen.","n":7},{"w":"Amt","art":"das","ipa":"/amt/","m":"agency; department; office; post; mass; district","f":"Amtes","s":"„Nun, du ganz würdiger Vasall an dem Thron des dreifach Gekrönten, du wirst tapfer tun, was deines Amtes ist!","n":7},{"w":"Glocke","art":"die","ipa":"/ˈɡlɔkə/","m":"bell; notification bell","f":"Glocke","s":"Der Morgen brach an, und ich sah mich an der Pforte des Kapuzinerklosters liegen, dessen Glocke ich, als ich mich aufgerichtet hatte, anzog.","n":7},{"w":"versammeln","art":"","ipa":"[fɛɐ̯ˈzaml̩n]","m":"to gather, to assemble; to gather","f":"versammelt","s":"Als ich eines Tages über den spanischen Platz ging, war ein Haufen Volks um den Kasten eines Puppenspielers versammelt.","n":7},{"w":"Innerstes","art":"das","ipa":"/ˈɪnɐstəs/","m":"nominalization of innerstes; core being","f":"Innerste","s":"Verwundet bis tief in das Innerste, kehrte ich in mein Kloster zurück und betete inbrünstig in der einsamen Kirche.","n":9},{"w":"dumpf","art":"","ipa":"[dʊmpf]","m":"dull; hollow, muffled, dead; vague; nagging","f":"dumpfes","s":"Es ließ sich ein dumpfes Rauschen und Brummen hören.","n":12},{"w":"Dominikaner","art":"der","ipa":"[dominiˈkaːnɐ]","m":"Dominican","f":"Dominikaner","s":"Du bist dem Dominikaner, der jetzt des Papstes Beichtiger ist, und seinem Anhange im Wege.","n":12},{"w":"Kapuzinerkloster","art":"das","ipa":"[kapuˈt͡siːnɐˌkloːstɐ]","m":"Capuchin monastery, Capuchin friary","f":"Kapuzinerkloster","s":"So wie in jenem Kapuzinerkloster, hörte ich hinter mir rufen: il Santo!","n":8},{"w":"irdisch","art":"","ipa":"/ˈɪrdɪʃ/","m":"terrestrial, earthly; worldly, mundane","f":"irdischer","s":"— Nur kund getan in irdischer Sprache wird der Beschluß der ewigen Macht, die sich ihren würdigen Statthalter auf Erden erkor, und so, hochheiliger Herr!","n":26},{"w":"erretten","art":"","ipa":"/ɛɐ̯ˈʁɛtn̩/","m":"to save, rescue","f":"errettet","s":"Unter possierlichen Bewegungen versprach er, daß nunmehr der ungeschlachte Riese Goliath ganz gewiß erschlagen und Israel errettet werden solle.","n":9},{"w":"Kapuziner","art":"der","ipa":"/kapuˈt͡siːnɐ/","m":"Capuchin","f":"Kapuziner","s":"„Medardus,“ fing er leise und eilig an, „Medardus, du magst es nun anstellen wie du willst, um dich zu verderben, die Narrheit ist hinter dir her auf den Flügeln des Westwindes — Südwindes oder auch Süd-Südwest — oder sonst, und packt dich, ragt auch nur noc…","n":20},{"w":"Hochaltar","art":"der","ipa":"[ˈhoːχʔalˌtaːɐ̯]","m":"high altar","f":"Hochaltar","s":"— Man schmückte den Hochaltar und die Nebenaltäre mit Blumengewinden, und ein Kirchendiener sprach viel von aufgeblühten Rosen, die durchaus morgen in aller Frühe herbeigeschafft werden müßten, weil die Frau Äbtissin ausdrücklich befohlen habe, daß mit Rosen…","n":11},{"w":"empor","art":"","ipa":"/ɛmˈpoːr/","m":"up, upward","f":"empor","s":"Der Riese Goliath stieg empor mit einem ungeheuren Kopfe.","n":7},{"w":"ansehen","art":"","ipa":"/ˈʔanˌzeːən/","m":"to look at, to have a look at; to look at","f":"Ansehen","s":"Er ging von der Idee aus, daß ich mich hatte zum Heiligen aufschwingen wollen, und daß ich, da er mir aus besonderen Gründen den Weg dazu versperren mußte, nun gesonnen war, mir auf andere Weise Ansehen und Einfluß zu verschaffen.","n":5},{"w":"gleichen","art":"","ipa":"/ˈɡlaɪ̯çən/","m":"to be like, to equal to, to resemble","f":"glichen","s":"Jene Hypothese, daß Aureliens entflohener Bräutigam Graf Viktorin gewesen, brachte die Geschichte der Italienerin in frisches Andenken; selbst die früher nicht Unterrichteten wurden von denen, die nun nicht mehr schweigen zu dürfen glaubten, aufgeklärt, und …","n":5},{"w":"Tier","art":"das","ipa":"/tiːr/","m":"animal; hind","f":"Tier","s":"sprach er, „der ewige Geist schuf einen Riesen, der jenes blinde Tier, das in uns wütet, zu bändigen und in Fesseln zu schlagen vermag.","n":5},{"w":"längst","art":"","ipa":"/lɛŋst/","m":"long ago, long","f":"längst","s":"— „Ihr habt, hochheiliger Herr,“ erwiderte ich, „Euren Diener gewürdigt Eure tiefe Ansicht des menschlichen Seins zu vernehmen, und wohl mag es Euch ziemen, über den Kampf zu sprechen, den Ihr längst, herrlich und glorreich siegend, geendet.“","n":5},{"w":"verlangen","art":"","ipa":"/fɛʁˈlaŋən/","m":"to ask for, demand","f":"verlangt","s":"„Bruder Medardus,“ sprach der Guardian, „ein Sterbender verlangt in der Todesnot Euern geistlichen Zuspruch und die letzte Ölung.","n":5},{"w":"merken","art":"","ipa":"/ˈmɛʁkŋ̍/","m":"to notice, to sense, to be able to tell","f":"merk","s":"Wir werden uns, merk’ ich, näher verständigen!...","n":5},{"w":"Mitte","art":"die","ipa":"/ˈmɪ.tə/","m":"middle; center","f":"Mitte","s":"Im Wagen fand ich zwei Männer, die mich in ihre Mitte nahmen.","n":5},{"w":"bestehen","art":"","ipa":"/bəˈʃteːən/","m":"to succeed, to pass; to consist; to exist","f":"bestanden","s":"— Aber es war, als würde, indem ich den Greis, dessen höchste Vergehen nur in Zweifeln bestanden, die ihm hie und da aufgestoßen, absolvierte, von der hohen ewigen Macht ein Geist des Himmels in mir entzündet, und als sei ich nur das Werkzeug, das körpergewo…","n":6},{"w":"knien","art":"","ipa":"/ˈkniː.ən/","m":"to kneel","f":"knieten","s":"Oft weckten mich bange Seufzer und das Gemurmel leiser Gebete aus tiefer Betrachtung, in die ich, auf den Stufen des Altars liegend, versunken, und ich bemerkte dann, wie rings um mich her Andächtige knieten, und meine Fürbitte zu erflehen schienen.","n":6},{"w":"Chor","art":"der","ipa":"/koːr/","m":"choir; chorus","f":"Chor","s":"Schon läuteten aufs neue alle Glocken des Klosters, und dazwischen tönten die donnernden Töne der Orgel, die Weihgesänge der im Chor versammelten Schwestern, durch die Lüfte, als der Prior wieder in den Saal trat.","n":6},{"w":"drängen","art":"","ipa":"/ˈdʁɛŋən/","m":"to push, press; to push, press, to throng, crowd","f":"gedrängt","s":"— So fing ich an, und erzählte nun, ohne Namen zu nennen und so gedrängt als möglich meinen Lebenslauf.","n":6}]]}};
const PRAET = [{"inf":"sein","p":"war","m":"to be","part":"gewesen","aux":"sein","n":468,"ex":[{"s":"Er lag in seinem Bett – aber er war kein Mensch mehr.","f":"war","b":"verwandlung-b1"},{"s":"Er war ein riesiges, ekliges Ungeziefer – eine Art großes Insekt.","f":"war","b":"verwandlung-b1"},{"s":"Es war ein normales Zimmer, nur ein bisschen zu klein.","f":"war","b":"verwandlung-b1"}]},{"inf":"haben","p":"hatte","m":"to have","part":"gehabt","aux":"haben","n":277,"ex":[{"s":"Er hatte viele dünne Beine.","f":"hatte","b":"verwandlung-b1"},{"s":"Gregor hatte es vor kurzem aus einer Zeitschrift ausgeschnitten.","f":"hatte","b":"verwandlung-b1"},{"s":"Er hatte dem Chef bestimmt schon gemeldet, dass Gregor nicht da war.","f":"hatte","b":"verwandlung-b1"}]},{"inf":"sehen","p":"sah","m":"to see","part":"gesehen","aux":"haben","n":122,"ex":[{"s":"Wenn er den Kopf ein wenig hob, sah er seinen braunen, runden Bauch.","f":"sah","b":"verwandlung-b1"},{"s":"Sein Zimmer sah aus wie immer.","f":"sah","b":"verwandlung-b1"},{"s":"Dann sah Gregor zum Fenster.","f":"sah","b":"verwandlung-b1"}]},{"inf":"können","p":"konnte","m":"can, to be able to","part":"gekonnt","aux":"","n":86,"ex":[{"s":"Sie bewegten sich vor seinen Augen, und er konnte nichts dagegen tun.","f":"konnte","b":"verwandlung-b1"},{"s":"Doch mit diesem Körper konnte er sich nicht auf die Seite drehen.","f":"konnte","b":"verwandlung-b1"},{"s":"Man konnte die Wörter nur am Anfang verstehen.","f":"konnte","b":"verwandlung-b1"}]},{"inf":"werden","p":"wurde","m":"to become","part":"geworden","aux":"sein","n":59,"ex":[{"s":"Aber dann wurde es schwer, denn er war sehr breit.","f":"wurde","b":"verwandlung-b1"},{"s":"Vielleicht wurde in der Stille alles wieder normal.","f":"wurde","b":"verwandlung-b1"},{"s":"Gregor wurde so aufgeregt, dass er sich mit aller Kraft aus dem Bett schwang.","f":"wurde","b":"verwandlung-b1"}]},{"inf":"gehen","p":"ging","m":"to go, to walk","part":"gegangen","aux":"sein","n":50,"ex":[{"s":"Die Mutter ging zufrieden weg.","f":"ging","b":"verwandlung-b1"},{"s":"Das ging gut, und der schwere Körper folgte langsam dem Kopf.","f":"ging","b":"verwandlung-b1"},{"s":"Es ging um das Geld, das Sie vor kurzem bekommen haben.","f":"ging","b":"verwandlung-b1"}]},{"inf":"kommen","p":"kam","m":"to come","part":"gekommen","aux":"sein","n":49,"ex":[{"s":"Bei dem kleinsten Fehler kam sofort der Verdacht.","f":"kam","b":"verwandlung-b1"},{"s":"Dann kam der Chef wieder mit den alten Schulden zu den Eltern.","f":"kam","b":"verwandlung-b1"},{"s":"Gregor wartete sofort an der Tür, aber niemand kam mehr.","f":"kam","b":"verwandlung-b1"}]},{"inf":"denken","p":"dachte","m":"to think","part":"gedacht","aux":"haben","n":48,"ex":[{"s":"»Vielleicht schlafe ich noch ein bisschen und vergesse diesen Unsinn«, dachte er.","f":"dachte","b":"verwandlung-b1"},{"s":"»Ach Gott«, dachte er, »was für einen anstrengenden Beruf habe ich!","f":"dachte","b":"verwandlung-b1"},{"s":"»Das frühe Aufstehen macht einen ganz dumm«, dachte er.","f":"dachte","b":"verwandlung-b1"}]},{"inf":"rufen","p":"rief","m":"to call, to shout","part":"gerufen","aux":"haben","n":44,"ex":[{"s":"»Gregor«, rief seine Mutter, »es ist Viertel vor sieben.","f":"rief","b":"verwandlung-b1"},{"s":", rief der Prokurist freundlich.","f":"rief","b":"verwandlung-b1"},{"s":"»Aber Herr Prokurist«, rief Gregor ganz aufgeregt, »ich mache sofort auf!","f":"rief","b":"verwandlung-b1"}]},{"inf":"müssen","p":"musste","m":"must, to have to","part":"gemusst","aux":"haben","n":36,"ex":[{"s":"Er schloss die Augen, damit er die zappelnden Beine nicht sehen musste.","f":"musste","b":"verwandlung-b1"},{"s":"Dafür musste er sich sehr beeilen, und seine Stoffe waren noch nicht eingepackt.","f":"musste","b":"verwandlung-b1"},{"s":"Er musste sich nur ein bisschen aufblasen, dann fiel sie von selbst herunter.","f":"musste","b":"verwandlung-b1"}]},{"inf":"bleiben","p":"blieb","m":"to remain","part":"geblieben","aux":"sein","n":34,"ex":[{"s":"Die Wohnungstür blieb offen.","f":"blieb","b":"verwandlung-b1"},{"s":"Er blieb stecken, eine Seite seines Körpers wurde verletzt, und braune Flecken blieben an der weißen Tür.","f":"blieb","b":"verwandlung-b1"},{"s":"Dort blieb er die ganze Nacht.","f":"blieb","b":"verwandlung-b1"}]},{"inf":"laufen","p":"lief","m":"to run, to walk","part":"gelaufen","aux":"sein","n":33,"ex":[{"s":"Ein kalter Schauer lief durch seinen Körper.","f":"lief","b":"verwandlung-b1"},{"s":"Dabei lief eine braune Flüssigkeit aus seinem Mund und tropfte auf den Boden.","f":"lief","b":"verwandlung-b1"},{"s":"Erst im Flur machte er eine plötzliche Bewegung und lief los.","f":"lief","b":"verwandlung-b1"}]},{"inf":"stehen","p":"stand","m":"to stand","part":"gestanden","aux":"haben","n":32,"ex":[{"s":"Aber dann stand er aufrecht da.","f":"stand","b":"verwandlung-b1"},{"s":"Der Prokurist stand der Tür am nächsten.","f":"stand","b":"verwandlung-b1"},{"s":"Auf dem Tisch stand noch viel Frühstücksgeschirr.","f":"stand","b":"verwandlung-b1"}]},{"inf":"scheinen","p":"schien","m":"to seem; to shine","part":"geschienen","aux":"","n":29,"ex":[{"s":"Der Rücken schien hart zu sein; dem würde wohl bei dem Fall auf den Teppich nichts geschehen.","f":"schien","b":"verwandlung"},{"s":"Und Gregor schien es, daß es viel vernünftiger wäre, ihn jetzt in Ruhe zu lassen, statt ihn mit Weinen und Zureden zu stören.","f":"schien","b":"verwandlung"},{"s":"Es schien leider, daß er keine eigentlichen Zähne hatte, – womit sollte er gleich den Schlüssel fassen?","f":"schien","b":"verwandlung"}]},{"inf":"liegen","p":"lag","m":"to lie (be lying)","part":"gelegen","aux":"haben","n":28,"ex":[{"s":"Er lag in seinem Bett – aber er war kein Mensch mehr.","f":"lag","b":"verwandlung-b1"},{"s":"Er lag auf seinem harten Rücken.","f":"lag","b":"verwandlung-b1"},{"s":"Die Bettdecke lag kaum noch auf ihm und wollte gleich herunterrutschen.","f":"lag","b":"verwandlung-b1"}]},{"inf":"fallen","p":"fiel","m":"to fall, to drop","part":"gefallen","aux":"sein","n":28,"ex":[{"s":"Er musste sich nur ein bisschen aufblasen, dann fiel sie von selbst herunter.","f":"fiel","b":"verwandlung-b1"},{"s":"Aber dann bekam er Angst: Wenn er jetzt aus dem Bett fiel, verletzte er sich vielleicht am Kopf.","f":"fiel","b":"verwandlung-b1"},{"s":"Dann ging sie zwei Schritte auf Gregor zu und fiel zu Boden.","f":"fiel","b":"verwandlung-b1"}]},{"inf":"halten","p":"hielt","m":"to hold","part":"gehalten","aux":"haben","n":26,"ex":[{"s":"Dann hielt er sich mit den kleinen Beinen an einem Stuhl fest.","f":"hielt","b":"verwandlung-b1"},{"s":"Dort ließ er den Stuhl los und hielt sich an der Tür fest.","f":"hielt","b":"verwandlung-b1"},{"s":"Er hielt die Hand vor den offenen Mund und ging langsam rückwärts.","f":"hielt","b":"verwandlung-b1"}]},{"inf":"lassen","p":"ließ","m":"to let; to leave","part":"gelassen","aux":"haben","n":26,"ex":[{"s":"Dort ließ er den Stuhl los und hielt sich an der Tür fest.","f":"ließ","b":"verwandlung-b1"},{"s":"Also ließ Gregor die Tür los und wollte zum Prokuristen.","f":"ließ","b":"verwandlung-b1"},{"s":"Immer wenn die Familie über das Geldverdienen sprach, ließ Gregor die Tür los.","f":"ließ","b":"verwandlung-b1"}]},{"inf":"schlagen","p":"schlug","m":"to hit, to beat","part":"geschlagen","aux":"haben","n":25,"ex":[{"s":"Da schlug die Uhr Viertel vor sieben.","f":"schlug","b":"verwandlung-b1"},{"s":"Er schlug hart gegen das Bettende.","f":"schlug","b":"verwandlung-b1"},{"s":"»Schon sieben Uhr«, sagte er sich, als die Uhr schlug, »und noch immer so ein Nebel.«","f":"schlug","b":"verwandlung-b1"}]},{"inf":"verstehen","p":"verstand","m":"to understand","part":"verstanden","aux":"","n":22,"ex":[{"s":"Gregor verstand: Der Prokurist durfte so nicht gehen!","f":"verstand","b":"verwandlung-b1"},{"s":"Gregor bat ihn, aber der Vater verstand ihn nicht.","f":"verstand","b":"verwandlung-b1"},{"s":"Darum dachte auch niemand, dass er die anderen verstand – nicht einmal die Schwester.","f":"verstand","b":"verwandlung-b1"}]},{"inf":"heben","p":"hob","m":"to lift","part":"gehoben","aux":"","n":21,"ex":[{"s":"Wenn er den Kopf ein wenig hob, sah er seinen braunen, runden Bauch.","f":"hob","b":"verwandlung-b1"},{"s":"Gregor hob den Kopf und sah den Vater an.","f":"hob","b":"verwandlung-b1"},{"s":"Sie hob einfach einen Stuhl hoch und wartete, um ihn auf Gregors Rücken zu schlagen.","f":"hob","b":"verwandlung-b1"}]},{"inf":"ziehen","p":"zog","m":"to pull","part":"gezogen","aux":"haben","n":21,"ex":[{"s":"Er wollte sie mit einem Bein berühren – aber sofort zog er das Bein zurück.","f":"zog","b":"verwandlung-b1"},{"s":"Aber schnell zog er ihn enttäuscht zurück.","f":"zog","b":"verwandlung-b1"},{"s":"Gregor zog das Tuch noch tiefer herunter, damit man ihn nicht sah.","f":"zog","b":"verwandlung-b1"}]},{"inf":"geben","p":"gab","m":"to give","part":"gegeben","aux":"haben","n":21,"ex":[{"s":"Es gab einen dumpfen Schlag, aber keinen großen Lärm, denn der Teppich war weich.","f":"gab","b":"verwandlung-b1"},{"s":"Dann gab ihm der Vater einen starken Stoß von hinten.","f":"gab","b":"verwandlung-b1"},{"s":"Aber besondere Wärme gab es nicht mehr.","f":"gab","b":"verwandlung-b1"}]},{"inf":"beginnen","p":"begann","m":"to begin","part":"begonnen","aux":"","n":20,"ex":[{"s":"Im rechten Zimmer begann die Schwester zu weinen.","f":"begann","b":"verwandlung-b1"},{"s":"Gregor begann deshalb sehr hart zu arbeiten.","f":"begann","b":"verwandlung-b1"},{"s":"Darum begann er, an den Wänden und an der Decke herumzukriechen.","f":"begann","b":"verwandlung-b1"}]},{"inf":"kriechen","p":"kroch","m":"to creep","part":"gekrochen","aux":"sein","n":18,"ex":[{"s":"Während Gregor das alles schnell sagte, kroch er zum Kasten.","f":"kroch","b":"verwandlung-b1"},{"s":"Langsam kroch er zur Tür.","f":"kroch","b":"verwandlung-b1"},{"s":"Aber Gregor drehte sich fast mit Widerwillen weg und kroch zurück in die Mitte des Zimmers.","f":"kroch","b":"verwandlung-b1"}]},{"inf":"dürfen","p":"durfte","m":"may, to be allowed to","part":"gedurft","aux":"haben","n":16,"ex":[{"s":"Er durfte auf keinen Fall ohnmächtig werden.","f":"durfte","b":"verwandlung-b1"},{"s":"Gregor verstand: Der Prokurist durfte so nicht gehen!","f":"durfte","b":"verwandlung-b1"},{"s":"Man durfte ihn nicht wie einen Feind behandeln.","f":"durfte","b":"verwandlung-b1"}]},{"inf":"nehmen","p":"nahm","m":"to take","part":"genommen","aux":"haben","n":16,"ex":[{"s":"Er nahm den Stock des Prokuristen in die rechte Hand und eine große Zeitung in die linke.","f":"nahm","b":"verwandlung-b1"},{"s":"Später gewöhnten sich alle daran: Gregor brachte das Geld, und die Familie nahm es dankbar.","f":"nahm","b":"verwandlung-b1"},{"s":"Grete nahm schnell alle Flaschen und lief zur Mutter.","f":"nahm","b":"verwandlung-b1"}]},{"inf":"werfen","p":"warf","m":"to throw","part":"geworfen","aux":"haben","n":16,"ex":[{"s":"Die Schwester fegte alle Reste zusammen, auch das, was er nicht berührt hatte, und warf alles weg.","f":"warf","b":"verwandlung-b1"},{"s":"Er warf sich auf das kühle Ledersofa daneben, denn er wurde ganz heiß vor Scham und Trauer.","f":"warf","b":"verwandlung-b1"},{"s":"Er warf seine Mütze quer durch das Zimmer auf das Kanapee und kam mit bösem Gesicht auf Gregor zu.","f":"warf","b":"verwandlung-b1"}]},{"inf":"bekommen","p":"bekam","m":"to get, to receive","part":"bekommen","aux":"haben","n":15,"ex":[{"s":"Aber dann bekam er Angst: Wenn er jetzt aus dem Bett fiel, verletzte er sich vielleicht am Kopf.","f":"bekam","b":"verwandlung-b1"},{"s":"Weil er so viel gegessen hatte, bekam er dort kaum Luft.","f":"bekam","b":"verwandlung-b1"},{"s":"So bekam Gregor jetzt jeden Tag sein Essen: einmal früh am Morgen, wenn die Eltern noch schliefen, und einmal nach dem Mittagessen.","f":"bekam","b":"verwandlung-b1"}]},{"inf":"schreien","p":"schrie","m":"to shout","part":"geschrien","aux":"haben","n":15,"ex":[{"s":"Sie streckte die Arme aus und schrie: »Hilfe, um Gottes willen, Hilfe!«","f":"schrie","b":"verwandlung-b1"},{"s":"Da schrie die Mutter wieder und lief zum Vater.","f":"schrie","b":"verwandlung-b1"},{"s":"Noch bevor sie verstand, dass es Gregor war, schrie sie: »Ach Gott, ach Gott!«","f":"schrie","b":"verwandlung-b1"}]},{"inf":"hängen","p":"hing","m":"to hang","part":"gehangen","aux":"","n":13,"ex":[{"s":"Über dem Tisch hing ein Bild in einem schönen goldenen Rahmen.","f":"hing","b":"verwandlung-b1"},{"s":"Bald hing Gregor schon halb aus dem Bett.","f":"hing","b":"verwandlung-b1"},{"s":"An der Wand hing ein Foto von Gregor als Soldat, mit Säbel und einem fröhlichen Lächeln.","f":"hing","b":"verwandlung-b1"}]},{"inf":"schlafen","p":"schlief","m":"to sleep","part":"geschlafen","aux":"haben","n":13,"ex":[{"s":"Gregor schlief immer auf der rechten Seite.","f":"schlief","b":"verwandlung-b1"},{"s":"Manchmal schlief er ein wenig, aber der Hunger weckte ihn immer wieder.","f":"schlief","b":"verwandlung-b1"},{"s":"Nach dem Abendessen schlief der Vater im Sessel ein.","f":"schlief","b":"verwandlung-b1"}]},{"inf":"tun","p":"tat","m":"to do","part":"getan","aux":"haben","n":13,"ex":[{"s":"Sein Unterkörper tat sehr weh, aber das war ihm egal.","f":"tat","b":"verwandlung-b1"},{"s":"Aber gleich danach tat es ihr leid.","f":"tat","b":"verwandlung-b1"},{"s":"Die Schwester tat so, als ob die Arbeit für ihn nicht schwer wäre.","f":"tat","b":"verwandlung-b1"}]},{"inf":"schieben","p":"schob","m":"to push","part":"geschoben","aux":"haben","n":12,"ex":[{"s":"Er schob sich langsam nach oben, um besser zu sehen.","f":"schob","b":"verwandlung-b1"},{"s":"Gregor schob sich mit dem Stuhl langsam zur Tür.","f":"schob","b":"verwandlung-b1"},{"s":"Oder er schob mit großer Mühe einen Stuhl zum Fenster, kletterte hinauf und sah hinaus.","f":"schob","b":"verwandlung-b1"}]},{"inf":"finden","p":"fand","m":"to find","part":"gefunden","aux":"haben","n":11,"ex":[{"s":"Dafür fand man später leicht eine Entschuldigung.","f":"fand","b":"verwandlung-b1"},{"s":"Zuerst fand sie nichts Besonderes.","f":"fand","b":"verwandlung-b1"},{"s":"Als Gregor Samsa eines Morgens aus unruhigen Träumen erwachte, fand er sich in seinem Bett zu einem ungeheueren Ungeziefer verwandelt.","f":"fand","b":"verwandlung"}]},{"inf":"wissen","p":"wusste","m":"to know","part":"gewusst","aux":"haben","n":10,"ex":[{"s":"Aber jetzt wusste die ganze Familie, dass Gregor noch zu Hause war.","f":"wusste","b":"verwandlung-b1"},{"s":"Schon beim ersten Wort wusste Gregor, wer da war: der Prokurist selbst, der wichtige Mann aus der Firma!","f":"wusste","b":"verwandlung-b1"},{"s":"Er wusste, dass er als Einziger ruhig geblieben war.","f":"wusste","b":"verwandlung-b1"}]},{"inf":"tragen","p":"trug","m":"to carry, to bear","part":"getragen","aux":"haben","n":10,"ex":[{"s":"Sie sah den vollen Milchnapf und trug ihn hinaus – mit einem Tuch, nicht mit der bloßen Hand.","f":"trug","b":"verwandlung-b1"},{"s":"Deshalb trug er an einem Tag ein Leintuch auf seinem Rücken zum Kanapee.","f":"trug","b":"verwandlung-b1"},{"s":"Grete hatte den Arm um die Mutter gelegt und trug sie fast.","f":"trug","b":"verwandlung-b1"}]},{"inf":"treten","p":"trat","m":"to step; to kick","part":"getreten","aux":"sein","n":10,"ex":[{"s":"Sie trat zur Seite und sah den riesigen braunen Fleck auf der Blumentapete.","f":"trat","b":"verwandlung-b1"},{"s":"Im Nebenzimmer links trat eine peinliche Stille ein, im Nebenzimmer rechts begann die Schwester zu schluchzen.","f":"trat","b":"verwandlung"},{"s":"»Sehen Sie das Blatt doch genau an,« sagte der Offizier und trat neben den Reisenden, um mit ihm zu lesen.","f":"trat","b":"strafkolonie"}]},{"inf":"schließen","p":"schloss","m":"to shut","part":"geschlossen","aux":"haben","n":8,"ex":[{"s":"Er schloss die Augen, damit er die zappelnden Beine nicht sehen musste.","f":"schloss","b":"verwandlung-b1"},{"s":"Einmal an diesem langen Abend öffnete jemand die eine Seitentür ein kleines Stück und schloss sie schnell wieder.","f":"schloss","b":"verwandlung-b1"},{"s":"Dann ging sie schnell hinaus und schloss sogar die Tür ab.","f":"schloss","b":"verwandlung-b1"}]},{"inf":"essen","p":"aß","m":"to eat","part":"gegessen","aux":"haben","n":8,"ex":[{"s":"Gierig aß er den Käse, das Gemüse und die Soße.","f":"aß","b":"verwandlung-b1"},{"s":"Aber sie wollten nicht sehen, wie er aß.","f":"aß","b":"verwandlung-b1"},{"s":"Später aß er immer weniger.","f":"aß","b":"verwandlung-b1"}]},{"inf":"erschrecken","p":"erschrak","m":"to get a fright","part":"erschrocken","aux":"sein","n":7,"ex":[{"s":"Gregor antwortete – und erschrak.","f":"erschrak","b":"verwandlung-b1"},{"s":"Als sie ihn dann unter dem Kanapee entdeckte, erschrak sie so sehr, dass sie die Tür sofort wieder zuschlug.","f":"erschrak","b":"verwandlung-b1"},{"s":"Als sie sich umdrehte, erschrak sie.","f":"erschrak","b":"verwandlung-b1"}]},{"inf":"sprechen","p":"sprach","m":"to speak","part":"gesprochen","aux":"haben","n":7,"ex":[{"s":"Laut genug für die Schwester sprach er nicht.","f":"sprach","b":"verwandlung-b1"},{"s":"Jetzt sprach der Prokurist lauter: »Herr Samsa, was ist los?","f":"sprach","b":"verwandlung-b1"},{"s":"Immer wenn die Familie über das Geldverdienen sprach, ließ Gregor die Tür los.","f":"sprach","b":"verwandlung-b1"}]},{"inf":"klingen","p":"klang","m":"to sound","part":"geklungen","aux":"haben","n":7,"ex":[{"s":"Vielleicht klang sogar sein Husten nicht mehr menschlich.","f":"klang","b":"verwandlung-b1"},{"s":"aber schrie er noch, es klang durchs ganze Treppenhaus.","f":"klang","b":"verwandlung"}]},{"inf":"erscheinen","p":"erschien","m":"to appear","part":"erschienen","aux":"sein","n":7,"ex":[{"s":"Sofort erschien in der Tür die Mutter mit einer Schüssel Fleisch und knapp hinter ihr die Schwester mit einer Schüssel hochgeschichteter Kartoffeln.","f":"erschien","b":"verwandlung"},{"s":"Da öffnete sich die Tür des Schlafzimmers, und Herr Samsa erschien in seiner Livree, an einem Arm seine Frau, am anderen seine Tochter.","f":"erschien","b":"verwandlung"},{"s":"Ein breites, lautloses Lachen erschien nun auf seinem Gesicht und verschwand nicht mehr.","f":"erschien","b":"strafkolonie"}]},{"inf":"stoßen","p":"stieß","m":"to push, to bump","part":"gestoßen","aux":"haben","n":6,"ex":[{"s":"Am Ende stieß sich Gregor mit aller Kraft nach vorne – in die falsche Richtung.","f":"stieß","b":"verwandlung-b1"},{"s":"Als nichts passierte, stieß sie ihn fester.","f":"stieß","b":"verwandlung-b1"},{"s":"Unerbittlich drängte der Vater und stieß Zischlaute aus, wie ein Wilder.","f":"stieß","b":"verwandlung"}]},{"inf":"mögen","p":"mochte","m":"to like","part":"gemocht","aux":"haben","n":6,"ex":[{"s":"Sie war klug, und der Prokurist mochte Frauen.","f":"mochte","b":"verwandlung-b1"},{"s":"Am liebsten mochte er den alten Käse.","f":"mochte","b":"verwandlung-b1"},{"s":"Die frischen Sachen mochte er überhaupt nicht – er konnte nicht einmal ihren Geruch ertragen.","f":"mochte","b":"verwandlung-b1"}]},{"inf":"springen","p":"sprang","m":"to spring","part":"gesprungen","aux":"sein","n":6,"ex":[{"s":"Da sprang die Mutter plötzlich auf.","f":"sprang","b":"verwandlung-b1"},{"s":"Gregor lief schnell zu ihm, aber der Prokurist sprang mit großen Schritten die Treppe hinunter und war weg.","f":"sprang","b":"verwandlung-b1"},{"s":"Sie sprang zurück und schloss die Tür, als ob er sie beißen wollte.","f":"sprang","b":"verwandlung-b1"}]},{"inf":"treiben","p":"trieb","m":"to drive (on), to push","part":"getrieben","aux":"haben","n":6,"ex":[{"s":"Damit trieb er Gregor in sein Zimmer zurück.","f":"trieb","b":"verwandlung-b1"},{"s":"Er trieb Gregor nur noch lauter vorwärts.","f":"trieb","b":"verwandlung-b1"}]},{"inf":"helfen","p":"half","m":"to help","part":"geholfen","aux":"haben","n":6,"ex":[{"s":"Sie war unruhig in Gregors Zimmer, sagte bald nichts mehr und half beim Hinaustragen des Kastens.","f":"half","b":"verwandlung-b1"},{"s":"Die Mutter zog an seinem Ärmel, die Schwester half ihr, aber es nützte nichts.","f":"half","b":"verwandlung-b1"},{"s":"Weil er so schwach war, half er mit dem Kopf nach: Er hob ihn immer wieder und schlug ihn auf den Boden.","f":"half","b":"verwandlung-b1"}]},{"inf":"erheben","p":"erhob","m":"to raise, lift","part":"erhoben","aux":"","n":6,"ex":[{"s":"Der Reisende erhob sich langsam, ging hin und beugte sich über die Egge.","f":"erhob","b":"strafkolonie"}]},{"inf":"verlieren","p":"verlor","m":"to lose","part":"verloren","aux":"haben","n":5,"ex":[{"s":"Weil er vielleicht seine Stelle verlor?","f":"verlor","b":"verwandlung-b1"},{"s":"Jetzt verlor auch der Vater die Ruhe.","f":"verlor","b":"verwandlung-b1"},{"s":"Gregor verlor darüber ganz den Kopf.","f":"verlor","b":"verwandlung"}]},{"inf":"bitten","p":"bat","m":"to ask, to beg","part":"gebeten","aux":"haben","n":5,"ex":[{"s":"Gregor bat ihn, aber der Vater verstand ihn nicht.","f":"bat","b":"verwandlung-b1"},{"s":"Das Dienstmädchen bat schon am ersten Tag auf den Knien darum, gehen zu dürfen.","f":"bat","b":"verwandlung-b1"},{"s":"Sie lief zum Vater, umarmte ihn und bat ihn, Gregors Leben zu schonen.","f":"bat","b":"verwandlung-b1"}]},{"inf":"reißen","p":"riss","m":"to tear","part":"gerissen","aux":"haben","n":5,"ex":[{"s":"Dann lief sie zum Fenster und riss es auf, als ob sie keine Luft bekäme.","f":"riss","b":"verwandlung-b1"},{"s":"Sie riss die Augen auf und pfiff leise.","f":"riss","b":"verwandlung-b1"},{"s":"Der Riemen, der für das Handgelenk bestimmt war, riss; wahrscheinlich hatte ihn der Soldat zu stark angezogen.","f":"riss","b":"strafkolonie"}]},{"inf":"fangen","p":"fing","m":"to catch","part":"gefangen","aux":"haben","n":5,"ex":[{"s":"Die Mutter, die noch immer nicht genug Atem finden konnte, fing mit einem irrsinnigen Ausdruck der Augen dumpf in die vorgehaltene Hand zu husten an.","f":"fing","b":"verwandlung"},{"s":"Als er die Umdrehung vollendet hatte, fing er sofort an, geradeaus zurückzuwandern.","f":"fing","b":"verwandlung"}]},{"inf":"fahren","p":"fuhr","m":"to drive, to ride, to travel","part":"gefahren","aux":"sein","n":4,"ex":[{"s":"Der nächste Zug fuhr um sieben.","f":"fuhr","b":"verwandlung-b1"},{"s":"»Ja,« sagte der Offizier, schob ein wenig die Mütze zurück und fuhr sich mit der Hand über das heisse Gesicht, »nun hören Sie!","f":"fuhr","b":"strafkolonie"}]},{"inf":"leiden","p":"litt","m":"to suffer","part":"gelitten","aux":"haben","n":4,"ex":[{"s":"Über einen Monat lang litt Gregor an dieser schweren Wunde.","f":"litt","b":"verwandlung-b1"}]},{"inf":"waschen","p":"wusch","m":"to wash","part":"gewaschen","aux":"haben","n":4,"ex":[{"s":"Der Vater brachte den Bankangestellten das Frühstück, die Mutter wusch fremde Wäsche, die Schwester lief für die Kunden hin und her.","f":"wusch","b":"verwandlung-b1"},{"s":"Dann sah er prüfend seine Hände an; sie schienen ihm nicht rein genug, um die Zeichnungen anzufassen; er ging daher zum Kübel und wusch sie nochmals.","f":"wusch","b":"strafkolonie"},{"s":"Das Hemd war entsetzlich schmutzig, und der Verurteilte wusch es in dem Wasserkübel.","f":"wusch","b":"strafkolonie"}]},{"inf":"ergreifen","p":"ergriff","m":"to grab, to seize","part":"ergriffen","aux":"haben","n":4,"ex":[{"s":"War er ein Tier, wenn ihn Musik so ergriff?","f":"ergriff","b":"verwandlung-b1"},{"s":"War er ein Tier, da ihn Musik so ergriff?","f":"ergriff","b":"verwandlung"}]},{"inf":"gleiten","p":"glitt","m":"to glide","part":"geglitten","aux":"sein","n":4,"ex":[{"s":"Er glitt wieder in seine frühere Lage zurück.","f":"glitt","b":"verwandlung"},{"s":"Ein schwach geworfener Apfel streifte Gregors Rücken, glitt aber unschädlich ab.","f":"glitt","b":"verwandlung"}]},{"inf":"befinden","p":"befand","m":"to be (located)","part":"befunden","aux":"haben","n":4,"ex":[{"s":"Sie schoben einen der Tische beiseite, unter dem sich wirklich ein Grabstein befand.","f":"befand","b":"strafkolonie"}]},{"inf":"schwingen","p":"schwang","m":"to swing","part":"geschwungen","aux":"haben","n":3,"ex":[{"s":"Gregor wurde so aufgeregt, dass er sich mit aller Kraft aus dem Bett schwang.","f":"schwang","b":"verwandlung-b1"}]},{"inf":"beißen","p":"biss","m":"to bite","part":"gebissen","aux":"haben","n":3,"ex":[{"s":"Er biss mit aller Kraft in den Schlüssel, obwohl es wehtat.","f":"biss","b":"verwandlung-b1"},{"s":"Der Reisende biss sich auf die Lippen und sagte nichts.","f":"biss","b":"strafkolonie"}]},{"inf":"sinken","p":"sank","m":"to sink","part":"gesunken","aux":"sein","n":3,"ex":[{"s":"Ihr Kopf sank auf die Brust.","f":"sank","b":"verwandlung-b1"},{"s":"Dann sank sein Kopf ohne seinen Willen ganz nach unten.","f":"sank","b":"verwandlung-b1"},{"s":"Dann sank sein Kopf ohne seinen Willen gänzlich nieder, und aus seinen Nüstern strömte sein letzter Atem schwach hervor.","f":"sank","b":"verwandlung"}]},{"inf":"lesen","p":"las","m":"to read","part":"gelesen","aux":"haben","n":3,"ex":[{"s":"Er saß oft stundenlang dabei und las Zeitungen.","f":"las","b":"verwandlung-b1"},{"s":"Sonst las der Vater um diese Zeit laut aus der Abendzeitung vor.","f":"las","b":"verwandlung-b1"},{"s":"Nun begann der Offizier die Aufschrift zu buchstabieren und dann las er sie noch einmal im Zusammenhang.","f":"las","b":"strafkolonie"}]},{"inf":"fließen","p":"floss","m":"to flow","part":"geflossen","aux":"sein","n":3,"ex":[{"s":"Dabei fiel die Kaffeekanne um, und der Kaffee floss auf den Teppich.","f":"floss","b":"verwandlung-b1"},{"s":"Eilig riss ihn der Offizier vom Stumpf in die Höhe und wollte den Kopf zur Grube hindrehen; aber es war zu spät, der Unrat floss schon an der Maschine hinab.","f":"floss","b":"strafkolonie"},{"s":"Das Blut floss in hundert Strömen, nicht mit Wasser vermischt, auch die Wasserröhrchen hatten diesmal versagt.","f":"floss","b":"strafkolonie"}]},{"inf":"erfahren","p":"erfuhr","m":"to find out, to learn","part":"erfahren","aux":"haben","n":3,"ex":[{"s":"So erfuhr Gregor zu seiner Freude: Es gab noch etwas Geld aus der alten Zeit.","f":"erfuhr","b":"verwandlung-b1"}]},{"inf":"zerbrechen","p":"zerbrach","m":"to break, to shatter","part":"zerbrochen","aux":"","n":3,"ex":[{"s":"Eine Flasche fiel auf den Boden und zerbrach.","f":"zerbrach","b":"verwandlung-b1"}]},{"inf":"dringen","p":"drang","m":"to push through, to get in","part":"gedrungen","aux":"haben","n":3,"ex":[{"s":"Aber der nächste drang tief in seinen Rücken ein.","f":"drang","b":"verwandlung-b1"}]},{"inf":"gelingen","p":"gelang","m":"to succeed, to work out","part":"gelungen","aux":"sein","n":3,"ex":[{"s":"Dies gelang auch leicht, und trotz ihrer Breite und Schwere folgte schließlich die Körpermasse langsam der Wendung des Kopfes.","f":"gelang","b":"verwandlung"}]},{"inf":"vergessen","p":"vergaß","m":"to forget","part":"vergessen","aux":"haben","n":3,"ex":[{"s":"Gleichzeitig aber vergaß er nicht, sich zwischendurch daran zu erinnern, daß viel besser als verzweifelte Entschlüsse ruhige und ruhigste Überlegung sei.","f":"vergaß","b":"verwandlung"},{"s":"»Aber Herr Prokurist,« rief Gregor außer sich und vergaß in der Aufregung alles andere, »ich mache ja sofort, augenblicklich auf.","f":"vergaß","b":"verwandlung"},{"s":"Der Vater schien wieder von seinem Eigensinn derartig ergriffen, daß er jeden Respekt vergaß, den er seinen Mietern immerhin schuldete.","f":"vergaß","b":"verwandlung"}]}];   // irregular past forms from the books: {inf, p, m, part, aux, n, ex:[{s,f,b}]}

const settings = store.get('settings', {});

let vocab = store.get('vocab', []);

const main = $('#main');
const DAY = 864e5;

let deVoice = null;

const bookTitle = id => (PREPS[id] && PREPS[id].title) || (id === 'elixiere' ? 'Die Elixiere des Teufels' : id);

/* ---------------- spaced repetition ---------------- */
const card = v => srs[v.w] || (srs[v.w] = { ivl: 0, ease: 2.5, reps: 0, due: 0, lapses: 0 });
function nextIvl(s, q) {

  if (q === 3) return s.ivl === 0 ? 1 : s.ivl === 1 ? 3 : Math.round(s.ivl * s.ease);

}

const isDue = v => { const s = srs[v.w]; return !s || s.due <= Date.now(); };

/* ---------------- matching typed answers ---------------- */
const norm = s => s.trim().toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z]/g, '');
function lev(a, b) {
  const m = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return m[a.length][b.length];
}
function check(typed, answer) {
  if (typed.trim() === answer) return 'ok';
  const a = norm(typed), b = norm(answer);
  if (!a) return 'no';
  if (a === b) return typed.trim().toLowerCase() === answer.toLowerCase() || answer[0] !== answer[0].toUpperCase() ? 'ok' : 'case';
  return lev(a, b) <= (b.length > 6 ? 2 : 1) ? 'close' : 'no';
}

/* ---------------- sentence helpers ---------------- */
const formOf = v => v.f || v.w;

  const m = s.match(re);
  if (!m) return s ? esc(s) : '';
  const at = m.index + m[1].length;
  const mid = mode === 'mark' ? `<mark>${esc(f)}</mark>` : mode === 'gap' ? `<span class="gap" id="gap">${'_ '.repeat(Math.min(f.length, 10)).trim()}</span>` : mode;
  return esc(s.slice(0, at)) + mid + esc(s.slice(at + f.length));
}

/* ---------------- prepare a chapter ---------------- */
function prep(id, ci) {

/* ---------------- review session ---------------- */
let keyHandler = null;
addEventListener('keydown', e => { if (keyHandler) keyHandler(e); });
function startReview() {
  vocab = store.get('vocab', []); srs = store.get('srs', {});
  const queue = vocab.filter(isDue).sort((a, b) => (srs[a.w] ? srs[a.w].due : 0) - (srs[b.w] ? srs[b.w].due : 0)).slice(0, 40);

  const again = new Map();

  function next() {

  }

  }

  }

    let shown = false;
    main.innerHTML = `<div class="study">${header('Erkennen')}<div class="card in">
      <div class="kind">Was bedeutet …</div>

    </div></div>`;

      if (shown) return; shown = true;
      $('#mean').classList.remove('hid');
      $('#acts').className = 'acts four';
      $('#acts').innerHTML = [[1, 'Nochmal'], [2, 'Schwer'], [3, 'Gut'], [4, 'Leicht']]
        .map(([q, t]) => `<button class="rate r${q}" data-q="${q}">${t} <kbd>${q}</kbd><small>${ivlLabel(nextIvl(s, q))}</small></button>`).join('');

    let answered = false, q = 3, t0 = Date.now();
    main.innerHTML = `<div class="study">${header('Schreiben')}<div class="card in">
      <div class="kind">Welches Wort fehlt?</div>
      <p class="sent">${sentenceHtml(v, 'gap')}</p>
      <div class="hint">Bedeutung: <b>${esc(v.m || '–')}</b>${v.art && ans !== v.w ? ` · Grundform: <b>${esc(v.art + ' ' + v.w)}</b>` : v.art ? ` · <b>${esc(v.art)}</b> …` : ans !== v.w ? ` · Grundform: <b>${esc(v.w)}</b>` : ''}
        <br><span id="tip" style="cursor:pointer;text-decoration:underline dotted">Tipp zeigen</span></div>
      <div class="typing"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Wort eintippen …" aria-label="Antwort"></div>
      <div class="uml">${['ä', 'ö', 'ü', 'ß'].map(c => `<button data-c="${c}">${c}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div class="acts" id="acts"><button class="btn" id="chk">Prüfen <small>Enter</small></button></div>
    </div></div>`;
    const inp = $('#inp'); setTimeout(() => inp.focus(), 50);
    let tipped = false;
    $('#tip').onclick = () => { tipped = true; $('#tip').textContent = `Beginnt mit „${ans.slice(0, 2)}…“, ${ans.length} Buchstaben`; inp.focus(); };
    document.querySelector('.uml').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; const p = inp.selectionStart; inp.value = inp.value.slice(0, p) + b.dataset.c + inp.value.slice(inp.selectionEnd); inp.focus(); inp.setSelectionRange(p + 1, p + 1); };
    function submit() {

      else if (r === 'case') { q = 3; gap.classList.add('ok'); inp.classList.add('ok'); fb.className = 'feedback close'; fb.textContent = 'Richtig – achte auf Groß-/Kleinschreibung.'; }
      else if (r === 'close') { q = 2; gap.classList.add('ok'); fb.className = 'feedback close'; fb.textContent = `Fast! Richtig ist: ${ans}`; }

      <div class="btns"><a class="btn" href="${(vocab[0] && vocab[0].b) || 'verwandlung'}.html">Weiterlesen</a><a class="btn ghost" href="#">Übersicht</a></div></div></div></div>`;

  }
}

/* ---------------- Präteritum trainer ----------------
   New verbs: see the past form in a story sentence → pick the infinitive (recognising, for reading).

const forms3 = v => `${v.inf} – <b>${esc(v.p)}</b> – ${v.aux === 'sein' ? 'ist' : 'hat'} ${esc(v.part)}`;
function praetList() {

    }).join('')}</div>

function praetSession() {
  let ps = store.get('praet', {});
  const now = Date.now();
  const due = PRAET.filter(v => ps[v.inf] && ps[v.inf].due <= now).sort((a, b) => ps[a.inf].due - ps[b.inf].due).slice(0, 20);
  const fresh = PRAET.filter(v => !ps[v.inf]).slice(0, 8);
  const queue = [...due, ...fresh];
  if (!queue.length) { main.innerHTML = `<div class="study"><div class="card in"><div class="done"><div class="mark">✓</div><h2>Alles wiederholt</h2><p>Für heute sind keine Präteritum-Formen fällig.</p><div class="btns"><a class="btn ghost" href="#praet-liste">Liste ansehen</a><a class="btn ghost" href="#">Übersicht</a></div></div></div></div>`; return; }
  const total = queue.length; let doneN = 0, right = 0;

  const save = () => store.set('praet', ps);
  const pc = v => ps[v.inf] || (ps[v.inf] = { ivl: 0, ease: 2.5, reps: 0, due: 0, lapses: 0 });
  function rateP(v, q) {
    const s = pc(v), d = nextIvl(s, q);
    if (q === 1) { s.lapses++; s.reps = Math.max(0, s.reps - 1); s.ease = Math.max(1.3, s.ease - .2); s.due = Date.now() + 10 * 60e3; }
    else { s.reps++; s.due = Date.now() + d * DAY - 3600e3; }
    if (q === 4) s.ease += .15;
    s.ivl = d; bumpStreak(); save();
  }
  const ex = v => v.ex[Math.floor(Math.random() * v.ex.length)];
  const head = kind => `<div class="prog"><span>${kind}</span><div class="bar"><i style="width:${doneN / total * 100}%"></i></div><span>${doneN} / ${total}</span></div>`;
  function after(v, q) {
    rateP(v, q); queue.shift();
    if (q === 1 && (again.get(v.inf) || 0) < 2) { again.set(v.inf, (again.get(v.inf) || 0) + 1); queue.splice(Math.min(3, queue.length), 0, v); }
    else { doneN++; if (q >= 3) right++; }
    const c = $('.card'); if (c) c.classList.add(q === 1 ? 'out-l' : 'out-r');
    setTimeout(next, 200);
  }
  function next() {
    if (!queue.length) return finish();
    const v = queue[0];
    (pc(v).reps >= 1 ? produce : recognise)(v);
  }
  // 1) ging → gehen (multiple choice)
  function recognise(v) {
    const e = ex(v);
    const others = PRAET.filter(x => x.inf !== v.inf).sort(() => Math.random() - .5).slice(0, 3);
    const opts = [v, ...others].sort(() => Math.random() - .5);
    let answered = false;
    main.innerHTML = `<div class="study">${head('Erkennen')}<div class="card in">
      <div class="kind">Von welchem Verb kommt …</div>
      <div class="word"><b>${esc(e.f)}</b></div>
      <p class="sent">${sentenceHtml({ s: e.s, f: e.f }, 'mark')}</p>
      <div class="acts two" id="opts" style="margin-top:20px">${opts.map((o, i) => `<button class="big2" data-i="${i}">${esc(o.inf)} <kbd>${i + 1}</kbd></button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div id="nxt"></div>
    </div></div>`;
    const pick = i => {
      if (answered) return; answered = true;
      const ok = opts[i] === v;
      document.querySelectorAll('#opts .big2').forEach((b, k) => {
        if (opts[k] === v) { b.style.background = 'var(--good-soft)'; b.style.color = 'var(--good)'; b.style.borderColor = 'var(--good)'; }
        else if (k === i) { b.style.background = 'var(--bad-soft)'; b.style.color = 'var(--bad)'; }
      });
      const fb = $('#fb'); fb.className = 'feedback ' + (ok ? 'ok' : 'no');
      fb.innerHTML = `${ok ? 'Richtig!' : 'Nicht ganz.'} <span style="font-weight:500;color:var(--ink)">${forms3(v)}</span><br><small style="color:var(--muted);font-weight:500">${esc(v.m)}</small>`;
      speak(`${v.inf}, ${v.p}`);
      $('#nxt').innerHTML = `<div class="acts"><button class="btn" id="go">Weiter <small>Enter</small></button></div>`;
      $('#go').onclick = () => after(v, ok ? 3 : 1);
    };
    $('#opts').onclick = e => { const b = e.target.closest('[data-i]'); if (b) pick(+b.dataset.i); };
    keyHandler = e => {
      if (/^[1-4]$/.test(e.key) && !answered) pick(+e.key - 1);
      else if (e.key === 'Enter' && answered) $('#go').click();
      else if (e.key === 'Escape') home();
    };
  }
  // 2) gehen → type "ging" into the story sentence
  function produce(v) {
    const e = ex(v);
    let answered = false, q = 3, t0 = Date.now();
    main.innerHTML = `<div class="study">${head('Bilden')}<div class="card in">
      <div class="kind">Setze das Verb in die Vergangenheit</div>
      <div class="word"><b style="font-size:38px">${esc(v.inf)}</b></div>
      <div class="ipa">${esc(v.m)}</div>
      <p class="sent">${sentenceHtml({ s: e.s, f: e.f }, 'gap')}</p>
      <div class="typing"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Präteritum …" aria-label="Antwort"></div>
      <div class="uml">${['ä', 'ö', 'ü', 'ß'].map(c => `<button data-c="${c}">${c}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>
      <div class="acts" id="acts"><button class="btn" id="chk">Prüfen <small>Enter</small></button></div>
    </div></div>`;
    const inp = $('#inp'); setTimeout(() => inp.focus(), 50);
    document.querySelector('.uml').onclick = ev => { const b = ev.target.closest('[data-c]'); if (!b) return; const p = inp.selectionStart; inp.value = inp.value.slice(0, p) + b.dataset.c + inp.value.slice(inp.selectionEnd); inp.focus(); inp.setSelectionRange(p + 1, p + 1); };
    function submit() {
      if (answered) return after(v, q);
      answered = true;
      // accept the exact form in the sentence, or the main form (e.g. "ging" for "gingen" is "close")
      let r = check(inp.value, e.f);
      if (r === 'no' && check(inp.value, v.p) !== 'no') r = 'close';
      const gap = $('#gap'), fb = $('#fb');
      gap.textContent = e.f;
      if (r === 'ok' || r === 'case') { q = Date.now() - t0 < 6000 ? 4 : 3; gap.classList.add('ok'); inp.classList.add('ok'); fb.className = 'feedback ok'; fb.innerHTML = 'Richtig!'; }
      else if (r === 'close') { q = 2; gap.classList.add('ok'); fb.className = 'feedback close'; fb.innerHTML = `Fast! Hier: <b>${esc(e.f)}</b>`; }
      else { q = 1; gap.classList.add('no'); inp.classList.add('no'); fb.className = 'feedback no'; fb.innerHTML = `Richtig ist: <b>${esc(e.f)}</b>`; }
      fb.innerHTML += `<br><span style="font-weight:500;color:var(--ink)">${forms3(v)}</span>`;
      inp.readOnly = true; speak(e.s);
      $('#acts').innerHTML = `<button class="btn" id="nx">Weiter <small>Enter</small></button>`;
      $('#nx').onclick = () => after(v, q);
    }
    $('#chk').onclick = submit;
    keyHandler = ev => { if (ev.key === 'Enter') { ev.preventDefault(); submit(); } else if (ev.key === 'Escape') home(); };
  }
  function finish() {
    keyHandler = null; location.hash = '';
    main.innerHTML = `<div class="study"><div class="card in"><div class="done"><div class="mark">⌛</div><h2>Geschafft!</h2>
      <p>${total} Verben geübt · ${right} sofort gewusst</p>
      <div class="btns"><a class="btn ghost" href="#praet-liste">Alle Formen</a><a class="btn ghost" href="#">Übersicht</a></div></div></div></div>`;
    confetti();
  }
  next();
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#9b2c1f', '#f5d77a', '#2f7d5b', '#e58b6b', '#8a7f72'];
  box.innerHTML = Array.from({ length: 60 }, () => `<i style="left:${Math.random() * 100}%;background:${cols[Math.random() * cols.length | 0]};animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * .4}s"></i>`).join('');
  document.body.appendChild(box); setTimeout(() => box.remove(), 3800);
}

/* ---------------- routing ---------------- */
function route() {
  keyHandler = null;
  const h = location.hash;
  const m = h.match(/^#prep=([a-z0-9-]+):(\d+)/);
  if (m) return prep(m[1], +m[2]);
  if (h === '#ueben') return startReview();
  if (h === '#praet') return praetSession();
  if (h === '#praet-liste') return praetList();
  home();
}
addEventListener('hashchange', () => { if (location.hash !== '#ueben') route(); });
$('#homeLnk').onclick = e => { e.preventDefault(); location.hash = ''; home(); };
route();
})();
</script>
</body>
