","n":3},{"w":"Stock","art":"der","ipa":"/ʃtɔk/","m":"stick; stick, staff; floor, storey, level","f":"Stock","s":"Er nahm den Stock des Prokuristen in die rechte Hand und eine große Zeitung in die linke.","n":3},{"w":"Stuhl","art":"der","ipa":"/ʃtuːl/","m":"a chair; a see; feces, stool","f":"Stuhl","s":"Dann hielt er sich mit den kleinen Beinen an einem Stuhl fest.","n":3},{"w":"Viertel","art":"das","ipa":"/ˈfɪʁtəl/","m":"quarter, fourth; quarter, neighbourhood","f":"Viertel","s":"Es war halb sieben, schon fast Viertel vor sieben!","n":4},{"w":"Teppich","art":"der","ipa":"/ˈtɛpɪç/","m":"rug, carpet; tapestry; slick","f":"Teppich","s":"Sein Rücken war hart, der Teppich weich.","n":4},{"w":"schaukeln","art":"","ipa":"/ˈʃaʊ̯kl̩n/","m":"to swing back and forth, to rock to and fro","f":"schaukelte","s":"Immer wieder schaukelte er zurück auf den Rücken.","n":4},{"w":"klein","art":"","ipa":"/klaɪ̯n/","m":"small, little, wee; small, little, young","f":"klein","s":"Es war ein normales Zimmer, nur ein bisschen zu klein.","n":2},{"w":"Arm","art":"der","ipa":"/arm/","m":"an arm; a sleeve; an arm of a creek or a river","f":"Arme","s":"Ein Mensch hätte Arme und Hände benutzt.","n":2},{"w":"kalt","art":"","ipa":"/kalt/","m":"cold, chilly; calm, restrained, passionless","f":"kalter","s":"Ein kalter Schauer lief durch seinen Körper.","n":2},{"w":"Richtung","art":"die","ipa":"/ˈʁɪçtʊŋ/","m":"direction; school of thought, branch, subfield","f":"Richtungen","s":"Gregor hatte nur viele kleine Beine, und sie bewegten sich alle in verschiedene Richtungen.","n":2},{"w":"persönlich","art":"","ipa":"/pɛʁˈzøːnlɪç/","m":"personal; friendly","f":"persönlich","s":"Musste wirklich der Prokurist persönlich kommen?","n":2},{"w":"willen","art":"","ipa":"","m":"only used in um … willen","f":"willen","s":"»Um Gottes willen«, rief die Mutter weinend, »er ist vielleicht schwer krank!","n":2},{"w":"Schlag","art":"der","ipa":"/ʃlaːk/","m":"blow, hit; beat; type, sort, kind; whipped cream","f":"Schlag","s":"Es gab einen dumpfen Schlag, aber keinen großen Lärm, denn der Teppich war weich.","n":2},{"w":"gesund","art":"","ipa":"/ɡəˈzʊnt/","m":"healthy","f":"gesund","s":"Und eigentlich fühlte sich Gregor ganz gesund.","n":2},{"w":"schließen","art":"","ipa":"[ˈʃliːsn̩]","m":"to shut; to close; to shut down; to lock; to end","f":"schloss","s":"Er schloss die Augen, damit er die zappelnden Beine nicht sehen musste.","n":2},{"w":"halb","art":"","ipa":"","m":"half, halfway","f":"halb","s":"Es war halb sieben, schon fast Viertel vor sieben!","n":2},{"w":"verdienen","art":"","ipa":"/fɛɐ̯ˈdiːnən/","m":"to make money, to earn; to deserve","f":"verdiene","s":"Das Reisen ist anstrengend, aber ohne Reisen verdiene ich kein Geld.","n":2},{"w":"Wind","art":"der","ipa":"/vɪnt/","m":"wind","f":"Wind","s":"Es klang wie Wind.","n":2},{"w":"schreien","art":"","ipa":"/ˈʃʁaɪ̯ən/","m":"to shout; to yell; to cry; to scream; to howl","f":"schrie","s":"Sie streckte die Arme aus und schrie: »Hilfe, um Gottes willen, Hilfe!«","n":2},{"w":"Frühstück","art":"das","ipa":"/ˈfʁyːʃtʏk/","m":"breakfast","f":"Frühstück","s":"Wenn ich morgens ins Hotel zurückkomme, sitzen sie noch beim Frühstück.","n":2},{"w":"Schloss","art":"das","ipa":"/ʃlɔs/","m":"lock, padlock; lock; castle","f":"Schloss","s":"Dann wollte er den Schlüssel im Schloss drehen – mit dem Mund.","n":2},{"w":"hinein","art":"","ipa":"[hɪˈnaɪ̯n]","m":"in","f":"hinein","s":"»Darf der Herr Prokurist jetzt zu dir hinein?«","n":2},{"w":"klopfen","art":"","ipa":"/ˈklɔpfən/","m":"to knock, to rap; to throb","f":"klopfte","s":"Jemand klopfte vorsichtig an die Tür.","n":2},{"w":"drücken","art":"","ipa":"/ˈdʁʏkən/","m":"to press, to push; to squeeze; to hug","f":"drückte","s":"Dann drückte er mit dem Kopf die Klinke herunter.","n":2},{"w":"Bauch","art":"der","ipa":"/baʊ̯x/","m":"abdomen, belly","f":"Bauch","s":"Wenn er den Kopf ein wenig hob, sah er seinen braunen, runden Bauch.","n":2},{"w":"springen","art":"","ipa":"/ˈʃpʁɪŋən/","m":"to spring; to leap; to bounce; to dive; to jump","f":"sprang","s":"Da sprang die Mutter plötzlich auf.","n":2},{"w":"treiben","art":"","ipa":"/ˈtʁaɪ̯bm̩/","m":"to drive; to propel; to force; to put forth","f":"trieb","s":"Damit trieb er Gregor in sein Zimmer zurück.","n":2},{"w":"erschrecken","art":"","ipa":"/ɛʁˈʃʁɛkən/","m":"to be frightened; to be startled; to frighten","f":"erschrak","s":"Gregor antwortete – und erschrak.","n":3}],[{"w":"Wand","art":"die","ipa":"/vant/","m":"wall, partition","f":"Wänden","s":"Darum begann er, an den Wänden und an der Decke herumzukriechen.","n":7},{"w":"Möbel","art":"das","ipa":"/ˈmøːbəl/","m":"piece of furniture; furniture","f":"Möbel","s":"Sie wollte ihm mehr Platz machen und die Möbel hinaustragen, vor allem den Kasten und den Schreibtisch.","n":9},{"w":"kriechen","art":"","ipa":"/ˈkʁiːçn̩/","m":"to creep; to crawl","f":"kroch","s":"Langsam kroch er zur Tür.","n":8},{"w":"Kanapee","art":"das","ipa":"/ˈkanapeː/","m":"canapé; hors d'oeuvre; sofa; couch","f":"Kanapee","s":"Ohne viel nachzudenken, kroch er unter das Kanapee, ein altes Sofa.","n":10},{"w":"tief","art":"","ipa":"/tiːf/","m":"deep; deep, profound; low","f":"tiefen","s":"Erst am Abend, als es schon dunkel wurde, wachte Gregor aus einem tiefen, schweren Schlaf auf.","n":5},{"w":"leer","art":"","ipa":"/leːɐ̯/","m":"empty","f":"leere","s":"Aber das hohe, leere Zimmer machte ihm Angst – obwohl er schon fünf Jahre darin wohnte.","n":5},{"w":"hinaus","art":"","ipa":"/hɪˈnaʊ̯s/","m":"out","f":"hinaus","s":"Sie sah den vollen Milchnapf und trug ihn hinaus – mit einem Tuch, nicht mit der bloßen Hand.","n":5},{"w":"Kaste","art":"die","ipa":"/ˈkastə/","m":"caste","f":"Kasten","s":"Sie wollte ihm mehr Platz machen und die Möbel hinaustragen, vor allem den Kasten und den Schreibtisch.","n":7},{"w":"werfen","art":"","ipa":"/ˈvɛrfən/","m":"to throw; to cast; to project; to give birth","f":"warf","s":"Die Schwester fegte alle Reste zusammen, auch das, was er nicht berührt hatte, und warf alles weg.","n":4},{"w":"Schreibtisch","art":"der","ipa":"/ˈʃʁaɪ̯pˌtɪʃ/","m":"desk, cabinet","f":"Schreibtisch","s":"Sie wollte ihm mehr Platz machen und die Möbel hinaustragen, vor allem den Kasten und den Schreibtisch.","n":5},{"w":"legen","art":"","ipa":"/ˈleːɡən/","m":"causative of liegen: to lay; to lie down","f":"legte","s":"Er legte das Geld zu Hause auf den Tisch, und die Familie war glücklich und überrascht.","n":3},{"w":"Weile","art":"die","ipa":"/ˈvaɪ̯lə/","m":"while","f":"Weile","s":"»Was er wieder treibt«, sagte der Vater nach einer Weile.","n":3},{"w":"Blick","art":"der","ipa":"[blɪk]","m":"glance, look; view","f":"Blick","s":"Einmal glaubte Gregor sogar, einen dankbaren Blick bei ihr zu sehen.","n":3},{"w":"herein","art":"","ipa":"[hɛˈʁaɪ̯n]","m":"in","f":"herein","s":"Schon früh am nächsten Morgen öffnete die Schwester die Tür und sah ängstlich herein.","n":3},{"w":"Milch","art":"die","ipa":"/mɪlç/","m":"milk; white semen of a male fish","f":"Milch","s":"Dort stand ein Napf mit süßer Milch und kleinen Stücken Weißbrot.","n":3},{"w":"zurückkommen","art":"","ipa":"[t͡suˈʁʏkˌkɔmən]","m":"to return","f":"zurückkommt","s":"Wenn Gregor zu uns zurückkommt, findet er alles unverändert.«","n":3},{"w":"Käse","art":"der","ipa":"/ˈkɛːzə/","m":"cheese; nonsense","f":"Käse","s":"Dann brachte sie viele verschiedene Dinge auf einer alten Zeitung: altes, halb verfaultes Gemüse, Knochen vom Abendessen, ein paar Rosinen und Mandeln, einen alten Käse, ein trockenes Brötchen und Butterbrot mit Salz.","n":3},{"w":"Deck","art":"das","ipa":"/dɛk/","m":"deck","f":"Decke","s":"Das Licht der Straßenlampen fiel blass an die Decke, aber unten, wo Gregor lag, war es dunkel.","n":4},{"w":"Tuch","art":"das","ipa":"/tuːx/","m":"cloth","f":"Tuch","s":"Sie sah den vollen Milchnapf und trug ihn hinaus – mit einem Tuch, nicht mit der bloßen Hand.","n":4},{"w":"Bier","art":"das","ipa":"/biːr/","m":"beer; business, beeswax","f":"Bier","s":"Auch Bier wollte der Vater nicht mehr.","n":2},{"w":"Monat","art":"der","ipa":"/ˈmoːnat/","m":"month","f":"Monat","s":"Außerdem hatte die Familie nicht das ganze Geld ausgegeben, das Gregor jeden Monat nach Hause brachte.","n":2},{"w":"müde","art":"","ipa":"/ˈmyːdə/","m":"tired; tired of it, tired of","f":"müde","s":"Manchmal wurde er so müde, dass sein Kopf gegen die Tür fiel.","n":2},{"w":"Hunger","art":"der","ipa":"/ˈhʊŋɐ/","m":"hunger","f":"Hunger","s":"Gregor freute sich sehr, denn er hatte noch mehr Hunger als am Morgen.","n":2},{"w":"neben","art":"","ipa":"/ˈneːbən/","m":"next to, beside, alongside, adjacent to, near, near to","f":"daneben","s":"Er warf sich auf das kühle Ledersofa daneben, denn er wurde ganz heiß vor Scham und Trauer.","n":2},{"w":"schrecklich","art":"","ipa":"/ˈʃʁɛklɪç/","m":"awful, terrible, horrible","f":"schrecklich","s":"Gregor stand noch am Fenster und sah hinaus – unbeweglich und schrecklich anzusehen.","n":2},{"w":"traurig","art":"","ipa":"/ˈtʁaʊ̯.ʁɪç/","m":"sad","f":"traurig","s":"Dann sagte sie traurig: »Jetzt ist wieder alles stehen geblieben.«","n":2},{"w":"Fuß","art":"der","ipa":"/fuːs/","m":"foot; footing; pedestal; metrical foot","f":"Füße","s":"Die Schwester bemerkte das, denn seine Füße hinterließen klebrige Spuren.","n":2},{"w":"Hoffnung","art":"die","ipa":"/ˈhɔfnʊŋ/","m":"hope, the belief or expectation that something wished for can or will really happen.","f":"Hoffnungen","s":"Er machte sich Sorgen und hatte unklare Hoffnungen.","n":2},{"w":"Glas","art":"das","ipa":"/ɡlaːs/","m":"glass; jar; time stamp for half an hour","f":"Glas","s":"Schnell kroch er hinauf und drückte sich an das Glas.","n":2},{"w":"beginnen","art":"","ipa":"/bəˈɡɪnən/","m":"to begin; to commence; to be started","f":"begann","s":"Gregor begann deshalb sehr hart zu arbeiten.","n":2},{"w":"Freude","art":"die","ipa":"/ˈfʁɔɪ̯də/","m":"joy, delight, glee","f":"Freude","s":"So erfuhr Gregor zu seiner Freude: Es gab noch etwas Geld aus der alten Zeit.","n":2},{"w":"danken","art":"","ipa":"[ˈdaŋkn̩]","m":"to thank","f":"dankte","s":"Sie dankte unter Tränen und versprach, niemandem etwas zu erzählen.","n":2},{"w":"nah","art":"","ipa":"/naː/","m":"near, close, nearby","f":"nächstes","s":"Gregor hatte einen geheimen Plan: Er wollte sie nächstes Jahr aufs Konservatorium schicken, obwohl das sehr teuer war.","n":2},{"w":"Flasche","art":"die","ipa":"/ˈflaʃə/","m":"bottle; flask; flagon; loser; wimp","f":"Flasche","s":"Eine Flasche fiel auf den Boden und zerbrach.","n":2},{"w":"dankbar","art":"","ipa":"","m":"grateful, thankful","f":"dankbar","s":"Später gewöhnten sich alle daran: Gregor brachte das Geld, und die Familie nahm es dankbar.","n":2},{"w":"nachdenken","art":"","ipa":"/ˈnaːxˌdɛŋkŋ̩/","m":"to think, to reflect, to ponder","f":"nachzudenken","s":"Jetzt hatte er Zeit, über sein neues Leben nachzudenken.","n":2},{"w":"atmen","art":"","ipa":"/ˈaːtmən/","m":"to breathe","f":"atmete","s":"Auch wenn es kalt war, blieb sie eine Weile am Fenster und atmete tief.","n":2},{"w":"Mühe","art":"die","ipa":"/ˈmyːə/","m":"effort, difficulty","f":"Mühe","s":"Oder er schob mit großer Mühe einen Stuhl zum Fenster, kletterte hinauf und sah hinaus.","n":2},{"w":"trauen","art":"","ipa":"/ˈtʁaʊ̯ən/","m":"to trust; to marry; to dare, to be brave enough","f":"traute","s":"Jemand wollte offenbar hereinkommen, traute sich aber nicht.","n":2},{"w":"frisch","art":"","ipa":"/fʁɪʃ/","m":"fresh; recent","f":"frischen","s":"Die frischen Sachen mochte er überhaupt nicht – er konnte nicht einmal ihren Geruch ertragen.","n":2},{"w":"Medizin","art":"die","ipa":"/(ˌ)me.di.ˈtsiːn/","m":"medicine","f":"Medizin","s":"Sie lief ins Nebenzimmer, um Medizin für die Mutter zu holen.","n":2},{"w":"ertragen","art":"","ipa":"/ɛʁˈtʁaːɡən/","m":"to bear, to stand, to endure, to take, to suffer, to tolerate, to handle","f":"ertragen","s":"Die frischen Sachen mochte er überhaupt nicht – er konnte nicht einmal ihren Geruch ertragen.","n":2},{"w":"hinterher","art":"","ipa":"/ˈhɪntɐˌhɛɐ̯/","m":"behind; afterwards","f":"hinterher","s":"Ein Beinchen war am Morgen schwer verletzt worden und schleppte leblos hinterher.","n":2},{"w":"schieben","art":"","ipa":"/ˈʃiːbən/","m":"to push; to shove; to slide; to slip; to put","f":"schob","s":"Oder er schob mit großer Mühe einen Stuhl zum Fenster, kletterte hinauf und sah hinaus.","n":3},{"w":"Wohnzimmer","art":"das","ipa":"/ˈvoːnˌt͡sɪmɐ/","m":"living room","f":"Wohnzimmer","s":"Durch den Türspalt sah Gregor, dass im Wohnzimmer Licht brannte.","n":3},{"w":"Apfel","art":"der","ipa":"/ˈapfəl/","m":"apple; apple tree; breasts","f":"Apfel","s":"Es war ein Apfel.","n":3},{"w":"unruhig","art":"","ipa":"/ˈʊnʁuːɪç/","m":"noisy; anxious, restless","f":"unruhiger","s":"Erst am Mittag kam sie wieder, und sie war unruhiger als sonst.","n":3},{"w":"Anfang","art":"der","ipa":"/ˈʔanfaŋ/","m":"start, beginning, origin","f":"Anfang","s":"Am Anfang sprachen alle fast nur über ihn.","n":1},{"w":"süß","art":"","ipa":"/zyːs/","m":"sweet; cute","f":"süßer","s":"Dort stand ein Napf mit süßer Milch und kleinen Stücken Weißbrot.","n":1},{"w":"herum","art":"","ipa":"/hɛɐ̯ˈʁʊm/","m":"about, around.","f":"herum","s":"Voller Angst und Schuldgefühle kroch er überall herum: über die Wände, die Möbel, die Decke.","n":1}],[{"w":"Geige","art":"die","ipa":"/ˈɡaɪ̯ɡə/","m":"violin, fiddle","f":"Geige","s":"An diesem Abend hörte man aus der Küche die Geige.","n":8},{"w":"mittel","art":"","ipa":"/ˈmɪtəl/","m":"middle, in the middle; average, middling; mid","f":"mittlere","s":"Der mittlere Herr war offenbar der Chef der drei.","n":6},{"w":"Bedienerin","art":"die","ipa":"[bəˈdiːnəʁɪn]","m":"a female assistent; a female help","f":"Bedienerin","s":"Stattdessen kam morgens und abends eine riesige, knochige Bedienerin mit weißen Haaren für die schwerste Arbeit.","n":13},{"w":"Küche","art":"die","ipa":"/ˈkʏçə/","m":"kitchen; cuisine","f":"Küche","s":"Sie wollten überall Ordnung, besonders in der Küche.","n":5},{"w":"lächeln","art":"","ipa":"/ˈlɛçəln/","m":"to smile","f":"lächelten","s":"Dann schlief er gleich wieder ein, und Mutter und Schwester lächelten sich müde an.","n":4},{"w":"schwach","art":"","ipa":"/ˈʃvax/","m":"weak, lacking in strength; weak","f":"schwach","s":"Er war enttäuscht und schwach vor Hunger.","n":4},{"w":"umdrehen","art":"","ipa":"/ˈʔʊmdʁeːən/","m":"to twist, to turn, to turn around","f":"umdrehte","s":", fragte sie, als Gregor sich umdrehte.","n":5},{"w":"Finger","art":"der","ipa":"/ˈfɪŋɐ/","m":"finger","f":"Finger","s":", rief der mittlere Herr und zeigte mit dem Finger auf Gregor.","n":3},{"w":"Fleisch","art":"das","ipa":"/flaɪ̯ʃ/","m":"flesh; meat; pulp","f":"Fleisch","s":"So blieb er im Fleisch stecken.","n":3},{"w":"Tier","art":"das","ipa":"/tiːr/","m":"animal; hind","f":"Tier","s":"War er ein Tier, wenn ihn Musik so ergriff?","n":3},{"w":"stören","art":"","ipa":"/ʃtøːɐ̯n/","m":"to disturb, to interfere, to bother","f":"störte","s":"Das störte ihn nicht sehr.","n":3},{"w":"morgens","art":"","ipa":"/ˈmɔʁɡəns/","m":"in the morning, a.m.","f":"morgens","s":"Stattdessen kam morgens und abends eine riesige, knochige Bedienerin mit weißen Haaren für die schwerste Arbeit.","n":3},{"w":"merken","art":"","ipa":"/ˈmɛʁkŋ̍/","m":"to notice, to sense, to be able to tell","f":"merkte","s":"Bald merkte er, dass er sich gar nicht mehr bewegen konnte.","n":3},{"w":"abends","art":"","ipa":"/ˈaːbən(t)s/","m":"in the evening, at night, see Abend","f":"abends","s":"Stattdessen kam morgens und abends eine riesige, knochige Bedienerin mit weißen Haaren für die schwerste Arbeit.","n":3},{"w":"Uniform","art":"die","ipa":"/ˈʊniˌfɔʁm/","m":"uniform","f":"Uniform","s":"Der Vater zog seine Uniform auch zu Hause nicht aus.","n":3},{"w":"heben","art":"","ipa":"/ˈheːbən/","m":"to lift; to raise; to heave; to hoist; to rise","f":"hob","s":"Sie hob einfach einen Stuhl hoch und wartete, um ihn auf Gregors Rücken zu schlagen.","n":4},{"w":"Besen","art":"der","ipa":"/ˈbeː.zn̩/","m":"broom","f":"Besen","s":"Am Abend kehrte sie es mit dem Besen wieder hinaus – egal, ob er es gegessen hatte oder nicht.","n":4},{"w":"Brief","art":"der","ipa":"/ˈbʁiːf/","m":"letter","f":"Briefe","s":"Frau Samsa und Grete beugten sich über ihre Briefe.","n":2},{"w":"sauber","art":"","ipa":"/ˈzaʊ̯bɐ/","m":"clean; neat, tidy; good, all right; pretty, cute","f":"sauber","s":"Früher hatte er sich mehrmals am Tag am Teppich sauber gerieben.","n":2},{"w":"Hals","art":"der","ipa":"/hals/","m":"neck; throat","f":"Hals","s":"Sie würde vor Rührung weinen, und er würde ihren Hals küssen.","n":2},{"w":"Gespräch","art":"das","ipa":"/ɡəˈʃpʁɛːç/","m":"conversation, chat, talk","f":"Gespräche","s":"Er konnte die Familie am beleuchteten Tisch sehen und ihre Gespräche hören.","n":2},{"w":"Pause","art":"die","ipa":"/ˈpaʊ̯zə/","m":"pause; break; tracing, blueprint","f":"Pause","s":"Er atmete schwer und musste oft eine Pause machen.","n":2},{"w":"Hut","art":"der","ipa":"/huːt/","m":"hat; head, top","f":"Hüte","s":"Alle drei nahmen ihre Hüte und Stöcke, verbeugten sich stumm und verließen die Wohnung.","n":2},{"w":"Haar","art":"das","ipa":"/haːr/","m":"hair","f":"Haaren","s":"Stattdessen kam morgens und abends eine riesige, knochige Bedienerin mit weißen Haaren für die schwerste Arbeit.","n":2},{"w":"geschlossen","art":"","ipa":"/ɡəˈʃlɔ.sn̩/","m":"shut; closed; locked; private, non-public","f":"geschlossenen","s":"Eine Viertelstunde lang schüttelte er mit geschlossenen Augen den Kopf.","n":2},{"w":"küssen","art":"","ipa":"[ˈkʰʏsn̩]","m":"to kiss; to make out","f":"küssen","s":"Sie würde vor Rührung weinen, und er würde ihren Hals küssen.","n":2},{"w":"entlassen","art":"","ipa":"/ˌɛntˈlasn̩/","m":"to release; to dismiss; to fire, to sack","f":"entlassen","s":"Das Dienstmädchen wurde entlassen.","n":2},{"w":"warm","art":"","ipa":"/varm/","m":"warm; mildly hot; keeping the wearer warm","f":"warm","s":"Obwohl es noch früh war, war die Luft schon ein wenig warm.","n":2},{"w":"Geduld","art":"die","ipa":"/ɡəˈdʊlt/","m":"patience","f":"Geduld","s":"Die Familie musste ihren Ekel herunterschlucken und Geduld haben, nur Geduld.","n":2},{"w":"anziehen","art":"","ipa":"/ˈantsiːən/","m":"to get dressed; to dress; to put on","f":"angezogen","s":"Er schlief vollständig angezogen auf seinem Platz, als ob er immer bereit für den Dienst wäre.","n":2},{"w":"Schlafzimmer","art":"das","ipa":"/ˈʃlaːfˌt͡sɪmɐ/","m":"bedroom, bedchamber","f":"Schlafzimmer","s":"Dann öffnete sie die Tür zum Schlafzimmer und rief laut in das Dunkel: »Sehen Sie nur mal an, es ist krepiert; da liegt es, ganz und gar krepiert!«","n":2},{"w":"Rock","art":"der","ipa":"/ʁɔk/","m":"skirt; jacket; dress; rock","f":"Rock","s":"Er wollte zur Schwester kriechen und an ihrem Rock ziehen.","n":2},{"w":"loswerden","art":"","ipa":"/ˈloːsˌveːɐ̯dn̩/","m":"to get rid of; to get off one's chest; to lose","f":"loszuwerden","s":"Ich sage nur: Wir müssen versuchen, es loszuwerden.","n":2},{"w":"Wut","art":"die","ipa":"/vuːt/","m":"rage; fury; outrage; anger; ecstasy; frenzy","f":"Wut","s":"Dann wieder war er voller Wut, weil sich niemand um ihn kümmerte.","n":2},{"w":"meistens","art":"","ipa":"/ˈmaɪ̯stn̩s/","m":"mostly; most often, usually, normally","f":"Meistens","s":"Meistens hatte er es nicht gegessen.","n":2},{"w":"Schulter","art":"die","ipa":"/ˈʃʊltɐ/","m":"shoulder","f":"Schultern","s":"Die Schwester zuckte nur mit den Schultern.","n":2},{"w":"Sessel","art":"der","ipa":"/ˈzɛsəl/","m":"armchair, easy chair; chair","f":"Sessel","s":"Nach dem Abendessen schlief der Vater im Sessel ein.","n":3},{"w":"Dunkles","art":"das","ipa":"/ˈdʊŋkləs/","m":"dark","f":"Dunkeln","s":"Gregor lag dann im Dunkeln, wo ihn niemand sah.","n":3},{"w":"zahlen","art":"","ipa":"/ˈtsaːln̩/","m":"to pay; to pay, to atone; to pay out","f":"zahle","s":"Ich zahle natürlich nichts.","n":1},{"w":"bisher","art":"","ipa":"/bɪsˈheːɐ̯/","m":"so far, until now, as yet","f":"bisher","s":"Eher wunderte er sich, dass er sich bisher mit diesen dünnen Beinchen bewegt hatte.","n":1},{"w":"hübsch","art":"","ipa":"/hʏpʃ/","m":"pretty, handsome; lovely, nice; great","f":"hübsche","s":"Plötzlich sahen Herr und Frau Samsa fast gleichzeitig, wie schön ihre Tochter geworden war, eine junge, hübsche Frau.","n":1},{"w":"Tasche","art":"die","ipa":"/ˈtaʃə/","m":"bag; pocket","f":"Taschen","s":"Dort standen sie mit den Händen in den Taschen ihrer alten Röcke um Gregors Leiche herum.","n":1},{"w":"seltsam","art":"","ipa":"/ˈzɛltˌzaːm/","m":"strange, weird, odd, funny, curious","f":"seltsam","s":"Das sah natürlich seltsam aus.","n":1},{"w":"Sonne","art":"die","ipa":"/ˈzɔnə/","m":"a sun; sunshine, sunlight","f":"Sonne","s":"Die Straßenbahn war voll von warmer Sonne, und sie waren allein darin.","n":1},{"w":"nämlich","art":"","ipa":"/ˈnɛːmlɪç/","m":"very same, selfsame","f":"nämlich","s":"Die Familie hatte nämlich ein Zimmer an drei Herren vermietet.","n":1},{"w":"ewig","art":"","ipa":"/ˈeːvɪç/","m":"eternal, everlasting; constant, frequent","f":"ewige","s":"Wenn man so schwer arbeiten muss wie wir, kann man diese ewige Qual zu Hause nicht ertragen.","n":1},{"w":"Bank","art":"die","ipa":"/baŋk/","m":"bench; pew; workbench; bank; substitutes' bench","f":"Bank","s":"Deshalb schrieben sie drei Entschuldigungsbriefe: Herr Samsa an seine Bank, Frau Samsa an ihren Auftraggeber und Grete an ihren Chef.","n":1},{"w":"Geheimnis","art":"das","ipa":"/ɡəˈhaɪmnɪs/","m":"secret; mystery","f":"Geheimnis","s":"Dann wollte er ihr sein Geheimnis erzählen: dass er sie aufs Konservatorium schicken wollte.","n":1},{"w":"stecken","art":"","ipa":"/ˈʃtɛkən/","m":"causative of stecken when intransitive, to stick","f":"stecken","s":"So blieb er im Fleisch stecken.","n":1},{"w":"miteinander","art":"","ipa":"/ˌmɪt.(ʔ)aɪ̯ˈnan.dɐ/","m":"together; with each other","f":"miteinander","s":"Aber bald gingen sie zum Fenster und sprachen leise miteinander.","n":1}]]},"verwandlung":{"title":"Die Verwandlung","chapters":["Titelseite","Erstes Kapitel","Zweites Kapitel","Drittes Kapitel"],"lists":[[],[{"w":"Chef","art":"der","ipa":"[ʃɛf]","m":"boss, chief","f":"Chef","s":"Das sollte ich bei meinem Chef versuchen; ich würde auf der Stelle hinausfliegen.","n":12},{"w":"Rücken","art":"der","ipa":"/ˈʁʏkn̩/","m":"back; back pain, especially chronic back pain","f":"Rücken","s":"Er lag auf seinem panzerartig harten Rücken und sah, wenn er den Kopf ein wenig hob, seinen gewölbten, braunen, von bogenförmigen Versteifungen geteilten Bauch, auf dessen Höhe sich die Bettdecke, zum gänzlichen Niedergleiten bereit, kaum noch erhalten konnte.","n":8},{"w":"öffnen","art":"","ipa":"/ˈœfnən/","m":"to open; to open, get, or answer the door","f":"geöffnet","s":"Im übrigen wird auch bis dahin jemand aus dem Geschäft kommen, um nach mir zu fragen, denn das Geschäft wird vor sieben Uhr geöffnet.«","n":9},{"w":"Bein","art":"das","ipa":"/baɪ̯n/","m":"leg of a person, animal, or object; bone","f":"Beine","s":"Seine vielen, im Vergleich zu seinem sonstigen Umfang kläglich dünnen Beine flimmerten ihm hilflos vor den Augen.","n":13},{"w":"scheinen","art":"","ipa":"/ˈʃaɪnən/","m":"to shine; to gleam; to seem; to appear; to look","f":"schien","s":"Der Rücken schien hart zu sein; dem würde wohl bei dem Fall auf den Teppich nichts geschehen.","n":7},{"w":"aufstehen","art":"","ipa":"/ˈʔaufˌʃteːən/","m":"to get up; to rise up, to rebel; to rest","f":"Aufstehen","s":"»Dies frühzeitige Aufstehen«, dachte er, »macht einen ganz blödsinnig.","n":7},{"w":"Nebenzimmer","art":"das","ipa":"[ˈneːbn̩ˌt͡sɪmɐ]","m":"neighbouring room, adjacent room","f":"Nebenzimmer","s":"»Da drin ist etwas gefallen,« sagte der Prokurist im Nebenzimmer links.","n":8},{"w":"übrigens","art":"","ipa":"/ˈyːbʁɪɡəns/","m":"apart from that, else, for the rest, for everything else","f":"übrigens","s":"Wer weiß übrigens, ob das nicht sehr gut für mich wäre.","n":6},{"w":"hängen","art":"","ipa":"/ˈhɛŋən/","m":"to hang, to be suspended; to be attached to","f":"hing","s":"Über dem Tisch, auf dem eine auseinandergepackte Musterkollektion von Tuchwaren ausgebreitet war – Samsa war Reisender –, hing das Bild, das er vor kurzem aus einer illustrierten Zeitschrift ausgeschnitten und in einem hübschen, vergoldeten Rahmen untergebra…","n":6},{"w":"merken","art":"","ipa":"/ˈmɛʁkŋ̍/","m":"to notice, to sense, to be able to tell","f":"merken","s":"Infolge der Holztür war die Veränderung in Gregors Stimme draußen wohl nicht zu merken, denn die Mutter beruhigte sich mit dieser Erklärung und schlürfte davon.","n":6},{"w":"Prokurist","art":"der","ipa":"/pʁokuˈʁɪst/","m":"legally authorized business representative or agent","f":"Prokurist","s":"Gregor brauchte nur das erste Grußwort des Besuchers zu hören und wußte schon, wer es war – der Prokurist selbst.","n":43},{"w":"Schmerz","art":"der","ipa":"/ʃmɛʁts/","m":"physical pain, ache; physical pain","f":"Schmerz","s":"Er versuchte es wohl hundertmal, schloß die Augen, um die zappelnden Beine nicht sehen zu müssen, und ließ erst ab, als er in der Seite einen noch nie gefühlten, leichten, dumpfen Schmerz zu fühlen begann.","n":5},{"w":"Zeitung","art":"die","ipa":"/ˈt͡saɪ̯tʊŋ/","m":"newspaper; tidings, news","f":"Zeitung","s":"Da sitzt er bei uns am Tisch und liest still die Zeitung oder studiert Fahrpläne.","n":5},{"w":"Stock","art":"der","ipa":"/ʃtɔk/","m":"stick; stick, staff; floor, storey, level","f":"Stock","s":"Leider schien nun auch diese Flucht des Prokuristen den Vater, der bisher verhältnismäßig gefaßt gewesen war, völlig zu verwirren, denn statt selbst dem Prokuristen nachzulaufen oder wenigstens Gregor in der Verfolgung nicht zu hindern, packte er mit der Rec…","n":5},{"w":"augenblicklich","art":"","ipa":"","m":"immediate; present","f":"augenblicklich","s":"Zuerst wollte er mit dem unteren Teil seines Körpers aus dem Bett hinauskommen, aber dieser untere Teil, den er übrigens noch nicht gesehen hatte und von dem er sich auch keine rechte Vorstellung machen konnte, erwies sich als zu schwer beweglich; es ging so…","n":6},{"w":"Arm","art":"der","ipa":"/arm/","m":"an arm; a sleeve; an arm of a creek or a river","f":"Arme","s":"Er hätte Arme und Hände gebraucht, um sich aufzurichten; statt dessen aber hatte er nur die vielen Beinchen, die ununterbrochen in der verschiedensten Bewegung waren und die er überdies nicht beherrschen konnte.","n":4},{"w":"Zug","art":"der","ipa":"/t͡suːk/","m":"train; platoon; pull; draught; drag, draught","f":"Zug","s":"Vorläufig allerdings muß ich aufstehen, denn mein Zug fährt um fünf.«","n":4},{"w":"schlagen","art":"","ipa":"/ˈʃlaːɡŋ̩/","m":"to beat; to hit; to knock; to strike; to punch","f":"schlug","s":"Als er dies alles in größter Eile überlegte, ohne sich entschließen zu können, das Bett zu verlassen – gerade schlug der Wecker dreiviertel sieben – klopfte es vorsichtig an die Tür am Kopfende seines Bettes.","n":4},{"w":"Kraft","art":"die","ipa":"/kʁaft/","m":"power, force, strength; force; worker, employee","f":"Kraft","s":"Mit welcher Kraft er sich auch auf die rechte Seite warf, immer wieder schaukelte er in die Rückenlage zurück.","n":4},{"w":"drehen","art":"","ipa":"/ˈdʁeː(ə)n/","m":"to turn; to turn, turn around","f":"drehte","s":"Er versuchte es daher, zuerst den Oberkörper aus dem Bett zu bekommen, und drehte vorsichtig den Kopf dem Bettrand zu.","n":4},{"w":"schließlich","art":"","ipa":"/ˈʃliːslɪç/","m":"in the end, finally, eventually; after all","f":"schließlich","s":"Zuerst wollte er mit dem unteren Teil seines Körpers aus dem Bett hinauskommen, aber dieser untere Teil, den er übrigens noch nicht gesehen hatte und von dem er sich auch keine rechte Vorstellung machen konnte, erwies sich als zu schwer beweglich; es ging so…","n":4},{"w":"Schloss","art":"das","ipa":"/ʃlɔs/","m":"lock, padlock; lock; castle","f":"Schloß","s":"Dann aber machte er sich daran, mit dem Mund den Schlüssel im Schloß umzudrehen.","n":4},{"w":"Erklärung","art":"die","ipa":"[ʔɛɐ̯ˈklɛːʁʊŋ]","m":"explanation; declaration, statement","f":"Erklärung","s":"Infolge der Holztür war die Veränderung in Gregors Stimme draußen wohl nicht zu merken, denn die Mutter beruhigte sich mit dieser Erklärung und schlürfte davon.","n":4},{"w":"drücken","art":"","ipa":"/ˈdʁʏkən/","m":"to press, to push; to squeeze; to hug","f":"drückte","s":"Je nach dem Fortschreiten der Drehung des Schlüssels umtanzte er das Schloß, hielt sich jetzt nur noch mit dem Munde aufrecht, und je nach Bedarf hing er sich an den Schlüssel oder drückte ihn dann wieder nieder mit der ganzen Last seines Körpers.","n":4},{"w":"anziehen","art":"","ipa":"/ˈantsiːən/","m":"to get dressed; to dress; to put on","f":"anziehen","s":"Zunächst wollte er ruhig und ungestört aufstehen, sich anziehen und vor allem frühstücken, und dann erst das Weitere überlegen, denn, das merkte er wohl, im Bett würde er mit dem Nachdenken zu keinem vernünftigen Ende kommen.","n":4},{"w":"vernünftig","art":"","ipa":"/fɛɐ̯ˈnʏnftɪç/","m":"reasonable, sensible","f":"vernünftigen","s":"Zunächst wollte er ruhig und ungestört aufstehen, sich anziehen und vor allem frühstücken, und dann erst das Weitere überlegen, denn, das merkte er wohl, im Bett würde er mit dem Nachdenken zu keinem vernünftigen Ende kommen.","n":4},{"w":"nieder","art":"","ipa":"/ˈniː.dɐ/","m":"low; mean; menial","f":"nieder","s":"Je nach dem Fortschreiten der Drehung des Schlüssels umtanzte er das Schloß, hielt sich jetzt nur noch mit dem Munde aufrecht, und je nach Bedarf hing er sich an den Schlüssel oder drückte ihn dann wieder nieder mit der ganzen Last seines Körpers.","n":4},{"w":"Teppich","art":"der","ipa":"/ˈtɛpɪç/","m":"rug, carpet; tapestry; slick","f":"Teppich","s":"Der Rücken schien hart zu sein; dem würde wohl bei dem Fall auf den Teppich nichts geschehen.","n":5},{"w":"Vorzimmer","art":"das","ipa":"/ˈfoːɐ̯ˌt͡sɪmɐ/","m":"entrance hall; hall, hallway, corridor","f":"Vorzimmer","s":"rief der Vater durch das Vorzimmer in die Küche und klatschte in die Hände, »sofort einen Schlosser holen!«","n":6},{"w":"Weiser","art":"der","ipa":"/ˈvaɪ̯zɐ/","m":"sage","f":"Weise","s":"Aber als er den Kopf endlich außerhalb des Bettes in der freien Luft hielt, bekam er Angst, weiter auf diese Weise vorzurücken, denn wenn er sich schließlich so fallen ließ, mußte geradezu ein Wunder geschehen wenn der Kopf nicht verletzt werden sollte.","n":5},{"w":"Reisender","art":"der","ipa":"[ˈʁaɪ̯zn̩dɐ]","m":"tourist; traveller, voyager","f":"Reisender","s":"Über dem Tisch, auf dem eine auseinandergepackte Musterkollektion von Tuchwaren ausgebreitet war – Samsa war Reisender –, hing das Bild, das er vor kurzem aus einer illustrierten Zeitschrift ausgeschnitten und in einem hübschen, vergoldeten Rahmen untergebra…","n":5},{"w":"infolge","art":"","ipa":"","m":"because of, due to, owing to","f":"Infolge","s":"Infolge der Holztür war die Veränderung in Gregors Stimme draußen wohl nicht zu merken, denn die Mutter beruhigte sich mit dieser Erklärung und schlürfte davon.","n":5},{"w":"offen","art":"","ipa":"/ˈɔfən/","m":"open; frank, candid; honest, sincere","f":"offen","s":"Man hörte gar nicht die Türe zuschlagen; sie hatten sie wohl offen gelassen, wie es in Wohnungen zu sein pflegt, in denen ein großes Unglück geschehen ist.","n":3},{"w":"Reise","art":"die","ipa":"/ˈʁaɪ̯zə/","m":"journey, travel; trip","f":"Reisen","s":"Gregor aber dachte gar nicht daran aufzumachen, sondern lobte die vom Reisen her übernommene Vorsicht, auch zu Hause alle Türen während der Nacht zu versperren.","n":3},{"w":"links","art":"","ipa":"/lɪŋks/","m":"on the left; to the left; inside out","f":"links","s":"»Da drin ist etwas gefallen,« sagte der Prokurist im Nebenzimmer links.","n":3},{"w":"antworten","art":"","ipa":"/ˈantvɔʁtn̩/","m":"to answer, to reply","f":"antworten","s":"Gregor hatte ausführlich antworten und alles erklären wollen, beschränkte sich aber bei diesen Umständen darauf, zu sagen: »Ja, ja, danke, Mutter, ich stehe schon auf.«","n":3},{"w":"Hoffnung","art":"die","ipa":"/ˈhɔfnʊŋ/","m":"hope, the belief or expectation that something wished for can or will really happen.","f":"Hoffnung","s":"Nun, die Hoffnung ist noch nicht gänzlich aufgegeben, habe ich einmal das Geld beisammen, um die Schuld der Eltern an ihn abzuzahlen – es dürfte noch fünf bis sechs Jahre dauern –, mache ich die Sache unbedingt.","n":3},{"w":"Möglichkeit","art":"die","ipa":"/ˈmøːklɪçˌkaɪ̯t/","m":"possibility, likelihood; option, choice","f":"Möglichkeit","s":"Aber als er wieder nach gleicher Mühe aufseufzend so dalag wie früher, und wieder seine Beinchen womöglich noch ärger gegeneinander kämpfen sah und keine Möglichkeit fand, in diese Willkür Ruhe und Ordnung zu bringen, sagte er sich wieder, daß er unmöglich i…","n":3},{"w":"statt","art":"","ipa":"/ʃtat/","m":"instead of","f":"statt","s":"Er hätte Arme und Hände gebraucht, um sich aufzurichten; statt dessen aber hatte er nur die vielen Beinchen, die ununterbrochen in der verschiedensten Bewegung waren und die er überdies nicht beherrschen konnte.","n":3},{"w":"Schritt","art":"der","ipa":"[ʃʁɪtʰ]","m":"step, footstep; walk; crotch; a pace","f":"Schrittes","s":"Aber dann ging natürlich wie immer das Dienstmädchen festen Schrittes zur Tür und öffnete.","n":3},{"w":"beginnen","art":"","ipa":"/bəˈɡɪnən/","m":"to begin; to commence; to be started","f":"begann","s":"Er versuchte es wohl hundertmal, schloß die Augen, um die zappelnden Beine nicht sehen zu müssen, und ließ erst ab, als er in der Seite einen noch nie gefühlten, leichten, dumpfen Schmerz zu fühlen begann.","n":3},{"w":"schwierig","art":"","ipa":"/ˈʃviːrɪç/","m":"difficult, hard, challenging, tough","f":"schwierig","s":"Aber weiterhin wurde es schwierig, besonders weil er so ungemein breit war.","n":3},{"w":"nah","art":"","ipa":"/naː/","m":"near, close, nearby","f":"näher","s":"Er fühlte ein leichtes Jucken oben auf dem Bauch; schob sich auf dem Rücken langsam näher zum Bettpfosten, um den Kopf besser heben zu können; fand die juckende Stelle, die mit lauter kleinen weißen Pünktchen besetzt war, die er nicht zu beurteilen verstand;…","n":3},{"w":"leise","art":"","ipa":"/ˈlaɪ.zə/","m":"quiet, soft, low; slight, faint, light","f":"leise","s":"An der anderen Seitentür aber klagte leise die Schwester: »Gregor?","n":3},{"w":"schreien","art":"","ipa":"/ˈʃʁaɪ̯ən/","m":"to shout; to yell; to cry; to scream; to howl","f":"schrie","s":"schrie sie dann.","n":3},{"w":"Frühstück","art":"das","ipa":"/ˈfʁyːʃtʏk/","m":"breakfast","f":"Frühstück","s":"Wenn ich zum Beispiel im Laufe des Vormittags ins Gasthaus zurückgehe, um die erlangten Aufträge zu überschreiben, sitzen diese Herren erst beim Frühstück.","n":3},{"w":"weinen","art":"","ipa":"/ˈvaɪ̯nən/","m":"to weep, cry","f":"weinte","s":"Und warum weinte sie denn?","n":3},{"w":"verlangen","art":"","ipa":"/fɛʁˈlaŋən/","m":"to ask for, demand","f":"verlangt","s":"Augenblicklich lag er wohl da auf dem Teppich, und niemand, der seinen Zustand gekannt hätte, hätte im Ernst von ihm verlangt, daß er den Prokuristen hereinlasse.","n":3},{"w":"außerhalb","art":"","ipa":"/ˈaʊ̯sɐhalp/","m":"outside, beyond; outside","f":"außerhalb","s":"Aber als er den Kopf endlich außerhalb des Bettes in der freien Luft hielt, bekam er Angst, weiter auf diese Weise vorzurücken, denn wenn er sich schließlich so fallen ließ, mußte geradezu ein Wunder geschehen wenn der Kopf nicht verletzt werden sollte.","n":3},{"w":"desto","art":"","ipa":"/ˈdɛstoː/","m":"the","f":"desto","s":"Nun, ruhig hatte er ja nicht geschlafen, aber wahrscheinlich desto fester.","n":3}],[{"w":"allerdings","art":"","ipa":"/ˈʔalɐdɪŋs/","m":"but, however; indeed!","f":"allerdings","s":"Nun mußte die Schwester im Verein mit der Mutter auch kochen; allerdings machte das nicht viel Mühe, denn man aß fast nichts.","n":8},{"w":"Wand","art":"die","ipa":"/vant/","m":"wall, partition","f":"Wände","s":"Während des Tages wollte Gregor schon aus Rücksicht auf seine Eltern sich nicht beim Fenster zeigen, kriechen konnte er aber auf den paar Quadratmetern des Fußbodens auch nicht viel, das ruhige Liegen ertrug er schon während der Nacht schwer, das Essen macht…","n":9},{"w":"irgendein","art":"","ipa":"/ˈɪrɡəntˌaɪ̯n/","m":"some; any","f":"irgendeiner","s":"Auf diese Weise bekam nun Gregor täglich sein Essen, einmal am Morgen, wenn die Eltern und das Dienstmädchen noch schliefen, das zweitemal nach dem allgemeinen Mittagessen, denn dann schliefen die Eltern gleichfalls noch ein Weilchen, und das Dienstmädchen w…","n":8},{"w":"gewiss","art":"","ipa":"/ɡəˈvɪs/","m":"certain","f":"gewiß","s":"Er wäre gewiß nicht viel später auch ohne Störung erwacht, denn er fühlte sich genügend ausgeruht und ausgeschlafen, doch schien es ihm, als hätte ihn ein flüchtiger Schritt und ein vorsichtiges Schließen der zum Vorzimmer führenden Tür geweckt.","n":8},{"w":"Möbel","art":"das","ipa":"/ˈmøːbəl/","m":"piece of furniture; furniture","f":"Möbel","s":"Der Schein der elektrischen Straßenbahn lag bleich hier und da auf der Zimmerdecke und auf den höheren Teilen der Möbel, aber unten bei Gregor war es finster.","n":13},{"w":"Anblick","art":"der","ipa":"/ˈʔanblɪk/","m":"view, sight, look","f":"Anblick","s":"Denn tatsächlich sah er von Tag zu Tag die auch nur ein wenig entfernten Dinge immer undeutlicher; das gegenüberliegende Krankenhaus, dessen nur allzu häufigen Anblick er früher verflucht hatte, bekam er überhaupt nicht mehr zu Gesicht, und wenn er nicht gen…","n":7},{"w":"vollständig","art":"","ipa":"/ˈfɔlˌʃtɛndɪç/","m":"complete; entire","f":"vollständig","s":"Aber das hohe freie Zimmer, in dem er gezwungen war, flach auf dem Boden zu liegen, ängstigte ihn, ohne daß er die Ursache herausfinden konnte, denn es war ja sein seit fünf Jahren von ihm bewohntes Zimmer – und mit einer halb unbewußten Wendung und nicht oh…","n":7},{"w":"kriechen","art":"","ipa":"/ˈkʁiːçn̩/","m":"to creep; to crawl","f":"kroch","s":"Aber bald zog er ihn enttäuscht wieder zurück; nicht nur, daß ihm das Essen wegen seiner heiklen linken Seite Schwierigkeiten machte – und er konnte nur essen, wenn der ganze Körper schnaufend mitarbeitete –, so schmeckte ihm überdies die Milch, die sonst se…","n":7},{"w":"Kaste","art":"die","ipa":"/ˈkastə/","m":"caste","f":"Kasten","s":"Die Schwester nun bemerkte sofort die neue Unterhaltung, die Gregor für sich gefunden hatte – er hinterließ ja auch beim Kriechen hie und da Spuren seines Klebstoffes –, und da setzte sie es sich in den Kopf, Gregor das Kriechen in größtem Ausmaße zu ermögli…","n":8},{"w":"Kanapee","art":"das","ipa":"/ˈkanapeː/","m":"canapé; hors d'oeuvre; sofa; couch","f":"Kanapee","s":"Aber das hohe freie Zimmer, in dem er gezwungen war, flach auf dem Boden zu liegen, ängstigte ihn, ohne daß er die Ursache herausfinden konnte, denn es war ja sein seit fünf Jahren von ihm bewohntes Zimmer – und mit einer halb unbewußten Wendung und nicht oh…","n":18},{"w":"Leintuch","art":"das","ipa":"/ˈlaɪ̯nˌtuːx/","m":"bed sheet","f":"Leintuch","s":"Um ihr auch diesen Anblick zu ersparen, trug er eines Tages auf seinem Rücken – er brauchte zu dieser Arbeit vier Stunden – das Leintuch auf das Kanapee und ordnete es in einer solchen Weise an, daß er nun gänzlich verdeckt war, und daß die Schwester, selbst…","n":8},{"w":"Lauf","art":"der","ipa":"/laʊ̯f/","m":"run, race; leg of certain animals; barrel","f":"Laufe","s":"Ein Beinchen war übrigens im Laufe der vormittägigen Vorfälle schwer verletzt worden – es war fast ein Wunder, daß nur eines verletzt worden war – und schleppte leblos nach.","n":5},{"w":"Blick","art":"der","ipa":"[blɪk]","m":"glance, look; view","f":"Blick","s":"Wäre dieses Leintuch ihrer Meinung nach nicht nötig gewesen, dann hätte sie es ja entfernen können, denn daß es nicht zum Vergnügen Gregors gehören konnte, sich so ganz und gar abzusperren, war doch klar genug, aber sie ließ das Leintuch, so wie es war, und …","n":5},{"w":"offenbar","art":"","ipa":"/ˈɔfn̩baːɐ̯/","m":"apparent","f":"offenbar","s":"Früh, als die Türen versperrt waren, hatten alle zu ihm hereinkommen wollen, jetzt, da er die eine Tür geöffnet hatte und die anderen offenbar während des Tages geöffnet worden waren, kam keiner mehr, und die Schlüssel steckten nun auch von außen.","n":5},{"w":"Milch","art":"die","ipa":"/mɪlç/","m":"milk; white semen of a male fish","f":"Milch","s":"Denn dort stand ein Napf mit süßer Milch gefüllt, in der kleine Schnitte von Weißbrot schwammen.","n":5},{"w":"bemerken","art":"","ipa":"/bəˈmɛʁkən/","m":"to notice, to perceive","f":"bemerkte","s":"Sie fand ihn nicht gleich, aber als sie ihn unter dem Kanapee bemerkte – Gott, er mußte doch irgendwo sein, er hatte doch nicht wegfliegen können – erschrak sie so sehr, daß sie, ohne sich beherrschen zu können, die Tür von außen wieder zuschlug.","n":6},{"w":"Weile","art":"die","ipa":"/ˈvaɪ̯lə/","m":"while","f":"Weilchen","s":"Auf diese Weise bekam nun Gregor täglich sein Essen, einmal am Morgen, wenn die Eltern und das Dienstmädchen noch schliefen, das zweitemal nach dem allgemeinen Mittagessen, denn dann schliefen die Eltern gleichfalls noch ein Weilchen, und das Dienstmädchen w…","n":4},{"w":"Fuß","art":"der","ipa":"/fuːs/","m":"foot; footing; pedestal; metrical foot","f":"Füßen","s":"Täte sie es nicht von selbst, er wollte lieber verhungern, als sie darauf aufmerksam machen, trotzdem es ihn eigentlich ungeheuer drängte, unterm Kanapee vorzuschießen, sich der Schwester zu Füßen zu werfen und sie um irgend etwas Gutes zum Essen zu bitten.","n":4},{"w":"werfen","art":"","ipa":"/ˈvɛrfən/","m":"to throw; to cast; to project; to give birth","f":"werfen","s":"Täte sie es nicht von selbst, er wollte lieber verhungern, als sie darauf aufmerksam machen, trotzdem es ihn eigentlich ungeheuer drängte, unterm Kanapee vorzuschießen, sich der Schwester zu Füßen zu werfen und sie um irgend etwas Gutes zum Essen zu bitten.","n":4},{"w":"leer","art":"","ipa":"/leːɐ̯/","m":"empty","f":"leeren","s":"Ihr scheine das Gegenteil der Fall zu sein; ihr bedrücke der Anblick der leeren Wand geradezu das Herz; und warum solle nicht auch Gregor diese Empfindung haben, da er doch an die Zimmermöbel längst gewöhnt sei und sich deshalb im leeren Zimmer verlassen füh…","n":4},{"w":"Zustand","art":"der","ipa":"/ˈt͡suːˌʃtant/","m":"condition; state; state pattern","f":"Zustand","s":"Dort blieb er die ganze Nacht, die er zum Teil im Halbschlaf, aus dem ihn der Hunger immer wieder aufschreckte, verbrachte, zum Teil aber in Sorgen und undeutlichen Hoffnungen, die aber alle zu dem Schlusse führten, daß er sich vorläufig ruhig verhalten und …","n":4},{"w":"Schreibtisch","art":"der","ipa":"/ˈʃʁaɪ̯pˌtɪʃ/","m":"desk, cabinet","f":"Schreibtisch","s":"Die Schwester nun bemerkte sofort die neue Unterhaltung, die Gregor für sich gefunden hatte – er hinterließ ja auch beim Kriechen hie und da Spuren seines Klebstoffes –, und da setzte sie es sich in den Kopf, Gregor das Kriechen in größtem Ausmaße zu ermögli…","n":5},{"w":"besondere","art":"","ipa":"","m":"special, particular, extraordinary","f":"besonderem","s":"Und so hatte er damals mit ganz besonderem Feuer zu arbeiten angefangen und war fast über Nacht aus einem kleinen Kommis ein Reisender geworden, der natürlich ganz andere Möglichkeiten des Geldverdienens hatte, und dessen Arbeitserfolge sich sofort in Form d…","n":5},{"w":"aufmerksam","art":"","ipa":"[ˈaʊ̯fˌmɛʁkzaːm]","m":"attentive, alert, observant","f":"aufmerksam","s":"Täte sie es nicht von selbst, er wollte lieber verhungern, als sie darauf aufmerksam machen, trotzdem es ihn eigentlich ungeheuer drängte, unterm Kanapee vorzuschießen, sich der Schwester zu Füßen zu werfen und sie um irgend etwas Gutes zum Essen zu bitten.","n":5},{"w":"erschrecken","art":"","ipa":"/ɛʁˈʃʁɛkən/","m":"to be frightened; to be startled; to frighten","f":"erschrak","s":"Sie fand ihn nicht gleich, aber als sie ihn unter dem Kanapee bemerkte – Gott, er mußte doch irgendwo sein, er hatte doch nicht wegfliegen können – erschrak sie so sehr, daß sie, ohne sich beherrschen zu können, die Tür von außen wieder zuschlug.","n":5},{"w":"Apfel","art":"der","ipa":"/ˈapfəl/","m":"apple; apple tree; breasts","f":"Apfel","s":"Es war ein Apfel; gleich flog ihm ein zweiter nach; Gregor blieb vor Schrecken stehen; ein Weiterlaufen war nutzlos, denn der Vater hatte sich entschlossen, ihn zu bombardieren.","n":5},{"w":"legen","art":"","ipa":"/ˈleːɡən/","m":"causative of liegen: to lay; to lie down","f":"legte","s":"Schon im Laufe des ersten Tages legte der Vater die ganzen Vermögensverhältnisse und Aussichten sowohl der Mutter als auch der Schwester dar.","n":3},{"w":"Hunger","art":"der","ipa":"/ˈhʊŋɐ/","m":"hunger","f":"Hunger","s":"Fast hätte er vor Freude gelacht, denn er hatte noch größeren Hunger als am Morgen, und gleich tauchte er seinen Kopf fast bis über die Augen in die Milch hinein.","n":3},{"w":"diesmal","art":"","ipa":"","m":"this time","f":"diesmal","s":"Nun aber warteten oft beide, der Vater und die Mutter, vor Gregors Zimmer, während die Schwester dort aufräumte, und kaum war sie herausgekommen, mußte sie ganz genau erzählen, wie es in dem Zimmer aussah, was Gregor gegessen hatte, wie er sich diesmal benom…","n":3},{"w":"entfernt","art":"","ipa":"","m":"distant; away","f":"entfernten","s":"Spät erst in der Nacht wurde das Licht im Wohnzimmer ausgelöscht, und nun war leicht festzustellen, daß die Eltern und die Schwester so lange wachgeblieben waren, denn wie man genau hören konnte, entfernten sich jetzt alle drei auf den Fußspitzen.","n":3},{"w":"gegenüber","art":"","ipa":"[ɡeːɡŋ̍ˈʔyːbɐ]","m":"opposite; to, toward, towards; compared to","f":"gegenüber","s":"Eigentlich hätte er ja mit diesen überschüssigen Geldern die Schuld des Vaters gegenüber dem Chef weiter abgetragen haben können, und jener Tag, an dem er diesen Posten hätte loswerden können, wäre weit näher gewesen, aber jetzt war es zweifellos besser so, …","n":3},{"w":"Zeichen","art":"das","ipa":"/ˈt͡saɪ̯çən/","m":"sign, token; signal; sign, indication; character","f":"Zeichen","s":"Er war schon längst mit allem fertig und lag nur noch faul auf der gleichen Stelle, als die Schwester zum Zeichen, daß er sich zurückziehen solle, langsam den Schlüssel umdrehte.","n":3},{"w":"herein","art":"","ipa":"[hɛˈʁaɪ̯n]","m":"in","f":"herein","s":"Nun kam gewiß bis zum Morgen niemand mehr zu Gregor herein; er hatte also eine lange Zeit, um ungestört zu überlegen, wie er sein Leben jetzt neu ordnen sollte.","n":3},{"w":"übrig","art":"","ipa":"/ˈyːbʁɪç/","m":"rest of, remaining; left, left over; spare","f":"übrig","s":"Nun war sie aber nicht imstande, dies allein zu tun; den Vater wagte sie nicht um Hilfe zu bitten; das Dienstmädchen hätte ihr ganz gewiß nicht geholfen, denn dieses etwa sechzehnjährige Mädchen harrte zwar tapfer seit Entlassung der früheren Köchin aus, hat…","n":3},{"w":"Freude","art":"die","ipa":"/ˈfʁɔɪ̯də/","m":"joy, delight, glee","f":"Freude","s":"Fast hätte er vor Freude gelacht, denn er hatte noch größeren Hunger als am Morgen, und gleich tauchte er seinen Kopf fast bis über die Augen in die Milch hinein.","n":3},{"w":"verdienen","art":"","ipa":"/fɛɐ̯ˈdiːnən/","m":"to make money, to earn; to deserve","f":"verdienen","s":"Es war also bloß eine Summe, die man eigentlich nicht angreifen durfte, und die für den Notfall zurückgelegt werden mußte; das Geld zum Leben aber mußte man verdienen.","n":3},{"w":"Gespräch","art":"das","ipa":"/ɡəˈʃpʁɛːç/","m":"conversation, chat, talk","f":"Gespräch","s":"Besonders in der ersten Zeit gab es kein Gespräch, das nicht irgendwie wenn auch nur im geheimen, von ihm handelte.","n":3},{"w":"leiden","art":"","ipa":"/ˈlaɪ̯dən/","m":"to suffer, to experience pain, sorrow, etc.","f":"litten","s":"Gewiß wollten auch sie nicht, daß Gregor verhungere, aber vielleicht hätten sie es nicht ertragen können, von seinem Essen mehr als durch Hörensagen zu erfahren, vielleicht wollte die Schwester ihnen auch eine möglicherweise nur kleine Trauer ersparen, denn …","n":3},{"w":"treten","art":"","ipa":"[ˈtʰʁ̥eːtn̩]","m":"to step, to walk; to appear; to step; to tread","f":"trat","s":"Aber als bereue sie ihr Benehmen, öffnete sie die Tür sofort wieder und trat, als sei sie bei einem Schwerkranken oder gar bei einem Fremden, auf den Fußspitzen herein.","n":3},{"w":"Flasche","art":"die","ipa":"/ˈflaʃə/","m":"bottle; flask; flagon; loser; wimp","f":"Fläschchen","s":"Sie lief ins Nebenzimmer, um irgendeine Essenz zu holen, mit der sie die Mutter aus ihrer Ohnmacht wecken könnte; Gregor wollte auch helfen – zur Rettung des Bildes war noch Zeit –; er klebte aber fest an dem Glas und mußte sich mit Gewalt losreißen; er lief…","n":3},{"w":"Gewalt","art":"die","ipa":"/ɡəˈvalt/","m":"strong or violent force; violence; authority","f":"Gewalt","s":"Später aber mußte man sie mit Gewalt zurückhalten, und wenn sie dann rief: »Laßt mich doch zu Gregor, er ist ja mein unglücklicher Sohn!","n":3},{"w":"atmen","art":"","ipa":"/ˈaːtmən/","m":"to breathe","f":"atmen","s":"Aber es kostete ihn große Selbstüberwindung, auch nur die kurze Zeit, während welcher die Schwester im Zimmer war, unter dem Kanapee zu bleiben, denn von dem reichlichen Essen hatte sich sein Leib ein wenig gerundet, und er konnte dort in der Enge kaum atmen.","n":3},{"w":"verhindern","art":"","ipa":"/fɛɐ̯ˈhɪndɐn/","m":"to prevent, to inhibit, to keep from happening.","f":"verhinderte","s":"Es wäre für Gregor nicht unerwartet gewesen, wenn sie nicht eingetreten wäre, da er sie durch seine Stellung verhinderte, sofort das Fenster zu öffnen, aber sie trat nicht nur nicht ein, sie fuhr sogar zurück und schloß die Tür; ein Fremder hätte geradezu de…","n":3},{"w":"immerhin","art":"","ipa":"[ˈɪmɐˈhɪn]","m":"after all; at least, anyway, on the bright side","f":"immerhin","s":"Gregor hörte nun, wie die zwei schwachen Frauen den immerhin schweren alten Kasten von seinem Platze rückten, und wie die Schwester immerfort den größten Teil der Arbeit für sich beanspruchte, ohne auf die Warnungen der Mutter zu hören, welche fürchtete, daß…","n":3},{"w":"Absicht","art":"die","ipa":"/ˈapzɪçt/","m":"intention; intent","f":"Absichten","s":"Sie räumten ihm sein Zimmer aus; nahmen ihm alles, was ihm lieb war; den Kasten, in dem die Laubsäge und andere Werkzeuge lagen, hatten sie schon hinausgetragen; lockerten jetzt den schon im Boden fest eingegrabenen Schreibtisch, an dem er als Handelsakademi…","n":3},{"w":"ertragen","art":"","ipa":"/ɛʁˈtʁaːɡən/","m":"to bear, to stand, to endure, to take, to suffer, to tolerate, to handle","f":"ertragen","s":"Gewiß wollten auch sie nicht, daß Gregor verhungere, aber vielleicht hätten sie es nicht ertragen können, von seinem Essen mehr als durch Hörensagen zu erfahren, vielleicht wollte die Schwester ihnen auch eine möglicherweise nur kleine Trauer ersparen, denn …","n":3},{"w":"beobachten","art":"","ipa":"/bəˈoːbaxtən/","m":"to watch, to observe","f":"beobachtete","s":"Gregor hatte den Kopf bis knapp zum Rande des Kanapees vorgeschoben und beobachtete sie.","n":3},{"w":"Rock","art":"der","ipa":"/ʁɔk/","m":"skirt; jacket; dress; rock","f":"Rockes","s":"Nun aber war er doch gut aufgerichtet; in eine straffe blaue Uniform mit Goldknöpfen gekleidet, wie sie Diener der Bankinstitute tragen; über dem hohen steifen Kragen des Rockes entwickelte sich sein starkes Doppelkinn; unter den buschigen Augenbrauen drang …","n":3},{"w":"öfter","art":"","ipa":"[ˈʔœftɐ]","m":"ofttimes, from time to time","f":"Öfters","s":"Öfters fragte die Schwester den Vater, ob er Bier haben wolle, und herzlich erbot sie sich, es selbst zu holen, und als der Vater schwieg, sagte sie, um ihm jedes Bedenken zu nehmen, sie könne auch die Hausmeisterin darum schicken, aber dann sagte der Vater …","n":3},{"w":"Brot","art":"das","ipa":"/bʁoːt/","m":"bread; loaf of bread; slice of bread; sandwich","f":"Brot","s":"Da war altes halbverfaultes Gemüse; Knochen vom Nachtmahl her, die von festgewordener weißer Sauce umgeben waren; ein paar Rosinen und Mandeln; ein Käse, den Gregor vor zwei Tagen für ungenießbar erklärt hatte; ein trockenes Brot, ein mit Butter beschmiertes…","n":3}],[{"w":"Küche","art":"die","ipa":"/ˈkʏçə/","m":"kitchen; cuisine","f":"Küche","s":"Diese ernsten Herren, – alle drei hatten Vollbärte, wie Gregor einmal durch eine Türspalte feststellte – waren peinlich auf Ordnung, nicht nur in ihrem Zimmer, sondern, da sie sich nun einmal hier eingemietet hatten, in der ganzen Wirtschaft, also insbesonde…","n":7},{"w":"mittel","art":"","ipa":"/ˈmɪtəl/","m":"middle, in the middle; average, middling; mid","f":"mittlere","s":"Die Zimmerherren hatten schon ihr Nachtmahl beendet, der mittlere hatte eine Zeitung hervorgezogen, den zwei anderen je ein Blatt gegeben, und nun lasen sie zurückgelehnt und rauchten.","n":7},{"w":"Sessel","art":"der","ipa":"/ˈzɛsəl/","m":"armchair, easy chair; chair","f":"Sessel","s":"Der Vater schlief bald nach dem Nachtessen in seinem Sessel ein; die Mutter und Schwester ermahnten einander zur Stille; die Mutter nähte, weit über das Licht vorgebeugt, feine Wäsche für ein Modengeschäft; die Schwester, die eine Stellung als Verkäuferin an…","n":14},{"w":"stören","art":"","ipa":"/ʃtøːɐ̯n/","m":"to disturb, to interfere, to bother","f":"stören","s":"Hätte man doch dieser Bedienerin, statt sie nach ihrer Laune ihn nutzlos stören zu lassen, lieber den Befehl gegeben, sein Zimmer täglich zu reinigen!","n":6},{"w":"Wohnzimmer","art":"das","ipa":"/ˈvoːnˌt͡sɪmɐ/","m":"living room","f":"Wohnzimmer","s":"Und wenn nun auch Gregor durch seine Wunde an Beweglichkeit wahrscheinlich für immer verloren hatte und vorläufig zur Durchquerung seines Zimmers wie ein alter Invalide lange, lange Minuten brauchte – an das Kriechen in der Höhe war nicht zu denken –, so bek…","n":7},{"w":"erheben","art":"","ipa":"[ʔɛʁˈheːbn̩]","m":"to raise, lift; to levy, charge; to bring","f":"erhob","s":"Und auf die beiden Frauen gestützt, erhob er sich, umständlich, als sei er für sich selbst die größte Last, ließ sich von den Frauen bis zur Türe führen, winkte ihnen dort ab und ging nun selbständig weiter, während die Mutter ihr Nähzeug, die Schwester ihre…","n":7},{"w":"Bedienerin","art":"die","ipa":"[bəˈdiːnəʁɪn]","m":"a female assistent; a female help","f":"Bedienerin","s":"Der Haushalt wurde immer mehr eingeschränkt; das Dienstmädchen wurde nun doch entlassen; eine riesige knochige Bedienerin mit weißem, den Kopf umflatterndem Haar kam des Morgens und des Abends, um die schwerste Arbeit zu leisten; alles andere besorgte die Mu…","n":21},{"w":"gänzlich","art":"","ipa":"/ˈɡɛntslɪç/","m":"completely, totally, altogether; fully","f":"gänzlich","s":"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgülti…","n":7},{"w":"Violine","art":"die","ipa":"/vi̯oˈliːnə/","m":"violin","f":"Violine","s":"Gerade an diesem Abend – Gregor erinnerte sich nicht, während der ganzen Zeit die Violine gehört zu haben – ertönte sie von der Küche her.","n":7},{"w":"schließen","art":"","ipa":"[ˈʃliːsn̩]","m":"to shut; to close; to shut down; to lock; to end","f":"geschlossen","s":"Da mochten Mutter und Schwester mit kleinen Ermahnungen noch so sehr auf ihn eindringen, viertelstundenlang schüttelte er langsam den Kopf, hielt die Augen geschlossen und stand nicht auf.","n":5},{"w":"ehe","art":"","ipa":"/ˈʔeːə/","m":"before, ere; rather than","f":"ehe","s":"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgülti…","n":4},{"w":"traurig","art":"","ipa":"/ˈtʁaʊ̯.ʁɪç/","m":"sad","f":"traurigen","s":"Die schwere Verwundung Gregors, an der er über einen Monat litt – der Apfel blieb, da ihn niemand zu entfernen wagte, als sichtbares Andenken im Fleische sitzen –, schien selbst den Vater daran erinnert zu haben, daß Gregor trotz seiner gegenwärtigen traurig…","n":4},{"w":"erkennen","art":"","ipa":"/ɛɐ̯ˈkɛnən/","m":"to recognize, perceive","f":"erkannt","s":"Seine gute Absicht schien erkannt worden zu sein; es war nur ein augenblicklicher Schrecken gewesen.","n":4},{"w":"zufällig","art":"","ipa":"/ˈt͡suːfɛlɪç/","m":"random, by chance or stochastic","f":"zufällig","s":"Ohne irgendwie neugierig zu sein, hatte sie zufällig einmal die Tür von Gregors Zimmer aufgemacht und war im Anblick Gregors, der, gänzlich überrascht, trotzdem ihn niemand jagte, hin- und herzulaufen begann, die Hände im Schoß gefaltet staunend stehen gebli…","n":4},{"w":"lächeln","art":"","ipa":"/ˈlɛçəln/","m":"to smile","f":"lächeln","s":"Er war befriedigt, und Mutter und Schwester, die gespannt zugesehen hatten, begannen aufatmend zu lächeln.","n":4},{"w":"Schlafzimmer","art":"das","ipa":"/ˈʃlaːfˌt͡sɪmɐ/","m":"bedroom, bedchamber","f":"Schlafzimmer","s":"Denn kaum hatte am Abend die Schwester die Veränderung in Gregors Zimmer bemerkt, als sie, aufs höchste beleidigt, ins Wohnzimmer lief und, trotz der beschwörend erhobenen Hände der Mutter, in einen Weinkrampf ausbrach, dem die Eltern – der Vater war natürli…","n":4},{"w":"solch","art":"","ipa":"/zɔlç/","m":"such","f":"solcher","s":"Man hatte sich angewöhnt, Dinge, die man anderswo nicht unterbringen konnte, in dieses Zimmer hineinzustellen, und solcher Dinge gab es nun viele, da man ein Zimmer der Wohnung an drei Zimmerherren vermietet hatte.","n":4},{"w":"heben","art":"","ipa":"/ˈheːbən/","m":"to lift; to raise; to heave; to hoist; to rise","f":"hob","s":"Die Bedienerin aber, statt sich zu fürchten, hob bloß einen in der Nähe der Tür befindlichen Stuhl hoch empor, und wie sie mit groß geöffnetem Munde dastand, war ihre Absicht klar, den Mund erst zu schließen, wenn der Sessel in ihrer Hand auf Gregors Rücken …","n":5},{"w":"ergreifen","art":"","ipa":"/ɛʁˈɡʁaɪfən/","m":"to seize, capture; to take up","f":"ergriffen","s":"Aber in dem Eigensinn, der ihn, seitdem er Diener war, ergriffen hatte, bestand er immer darauf, noch länger bei Tisch zu bleiben, trotzdem er regelmäßig einschlief, und war dann überdies nur mit der größten Mühe zu bewegen, den Sessel mit dem Bett zu vertau…","n":5},{"w":"trotzen","art":"","ipa":"","m":"to defy, to brave","f":"trotz","s":"Die schwere Verwundung Gregors, an der er über einen Monat litt – der Apfel blieb, da ihn niemand zu entfernen wagte, als sichtbares Andenken im Fleische sitzen –, schien selbst den Vater daran erinnert zu haben, daß Gregor trotz seiner gegenwärtigen traurig…","n":5},{"w":"müde","art":"","ipa":"/ˈmyːdə/","m":"tired; tired of it, tired of","f":"müde","s":"Freilich waren es nicht mehr die lebhaften Unterhaltungen der früheren Zeiten, an die Gregor in den kleinen Hotelzimmern stets mit einigem Verlangen gedacht hatte, wenn er sich müde in das feuchte Bettzeug hatte werfen müssen.","n":3},{"w":"Schlaf","art":"der","ipa":"/ʃlaːf/","m":"sleep; temple","f":"Schlaf","s":"Sobald die Uhr zehn schlug, suchte die Mutter durch leise Zusprache den Vater zu wecken und dann zu überreden, ins Bett zu gehen, denn hier war es doch kein richtiger Schlaf und diesen hatte der Vater, der um sechs Uhr seinen Dienst antreten mußte, äußerst n…","n":3},{"w":"Hals","art":"der","ipa":"/hals/","m":"neck; throat","f":"Hals","s":"Nach dieser Erklärung würde die Schwester in Tränen der Rührung ausbrechen, und Gregor würde sich bis zu ihrer Achsel erheben und ihren Hals küssen, den sie, seitdem sie ins Geschäft ging, frei ohne Band oder Kragen trug.","n":3},{"w":"beenden","art":"","ipa":"[bəˈʔɛndn̩]","m":"to finish, to complete, to end; to terminate","f":"beendet","s":"Die Zimmerherren hatten schon ihr Nachtmahl beendet, der mittlere hatte eine Zeitung hervorgezogen, den zwei anderen je ein Blatt gegeben, und nun lasen sie zurückgelehnt und rauchten.","n":3},{"w":"Fleisch","art":"das","ipa":"/flaɪ̯ʃ/","m":"flesh; meat; pulp","f":"Fleische","s":"Die schwere Verwundung Gregors, an der er über einen Monat litt – der Apfel blieb, da ihn niemand zu entfernen wagte, als sichtbares Andenken im Fleische sitzen –, schien selbst den Vater daran erinnert zu haben, daß Gregor trotz seiner gegenwärtigen traurig…","n":3},{"w":"Tier","art":"das","ipa":"/tiːr/","m":"animal; hind","f":"Tier","s":"War er ein Tier, da ihn Musik so ergriff?","n":3},{"w":"seitdem","art":"","ipa":"","m":"since, ever since; since that","f":"seitdem","s":"Aber in dem Eigensinn, der ihn, seitdem er Diener war, ergriffen hatte, bestand er immer darauf, noch länger bei Tisch zu bleiben, trotzdem er regelmäßig einschlief, und war dann überdies nur mit der größten Mühe zu bewegen, den Sessel mit dem Bett zu vertau…","n":3},{"w":"schwach","art":"","ipa":"/ˈʃvax/","m":"weak, lacking in strength; weak","f":"schwächer","s":"Er hatte zwar Schmerzen im ganzen Leib, aber ihm war, als würden sie allmählich schwächer und schwächer und würden schließlich ganz vergehen.","n":3},{"w":"hinein","art":"","ipa":"[hɪˈnaɪ̯n]","m":"in","f":"hinein","s":"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgülti…","n":3},{"w":"schweigen","art":"","ipa":"/ˈʃvaɪ̯ɡən/","m":"to be silent; to keep quiet; to stop talking","f":"schwieg","s":"Er schwieg und sah gerade vor sich hin, als erwarte er etwas.","n":3},{"w":"Dunkel","art":"das","ipa":"/ˈdʊŋkl̩/","m":"dark, darkness","f":"Dunkel","s":"Und wenn nun auch Gregor durch seine Wunde an Beweglichkeit wahrscheinlich für immer verloren hatte und vorläufig zur Durchquerung seines Zimmers wie ein alter Invalide lange, lange Minuten brauchte – an das Kriechen in der Höhe war nicht zu denken –, so bek…","n":3},{"w":"einander","art":"","ipa":"/aɪ̯ˈnandɐ/","m":"Reciprocal pronoun of all three plural persons: each other","f":"einander","s":"Der Vater schlief bald nach dem Nachtessen in seinem Sessel ein; die Mutter und Schwester ermahnten einander zur Stille; die Mutter nähte, weit über das Licht vorgebeugt, feine Wäsche für ein Modengeschäft; die Schwester, die eine Stellung als Verkäuferin an…","n":3},{"w":"loswerden","art":"","ipa":"/ˈloːsˌveːɐ̯dn̩/","m":"to get rid of; to get off one's chest; to lose","f":"loszuwerden","s":"Ich will vor diesem Untier nicht den Namen meines Bruders aussprechen und sage daher bloß: wir müssen versuchen es loszuwerden.","n":3},{"w":"gleichzeitig","art":"","ipa":"[ˈɡlaɪ̯çˌtsaɪ̯tɪç]","m":"simultaneous, concurrent, coincident, concomitant","f":"gleichzeitig","s":"Er wollte sie nicht mehr aus seinem Zimmer lassen, wenigstens nicht, solange er lebte; seine Schreckgestalt sollte ihm zum erstenmal nützlich werden; an allen Türen seines Zimmers wollte er gleichzeitig sein und den Angreifern entgegenfauchen; die Schwester …","n":3},{"w":"stets","art":"","ipa":"/ʃteːts/","m":"always; constantly; the whole time; every time","f":"stets","s":"Freilich waren es nicht mehr die lebhaften Unterhaltungen der früheren Zeiten, an die Gregor in den kleinen Hotelzimmern stets mit einigem Verlangen gedacht hatte, wenn er sich müde in das feuchte Bettzeug hatte werfen müssen.","n":4},{"w":"erscheinen","art":"","ipa":"/ɛɐ̯ˈʃaɪ̯nən/","m":"to appear; to come out, be released","f":"erschienen","s":"Manchmal dachte er daran, beim nächsten Öffnen der Tür die Angelegenheiten der Familie ganz so wie früher wieder in die Hand zu nehmen; in seinen Gedanken erschienen wieder nach langer Zeit der Chef und der Prokurist, die Kommis und die Lehrjungen, der so be…","n":4},{"w":"umdrehen","art":"","ipa":"/ˈʔʊmdʁeːən/","m":"to twist, to turn, to turn around","f":"umdrehte","s":"fragte sie, als Gregor sich wieder umdrehte, und stellte den Sessel ruhig in die Ecke zurück.","n":4},{"w":"heftig","art":"","ipa":"/ˈhɛftɪç/","m":"fierce, heavy, vehement, severe, violent","f":"heftiger","s":"Einmal am frühen Morgen – ein heftiger Regen, vielleicht schon ein Zeichen des kommenden Frühjahrs, schlug an die Scheiben – war Gregor, als die Bedienerin mit ihren Redensarten wieder begann, derartig erbittert, daß er, wie zum Angriff, allerdings langsam u…","n":4},{"w":"aufrecht","art":"","ipa":"/ˈaʊ̯fˌʁɛçt/","m":"upright, erect, tall; unbowed, brave, resolute","f":"aufrecht","s":"Der Vater schien durch die Worte der Schwester auf bestimmtere Gedanken gebracht zu sein, hatte sich aufrecht gesetzt, spielte mit seiner Dienermütze zwischen den Tellern, die noch vom Nachtmahl der Zimmerherren her auf dem Tische standen, und sah bisweilen …","n":4},{"w":"drängen","art":"","ipa":"/ˈdʁɛŋən/","m":"to push, press; to push, press, to throng, crowd","f":"drängen","s":"Er eilte zu ihnen und suchte sie mit ausgebreiteten Armen in ihr Zimmer zu drängen und gleichzeitig mit seinem Körper ihnen den Ausblick auf Gregor zu nehmen.","n":4},{"w":"Schüssel","art":"die","ipa":"/ˈʃʏsəl/","m":"bowl, platter; basin; car; dish","f":"Schüssel","s":"Sofort erschien in der Tür die Mutter mit einer Schüssel Fleisch und knapp hinter ihr die Schwester mit einer Schüssel hochgeschichteter Kartoffeln.","n":4},{"w":"Rücksicht","art":"die","ipa":"/ˈʁʏkzɪçt/","m":"consideration","f":"Rücksicht","s":"Aber Gregor sah wohl ein, daß es nicht nur die Rücksicht auf ihn war, welche eine Übersiedlung verhinderte, denn ihn hätte man doch in einer passenden Kiste mit ein paar Luftlöchern leicht transportieren können; was die Familie hauptsächlich vom Wohnungswech…","n":4},{"w":"Besen","art":"der","ipa":"/ˈbeː.zn̩/","m":"broom","f":"Besens","s":"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgülti…","n":4},{"w":"allgemein","art":"","ipa":"/ˌalɡəˈmaɪ̯n/","m":"general, universal","f":"allgemeiner","s":"Und wenn nun auch Gregor durch seine Wunde an Beweglichkeit wahrscheinlich für immer verloren hatte und vorläufig zur Durchquerung seines Zimmers wie ein alter Invalide lange, lange Minuten brauchte – an das Kriechen in der Höhe war nicht zu denken –, so bek…","n":4},{"w":"eilen","art":"","ipa":"[ˈaɪ̯lən]","m":"to hurry, to rush; to hurry, to hasten, to rush","f":"eilte","s":"Er eilte zu ihnen und suchte sie mit ausgebreiteten Armen in ihr Zimmer zu drängen und gleichzeitig mit seinem Körper ihnen den Ausblick auf Gregor zu nehmen.","n":4},{"w":"Speise","art":"die","ipa":"/ˈʃpaɪ̯zə/","m":"meal, fare","f":"Speise","s":"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgülti…","n":4},{"w":"derartig","art":"","ipa":"","m":"such, suchlike","f":"derartige","s":"In der ersten Zeit stellte sich Gregor bei der Ankunft der Schwester in derartige besonders bezeichnende Winkel, um ihr durch diese Stellung gewissermaßen einen Vorwurf zu machen.","n":4},{"w":"Anfang","art":"der","ipa":"/ˈʔanfaŋ/","m":"start, beginning, origin","f":"Anfangs","s":"Anfangs rief sie ihn auch zu sich herbei, mit Worten, die sie wahrscheinlich für freundlich hielt, wie »Komm mal herüber, alter Mistkäfer!«","n":2},{"w":"klein","art":"","ipa":"/klaɪ̯n/","m":"small, little, wee; small, little, young","f":"kleinsten","s":"Und dabei hätte er gerade jetzt mehr Grund gehabt, sich zu verstecken, denn infolge des Staubes, der in seinem Zimmer überall lag und bei der kleinsten Bewegung umherflog, war auch er ganz staubbedeckt; Fäden, Haare, Speiseüberreste schleppte er auf seinem R…","n":2},{"w":"herum","art":"","ipa":"/hɛɐ̯ˈʁʊm/","m":"about, around.","f":"herum","s":"Und dabei hätte er gerade jetzt mehr Grund gehabt, sich zu verstecken, denn infolge des Staubes, der in seinem Zimmer überall lag und bei der kleinsten Bewegung umherflog, war auch er ganz staubbedeckt; Fäden, Haare, Speiseüberreste schleppte er auf seinem R…","n":2}]]},"strafkolonie":{"title":"In der Strafkolonie","chapters":["Titelseite","In der Strafkolonie"],"lists":[[],[{"w":"legen","art":"","ipa":"/ˈleːɡən/","m":"causative of liegen: to lay; to lie down","f":"gelegt","s":"Hier auf das Bett wird der Verurteilte gelegt.","n":8},{"w":"Dame","art":"die","ipa":"/ˈdaːmə/","m":"lady; madam; queen; king; Dame; draughts","f":"Damen","s":"Die Damen des Kommandanten stopfen dem Mann, ehe er abgeführt wird, den Hals mit Zuckersachen voll.","n":9},{"w":"tief","art":"","ipa":"/tiːf/","m":"deep; deep, profound; low","f":"tiefen","s":"Wenigstens war hier in dem tiefen, sandigen, von kahlen Abhängen ringsum abgeschlossenen kleinen Tal ausser dem Offizier und dem Reisenden nur der Verurteilte, ein stumpfsinniger, breitmäuliger Mensch mit verwahrlostem Haar und Gesicht und ein Soldat zugegen…","n":8},{"w":"Blick","art":"der","ipa":"[blɪk]","m":"glance, look; view","f":"Blick","s":"In der Strafkolonie »Es ist ein eigentümlicher Apparat,« sagte der Offizier zu dem Forschungsreisenden und überblickte mit einem gewissermassen bewundernden Blick den ihm doch wohlbekannten Apparat.","n":10},{"w":"allerdings","art":"","ipa":"/ˈʔalɐdɪŋs/","m":"but, however; indeed!","f":"allerdings","s":"Das Verdienst der Erfindung allerdings gebührt ihm ganz allein.","n":14},{"w":"beginnen","art":"","ipa":"/bəˈɡɪnən/","m":"to begin; to commence; to be started","f":"beginnen","s":"Aber die Zeit vergeht, die Exekution sollte schon beginnen, und ich bin mit der Erklärung des Apparates noch nicht fertig.«","n":9},{"w":"werfen","art":"","ipa":"/ˈvɛrfən/","m":"to throw; to cast; to project; to give birth","f":"warf","s":"Er sass nun am Rande einer Grube, in die er einen flüchtigen Blick warf.","n":8},{"w":"schreien","art":"","ipa":"/ˈʃʁaɪ̯ən/","m":"to shout; to yell; to cry; to scream; to howl","f":"schrie","s":"schrie der Offizier, denn er merkte, dass der Reisende durch den Verurteilten allzusehr abgelenkt wurde.","n":9},{"w":"fassen","art":"","ipa":"/ˈfasn̩/","m":"to gird, to surround, to confine into a form","f":"fasste","s":"»Dieser Apparat,« sagte er und fasste eine Kurbelstange, auf die er sich stützte, »ist eine Erfindung unseres früheren Kommandanten.","n":16},{"w":"Maschine","art":"die","ipa":"/maˈʃiːnə/","m":"machine; engine; airplane; motorcycle","f":"Maschine","s":"Der Reisende hatte das Ohr zum Offizier geneigt und sah, die Hände in den Rocktaschen, der Arbeit der Maschine zu.","n":25},{"w":"Soldat","art":"der","ipa":"/zɔlˈdaːt/","m":"soldier","f":"Soldaten","s":"Der Reisende schien nur aus Höflichkeit der Einladung des Kommandanten gefolgt zu sein, der ihn aufgefordert hatte, der Exekution eines Soldaten beizuwohnen, der wegen Ungehorsam und Beleidigung des Vorgesetzten verurteilt worden war.","n":52},{"w":"scheinen","art":"","ipa":"/ˈʃaɪnən/","m":"to shine; to gleam; to seem; to appear; to look","f":"schien","s":"Der Reisende schien nur aus Höflichkeit der Einladung des Kommandanten gefolgt zu sein, der ihn aufgefordert hatte, der Exekution eines Soldaten beizuwohnen, der wegen Ungehorsam und Beleidigung des Vorgesetzten verurteilt worden war.","n":11},{"w":"Erklärung","art":"die","ipa":"[ʔɛɐ̯ˈklɛːʁʊŋ]","m":"explanation; declaration, statement","f":"Erklärungen","s":"Um so auffallender war es allerdings, dass der Verurteilte sich dennoch bemühte, den Erklärungen des Offiziers zu folgen.","n":14},{"w":"merken","art":"","ipa":"/ˈmɛʁkŋ̍/","m":"to notice, to sense, to be able to tell","f":"merkt","s":"Ein Nichteingeweihter merkt äusserlich keinen Unterschied in den Strafen.","n":8},{"w":"irgendein","art":"","ipa":"/ˈɪrɡəntˌaɪ̯n/","m":"some; any","f":"irgendeine","s":"Niemand konnte irgendeine Eigennützigkeit des Reisenden annehmen, denn der Verurteilte war ihm fremd, kein Landsmann und ein zum Mitleid gar nicht auffordernder Mensch.","n":8},{"w":"Offizier","art":"der","ipa":"/ɔfiˈtsiːr/","m":"commissioned officer","f":"Offizier","s":"In der Strafkolonie »Es ist ein eigentümlicher Apparat,« sagte der Offizier zu dem Forschungsreisenden und überblickte mit einem gewissermassen bewundernden Blick den ihm doch wohlbekannten Apparat.","n":101},{"w":"Urteil","art":"das","ipa":"/ˈʊʁtaɪ̯l/","m":"judgment, verdict, sentence","f":"Urteils","s":"Dieser Egge aber ist die eigentliche Ausführung des Urteils überlassen.«","n":16},{"w":"schließlich","art":"","ipa":"/ˈʃliːslɪç/","m":"in the end, finally, eventually; after all","f":"schliesslich","s":"fragte er schliesslich, zog aus einem Haufen von Rohrstühlen einen hervor und bot ihn dem Reisenden an; dieser konnte nicht ablehnen.","n":7},{"w":"nah","art":"","ipa":"/naː/","m":"near, close, nearby","f":"nähere","s":"»Nein,« sagte der Offizier wieder, stockte dann einen Augenblick, als verlange er vom Reisenden eine nähere Begründung seiner Frage, und sagte dann: »Es wäre nutzlos, es ihm zu verkünden.","n":7},{"w":"offenbar","art":"","ipa":"/ˈɔfn̩baːɐ̯/","m":"apparent","f":"offenbar","s":"Aber die Bewegungen seiner wulstig aneinander gedrückten Lippen zeigten offenbar, dass er nichts verstehen konnte.","n":7},{"w":"lächeln","art":"","ipa":"/ˈlɛçəln/","m":"to smile","f":"lächelnd","s":"»Ja gewiss,« sagte der Offizier lächelnd, »befühlen Sie es selbst.«","n":7},{"w":"Kommandant","art":"der","ipa":"/kɔmanˈdant/","m":"commander","f":"Kommandanten","s":"Der Reisende schien nur aus Höflichkeit der Einladung des Kommandanten gefolgt zu sein, der ihn aufgefordert hatte, der Exekution eines Soldaten beizuwohnen, der wegen Ungehorsam und Beleidigung des Vorgesetzten verurteilt worden war.","n":56},{"w":"gewiss","art":"","ipa":"/ɡəˈvɪs/","m":"certain","f":"Gewiss","s":"»Gewiss,« sagte der Offizier und wusch sich die von Öl und Fett beschmutzten Hände in einem bereitstehenden Wasserkübel, »aber sie bedeuten die Heimat; wir wollen nicht die Heimat verlieren.","n":12},{"w":"Kette","art":"die","ipa":"/ˈkɛtə/","m":"chain; necklace, bracelet, anklet; chain, series","f":"Kette","s":"Wenigstens war hier in dem tiefen, sandigen, von kahlen Abhängen ringsum abgeschlossenen kleinen Tal ausser dem Offizier und dem Reisenden nur der Verurteilte, ein stumpfsinniger, breitmäuliger Mensch mit verwahrlostem Haar und Gesicht und ein Soldat zugegen…","n":10},{"w":"Fahrrad","art":"das","ipa":"/ˈfaːrˌra(ː)t/","m":"bicycle","f":"Rad","s":"Er sprang auf die Leiter, drehte ein Rad, rief hinunter: »Achtung, treten Sie zur Seite!«","n":9},{"w":"heben","art":"","ipa":"/ˈheːbən/","m":"to lift; to raise; to heave; to hoist; to rise","f":"hob","s":"Dieser hob mit einem Ruck die Augen, sah, was der Verurteilte gewagt hatte, liess das Gewehr fallen, stemmte die Füsse mit den Absätzen in den Boden, riss den Verurteilten zurück, dass er gleich niederfiel, und sah dann auf ihn hinunter, wie er sich wand und…","n":9},{"w":"Verfahren","art":"das","ipa":"[fɛɐ̯ˈfaːʁən]","m":"procedure, process; proceedings","f":"Verfahren","s":"Ausserdem aber setzte er einige Hoffnung auf den neuen Kommandanten, der offenbar, allerdings langsam, ein neues Verfahren einzuführen beabsichtigte, das dem beschränkten Kopf dieses Offiziers nicht eingehen konnte.","n":21},{"w":"Apparat","art":"der","ipa":"/apaˈʁaːt/","m":"apparatus, device, machine; apparat, apparatus","f":"Apparat","s":"In der Strafkolonie »Es ist ein eigentümlicher Apparat,« sagte der Offizier zu dem Forschungsreisenden und überblickte mit einem gewissermassen bewundernden Blick den ihm doch wohlbekannten Apparat.","n":27},{"w":"Blatt","art":"das","ipa":"/blat/","m":"leaf; petal; sheet; hand, cards","f":"Blätter","s":"Hier sind sie,« – er zog einige Blätter aus der Ledermappe – »ich kann sie Ihnen aber leider nicht in die Hand geben, sie sind das Teuerste, was ich habe.","n":8},{"w":"Nadel","art":"die","ipa":"/ˈnaːdəl/","m":"needle; hook; pin","f":"Nadeln","s":"Die Nadeln sind eggenartig angeordnet, auch wird das Ganze wie eine Egge geführt, wenn auch bloss auf einem Platz und viel kunstgemässer.","n":10},{"w":"hinunter","art":"","ipa":"/hɪˈnʊntɐ/","m":"down, downwards","f":"hinunter","s":"rief er endlich und stieg von der Leiter hinunter.","n":9},{"w":"Anhänger","art":"der","ipa":"/ˈanˌhɛŋɐ/","m":"follower, fan; trailer; pendant; henchman","f":"Anhänger","s":"Das waren Arbeiten, die man eigentlich einem Maschinisten hätte überlassen können, aber der Offizier führte sie mit einem grossen Eifer aus, sei es, dass er ein besonderer Anhänger dieses Apparates war, sei es, dass man aus anderen Gründen die Arbeit sonst n…","n":8},{"w":"verurteilen","art":"","ipa":"/fərˈu(ː)rˌtaɪ̯lən/","m":"to convict, condemn, sentence","f":"verurteilt","s":"Der Reisende schien nur aus Höflichkeit der Einladung des Kommandanten gefolgt zu sein, der ihn aufgefordert hatte, der Exekution eines Soldaten beizuwohnen, der wegen Ungehorsam und Beleidigung des Vorgesetzten verurteilt worden war.","n":71},{"w":"Schrift","art":"die","ipa":"/ʃʁɪft/","m":"writing, script; script; hand, handwriting; font","f":"Schrift","s":"Die lange schreibt nämlich, und die kurze spritzt Wasser aus, um das Blut abzuwaschen und die Schrift immer klar zu erhalten.","n":8},{"w":"Kolonie","art":"die","ipa":"/koloˈniː/","m":"colony; colony, community","f":"Kolonie","s":"Wir, seine Freunde, wussten schon bei seinem Tod, dass die Einrichtung der Kolonie so in sich geschlossen ist, dass sein Nachfolger, und habe er tausend neue Pläne im Kopf, wenigstens während vieler Jahre nichts von dem Alten wird ändern können.","n":8},{"w":"Grube","art":"die","ipa":"/ˈɡʁuːbə/","m":"pit, excavation; mine","f":"Grube","s":"Er sass nun am Rande einer Grube, in die er einen flüchtigen Blick warf.","n":16},{"w":"beugen","art":"","ipa":"/ˈbɔʏ̯ɡən/","m":"to bend something, to bow something; to bend","f":"beugte","s":"fragte der Reisende und beugte sich vor.","n":13},{"w":"Exekution","art":"die","ipa":"[ɛksekuˈt͡si̯oːn]","m":"execution; foreclosure","f":"Exekution","s":"Der Reisende schien nur aus Höflichkeit der Einladung des Kommandanten gefolgt zu sein, der ihn aufgefordert hatte, der Exekution eines Soldaten beizuwohnen, der wegen Ungehorsam und Beleidigung des Vorgesetzten verurteilt worden war.","n":24},{"w":"Riemen","art":"der","ipa":"/ˈʁiːmən/","m":"strap; belt; oar","f":"Riemen","s":"Auf diese Watte wird der Verurteilte bäuchlings gelegt, natürlich nackt; hier sind für die Hände, hier für die Füsse, hier für den Hals Riemen, um ihn festzuschnallen.","n":13},{"w":"Reisender","art":"der","ipa":"[ˈʁaɪ̯zn̩dɐ]","m":"tourist; traveller, voyager","f":"Reisende","s":"Der Reisende schien nur aus Höflichkeit der Einladung des Kommandanten gefolgt zu sein, der ihn aufgefordert hatte, der Exekution eines Soldaten beizuwohnen, der wegen Ungehorsam und Beleidigung des Vorgesetzten verurteilt worden war.","n":120},{"w":"Zeichner","art":"der","ipa":"/ˈt͡saɪ̯çnɐ/","m":"drawer; underwriter","f":"Zeichner","s":"Der untere heisst das Bett, der obere heisst der Zeichner, und hier der mittlere, schwebende Teil heisst die Egge.«","n":21},{"w":"offen","art":"","ipa":"/ˈɔfən/","m":"open; frank, candid; honest, sincere","f":"offenem","s":"Er war ungemein ermattet, atmete mit weit offenem Mund und hatte zwei zarte Damentaschentücher hinter den Uniformkragen gezwängt.","n":6},{"w":"Arm","art":"der","ipa":"/arm/","m":"an arm; a sleeve; an arm of a creek or a river","f":"Arm","s":"Der Offizier erkannte, dass er in Gefahr war, in der Erklärung des Apparates für lange Zeit aufgehalten zu werden; er ging daher zum Reisenden, hing sich in seinen Arm, zeigte mit der Hand auf den Verurteilten, der sich jetzt, da die Aufmerksamkeit so offenb…","n":6},{"w":"übrig","art":"","ipa":"/ˈyːbʁɪç/","m":"rest of, remaining; left, left over; spare","f":"übrige","s":"Es müssen also viele, viele Zieraten die eigentliche Schrift umgeben; die wirkliche Schrift umzieht den Leib nur in einem schmalen Gürtel; der übrige Körper ist für Verzierungen bestimmt.","n":6},{"w":"drehen","art":"","ipa":"/ˈdʁeː(ə)n/","m":"to turn; to turn, turn around","f":"drehte","s":"Er sprang auf die Leiter, drehte ein Rad, rief hinunter: »Achtung, treten Sie zur Seite!«","n":6},{"w":"steigen","art":"","ipa":"/ˈʃtaɪ̯ɡən/","m":"to ascend, to climb, to rise; to rise","f":"stieg","s":"Der Reisende hatte wenig Sinn für den Appa
