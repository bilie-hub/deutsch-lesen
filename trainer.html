rat und ging hinter dem Verurteilten fast sichtbar unbeteiligt auf und ab, während der Offizier die letzten Vorbereitungen besorgte, bald unter den tief in die Erde eingebauten Apparat kroch, bald auf eine Leiter sti…","n":6},{"w":"Gang","art":"der","ipa":"/ɡaŋ/","m":"motion, movement, progress, way, going; course","f":"Gang","s":"Der Apparat soll ja zwölf Stunden ununterbrochen im Gang sein.","n":6},{"w":"verlangen","art":"","ipa":"/fɛʁˈlaŋən/","m":"to ask for, demand","f":"verlangte","s":"Der Reisende machte eine ungewisse Handbewegung; der Offizier verlangte nichts Besseres, denn nun konnte er selbst den Apparat erklären.","n":6},{"w":"Hemd","art":"das","ipa":"/hɛmt/","m":"shirt; dress shirt","f":"Hemd","s":"Er bückte sich ein wenig und verfolgte die schwankenden Nadeln, als ihm der Soldat, auf ein Zeichen des Offiziers, mit einem Messer hinten Hemd und Hose durchschnitt, so dass sie von dem Verurteilten abfielen; er wollte nach dem fallenden Zeug greifen, um se…","n":6},{"w":"Einladung","art":"die","ipa":"[ˈaɪ̯nˌlaːdʊŋ]","m":"invitation","f":"Einladung","s":"Der Reisende schien nur aus Höflichkeit der Einladung des Kommandanten gefolgt zu sein, der ihn aufgefordert hatte, der Exekution eines Soldaten beizuwohnen, der wegen Ungehorsam und Beleidigung des Vorgesetzten verurteilt worden war.","n":6}]]},"elixiere":{"title":"Die Elixiere des Teufels","chapters":["Titelseiten","Einleitung","Vorwort","Erster Teil · 1. Abschnitt","Erster Teil · 2. Abschnitt","Erster Teil · 3. Abschnitt","Erster Teil · 4. Abschnitt","Zweiter Teil · 1. Abschnitt","Zweiter Teil · 2. Abschnitt","Zweiter Teil · 3. Abschnitt"],"lists":[[],[],[],[{"w":"wunderbar","art":"","ipa":"/ˈvʊndəʁˌbaːʁ/","m":"wonderful","f":"wunderbare","s":"— So ist es mir, als hätte ich selbst einmal in der öden Kirche die wunderbare Gestalt eines ernsten Mannes gesehen, und es sei eben der fremde Maler gewesen, der in uralter Zeit, als eben die Kirche gebaut, erschien, dessen Sprache niemand verstehen konnte …","n":17},{"w":"Seele","art":"die","ipa":"/ˈzeːlə/","m":"soul; mind, spirit; human being, soul; bore","f":"Seele","s":"Jedes ihrer Worte blieb tief in meiner Seele zurück, noch den ganzen Tag über, wenn ich sie gesprochen, befand ich mich in wunderbarer feierlicher Stimmung und ihre Gestalt begleitete mich auf den Spaziergängen, die ich dann besuchte.","n":20},{"w":"tief","art":"","ipa":"/tiːf/","m":"deep; deep, profound; low","f":"tiefen","s":"Nie hat mir meine Mutter gesagt, in welchen Verhältnissen mein Vater in der Welt lebte; rufe ich mir aber alles das ins Gedächtnis zurück, was sie mir schon in meiner frühesten Jugend von ihm erzählte, so muß ich wohl glauben, daß es ein mit tiefen Kenntniss…","n":20},{"w":"Kraft","art":"die","ipa":"/kʁaft/","m":"power, force, strength; force; worker, employee","f":"Kraft","s":"Ist es nicht herrlich, lieber Bruder Medardus, daß unsere Kirche darnach trachtet, jene geheimnisvollen Fäden zu erfassen, die das Sinnliche mit dem Übersinnlichen verknüpfen, ja unseren zum irdischen Leben und Sein gediehenen Organismus so anzuregen, daß se…","n":13},{"w":"Geist","art":"der","ipa":"/ɡaɪ̯st/","m":"spirit; the Holy Spirit; Holy Ghost; essence","f":"Geiste","s":"Noch ist es mir unerklärlich, wie meine Mutter darauf verfiel, mich aufzufordern, der Fürstin von den schönen herrlichen Dingen meines Geburtsortes zu erzählen, und ich, wie von einer höheren Macht inspiriert, ihr die schönen Bilder des fremden unbekannten M…","n":17},{"w":"öffnen","art":"","ipa":"/ˈœfnən/","m":"to open; to open, get, or answer the door","f":"öffne","s":"— war es nicht, als öffne sich die Wolkenglorie über dem Hochaltar?","n":9},{"w":"Kirche","art":"die","ipa":"/ˈkɪʁçə/","m":"church; an assembly","f":"Kirche","s":"— Mit dem ersten Bewußtsein dämmern in mir die lieblichen Bilder von dem Kloster, und von der herrlichen Kirche in der heiligen Linde, auf.","n":30},{"w":"ewig","art":"","ipa":"/ˈeːvɪç/","m":"eternal, everlasting; constant, frequent","f":"ewig","s":"— Ach, wie ein fernes herrliches Land, wo die Freude wohnt und die ungetrübte Heiterkeit des kindlichen unbefangenen Sinns, liegt die Heimat weit, weit hinter mir, aber wenn ich zurückblicke, da gähnt mir die Kluft entgegen, die mich auf ewig von ihr geschie…","n":8},{"w":"Wein","art":"der","ipa":"/vaɪ̯n/","m":"wine","f":"Wein","s":"— Eine Schwester brachte Zuckerwerk und süßen Wein, ich ließ mich, jetzt schon dreister geworden, nicht lange nötigen, sondern naschte tapfer von den Süßigkeiten, die mir die holde Frau, welche sich gesetzt und mich auf den Schoß genommen hatte, selbst in de…","n":15},{"w":"Blick","art":"der","ipa":"[blɪk]","m":"glance, look; view","f":"Blick","s":"Sie sah mich mit einem ernsten, bis ins Innerste dringenden Blick an, und frug: „Ist das euer Sohn?“","n":14},{"w":"indem","art":"","ipa":"/ɪnˈdeːm/","m":"by; while, at the time that","f":"indem","s":"Einer von ihnen rief, indem er uns gewahr wurde, lachend: „Sieh da!","n":9},{"w":"treten","art":"","ipa":"[ˈtʰʁ̥eːtn̩]","m":"to step, to walk; to appear; to step; to tread","f":"traten","s":"Da traten einige Jünglinge aus dem Gebüsch, die, nach ihrer Kleidung und nach ihrem ganzen Wesen zu urteilen, wohl nur aus Neugierde und Schaulust nach der heiligen Linde gekommen waren.","n":9},{"w":"Flasche","art":"die","ipa":"/ˈflaʃə/","m":"bottle; flask; flagon; loser; wimp","f":"Flaschen","s":"Allerlei lustige Erzählungen, Späße und Schwänke wechselten unter dem lauten Gelächter der Gäste, wobei die Flaschen fleißig geleert wurden bis der Abend hereinbrach und die Wagen zur Abfahrt bereit standen.","n":20},{"w":"steigen","art":"","ipa":"/ˈʃtaɪ̯ɡən/","m":"to ascend, to climb, to rise; to rise","f":"stieg","s":"Endlich stieg ich, an der Hand meiner Mutter, die breiten, steinernen Treppen herauf und trat in das hohe, gewölbte, mit heiligen Bildern ausgeschmückte Gemach, in dem wir die Fürstin fanden.","n":10},{"w":"scheinen","art":"","ipa":"/ˈʃaɪnən/","m":"to shine; to gleam; to seem; to appear; to look","f":"schien","s":"Der herrliche Klostergarten mit der Aussicht in die Gebirge hinein schien mir jedesmal, wenn ich in den langen Alleen wandelte und bald bei dieser, bald bei jener üppigen Baumgruppe stehen blieb, in neuer Schönheit zu erglänzen.","n":16},{"w":"heiligen","art":"","ipa":"/ˈhaɪ̯lɪɡən/","m":"to hallow; to make holy","f":"heilige","s":"— Auf der beschwerlichen Wanderung dahin fühlte meine Mutter nach mehreren Jahren der Ehe zum erstenmal, daß diese nicht unfruchtbar bleiben würde, wie mein Vater befürchtet, und seiner Dürftigkeit unerachtet war er hoch erfreut, weil nun eine Vision in Erfü…","n":10},{"w":"drücken","art":"","ipa":"/ˈdʁʏkən/","m":"to press, to push; to squeeze; to hug","f":"drückte","s":"und hob mich auf und drückte mich heftig an sich, aber in dem Augenblick preßte mir ein jäher Schmerz, den ich am Halse fühlte, einen starken Schrei aus, so daß die Fürstin erschrocken mich losließ, und die durch mein Betragen ganz bestürzt gewordene Mutter …","n":8},{"w":"Kiste","art":"die","ipa":"/ˈkɪstə/","m":"chest, box; crate, case; bed, sleeping furniture","f":"Kistchen","s":"Endlich nahm er aus einem wohlverschlossenen Schranke ein Kistchen heraus und sagte.","n":12},{"w":"Brust","art":"die","ipa":"/bʁʊst/","m":"chest; breast; side of the chest; bosom","f":"Brust","s":"Die Fürstin ließ das nicht zu; es fand sich, daß das diamantne Kreuz, welches die Fürstin auf der Brust trug, mich, indem sie heftig mich an sich drückte, am Halse so stark beschädigt hatte, daß die Stelle ganz rot und mit Blut unterlaufen war.","n":8},{"w":"Schrank","art":"der","ipa":"/ʃʁaŋk/","m":"cupboard; wardrobe, closet; bookcase; locker","f":"Schranke","s":"Endlich nahm er aus einem wohlverschlossenen Schranke ein Kistchen heraus und sagte.","n":12},{"w":"befinden","art":"","ipa":"/bəˈfɪndn̩/","m":"to occupy a place; to be located; to be situated","f":"befand","s":"Jedes ihrer Worte blieb tief in meiner Seele zurück, noch den ganzen Tag über, wenn ich sie gesprochen, befand ich mich in wunderbarer feierlicher Stimmung und ihre Gestalt begleitete mich auf den Spaziergängen, die ich dann besuchte.","n":8},{"w":"desto","art":"","ipa":"/ˈdɛstoː/","m":"the","f":"desto","s":"In der heiligen Linde erkrankte mein Vater, und je weniger er die vorgeschriebenen beschwerlichen Andachtsübungen seiner Schwäche unerachtet aussetzen wollte, desto mehr nahm das Übel überhand; er starb entsündigt und getröstet in demselben Augenblick, als i…","n":7},{"w":"Zelle","art":"die","ipa":"/ˈtsɛlə/","m":"in a monastery or convent; in a prison; cell","f":"Zelle","s":"— Ich war wie vernichtet, ein Eisstrom goß sich durch mein Inneres — besinnungslos stürzte ich fort ins Kollegium — in meine Zelle.","n":7},{"w":"vermögen","art":"","ipa":"[fɛəˈmøːɡŋ̩]","m":"to be able to; may; to cause, to force, to impel","f":"vermochte","s":"Eine innere Scham, die ich nicht zu überwinden vermochte, hielt mich zurück ihm die Wahrheit zu sagen, dagegen erzählte ich ihm mit dem Feuer der Exaltation, das noch in mir glühte, die wunderbaren Begebenheiten meiner Kinderjahre, welche alle auf meine Best…","n":7},{"w":"Heil","art":"das","ipa":"/haɪ̯l/","m":"health, salvation, well-being, happiness, a state of intactness and prosperity","f":"Heil","s":"— Das was darinnen enthalten, stammt unmittelbar von dem Widersacher her aus jener Zeit, als er noch sichtlich gegen das Heil der Menschen zu kämpfen vermochte.“","n":10},{"w":"gewiss","art":"","ipa":"/ɡəˈvɪs/","m":"certain","f":"gewiß","s":"— So gedenke ich ferner noch eines alten fremdartig gekleideten Pilgers mit langem grauem Barte, der mich oft auf den Armen umhertrug, im Walde allerlei bunte Moose und Steine suchte, und mit mir spielte; unerachtet ich gewiß glaube, daß nur aus der Beschrei…","n":19},{"w":"erfüllen","art":"","ipa":"/ɛrˈfʏlən/","m":"to fill; to fulfill / fulfil; to come true","f":"erfüllte","s":"— Aber finstre Gestalten steigen auf, und immer dichter und dichter sich zusammendrängend, immer enger und enger mich einschließend, versperren sie die Aussicht und befangen meinen Sinn mit den Drangsalen der Gegenwart, daß selbst die Sehnsucht, welche mich …","n":12},{"w":"besondere","art":"","ipa":"","m":"special, particular, extraordinary","f":"besondere","s":"Als ich einige Tropfen des süßen Getränks, das mir bis jetzt ganz unbekannt gewesen, gekostet, kehrte mein munterer Sinn, die besondere Lebendigkeit, die, nach meiner Mutter Zeugnis, von meiner frühsten Jugend mir eigen war, zurück.","n":9},{"w":"irgend","art":"","ipa":"","m":"at all; any, some","f":"irgend","s":"— Meine Mutter konnte nicht genug sagen, welchen tiefen unauslöschlichen Eindruck die Worte des Pilgers auf sie gemacht hatten; sie beschloß aber dem unerachtet meiner Neigung durchaus keinen Zwang anzutun, sondern ruhig abzuwarten, was das Geschick über mic…","n":10},{"w":"gewöhnlich","art":"","ipa":"/ɡəˈvøːnlɪç/","m":"usual, normal, ordinary, everyday","f":"gewöhnlichen","s":"— Einst hatte der Prior viel Merkwürdiges mit mir gesprochen über das profane Leben; er war eingedrungen in die schlüpfrigsten Materien, die er aber mit seiner gewöhnlichen Leichtigkeit und Anmut des Ausdrucks zu behandeln wußte, so daß er, alles nur im mind…","n":8},{"w":"Heiliger","art":"der","ipa":"/ˈhaɪ̯.lɪ.ɡɐ/","m":"saint","f":"Heiligen","s":"Noch lächeln mir die bunten Gestalten der Engel — der Heiligen — von den Wänden, von der Decke der Kirche an!","n":18},{"w":"Vision","art":"die","ipa":"/viˈzi̯oːn/","m":"vision","f":"Vision","s":"— Auf der beschwerlichen Wanderung dahin fühlte meine Mutter nach mehreren Jahren der Ehe zum erstenmal, daß diese nicht unfruchtbar bleiben würde, wie mein Vater befürchtet, und seiner Dürftigkeit unerachtet war er hoch erfreut, weil nun eine Vision in Erfü…","n":8},{"w":"herrlich","art":"","ipa":"/ˈhɛʁlɪç/","m":"fantastic; marvelous; wonderful; splendid","f":"herrlichen","s":"— Mit dem ersten Bewußtsein dämmern in mir die lieblichen Bilder von dem Kloster, und von der herrlichen Kirche in der heiligen Linde, auf.","n":22},{"w":"sowie","art":"","ipa":"[zoˈviː]","m":"as well as; as soon as","f":"sowie","s":"Schon den Tag vorher strömten aus der benachbarten Stadt sowie aus der ganzen umliegenden Gegend, eine Menge Menschen herbei und lagerten sich auf der großen blumichten Wiese, die sich an das Kloster schloß, so daß das frohe Getümmel Tag und Nacht nicht aufh…","n":12},{"w":"Kloster","art":"das","ipa":"/ˈkloːstɐ/","m":"convent, monastery, cloister","f":"Kloster","s":"— Mit dem ersten Bewußtsein dämmern in mir die lieblichen Bilder von dem Kloster, und von der herrlichen Kirche in der heiligen Linde, auf.","n":46},{"w":"jener","art":"","ipa":"/ˈjeːnɐ/","m":"that, that one","f":"jener","s":"Die Zeit von jener Begebenheit mit dem alten Pilger, welche ich in der Tat aus eigner Anschauung weiß, so daß sie meine Mutter nur rücksichts der Reden des Malers und des alten Pilgers ergänzt hat, bis zu dem Moment, als mich meine Mutter zum erstenmal zur Ä…","n":33},{"w":"Fürst","art":"der","ipa":"/fʏɐ̯st/","m":"prince","f":"Fürstin","s":"Endlich stieg ich, an der Hand meiner Mutter, die breiten, steinernen Treppen herauf und trat in das hohe, gewölbte, mit heiligen Bildern ausgeschmückte Gemach, in dem wir die Fürstin fanden.","n":23},{"w":"Gebet","art":"das","ipa":"/ɡəˈbeːt/","m":"prayer","f":"Gebet","s":"Lustiger Gesang, fromme Lieder, die inbrünstigen Seufzer der Büßenden, das Gelächter der Fröhlichen, Klagen, Jauchzen, Jubel, Scherze, Gebet erfüllen wie in wunderbarem betäubendem Konzert die Lüfte!","n":8},{"w":"ergreifen","art":"","ipa":"/ɛʁˈɡʁaɪfən/","m":"to seize, capture; to take up","f":"ergriffen","s":"— Ihre Stimme, ihr ganzes Ansehn — selbst die fremde Umgebung, das hohe Gemach, die Bilder, alles wirkte so auf mich, daß ich, von dem Gefühl eines inneren Grauens ergriffen, bitterlich zu weinen anfing.","n":8},{"w":"fremd","art":"","ipa":"/fʁɛmt/","m":"strange; foreign; external","f":"fremde","s":"— So ist es mir, als hätte ich selbst einmal in der öden Kirche die wunderbare Gestalt eines ernsten Mannes gesehen, und es sei eben der fremde Maler gewesen, der in uralter Zeit, als eben die Kirche gebaut, erschien, dessen Sprache niemand verstehen konnte …","n":10},{"w":"heilig","art":"","ipa":"","m":"holy; sacred","f":"heiligen","s":"Eben aus diesen Erzählungen und einzelnen Äußerungen meiner Mutter, über ihr früheres Leben, die mir erst später verständlich worden, weiß ich, daß meine Eltern von einem bequemen Leben, welches sie im Besitz vielen Reichtums führten, herabsanken in die drüc…","n":29},{"w":"Gestalt","art":"die","ipa":"/ɡəˈʃtalt/","m":"shape, form, figure, outline","f":"Gestalten","s":"Noch lächeln mir die bunten Gestalten der Engel — der Heiligen — von den Wänden, von der Decke der Kirche an!","n":12},{"w":"entsetzlich","art":"","ipa":"/ɛntˈzɛt͡slɪç/","m":"horrible, terrible, horrendous, appalling","f":"entsetzlich","s":"Überall erklangen um mich Stimmen, die mich verspotteten, verhöhnten; ich war im Begriff mich durch das Fenster zu stürzen, zum Glück verhinderten mich die Eisenstäbe daran, mein Zustand war in der Tat entsetzlich.","n":8},{"w":"geistig","art":"","ipa":"/ˈɡaɪ̯stɪç/","m":"mental; intellectual; spiritual","f":"geistigen","s":"Ohne dem Irdischen einen falschen Wert zu verleihen, mußten sie in der verschiedenen, aus dem Innern bestimmten Lebensweise der Menschen, die Notwendigkeit einer solchen Strahlenbrechung des geistigen Prinzips, ohne welche alles farb- und glanzlos geblieben …","n":15},{"w":"Begeisterung","art":"die","ipa":"/bəˈɡaɪ̯stəʁʊŋ/","m":"enthusiasm, zeal, zest; rapture, ecstasy","f":"Begeisterung","s":"Die Fürstin, selbst meine Mutter, blickten mich voll Erstaunen an, aber je mehr ich sprach, deste höher stieg meine Begeisterung, und als mich endlich die Fürstin frug: „Sage mir liebes Kind, woher weißt du denn das alles?“","n":8},{"w":"Weiser","art":"der","ipa":"/ˈvaɪ̯zɐ/","m":"sage","f":"Weise","s":"— Die Fürstin war auf besondere Weise bewegt, ihre Stimme zitterte vor Wehmut, als sie noch salbungsvolle Worte der Ermahnung sprach.","n":13},{"w":"eigen","art":"","ipa":"/ˈaɪ̯ɡən/","m":"own, peculiar or private to someone, idiosyncratic, proper or proprietary","f":"eigner","s":"Die Zeit von jener Begebenheit mit dem alten Pilger, welche ich in der Tat aus eigner Anschauung weiß, so daß sie meine Mutter nur rücksichts der Reden des Malers und des alten Pilgers ergänzt hat, bis zu dem Moment, als mich meine Mutter zum erstenmal zur Ä…","n":8},{"w":"geheimnisvoll","art":"","ipa":"/ɡəˈhaɪ̯mnɪsˌfɔl/","m":"mysterious, cryptic, arcane, enigmatic","f":"geheimnisvollen","s":"Sechzehn Jahre war ich alt geworden, als der Pfarrer erklärte, daß ich nun vorbereitet genug sei, die höheren theologischen Studien in dem Seminar der benachbarten Stadt zu beginnen: ich hatte mich nämlich ganz für den geistlichen Stand entschieden und dies …","n":9},{"w":"dringen","art":"","ipa":"/ˈdʁɪŋən/","m":"to insist; to press; to ooze; to seep","f":"gedrungen","s":"— Die Erzählungen meiner Mutter von dem wundervollen Kloster, wo ihrem tiefsten Schmerz gnadenreicher Trost zuteil wurde, sind so in mein Innres gedrungen, daß ich alles selbst gesehen, selbst erfahren zu haben glaube, unerachtet es unmöglich ist, daß meine …","n":9},{"w":"Abt","art":"der","ipa":"/apt/","m":"abbot","f":"Äbtissin","s":"— Meine Erinnerungen aus deutlicher selbst gemachter Erfahrung heben von dem Zeitpunkt an, als meine Mutter auf der Heimreise in das Cisterzienser Nonnenkloster gekommen war, dessen gefürstete Äbtissin, die meinen Vater gekannt hatte, sie freundlich aufnahm.","n":11}],[{"w":"Verbindung","art":"die","ipa":"/fɛɐ̯ˈbɪndʊŋ(k)/","m":"connection; compound; accession","f":"Verbindung","s":"Sein Vater hatte seine Verbindung mit einer ihm befreundeten Familie durch eine Heirat gewünscht, und um so freudiger erfüllte er diesen Willen, als er in der ihm bestimmten Braut ein herrliches, von der Natur reich ausgestattetes Wesen fand, zu dem er sich …","n":8},{"w":"seltsam","art":"","ipa":"/ˈzɛltˌzaːm/","m":"strange, weird, odd, funny, curious","f":"seltsame","s":"Ganz entkräftet setzte ich mich auf ein Felsstück und konnte nicht widerstehen einen Zug aus der Korbflasche zu tun, unerachtet ich das seltsame Getränk soviel nur möglich aufsparen wollte.","n":11},{"w":"Geheimnis","art":"das","ipa":"/ɡəˈhaɪmnɪs/","m":"secret; mystery","f":"Geheimnisses","s":"Er ist ruhig, aber läßt nicht ab von der einmal gefaßten Idee, und alle Bemühungen das Ereignis zu erforschen, das ihn in diesen Zustand versetzt, bleiben fruchtlos, unerachtet die Entdeckung dieses Geheimnisses vielleicht am ersten auf wirksame Mittel führe…","n":9},{"w":"anderer","art":"","ipa":"/ˈandərər/","m":"other, different; second","f":"andrer","s":"— Nie war mir so zu Mute gewesen, ich schien mir selbst ein andrer, und, wie von neuerweckter Kraft beseelt und begeistert schritt ich rasch fort durch den Wald, den Berg herab.","n":9},{"w":"Schritt","art":"der","ipa":"[ʃʁɪtʰ]","m":"step, footstep; walk; crotch; a pace","f":"Schritte","s":"Ich trat einige Schritte weiter und erstarrte beinahe vor Schreck, als ich dicht an einem jähen, entsetzlichen Abgrund stand, in den sich, zwischen schroffen, spitzen Felsen, ein Waldbach zischend und brausend hinabstürzte, dessen donnerndes Getöse ich schon…","n":11},{"w":"nah","art":"","ipa":"/naː/","m":"near, close, nearby","f":"nahen","s":"Es war mir klar, daß eine große Ähnlichkeit meiner Gesichtszüge und meiner Gestalt mit der des unglücklichen Grafen den Jäger getäuscht, und der Graf gerade die Verkleidung als Kapuziner gewählt haben müsse, um irgend ein Abenteuer in dem nahen Schlosse zu b…","n":16},{"w":"daher","art":"","ipa":"/ˈdaːheːɐ̯/","m":"from there, thence; therefore; because of that","f":"daher","s":"Als die Lobrede geendet, antwortete er, wie er sich auch nicht im mindesten von Euphemien angezogen fühle, sie niemals lieben könne, und daher recht herzlich bitte, den Plan jeder näheren Verbindung mit ihr aufzugeben.","n":9},{"w":"Schloss","art":"das","ipa":"/ʃlɔs/","m":"lock, padlock; lock; castle","f":"Schlosse","s":"Da fuhr der junge Mensch fort: „Nun gnädiger Herr, reite ich den Fahrweg herab nach dem Städtchen, wo ich mich in dem Hause dicht vor dem Tor linker Hand verborgen halten will, Sie werden wohl gleich herab nach dem Schlosse wandeln, man wird Sie wohl schon e…","n":17},{"w":"Zufall","art":"der","ipa":"/ˈt͡suːˌfal/","m":"chance, coincidence, randomness","f":"Zufalls","s":"Als ich mich von meiner Betäubung erholt und die ganze Begebenheit überdachte, mußte ich mir wohl eingestehen, daß ich bloß dem Spiel des Zufalls, der mich mit einem Ruck in das sonderbarste Verhältnis geworfen, nachgegeben.","n":13},{"w":"wahnsinnig","art":"","ipa":"/ˈvaːnˌzɪnɪç/","m":"mad, insane; incredible, unbelievable","f":"wahnsinnige","s":"Nun brach aber das Unglück und die Trauer ein in unser Haus, denn bald schrieb Euphemie dem Baron, wie Hermogen plötzlich von einer oft in wahnsinnige Wut ausbrechenden Melancholie befallen, wie er einsam umherirre, sich und sein Geschick verwünsche und wie …","n":11},{"w":"Gang","art":"der","ipa":"/ɡaŋ/","m":"motion, movement, progress, way, going; course","f":"Gängen","s":"Bald befand ich mich in den Gängen des Parks, welcher das Schloß umgab; in einer dunklen Seitenallee sah ich zwei Männer wandeln, von denen der eine wie ein Weltgeistlicher gekleidet war.","n":11},{"w":"Wesen","art":"das","ipa":"/ˈveːzən/","m":"creature, being; essence, substance; character","f":"Wesens","s":"Die plötzliche Änderung Ihres ganzen Wesens hat indessen nur zu deutlich gezeigt, daß irgend ein Ereignis das Sie uns hartnäckig verschweigen, Ihr Inneres auf furchtbare Weise erschüttert hat und nun zerstörend fortarbeitet.","n":9},{"w":"wild","art":"","ipa":"/vɪlt/","m":"wild; wild, unrestrained, raucous; strange","f":"wilden","s":"Ich konnte den wilden Flug nicht mehr aufhalten, es war zu spät.","n":9},{"w":"werfen","art":"","ipa":"/ˈvɛrfən/","m":"to throw; to cast; to project; to give birth","f":"geworfen","s":"— Sowie ich ihn berührte, fuhr er aus tiefem Schlafe, aber in demselben Augenblick stürzte er, das Gleichgewicht verlierend, hinab in den Abgrund, daß, von Felsenspitze zu Felsenspitze geworfen, die zerschmetterten Glieder zusammenkrachten; sein schneidendes…","n":7},{"w":"Park","art":"der","ipa":"/paʁk/","m":"park; park, grounds","f":"Parks","s":"Bald befand ich mich in den Gängen des Parks, welcher das Schloß umgab; in einer dunklen Seitenallee sah ich zwei Männer wandeln, von denen der eine wie ein Weltgeistlicher gekleidet war.","n":7},{"w":"Wahnsinn","art":"der","ipa":"/ˈvaːnzɪn/","m":"insanity, madness","f":"Wahnsinn","s":"Tief bewunderte ich die Weisheit des Priors, der das richtige Mittel zu meiner Heilung wählte, denn, in den Klostermauern eingeschlossen, immer von denselben Gegenständen umgeben, immer brütend und hineinzehrend in das Innere, hätte mich jene Vision, der die…","n":7},{"w":"tausend","art":"","ipa":"/ˈtaʊ̯zənt/","m":"thousand","f":"tausend","s":"Die Sonne trat in flammender Glut hinter der Stadt hervor, ihr funkelndes Gold erglänzte in den Bäumen und in freudigem Rauschen fielen die Tautropfen wie glühende Diamanten herab auf tausend bunte Insektlein, die sich schwirrend und sumsend erhoben.","n":7},{"w":"erscheinen","art":"","ipa":"/ɛɐ̯ˈʃaɪ̯nən/","m":"to appear; to come out, be released","f":"erschien","s":"— Überall wo sie erschien ging ein neues herrliches Leben auf und man huldigte ihr mit dem glühendsten Enthusiasmus; den Unbedeutendsten, Leblosesten wußte sie selbst in sein eignes Inneres hinein zu entzünden, daß er, wie inspiriert, sich über die eigne Dür…","n":8},{"w":"Weib","art":"das","ipa":"/vaɪ̯p/","m":"woman, broad; woman, wife","f":"Weibes","s":"Bald war ich überzeugt, daß jene Erscheinung des unbekannten Weibes nur eine Vision gewesen, die Folge gar zu großer Anstrengung, und statt, wie ich sonst getan haben würde, das verführerische, verderbliche Trugbild der steten Verfolgung des Widersachers zuz…","n":8},{"w":"derselbe","art":"","ipa":"/deːɐ̯ˈzɛlbə/","m":"the same; selfsame; idem","f":"denselben","s":"Tief bewunderte ich die Weisheit des Priors, der das richtige Mittel zu meiner Heilung wählte, denn, in den Klostermauern eingeschlossen, immer von denselben Gegenständen umgeben, immer brütend und hineinzehrend in das Innere, hätte mich jene Vision, der die…","n":10},{"w":"entgegen","art":"","ipa":"[ʔɛntˈɡeːɡŋ̩]","m":"against","f":"entgegen","s":"Leblos vor Schreck und Entsetzen stand ich da, endlich ergriff ich den Hut, den Degen, das Portefeuille und wollte mich schnell von dem Unglücksorte entfernen, da trat mir ein junger Mensch aus dem Tannenwalde entgegen, wie ein Jäger gekleidet, schaute mir e…","n":11},{"w":"Baron","art":"der","ipa":"[baˈʁoːn]","m":"baron","f":"Baron","s":"Auf, Baron!","n":65},{"w":"erheben","art":"","ipa":"[ʔɛʁˈheːbn̩]","m":"to raise, lift; to levy, charge; to bring","f":"erhoben","s":"Die Sonne trat in flammender Glut hinter der Stadt hervor, ihr funkelndes Gold erglänzte in den Bäumen und in freudigem Rauschen fielen die Tautropfen wie glühende Diamanten herab auf tausend bunte Insektlein, die sich schwirrend und sumsend erhoben.","n":8},{"w":"Verhältnis","art":"das","ipa":"/fɛɐ̯ˈhɛltnɪs/","m":"relation, ratio; relationship; affair","f":"Verhältnis","s":"Als ich mich von meiner Betäubung erholt und die ganze Begebenheit überdachte, mußte ich mir wohl eingestehen, daß ich bloß dem Spiel des Zufalls, der mich mit einem Ruck in das sonderbarste Verhältnis geworfen, nachgegeben.","n":14},{"w":"Hauptstadt","art":"die","ipa":"/ˈhaʊ̯ptˌʃtat/","m":"capital","f":"Hauptstadt","s":"Mehrenteils brachten wir den Winter in der benachbarten Hauptstadt zu, als aber bald nach Aureliens Geburt die Baronesse zu kränkeln anfing, blieben wir auch den Sommer über in der Stadt, da sie unausgesetzt des Beistandes geschickter Ärzte bedurfte.","n":9},{"w":"Abgrund","art":"der","ipa":"/ˈapˌɡʁʊnt/","m":"abyss, precipice","f":"Abgrund","s":"Ich trat einige Schritte weiter und erstarrte beinahe vor Schreck, als ich dicht an einem jähen, entsetzlichen Abgrund stand, in den sich, zwischen schroffen, spitzen Felsen, ein Waldbach zischend und brausend hinabstürzte, dessen donnerndes Getöse ich schon…","n":14},{"w":"Erscheinung","art":"die","ipa":"/ɛɐ̯ˈʃaɪ̯nʊŋ/","m":"appearance; apparition, vision; phenomenon","f":"Erscheinungen","s":"antwortete ich, und es war mir, als trete ein neues Leben, voll Lust und Freiheit, mit tausend holdseligen Erscheinungen auf mich ein!","n":10},{"w":"Genuss","art":"der","ipa":"/ɡəˈnʊs/","m":"enjoyment, pleasure; consumption","f":"Genüssen","s":"— Überall wo sie erschien ging ein neues herrliches Leben auf und man huldigte ihr mit dem glühendsten Enthusiasmus; den Unbedeutendsten, Leblosesten wußte sie selbst in sein eignes Inneres hinein zu entzünden, daß er, wie inspiriert, sich über die eigne Dür…","n":9},{"w":"Inneres","art":"das","ipa":"","m":"inside, interior; bowels, innards","f":"Innere","s":"Tief bewunderte ich die Weisheit des Priors, der das richtige Mittel zu meiner Heilung wählte, denn, in den Klostermauern eingeschlossen, immer von denselben Gegenständen umgeben, immer brütend und hineinzehrend in das Innere, hätte mich jene Vision, der die…","n":27},{"w":"fromm","art":"","ipa":"/fʁɔm/","m":"pious, religious, devout; righteous","f":"frommen","s":"In blauen Duft gehüllt, lag das Kloster unter mir im Tale; der frische Morgenwind rührte sich und trug, die Lüfte durchstreichend, die frommen Gesänge der Brüder zu mir herauf.","n":10},{"w":"Arm","art":"der","ipa":"/arm/","m":"an arm; a sleeve; an arm of a creek or a river","f":"Arme","s":"Der Alte stand auf und wollte fortgehen, der Jüngling fiel ihm in die Arme.","n":6},{"w":"Pferd","art":"das","ipa":"/pfeːrt/","m":"horse; knight; pommel horse; a woman","f":"Pferd","s":"Immer dichter und dichter wurde der Tannenwald, im tiefsten Dickicht rauschte es, und bald darauf wieherte laut ein Pferd, das dort angebunden.","n":6},{"w":"Lust","art":"die","ipa":"/lʊst/","m":"desire; the wish to do or have something","f":"Lust","s":"Die Vögel erwachten und flatterten, singend und jubilierend sich in froher Lust liebkosend, durch den Wald!","n":6},{"w":"bewegen","art":"","ipa":"/bəˈveːɡən/","m":"to motivate; to persuade; to prompt; to make","f":"bewegten","s":"Es fehlte natürlicherweise nicht an Anbetern, die täglich zu der Gottheit mit Inbrunst flehten; man konnte indessen nie mit Bestimmtheit sagen, daß sie diesen oder jenen besonders auszeichne, vielmehr wußte sie mit schalkhafter Ironie, die, ohne zu beleidige…","n":6},{"w":"Gesellschaft","art":"die","ipa":"/ɡəˈzɛlʃaft/","m":"company; society, the public; society","f":"Gesellschaft","s":"Sie wußte dem blöden unerfahrnen Mädchen in glänzender Gesellschaft auf eine so feine Art beizustehen, daß dieser Beistand statt bemerkt zu werden, nur dazu diente, Aureliens natürlichen Verstand und tiefes richtiges Gefühl so herauszuheben, daß man sie bald…","n":6},{"w":"statt","art":"","ipa":"/ʃtat/","m":"instead of","f":"statt","s":"Es war mir jetzt selbst unbegreiflich, mit welcher Langmut der Prior das alles ertragen und mich statt der wohlverdienten Strafe in die Welt geschickt hatte.","n":6},{"w":"leise","art":"","ipa":"/ˈlaɪ.zə/","m":"quiet, soft, low; slight, faint, light","f":"leisen","s":"Von der Zeit, als dieses Gespräch, das mir der Baron gleich wieder erzählte, stattgefunden, verdoppelte Euphemie ihre Aufmerksamkeit für den Baron und Aurelien, ja in manchen leisen Andeutungen führte sie den Baron darauf, daß eine Verbindung mit ihm selbst …","n":6},{"w":"brechen","art":"","ipa":"/ˈbʁɛçən/","m":"to break; to refract; to vomit; to fold","f":"gebrochen","s":"sagte der Alte, „Sie bringen durch Ihr starrsinniges Schweigen Ihre Familie zur Verzweiflung, Ihre düstre Schwermut steigt mit jedem Tage, Ihre jugendliche Kraft ist gebrochen, die Blüte verwelkt, Ihr Entschluß den geistlichen Stand zu wählen zerstört alle H…","n":6},{"w":"Hut","art":"der","ipa":"/huːt/","m":"hat; head, top","f":"Hut","s":"Dicht, dicht an dem Sturz, saß auf einem über die Tiefe hervorragenden Felsenstück ein junger Mann in Uniform, der Hut mit dem hohen Federbusch, der Degen, ein Portefeuille lagen neben ihm.","n":6},{"w":"Wunsch","art":"der","ipa":"/vʊnʃ/","m":"wish","f":"Wünsche","s":"sagte der Alte, „Sie bringen durch Ihr starrsinniges Schweigen Ihre Familie zur Verzweiflung, Ihre düstre Schwermut steigt mit jedem Tage, Ihre jugendliche Kraft ist gebrochen, die Blüte verwelkt, Ihr Entschluß den geistlichen Stand zu wählen zerstört alle H…","n":6},{"w":"Zweifel","art":"der","ipa":"/ˈtsvaɪ̯fəl/","m":"doubt","f":"Zweifel","s":"Der innere, unwiderstehliche Drang in mir, wie es jenes Verhängnis zu wollen schien, die Rolle des Grafen fortzuspielen, überwog jeden Zweifel und übertäubte die innere Stimme, welche mich des Mordes und des frechen Frevels bezieh.","n":6},{"w":"schweigen","art":"","ipa":"/ˈʃvaɪ̯ɡən/","m":"to be silent; to keep quiet; to stop talking","f":"schweigen","s":"Sie schweigen?","n":6},{"w":"selten","art":"","ipa":"/ˈzɛltən/","m":"rare, infrequent, uncommon, scarce","f":"seltener","s":"Sie liebten sonst Ihren Vater mit seltener Innigkeit, ist es Ihnen aber jetzt unmöglich geworden ihm Ihr Herz zu erschließen, so quälen Sie ihn wenigstens nicht durch den Anblick Ihres Rocks, der auf den für ihn entsetzlichen Entschluß hindeutet.","n":6},{"w":"Pater","art":"der","ipa":"/ˈpaːtər/","m":"father; Father","f":"Pater","s":"Endlich brach er los: „Mein Gott, ehrwürdiger Herr, alles müßte mich trügen, wenn Sie nicht der Pater Medardus aus dem Kapuzinerkloster in ..","n":6},{"w":"Mittel","art":"das","ipa":"/ˈmɪtəl/","m":"agent, appliance; means; medicament, remedy","f":"Mittel","s":"Tief bewunderte ich die Weisheit des Priors, der das richtige Mittel zu meiner Heilung wählte, denn, in den Klostermauern eingeschlossen, immer von denselben Gegenständen umgeben, immer brütend und hineinzehrend in das Innere, hätte mich jene Vision, der die…","n":6},{"w":"Gedanke","art":"der","ipa":"/ɡəˈdaŋkə/","m":"idea, plan; concept","f":"Gedanke","s":"Schon war ich eine ziemliche Strecke einsam fortgewandelt, als mir erst der Gedanke an die Unbekannte und an den fantastischen Plan sie aufzusuchen, wiederkam.","n":6},{"w":"Graf","art":"der","ipa":"/ɡraːf/","m":"count; earl","f":"Grafen","s":"In mich gekehrt, immer in den Abgrund starrend, ob der blutige Leichnam des Grafen sich nicht mir drohend erheben werde, stand ich da.","n":7},{"w":"verbergen","art":"","ipa":"/fɛɐ̯ˈbɛʁɡn̩/","m":"to hide, conceal from view, keep secret","f":"verborgen","s":"Da fuhr der junge Mensch fort: „Nun gnädiger Herr, reite ich den Fahrweg herab nach dem Städtchen, wo ich mich in dem Hause dicht vor dem Tor linker Hand verborgen halten will, Sie werden wohl gleich herab nach dem Schlosse wandeln, man wird Sie wohl schon e…","n":7},{"w":"brennen","art":"","ipa":"/ˈbʁɛnən/","m":"to burn; to light on fire; to be on fire","f":"brannte","s":"Es war hoher Mittag, die Sonne brannte auf mein unbedecktes Haupt, ich lechzte vor Durst, aber keine Quelle war in der Nähe und noch immer konnte ich nicht das Dorf erreichen, auf das ich stoßen sollte.","n":7},{"w":"Anblick","art":"der","ipa":"/ˈʔanblɪk/","m":"view, sight, look","f":"Anblick","s":"Sie liebten sonst Ihren Vater mit seltener Innigkeit, ist es Ihnen aber jetzt unmöglich geworden ihm Ihr Herz zu erschließen, so quälen Sie ihn wenigstens nicht durch den Anblick Ihres Rocks, der auf den für ihn entsetzlichen Entschluß hindeutet.","n":7}],[{"w":"legen","art":"","ipa":"/ˈleːɡən/","m":"causative of liegen: to lay; to lie down","f":"legte","s":"— Mit diesen Worten zog ich den Geldbeutel hervor, legte drei blanke Dukaten auf den Tisch und der gravitätische Ernst des Herrn Richters verzog sich zum schmunzelnden Lächeln.","n":8},{"w":"Richter","art":"der","ipa":"/ˈʁɪçtɐ/","m":"judge","f":"Richter","s":"Ihr kommt nicht eher von hinnen, bis Ihr uns, dem Richter hier am Orte umständlich gesagt, wer Ihr seid, mit allen Qualitäten, was Geburt, Stand und Würde anbelangt, auch woher Ihr gekommen und wohin Ihr zu reisen gedenkt, nach allen Qualitäten, der Lage des…","n":16},{"w":"Wald","art":"der","ipa":"/valt/","m":"forest; woods; woodland","f":"Waldes","s":"Bald war ich am Ausgange des Waldes und der in der Ferne aufsteigende Dampf, sowie das helle Glockengeläute, das zu mir herübertönte, ließen mich ein Dorf in der Nahe vermuten.","n":25},{"w":"beginnen","art":"","ipa":"/bəˈɡɪnən/","m":"to begin; to commence; to be started","f":"begann","s":"— Die Kutte hatte ich in einen hohlen Baum verborgen und mit ihr all die feindseligen Erscheinungen auf dem Schlosse in den finstern Wald gebannt; denn ich fühlte mich froh und mutig und es war mir, als habe nur meine überreizte Fantasie mir Viktorins blutig…","n":8},{"w":"schreien","art":"","ipa":"/ˈʃʁaɪ̯ən/","m":"to shout; to yell; to cry; to scream; to howl","f":"schrie","s":"schrie der Richter, aber die Alte kreischte: „Der Blutbruder hat mir keinen Groschen gegeben, seht ihr nicht den toten Menschen vor mir liegen?","n":9},{"w":"Haar","art":"das","ipa":"/haːr/","m":"hair","f":"Haare","s":"— Ich beschloß, mich sogleich umzukleiden; mit Hilfe der kleinen Schere und des Kamms den ich in einem Besteck gefunden, verschnitt ich den Bart und brachte die Haare so gut es gehen wollte in Ordnung.","n":10},{"w":"Tor","art":"das","ipa":"/toːr/","m":"gate, archway; gate, door; gateway; goal, net","f":"Tor","s":"Rasch wollte ich durch das Tor sprengen, aber das Pferd fing an sich zu bäumen, meine Unwissenheit, meine Ungeschicklichkeit im Reiten versagte mir jedes Mittel es von der Stelle zu bringen, im Kreise drehte es sich mit mir herum und warf mich endlich, unter…","n":9},{"w":"hinein","art":"","ipa":"[hɪˈnaɪ̯n]","m":"in","f":"hinein","s":"Geheimnisse offenbaren,“ sprach der Richter, „ich merke schon, was das sein wird; nun, geht nun hinaus, ihr Leute, bewacht die Türe und die Fenster und laßt niemanden hinein und heraus!“","n":8},{"w":"mehrere","art":"","ipa":"/meːrərə/","m":"multiple, several; more than one; a number of","f":"mehrere","s":"Während daß ich mein Frühstück verzehrte und mein Pferd gefüttert wurde, versammelten sich mehrere Bauern in der Wirtsstube, die, mit scheuen Blicken mich anschielend, miteinander flüsterten.","n":9},{"w":"Hof","art":"der","ipa":"/hoːf/","m":"yard, court, courtyard; court; farmyard","f":"Hof","s":"Als der Schwarm vorüber, führte man mich eine Seitentreppe hinab in den Hof, und dann durch das Hintergebäude auf die Straße.","n":8},{"w":"springen","art":"","ipa":"/ˈʃpʁɪŋən/","m":"to spring; to leap; to bounce; to dive; to jump","f":"sprang","s":"Da griff ich in die Tasche und warf ihr Geld in den Schoß und jubelnd und jauchzend sprang die Alte auf in die Lüfte und schrie: „Seht die schönen Groschen die mir der Blutbruder gegeben, seht die schönen Groschen!“","n":11},{"w":"Ton","art":"der","ipa":"/toːn/","m":"clay; tone; note","f":"Ton","s":"Da räusperte sich der ernsthafte Mann und sprach, indem er sich bemühte in den Ton seiner Stimme recht viel Gewichtiges zu legen.","n":10},{"w":"Bart","art":"der","ipa":"/baːrt/","m":"beard; bit","f":"Bart","s":"— Ich beschloß, mich sogleich umzukleiden; mit Hilfe der kleinen Schere und des Kamms den ich in einem Besteck gefunden, verschnitt ich den Bart und brachte die Haare so gut es gehen wollte in Ordnung.","n":10},{"w":"nieder","art":"","ipa":"/ˈniː.dɐ/","m":"low; mean; menial","f":"nieder","s":"Über den kann der Blutbruder nicht wegspringen, der tote Mensch richtet sich auf, aber ich drücke ihn nieder, wenn mir der Blutbruder einen Groschen gibt.“","n":8},{"w":"schlagen","art":"","ipa":"/ˈʃlaːɡŋ̩/","m":"to beat; to hit; to knock; to strike; to punch","f":"schlug","s":"Ich schlug den breiten Weg ein, der sich hinabschlängelte und sobald der Abhang weniger steil wurde, schwang ich mich aufs Pferd um soviel möglich mich an das mir ganz fremde Reiten zu gewöhnen.","n":7},{"w":"erkennen","art":"","ipa":"/ɛɐ̯ˈkɛnən/","m":"to recognize, perceive","f":"erkannte","s":"Ich warf die Kutte ab, in welcher ich noch das kleine verhängnisvolle Messer, Viktorins Portefeuille sowie die Korbflasche mit dem Rest des Teufels-Elixiers vorfand, und bald stand ich da in weltlicher Kleidung mit der Reisemütze auf dem Kopf, so daß ich mic…","n":7},{"w":"Messer","art":"das","ipa":"/ˈmɛsɐ/","m":"knife; measurer, surveyor; gauge, meter","f":"Messer","s":"Ich warf die Kutte ab, in welcher ich noch das kleine verhängnisvolle Messer, Viktorins Portefeuille sowie die Korbflasche mit dem Rest des Teufels-Elixiers vorfand, und bald stand ich da in weltlicher Kleidung mit der Reisemütze auf dem Kopf, so daß ich mic…","n":7},{"w":"Dorf","art":"das","ipa":"/dɔrf/","m":"village; backwater","f":"Dorf","s":"Bald war ich am Ausgange des Waldes und der in der Ferne aufsteigende Dampf, sowie das helle Glockengeläute, das zu mir herübertönte, ließen mich ein Dorf in der Nahe vermuten.","n":7},{"w":"Zustand","art":"der","ipa":"/ˈt͡suːˌʃtant/","m":"condition; state; state pattern","f":"Zustande","s":"rief der Förster, „du verruchter, gotteslästerlicher Mensch, du wagst es, hier wieder mit deinem rasenden Beginnen unter fromme Leute zu treten, du wagst es, mir, der ich dich aus viehischem Zustande, aus der ewigen Verderbnis errettet, aufs neue nach dem Le…","n":7},{"w":"schwarz","art":"","ipa":"/ʃvarts/","m":"black, reflecting little or no light; illegal","f":"schwarzer","s":"„Sie kennen,“ nahm der Fremde wieder das Wort, „wohl alle wahrscheinlich, wenn Sie die Reise durch das Gebirge machten, jene wilde, schauerliche Gegend, in der, wenn der Wanderer aus dem dicken Tannenwalde auf die hohen Felsenmassen tritt, sich ihm ein tiefe…","n":7},{"w":"einsam","art":"","ipa":"/ˈaɪ̯nzaːm/","m":"lonely, lone","f":"einsam","s":"sagte der Förster, „einsam ist es hier wohl gar nicht, Sie müßten denn so nach den gewöhnlichen Begriffen der Städter jede Wohnung einsam nennen, die im Walde liegt, unerachtet es denn doch sehr darauf ankommt, wer sich darin aufhält.","n":7},{"w":"Gewehr","art":"das","ipa":"/ɡəˈveːɐ̯/","m":"rifle, long gun; tusks","f":"Gewehr","s":"„Aber,“ fuhr er fort, „die Spitzbuben können mir nichts anhaben, denn mit der Hilfe Gottes verwalte ich mein Amt treu und redlich, und im Glauben und im Vertrauen auf ihn, auf mein gut Gewehr, biete ich ihnen Trotz.“","n":7},{"w":"solch","art":"","ipa":"/zɔlç/","m":"such","f":"solch","s":"Ihr merkt nun selbst, woher das Auffallende in meinem Äußern rührt, das mich bei Euch in solch bösen Verdacht gebracht hat.","n":7},{"w":"Stimmung","art":"die","ipa":"","m":"mood; lively atmosphere; vibe; exuberance; trend","f":"Stimmung","s":"Das Gewühl der Menschen, der fortdauernde Lärm des Gewerbes, das sich auf den Straßen rührte, alles war mir neu und ganz dazu geeignet, die heitre Stimmung zu erhalten, in die mich der komische Kleine versetzt.","n":7},{"w":"Bursche","art":"der","ipa":"/ˈbʊrʃə/","m":"boy, young man; student; boy, young servant","f":"Bursch","s":"— Damon maß mich mit den Augen und suchte dann selbst aus dem Paket, das ihm ein Bursch nachgetragen, Kleidungsstücke heraus, die den Wünschen, welche ich ihm eröffnet, ganz entsprachen.","n":10},{"w":"stürzen","art":"","ipa":"/ˈʃtyʁtsən/","m":"to fall down, to drop, to tumble; to upturn","f":"stürzte","s":"Unsinnig vor Wut und Verzweiflung riß ich das Messer, womit ich Hermogen getötet, und das ich stets bei mir zu tragen pflegte, aus der Seitentasche und stürzte mich auf den Maler, aber ein Schlag warf mich nieder und der Maler lachte im fürchterlichen Hohn, …","n":8},{"w":"Fremder","art":"der","ipa":"","m":"stranger; stranger, foreigner","f":"Fremde","s":"— Ich hatte noch gar nicht daran gedacht, daß es nötig sei irgend einen Namen anzunehmen und noch weniger war mir eingefallen, daß das Sonderbare, Fremde meines Äußern — welches durch die Kleidung, der sich mein mönchischer Anstand nicht fügen wollte, sowie …","n":8},{"w":"Turm","art":"der","ipa":"/tʊʁm/","m":"tower, spire; steeple; rook; diving platform","f":"Turm","s":"Also nur ohne alle weitere Umstände und zeremonische Worte den Paß oder in den Turm!“","n":8},{"w":"bemerken","art":"","ipa":"/bəˈmɛʁkən/","m":"to notice, to perceive","f":"bemerkte","s":"— Ich bemerkte, daß die Leute welche mir begegneten, still standen und mir verwundert nachsahen, ja, daß der Wirt im Dorfe vor Erstaunen über meinen Anblick kaum Worte finden konnte, welches mich nicht wenig ängstigte.","n":11},{"w":"hervor","art":"","ipa":"/hɛrˈfoːr/","m":"forth","f":"hervor","s":"— Mit diesen Worten zog ich den Geldbeutel hervor, legte drei blanke Dukaten auf den Tisch und der gravitätische Ernst des Herrn Richters verzog sich zum schmunzelnden Lächeln.","n":8},{"w":"Satan","art":"der","ipa":"/ˈzaːtan/","m":"Satan, the Devil; a satan, a devil","f":"Satan","s":"— „Hebe dich weg,“ schrie ich außer mir, „du bist der Satan, du bist der frevelnde Mord, aber über mich hast du keine Macht!“","n":11},{"w":"Maler","art":"der","ipa":"/ˈmaːlər/","m":"painter","f":"Maler","s":"— Seit mehreren Abenden sprach man in der Gesellschaft, die ich besuchte, viel von einem fremden Maler, der angekommen und eine Ausstellung seiner Gemälde veranstaltet habe: Alle außer mir hatten die Gemälde schon gesehen und rühmten ihre Vortrefflichkeit so…","n":19},{"w":"Mönch","art":"der","ipa":"/mœnç/","m":"monk; blackcap","f":"Mönche","s":"“ — Diese Worte sang der Kleine mit heisrer, quäkender Stimme, indem er mit treuster Wahrheit, Stellung und Gebärde der Mönche nachahmte.","n":39},{"w":"Anstand","art":"der","ipa":"/ˈan.ʃtant/","m":"decency, manners; offense, objection","f":"Anstand","s":"— Ich hatte noch gar nicht daran gedacht, daß es nötig sei irgend einen Namen anzunehmen und noch weniger war mir eingefallen, daß das Sonderbare, Fremde meines Äußern — welches durch die Kleidung, der sich mein mönchischer Anstand nicht fügen wollte, sowie …","n":10},{"w":"Porträt","art":"das","ipa":"/pɔrˈtrɛː/","m":"portrait","f":"Porträt","s":"Das Gefühl der tiefsten Wehmut durchdrang mich, aber eines lauten Ausrufs konnte ich mich nicht erwehren, als mein Blick auf ein lebensgroßes Porträt fiel, in dem ich die Fürstin, meine Pflegemutter, erkannte.","n":9},{"w":"vorzüglich","art":"","ipa":"","m":"splendid, first-rate, exquisite, five-star, delicious","f":"vorzüglich","s":"— Der ganze Vorfall im Dorfe, vorzüglich die verhängnisvollen Worte des wahnsinnigen Weibes hatten mich nicht wenig aufgeregt.","n":8},{"w":"Förster","art":"der","ipa":"/ˈfœʁstɐ/","m":"forester","f":"Förster","s":"— Unwillkürlich schob ich, wie ich es noch oft aus alter Gewohnheit nicht lassen konnte, einige salbungsvolle Worte über die Kraft des Vertrauens auf Gott ein, und der Förster erheiterte sich immer mehr und mehr.","n":25},{"w":"Zug","art":"der","ipa":"/t͡suːk/","m":"train; platoon; pull; draught; drag, draught","f":"Züge","s":"Sehen Sie, mein Herr, sagte der Kleine, das sind die Hauptingredienzien Ihres äußern Anstandes, und wenn Sie es wünschen, so will ich, Ihre Züge, Ihre Gestalt, Ihre Sinnesart beachtend, etwas Caracalla, Abälard und Boccaz zusammengießen, und so in der Glut, …","n":6},{"w":"Schlaf","art":"der","ipa":"/ʃlaːf/","m":"sleep; temple","f":"Schlafe","s":"Meinen Protestationen unerachtet weckte er seine Frau, eine betagte, aber muntre, rührige Matrone, die, wiewohl aus dem Schlafe gestört, doch freundlich den Gast bewillkommnete und auf des Mannes Geheiß sogleich ein Abendessen zu bereiten anfing.","n":6},{"w":"rot","art":"","ipa":"/roːt/","m":"red; red-haired; redskin; Native American","f":"rote","s":"Eine spitze rote Nase, ein paar kleine, funkelnde Augen, ein langes Kinn und dazu ein aufgetürmtes, gepudertes Toupet, das, wie ich nachher wahrnahm, ganz unvermuteterweise hinten in einen Titus ausging, ein großes Jabot, ein brennend rotes Gilet, unter dem …","n":6},{"w":"Kunst","art":"die","ipa":"/kʊnst/","m":"art; artworks, works of art; craft","f":"Kunst","s":"— Sie ist fremd dem Pietro Belcampo, den die Kunst, die heilige, durchdringt.","n":6},{"w":"lebendig","art":"","ipa":"/leˈbɛndɪç/","m":"living, alive, animate","f":"lebendiger","s":"Immer lebendiger und lebendiger wurde die Heerstraße, und alles kündigte schon in der Ferne die reiche, lebhafte Handelsstadt an, der ich mich jetzt näherte.","n":6},{"w":"packen","art":"","ipa":"/ˈpakən/","m":"to pack; to get packed; to take; to beat it","f":"packen","s":"Endlich waren wir in meinem Zimmer; Belcampo half mir packen, bald war alles zur Reise bereit, ich drückte dem Kleinen mehrere Dukaten in die Hand, er sprang hoch auf vor Freude und rief laut: „Heisa, nun habe ich ehrenwertes Geld, lauter flimmerndes Gold mi…","n":6},{"w":"hell","art":"","ipa":"/hɛl/","m":"clear, bright, light; quick, clever; great","f":"hell","s":"Als die ersten Strahlen der Sonne durch den finstern Tannenwald brachen, befand ich mich an einem frisch und hell über glatte Kieselsteine dahinströmenden Bach.","n":7},{"w":"heulen","art":"","ipa":"/ˈhɔʏ̯lən/","m":"to howl, to whine; to weep, to cry","f":"heulte","s":"Eine helle Glocke im Hause schlug drei Uhr, da heulte er wie von entsetzlicher Qual ergriffen, aber dann brach er wieder aus in das schneidende Gelächter, wie ich es im Traum gehört, er schwenkte sich in wilden Sprüngen, er trank aus der Flasche und rannte d…","n":7},{"w":"Huhn","art":"das","ipa":"/huːn/","m":"chicken; hen","f":"Hühner","s":"Bis dahin tritt die Dämmerung ein, dann gehen wir auf den Anstand, da es, wie mir Franz sagt, Hühner gibt.","n":7},{"w":"stoßen","art":"","ipa":"/ˈʃtoːsn̩/","m":"to push; to shove; to thrust; to bump; to knock","f":"stieß","s":"— Ich fühlte mich von den Gästen angepackt, da ermannte ich mich, und wie ein wütender Stier drängte und stieß ich gegen die Menge, daß mehrere zur Erde stürzten und ich mir den Weg zur Tür bahnte.","n":7},{"w":"Qualität","art":"die","ipa":"/ˌkvaliˈtɛːt/","m":"quality","f":"Qualitäten","s":"Ihr kommt nicht eher von hinnen, bis Ihr uns, dem Richter hier am Orte umständlich gesagt, wer Ihr seid, mit allen Qualitäten, was Geburt, Stand und Würde anbelangt, auch woher Ihr gekommen und wohin Ihr zu reisen gedenkt, nach allen Qualitäten, der Lage des…","n":7},{"w":"Locke","art":"die","ipa":"/ˈlɔkə/","m":"curl","f":"Löckchen","s":"— Sie verstehen mich, mein Herr, denn Sie scheinen mir ein denkender Kopf, wie ich aus dem Löckchen schließe, das sich rechter Hand über Dero verehrte Stirn gelegt.“","n":7},{"w":"Ungetüm","art":"das","ipa":"[ˈʊnɡətyːm]","m":"monster","f":"Ungetüm","s":"— Aber ich erkannte die Nähe des Feindes, der mich in die wogende Flut der ich kaum entronnen, gewaltsam hineindrängen, mich vernichten wollte, und mir kam der Mut wieder, mich aufzulehnen gegen das Ungetüm, das in geheimnisvollem Dunkel auf mich einstürmte.","n":9}],[{"w":"Dame","art":"die","ipa":"/ˈdaːmə/","m":"lady; madam; queen; king; Dame; draughts","f":"Damen","s":"— Die Damen umringten sie, man stellte sich vor, sie sah mich an mit einem Blick, der Erstaunen, eine innere Bewegung verriet; sie lispelte einige Worte, die ich nicht verstand und kehrte sich dann zu einer alten Dame, der sie etwas leise sagte, worüber dies…","n":15},{"w":"Karte","art":"die","ipa":"/ˈkartə/","m":"card","f":"Karten","s":"Der Fürst rief mich zu sich, ich mußte neben ihm stehen, und er wählte meine Karten, nachdem er mir in kurzen Worten das Mechanische des Spiels erklärt.","n":11},{"w":"erhalten","art":"","ipa":"/ɛʁˈhaltən/","m":"to receive; to receive, to win","f":"erhielt","s":"Man sah wohl, wie die anständige Haltung in einer gewissen Ruhe und anspruchslosen Zierlichkeit, in der sich die Residenz erhielt, von dem Hofe ausging.","n":10},{"w":"Prinzessin","art":"die","ipa":"/pʁɪnˈt͡sɛsɪn/","m":"princess","f":"Prinzessinnen","s":"wo sind die Prinzessinnen?","n":32},{"w":"Gespräch","art":"das","ipa":"/ɡəˈʃpʁɛːç/","m":"conversation, chat, talk","f":"Gespräch","s":"Sie redete liebreich mit mehreren Frauenzimmern, die sich eben in der Allee befanden, während der Fürst mit einem ernsten Mann im interessanten, eifrigen Gespräch begriffen schien.","n":9},{"w":"Prinz","art":"der","ipa":"/pʁɪnt͡s/","m":"prince","f":"Prinzen","s":"Ich versuchte ihn über den Verlust dieses wackern Prinzen des längst vergangenen Jahrhunderts möglichst zu trösten, aber es war vergebens.","n":16},{"w":"ebenso","art":"","ipa":"/ˈeːbənzoː/","m":"equally, as much; likewise","f":"ebenso","s":"Er schrieb und zeichnete den Baumeistern mit ängstlicher Genauigkeit jedes Detail der Gebäude vor und jede geringe Abweichung von dem aufgestellten Muster, das er mühsam aus allen nur möglichen antiquarischen Werken herausgesucht, konnte ihn ebenso ängstigen…","n":10},{"w":"geheim","art":"","ipa":"/ɡəˈhaɪ̯m/","m":"secret, clandestine; familiar, dear","f":"geheimeren","s":"Diese Standbilder sind deshalb verbannt worden, und Sie finden nun nur einige gute Kopien nach der Antike, die der Fürst gewisser, ihm teurer Erinnerungen wegen gern im Park behalten wollte, die aber die Fürstin so geschickt — mit zartem Sinn des Fürsten inn…","n":8},{"w":"Verlust","art":"der","ipa":"[fɛɐ̯ˈlʊst]","m":"loss","f":"Verlust","s":"Gewinn und Verlust sind die beiden Angeln, auf denen sich die geheimnisvolle Maschine bewegt, die wir angestoßen, und die nun der ihr einwohnende Geist nach Willkür forttreibt.","n":11},{"w":"Wissenschaft","art":"die","ipa":"/ˈvɪsənʃaft/","m":"science; science, the sciences taken as a whole","f":"Wissenschaften","s":"Der Fürst liebt Künste und Wissenschaften, daher ist ihm jeder geschickte Künstler, jeder geistreiche Gelehrte willkommen, und der Grad seines Wissens nur ist die Ahnenprobe, die die Fähigkeit bestimmt, in der nächsten Umgebung des Fürsten erscheinen zu dürf…","n":8},{"w":"durchaus","art":"","ipa":"/dʊrçˈaʊ̯s/","m":"absolutely, fully, entirely","f":"durchaus","s":"Er schrieb und zeichnete den Baumeistern mit ängstlicher Genauigkeit jedes Detail der Gebäude vor und jede geringe Abweichung von dem aufgestellten Muster, das er mühsam aus allen nur möglichen antiquarischen Werken herausgesucht, konnte ihn ebenso ängstigen…","n":8},{"w":"Green","art":"das","ipa":"/ɡʁiːn/","m":"green, putting green","f":"Green","s":"Sollten Sie aber glauben, daß hier im Amtshause sich, beinahe ebenso lange als Herr Ewson bei mir ist, ein englischer Doktor aufhält, der Green heißt und mit Herrn Ewson darin sympathisiert, daß er ebenso originell, ebenso voll sonderbaren Humors ist?","n":8},{"w":"blasen","art":"","ipa":"/ˈblaːzən/","m":"to blow; to play","f":"geblasen","s":"Ermüdet, ja zerschlagen von der weiten Reise, warf ich mich in meinem Zimmer gleich ins Bette, um recht auszuschlafen, aber es mochte eben Eins geschlagen haben, als mich eine Flöte, die dicht neben mir geblasen wurde, weckte.","n":8},{"w":"Wirt","art":"der","ipa":"/vɪʁt/","m":"pubkeeper; innkeeper; host; agent; caretaker","f":"Wirt","s":"; ich entschloß mich in den stattlichen Gasthof einzukehren, wo mich ein freundlicher, aufgeweckter Wirt empfing.","n":23},{"w":"Kapelle","art":"die","ipa":"[kaˈpɛlə]","m":"chapel; band, ensemble","f":"Kapelle","s":"Als der Park angelegt wurde, war er leidenschaftlicher Baumeister und Gärtner, dann begeisterte ihn der Schwung, den seit einiger Zeit die Musik genommen, und dieser Begeisterung verdanken wir die Einrichtung einer ganz vorzüglichen Kapelle.","n":9},{"w":"Perücke","art":"die","ipa":"/peˈrʏkə/","m":"wig; periwig; peruke","f":"Perücke","s":"— Damit sprang ein kleiner, winddürrer Mann, in einem kaffeebraunen Rocke und fuchsroter runder Perücke, auf die er einen grauen Hut ganz schief und martialisch gestülpt, schnell zum Hause hinaus und lief nach dem Stalle, aus dem ich ihn bald auf einem zieml…","n":8},{"w":"gnädig","art":"","ipa":"/ˈɡnɛːdɪç/","m":"gracious; propitious; merciful","f":"gnädigster","s":"— „Mag das sein, gnädigster Herr,“ erwiderte ich, „aber ich fühle nur zu lebhaft, daß es nicht sowohl die Gefahr ist, durch bedeutenden Verlust in die übelste Lage zu geraten, welche dieses Spiel so verderblich macht, sondern vielmehr die Kühnheit, geradezu …","n":8},{"w":"äußern","art":"","ipa":"/ˈɔʏ̯sɐn/","m":"to utter; to say; to express","f":"äußere","s":"Selbst in der Kleidung und in dem Anstande der Einwohner bis auf den gemeinen Mann herrschte eine gewisse Zierlichkeit, ein Streben, äußere Bildung zu zeigen.","n":14},{"w":"Gemahl","art":"der","ipa":"/ɡəˈmaːl/","m":"spouse; husband","f":"Gemahlin","s":"Ich eilte um die bestimmte Stunde in den Park, der Fürst trat mit seiner Gemahlin und einer geringen Umgebung aus dem Schlosse.","n":10},{"w":"Zirkel","art":"der","ipa":"/ˈt͡sɪrkəl/","m":"pair of compasses, compass; circle","f":"Zirkel","s":"Ich äußerte ihm, als wir bei der Mahlzeit vertrauter geworden, meinen herzlichen Wunsch, der fürstlichen Familie näher zu treten, und er versicherte, daß nichts leichter sei als dieses, da jeder gebildete, geistreiche Fremde im Zirkel des Hofes willkommen wä…","n":9},{"w":"manch","art":"","ipa":"/manç/","m":"many a; many; some","f":"manche","s":"Zufällig stand ich bei einem aufgeweckten Mann, der mir auf alle mögliche Fragen Bescheid gab und manche muntere Anmerkung einzuflechten wußte.","n":9},{"w":"Residenz","art":"die","ipa":"/ʁeziˈdɛnt͡s/","m":"residence, abode; residency; capital","f":"Residenz","s":"Die Residenz des Fürsten bildete gerade den Gegensatz zu der Handelsstadt, die ich verlassen.","n":8},{"w":"geistreich","art":"","ipa":"[ˈɡaɪstˌʁaɪç]","m":"witty","f":"geistreichen","s":"— Die einfachsten, anspruchslosesten Gartenhäuser, Strohdächer auf Baumstämme gestützt und in anmutige Gebüsche versteckt, die eben jenen angedeuteten Zweck erreichten, meinte ich dagegen, wären mir lieber, als alle jene Tempelchen und Kapellchen; und sollte…","n":9},{"w":"Italienerin","art":"die","ipa":"","m":"female Italian","f":"Italienerin","s":"Franceskos Betragen änderte sich bald nach der Ankunft der Italienerin auf eine ganz auffallende Weise; es war, als zehre ein geheimer Gram an seiner Lebensblüte, er wurde mürrisch, verschlossen, er vernachlässigte seine fürstliche Geliebte.","n":8},{"w":"beweisen","art":"","ipa":"/bəˈvaɪ̯zən/","m":"to prove; to display, to show, to demonstrate","f":"bewies","s":"Das Gespräch wandte sich zur Kunst, ich bewies mich als guter Kenner der Malerei und als praktischer Tonkünstler, ich wagte manchen Widerspruch gegen seine Urteile, die geistreich und präcis seine innere Überzeugung aussprachen, aber auch wahrnehmen ließen, …","n":6},{"w":"Nase","art":"die","ipa":"/ˈnaːzə/","m":"nose; snout; dummy; a mild insult; common nase","f":"Nase","s":"Vorzüglich war es ein kleiner Mann mit gestützter Nase und lebhaft funkelnden Augen, schwarz gekleidet, den langen Stahldegen an der Seite, der, indem er sich mit unglaublicher Schnelle durch die Gesellschaft wand und schlängelte, und bald hier, bald dort wa…","n":6},{"w":"Gebäude","art":"das","ipa":"/ɡəˈbɔɪ̯də/","m":"building, edifice, structure","f":"Gebäude","s":"Der fürstliche Palast war nichts weniger als groß, auch nicht im großen Stil erbaut, aber Rücksichts der Eleganz, der richtigen Verhältnisse, eines der schönsten Gebäude, die ich jemals gesehen; an ihn schloß sich ein anmutiger Park, den der liberale Fürst d…","n":6},{"w":"freundlich","art":"","ipa":"/ˈfʁɔɪ̯ntlɪç/","m":"friendly, benign; nice, pleasant","f":"freundliche","s":"— Jedes Gesicht ist kunstmäßig in freundliche Falten gelegt, aber im Herzen Lug und Trug; sie schmelzen vor Freundschaft und Zärtlichkeit, sie bücken und krümmen sich, aber jeder ist des andern unversöhnlicher Feind und sucht ihm hinterlistig ein Bein zu ste…","n":6},{"w":"Rock","art":"der","ipa":"/ʁɔk/","m":"skirt; jacket; dress; rock","f":"Röcken","s":"So wie nach meiner, aus Romanen und Komödien gezogenen Theorie, der Fürst, als er mit mir im Park sprach, bei den Worten: ich bin der Fürst, eigentlich den Oberrock rasch aufknöpfen, und mir einen großen Stern entgegenblitzen lassen mußte, so sollten auch al…","n":6},{"w":"treiben","art":"","ipa":"/ˈtʁaɪ̯bm̩/","m":"to drive; to propel; to force; to put forth","f":"getrieben","s":"Die Freiheit, alles zu äußern was man denkt; die Geringfügigkeit der Abgaben und der daraus entspringende niedrige Preis aller Lebensbedürfnisse; das gänzliche Zurücktreten der Polizei, die nur dem boshaften Übermute ohne Geräusch Schranken setzt und weit en…","n":6},{"w":"wirken","art":"","ipa":"/ˈvɪrkən/","m":"to function, to be effective, to work","f":"wirken","s":"Diese Standbilder sind deshalb verbannt worden, und Sie finden nun nur einige gute Kopien nach der Antike, die der Fürst gewisser, ihm teurer Erinnerungen wegen gern im Park behalten wollte, die aber die Fürstin so geschickt — mit zartem Sinn des Fürsten inn…","n":6},{"w":"Spieler","art":"der","ipa":"/ˈʃpiːlɐ/","m":"agent noun of spielen; player","f":"Spieler","s":"— Sonst wurde viel getanzt, jetzt wird an Gesellschaftstagen eine Farobank gehalten, und der Fürst, ohne im mindesten eigentlicher Spieler zu sein, ergötzt er sich an den sonderbaren Verknüpfungen des Zufalls, doch bedarf es nur irgend eines Impulses, um wie…","n":7},{"w":"Umgebung","art":"die","ipa":"/ʊmˈɡeːbʊŋ/","m":"environment, vicinity, surroundings","f":"Umgebung","s":"Ich eilte um die bestimmte Stunde in den Park, der Fürst trat mit seiner Gemahlin und einer geringen Umgebung aus dem Schlosse.","n":7},{"w":"Begriff","art":"der","ipa":"/bəˈɡʁɪf/","m":"term, word; concept","f":"Begriff","s":"Schon im Begriff mich zu verlassen, kehrte der Fürst sich noch zu mir und frug: „Mit wem habe ich aber gesprochen?“","n":7},{"w":"heftig","art":"","ipa":"/ˈhɛftɪç/","m":"fierce, heavy, vehement, severe, violent","f":"heftig","s":"„Was Adel, was Adel,“ rief der Fürst heftig, „Sie sind, wie ich mich überzeugt habe, ein sehr unterrichteter, geistreicher Mann.","n":7},{"w":"Leibarzt","art":"der","ipa":"","m":"personal physician","f":"Leibarzt","s":"Es war des Fürsten Leibarzt.","n":16},{"w":"fürstlich","art":"","ipa":"","m":"princely; lavish, luxuriant","f":"fürstlichen","s":"Das Leben am fürstlichen Hofe.","n":13},{"w":"indessen","art":"","ipa":"","m":"nevertheless, and yet; while","f":"indessen","s":"„Ich bin ganz Ihrer Meinung,“ erwiderte mein Begleiter, „indessen rühren alle diese Gebäude, ja die Anlage des ganzen Parks von dem Fürsten selbst her, und dieser Umstand beschwichtigt, wenigstens bei uns Einheimischen, jeden Tadel.","n":9},{"w":"inner","art":"","ipa":"/ˈɪnɐ/","m":"inner","f":"innerste","s":"Diese Standbilder sind deshalb verbannt worden, und Sie finden nun nur einige gute Kopien nach der Antike, die der Fürst gewisser, ihm teurer Erinnerungen wegen gern im Park behalten wollte, die aber die Fürstin so geschickt — mit zartem Sinn des Fürsten inn…","n":11},{"w":"Irländer","art":"der","ipa":"/ˈɪʁlɛndɐ/","m":"synonym of Ire","f":"Irländer","s":"Offenbar war es, wie ich nachher einsah, Bosheit des Wirts, daß er das Gespräch geschickt auf nationelle Eigentümlichkeiten lenkte, und mich geradezu frug, ob ich wohl schon Irländer kennen gelernt und von ihren sogenannten Bulls etwas wisse?","n":10},{"w":"Amtmann","art":"der","ipa":"/ˈamtˌman/","m":"bailiff","f":"Amtmann","s":"Es fällt mir eben ein, daß Herr Ewson auf heute abend einen Punsch bei mir bestellt hat, zu dem er den Amtmann und den Doktor Green eingeladen.","n":9},{"w":"Flöte","art":"die","ipa":"/ˈfløːtə/","m":"flute; whistle","f":"Flöte","s":"Ermüdet, ja zerschlagen von der weiten Reise, warf ich mich in meinem Zimmer gleich ins Bette, um recht auszuschlafen, aber es mochte eben Eins geschlagen haben, als mich eine Flöte, die dicht neben mir geblasen wurde, weckte.","n":7},{"w":"lebhaft","art":"","ipa":"[ˈleːphaft]","m":"lively, active, buoyant or agile; brisk; allegro","f":"lebhaften","s":"— Der Fürst lächelte, und fuhr, mich mit seinen lebhaften, klaren Augen scharf anblickend, fort: „Ei, das sind kindische Seelen, die das behaupten, aber am Ende halten Sie mich wohl für einen Spieler, der Sie ins Garn locken will.","n":7},{"w":"neben","art":"","ipa":"/ˈneːbən/","m":"next to, beside, alongside, adjacent to, near, near to","f":"neben","s":"Der Fürst rief mich zu sich, ich mußte neben ihm stehen, und er wählte meine Karten, nachdem er mir in kurzen Worten das Mechanische des Spiels erklärt.","n":5},{"w":"Fuß","art":"der","ipa":"/fuːs/","m":"foot; footing; pedestal; metrical foot","f":"Fuß","s":"— Es kam mir ferner der herrliche Bull jenes Irländers in den Sinn, der mit einem jähzornigen Schotten zusammen in einem Bette schlief und den bloßen Fuß unter der Decke hervorgestreckt hatte.","n":5},{"w":"ähnlich","art":"","ipa":"/ˈɛːnlɪç/","m":"similar, alike, resembling","f":"ähnlich","s":"— bald sah ich nichts mehr als die Fürstin, sie, die meiner Pflegemutter so ähnlich war!","n":5},{"w":"Unterhaltung","art":"die","ipa":"","m":"conversation; entertainment","f":"Unterhaltungen","s":"Was aber den Wechsel der Unterhaltungen bei Hofe betrifft, so ist das wohl ein heitres Spiel im Leben, das jeder dem regsamen Fürsten zur Erholung vom ernsten, oft mühevollen Geschäft recht herzlich gönnen mag.“","n":5},{"w":"einzig","art":"","ipa":"/ˈaɪ̯nt͡sɪç/","m":"only, sole; unique","f":"einzigen","s":"Sie ließ sich alsbald in ein Gespräch mit mir ein, das, so schlau sie es anfing, bald den einzigen Zweck verriet, mich über meine Lebensverhältnisse auszufragen.","n":6},{"w":"unterbrechen","art":"","ipa":"/ʊntərˈbrɛçən/","m":"to interrupt","f":"unterbrochen","s":"Mehrere Straßen, worin Alleen gepflanzt, schienen mehr Anlagen eines Parks zu sein, als zur Stadt zu gehören; alles bewegte sich still und feierlich, selten von dem rasselnden Geräusch eines Wagens unterbrochen.","n":6},{"w":"versichert","art":"","ipa":"/fɛɐ̯ˈzɪçɐt/","m":"insured, covered","f":"versicherte","s":"Ich äußerte ihm, als wir bei der Mahlzeit vertrauter geworden, meinen herzlichen Wunsch, der fürstlichen Familie näher zu treten, und er versicherte, daß nichts leichter sei als dieses, da jeder gebildete, geistreiche Fremde im Zirkel des Hofes willkommen wä…","n":6}],[{"w":"Hals","art":"der","ipa":"/hals/","m":"neck; throat","f":"Halses","s":"Doch hat Medardus das rote Zeichen eines Kreuzes an der linken Seite des Halses, und wenn dieser Mann ...“","n":9},{"w":"herein","art":"","ipa":"[hɛˈʁaɪ̯n]","m":"in","f":"herein","s":"Mehrere Männer traten herein; bei dem Leuchten der Laterne, die einer von ihnen trug, erkannte ich sie für Polizeisoldaten.","n":9},{"w":"Verbrechen","art":"das","ipa":"/fərˈbrɛçən/","m":"a felony, indictable offence; a crime; crime","f":"Verbrechen","s":"Der Richter forderte mich auf, meine bisherigen Lebensverhältnisse genau anzugeben; ich bat ihn, mir erst die Ursache meiner plötzlichen Verhaftung zu sagen, er erwiderte, daß ich über das mir schuld gegebene Verbrechen zu seiner Zeit genau genug vernommen w…","n":14},{"w":"rennen","art":"","ipa":"[ˈʁɛnən]","m":"to run; to race; to sprint; to run over","f":"rannte","s":"Ich fühlte es, daß Aurelie nicht mehr in meiner Nähe war, doch wagte ich es nicht, aufzublicken, ich rannte fort durch die erleuchteten Säle.","n":8},{"w":"Wand","art":"die","ipa":"/vant/","m":"wall, partition","f":"Wände","s":"In den wunderlichen Reflexen, die der düstere, flackernde Schein der Lampe an Wände und Decke warf, grinsten mich allerlei verzerrte Gesichter an; ich löschte die Lampe aus, ich barg mich in die Strohkissen, aber gräßlicher tönte dann das dumpfe Stöhnen, das…","n":10},{"w":"Gewalt","art":"die","ipa":"/ɡəˈvalt/","m":"strong or violent force; violence; authority","f":"Gewalt","s":"— Mit aller Gewalt raffte ich mich zusammen.","n":9},{"w":"Braut","art":"die","ipa":"/bʁaʊ̯t/","m":"bride; a woman taking part in a marriage","f":"Braut","s":"Nun bist du seine Braut ...","n":8},{"w":"dunkel","art":"","ipa":"/ˈdʊŋkəl/","m":"dark; deep; vague, faint","f":"dunklen","s":"— So verkünden es uns die dunklen, weissagenden Stimmen, die aus jener, keinem irdischen Maßstab meßlichen Urzeit zu uns herübertönen, und wie in den Mysterien, die die Säuglinge der Natur feierten, ist uns ja auch der Tod das Weihfest der Liebe!","n":12},{"w":"klopfen","art":"","ipa":"/ˈklɔpfən/","m":"to knock, to rap; to throb","f":"klopfte","s":"— Eben schlich ich eines Tages durch den Park, nachsinnend, ob es ratsam sei, die Abendgesellschaft zu besuchen, die der Fürst ansagen lassen, als man von hinten her auf meine Schulter klopfte.","n":12},{"w":"Prozess","art":"der","ipa":"/pʁoˈt͡sɛs/","m":"lawsuit; process, procedure","f":"Prozesses","s":"Ich wußte, daß man hier gefährliche Verbrecher während des Prozesses einsperre.","n":10},{"w":"beinahe","art":"","ipa":"/baɪ̯ˈnaːə/","m":"almost; nearly","f":"beinahe","s":"es gibt die wunderlichsten Täuschungen, mein Herr Leonard; beinahe ist’s mir gewiß, daß man auf augenblicklichen Eindruck eine Hypothese gebaut hat, die vielleicht in wenigen Minuten in Nichts zerfällt.","n":10},{"w":"deutlich","art":"","ipa":"","m":"articulate, clear; distinct; considerable","f":"deutliches","s":"Ohne deutliches Bewußtsein, was mir drohen könne, glaubte ich zu fühlen, daß ich nun verloren sei.","n":9},{"w":"B","art":"das","ipa":"/beː/","m":"B-flat; B","f":"B","s":"In dem Augenblick kam mir auch ein junger Pole ins Gedächtnis, mit dem ich auf dem Seminar in B.","n":15},{"w":"Brief","art":"der","ipa":"/ˈbʁiːf/","m":"letter","f":"Briefe","s":"Nur einige mir unverständliche Notizen und mehrere an einen Grafen Viktorin gerichtete Briefe befanden sich darin.","n":7},{"w":"Schmerz","art":"der","ipa":"/ʃmɛʁts/","m":"physical pain, ache; physical pain","f":"Schmerz","s":"hat dich je solch namenloser Schmerz zermalmt, so stimme ein in den trostlosen Jammer des ergrauten Mönchs, der in finstrer Zelle der Sonnenzeit seiner Liebe gedenkend, das harte Lager mit blutigen Tränen netzt, dessen bange Todesseufzer in stiller Nacht dur…","n":7},{"w":"albern","art":"","ipa":"/ˈalbərn/","m":"goofy, silly, childish","f":"alberner","s":"Gewiß ist es am Ende ein alberner Tor, der ...“","n":7},{"w":"Verbrecher","art":"der","ipa":"/fɛɐ̯ˈbʁɛçɐ/","m":"criminal","f":"Verbrecher","s":"Ich wußte, daß man hier gefährliche Verbrecher während des Prozesses einsperre.","n":8},{"w":"unheimlich","art":"","ipa":"/ˈʊnˌhaɪ̯m.lɪç/","m":"uncanny, creepy, eerie; incredible, massive","f":"unheimlich","s":"Wohl mag mein ganzes Wesen gar unheimlich erschienen sein; denn ich bemerkte, wie mir alles scheu auswich, als ich die breite Haupttreppe mehr herabsprang als herabstieg.","n":8},{"w":"Kreuz","art":"das","ipa":"/ˈkʁɔʏ̯ts/","m":"cross; clubs; sharp sign, ♯; lower back","f":"Kreuzes","s":"Doch hat Medardus das rote Zeichen eines Kreuzes an der linken Seite des Halses, und wenn dieser Mann ...“","n":8},{"w":"wenden","art":"","ipa":"/ˈvɛndən/","m":"to turn something so as to cook or roast it from both sides","f":"wenden","s":"Überdem waren aller Augen auf Aurelien gerichtet, und so gelang es mir, im Kreise gleichgültiger Menschen mich zu drehen und zu wenden, ohne daß irgend einer mich sonderlich bemerkt oder gar angeredet hätte, welches mir unerträglich gewesen sein würde, da ic…","n":11},{"w":"blicken","art":"","ipa":"[ˈblɪkŋ̩]","m":"to look; to get, to understand","f":"blickend","s":"fing er sogleich an, und griff, starr mir ins Auge blickend, nach meinem Arm.","n":10},{"w":"gestehen","art":"","ipa":"/ɡəˈʃteːən/","m":"to confess, to admit; to make known","f":"gestehen","s":"— „Ich weiß,“ sagte ich, mich ziemlich unsanft losmachend, „ich weiß Ihre wunderlichen Reden nicht zu deuten, mein Herr, aber ich muß gestehen, daß, als ich Aurelien von den geschmückten Herrn umlagert sah, denen, wie Sie witzig bemerken, das Liebesfeuer aus…","n":13},{"w":"verderben","art":"","ipa":"/fɛɐ̯ˈdɛʁbən/","m":"to deprive of; to rob of; to ruin; to corrupt","f":"Verderben","s":"„Bin ich denn schuld an euerm Verderben?","n":8},{"w":"sanft","art":"","ipa":"/zanft/","m":"gentle","f":"sanft","s":"— Ich weiß nicht, ob ich diese Worte wirklich sprach, aber ich hörte mich selbst lachen und fuhr auf wie aus tiefem Traum, als der alte Hofmarschall, sanft meine Hand fassend, frug: „Worüber erfreuen Sie sich so, lieber Herr Leonard?“","n":10},{"w":"ahnen","art":"","ipa":"/ˈʔaːnən/","m":"to suspect, guess","f":"ahnen","s":"„Wenigstens hätten Sie aber doch gleich ahnen, daß man Sie mit dem wahnsinnigen Mönch verwechsle, und diesen als den Kapuziner Medardus bezeichnen sollen?“","n":8},{"w":"widerstehen","art":"","ipa":"/viːdəʁˈʃteːn/","m":"to withstand, to resist","f":"widerstehen","s":"— — Man sage nicht, daß das einfache Hauskleid das wahrhaft schöne Mädchen am besten ziere, der Putz der Weiber übt einen geheimnisvollen Zauber, dem wir nicht leicht widerstehen können.","n":10},{"w":"Unbekannte","art":"die","ipa":"","m":"female equivalent of Unbekannter: female stranger","f":"Unbekannter","s":"Unbekannter!","n":8},{"w":"F","art":"das","ipa":"/ɛf/","m":"F","f":"F","s":"Er nannte die Gegend, wo die Güter des Barons F.","n":10},{"w":"Geliebter","art":"der","ipa":"/ɡəˈliːptɐ/","m":"lover, romantic partner","f":"Geliebte","s":"— Als du die Geliebte zum erstenmal geschmückt sahst, fröstelte da nicht ein unerklärlich Gefühl dir durch Nerv und Adern?","n":8},{"w":"starren","art":"","ipa":"/ˈʃtarən/","m":"to stare, to gaze","f":"starr","s":"fing er sogleich an, und griff, starr mir ins Auge blickend, nach meinem Arm.","n":12},{"w":"Vermutung","art":"die","ipa":"[fɛɐ̯ˈmuːtʊŋ]","m":"guess; supposition; suspicion; conjecture","f":"Vermutungen","s":"Meinen ehemaligen Verhältnissen bei Hofe und der allgemeinen Achtung, die ich in der Tat so lange genossen hatte, mochte ich die höfliche Art danken, mit der man mich behandelte, wiewohl ich auch die Überzeugung darauf baute, daß nur Vermutungen, die hauptsä…","n":8},{"w":"fürchterlich","art":"","ipa":"/ˈfʏʁçtɐlɪç/","m":"frightening","f":"fürchterlich","s":"Darauf mich stützend, wollte ich auf irgend eine Weise ein Zusammentreffen mit Viktorin, ja selbst mit dem Medardus, für den man mich hielt, vorgeben; jenes Abenteuer auf dem Schlosse, das so fürchterlich endete, als von Hörensagen erzählen, und mich selbst,…","n":8},{"w":"Ähnlichkeit","art":"die","ipa":"/ˈɛːnlɪçkaɪ̯t/","m":"similarity, resemblance","f":"Ähnlichkeit","s":"Es muß also ein Fremder sein, der mich eines in früherer Zeit begangenen Verbrechens anklagt, und da ich mich von aller Schuld völlig rein fühle, so hat vielleicht nur eine unglückliche Ähnlichkeit die Vermutung meiner Schuld erregt; um so härter finde ich e…","n":11},{"w":"Kerker","art":"der","ipa":"/ˈkɛrkər/","m":"dungeon","f":"Kerker","s":"Ich wurde in den Kerker zurückgeführt.","n":10},{"w":"erwachen","art":"","ipa":"/ɛɐ̯ˈvaxn̩/","m":"to awake","f":"erwachte","s":"Als ich am hellen Morgen erwachte, kam mir nur nach und nach die Erinnerung dessen, was geschehen und wo ich hingebracht worden.","n":8},{"w":"erwidern","art":"","ipa":"/ɛrˈviːdərn/","m":"to reciprocate, return, to react with something analogous","f":"erwiderte","s":"Er frug mich, was ich da mache, ich erwiderte, daß ich nur hinausschauen wollen; schweigend trug er Tisch, Bette und den Stuhl fort und schloß mich sogleich wieder ein.","n":12},{"w":"Doppelgänger","art":"der","ipa":"/ˈdɔpl̩ɡɛŋɐ/","m":"doppelganger, doppelgänger","f":"Doppelgänger","s":"Er hielt mich für seinen Doppelgänger, dessen Erscheinung ihm den Tod verkünde.","n":11},{"w":"Adel","art":"der","ipa":"/ˈaːdəl/","m":"nobility","f":"Adel","s":"Nun, Herr Leonard, oder vielmehr Herr von Krczynski, Sie sind von Adel, ich fixiere Sie bei Hofe auf eine Art, die Ihnen angenehm sein soll.","n":10},{"w":"herauf","art":"","ipa":"/hɛˈʁaʊ̯f/","m":"up, upwards","f":"herauf","s":"— Der Abend kam, die Nacht brach ein, da hörte ich die Haustüre aufschließen, mehrere Stimmen murmelten und flüsterten durcheinander, es wandte und tappte die Treppe herauf — endlich pochte man an meine Türe und befahl mir, im Namen der Obrigkeit, aufzumachen.","n":10},{"w":"vergebens","art":"","ipa":"/fɛrˈɡeːbəns/","m":"in vain","f":"vergebens","s":"Er blieb in seiner ruhigen Dolcezza , obgleich erwähnter Konsistorialpräsident wirklich meinte, der Teufel habe aus Ihnen, mein Teurer, auf seine Art gelächelt und unsere schöne Aurelie von solchem Grausen und Entsetzen ergriffen wurde, daß alle Bemühungen d…","n":11},{"w":"Träne","art":"die","ipa":"/ˈtrɛːnə/","m":"tear","f":"Tränen","s":"hat dich je solch namenloser Schmerz zermalmt, so stimme ein in den trostlosen Jammer des ergrauten Mönchs, der in finstrer Zelle der Sonnenzeit seiner Liebe gedenkend, das harte Lager mit blutigen Tränen netzt, dessen bange Todesseufzer in stiller Nacht dur…","n":11},{"w":"vernehmen","art":"","ipa":"/fɛʁˈneːmən/","m":"to hear; to question, to examine","f":"vernommen","s":"Der Richter forderte mich auf, meine bisherigen Lebensverhältnisse genau anzugeben; ich bat ihn, mir erst die Ursache meiner plötzlichen Verhaftung zu sagen, er erwiderte, daß ich über das mir schuld gegebene Verbrechen zu seiner Zeit genau genug vernommen w…","n":10},{"w":"Umstand","art":"der","ipa":"/ˈʊmʃtant/","m":"circumstance; fuss, trouble, bother","f":"Umstande","s":"Jetzt komme es nur darauf an, meinen ganzen Lebenslauf bis zur Ankunft in der Residenz auf das genaueste zu wissen, und er müsse mich daran erinnern, daß es dem Kriminalgericht nicht an Mitteln fehlen würde, auch dem kleinsten von mir angegebenen Umstande na…","n":11},{"w":"entsetzen","art":"","ipa":"/ɛntˈzɛtsən/","m":"to shock, horrify, appall; to relieve","f":"Entsetzen","s":"Er blieb in seiner ruhigen Dolcezza , obgleich erwähnter Konsistorialpräsident wirklich meinte, der Teufel habe aus Ihnen, mein Teurer, auf seine Art gelächelt und unsere schöne Aurelie von solchem Grausen und Entsetzen ergriffen wurde, daß alle Bemühungen d…","n":17},{"w":"Geistlicher","art":"der","ipa":"/ˈɡaɪ̯stlɪçɐ/","m":"priest, clergyman, clergyperson, cleric","f":"Geistlichen","s":"Mein Vater, selbst ziemlich unterrichtet, billigte meinen entschiedenen Hang zu den Wissenschaften, und wollte mich eben nach Krakau zu einem ihm verwandten Geistlichen, Stanislaw Krczynski, schicken, als er starb.","n":9},{"w":"trostlos","art":"","ipa":"/ˈtʁoːstloːs/","m":"dreary, bleak, desolate, dismal; depressing","f":"trostlosen","s":"hat dich je solch namenloser Schmerz zermalmt, so stimme ein in den trostlosen Jammer des ergrauten Mönchs, der in finstrer Zelle der Sonnenzeit seiner Liebe gedenkend, das harte Lager mit blutigen Tränen netzt, dessen bange Todesseufzer in stiller Nacht dur…","n":9},{"w":"erblicken","art":"","ipa":"[ɛɐ̯ˈblɪkn̩]","m":"to sight, catch sight of","f":"erblickte","s":"Doch besser, wie damals, als ich Aurelien zum erstenmal im Schlosse des Barons erblickte, hemmte ich den Ausbruch meiner wahnsinnigen Leidenschaft.","n":9},{"w":"klein","art":"","ipa":"/klaɪ̯n/","m":"small, little, wee; small, little, young","f":"kleinsten","s":"Jetzt komme es nur darauf an, meinen ganzen Lebenslauf bis zur Ankunft in der Residenz auf das genaueste zu wissen, und er müsse mich daran erinnern, daß es dem Kriminalgericht nicht an Mitteln fehlen würde, auch dem kleinsten von mir angegebenen Umstande na…","n":6},{"w":"dauern","art":"","ipa":"/ˈdaʊ̯ɐn/","m":"to last, to continue, to persist; to grieve","f":"dauerte","s":"Nicht lange dauerte es, so wurde mein Bette gebracht und der Gefangenwärter frug mich, ob ich noch etwas zu meiner Bequemlichkeit wünsche?","n":6},{"w":"halb","art":"","ipa":"","m":"half, halfway","f":"halb","s":"— In der neunten Nacht mochte es sein, als ich, halb ohnmächtig von Grauen und Entsetzen, auf dem kalten Boden des Gefängnisses ausgestreckt lag.","n":6}],[{"w":"Rom","art":"der","ipa":"/ʁoːm/","m":"Rom, Romani","f":"Rom","s":"Haben wir das Glück, Euch ganz zu heilen, so könnt Ihr ruhig Eure Straße fortwandeln, denn wie ich höre, wollt Ihr nach Rom!“","n":11},{"w":"Gnade","art":"die","ipa":"/ˈɡnaːdə/","m":"grace, mercy, graciousness; pardon, clemency","f":"Gnade","s":"Dank sei es der ewigen Langmut und Gnade des Herren, Dank sei es der Fürsprache der Gebenedeiten und der Heiligen, daß ich errettet worden bin!“","n":9},{"w":"Ei","art":"das","ipa":"/aɪ̯/","m":"egg; something egg-shaped; testicle, ball; bucks","f":"Ei","s":"„Ei,“ sprach er, „wie sollen wir denn Euern Namen nicht wissen?","n":10},{"w":"Kleid","art":"das","ipa":"/klaɪ̯t/","m":"dress, gown; garment; clothes; pelt, plumage","f":"Kleid","s":"Ehrwürden wundern sich merklich über das schöne Kleid, das Ihnen angelegt worden, es scheint Ihnen überall wunderbar anzustehen und zu passen, besser als jenes nußbraune Kleid mit schnöden besponnenen Knöpfen, das mein ernsthafter, vernünftiger Damon Ihnen a…","n":7},{"w":"fliehen","art":"","ipa":"/ˈfliː.ən/","m":"to flee; to escape; to fly; to diverge; to avoid","f":"Fliehen","s":"„Fliehen, weiter fort!","n":7},{"w":"aufnehmen","art":"","ipa":"/ˈʔaʊ̯fneːmən/","m":"to pick up, lift up; to record, to take","f":"aufnehme","s":"Es wurde mir klar, daß mein bewußtloser Zustand eine Zeitlang gedauert haben, und daß ich in demselben auf diese oder jene Weise in ein Kloster gebracht sein mußte, das Kranke aufnehme.","n":7},{"w":"Höhle","art":"die","ipa":"/ˈhøːlə/","m":"cave; cavity","f":"Höhle","s":"Eine gute Strecke von Rom fand er eine Höhle, in die er sich ermüdet und ermattet verbarg.","n":10},{"w":"Sünde","art":"die","ipa":"/ˈzʏndə/","m":"sin","f":"Sünde","s":"„Du scheinst, mein Bruder,“ fing er an, „von schwerer Sünde belastet, denn nur die tiefste, trostloseste Reue über eine entsetzliche Tat kann sich so gebärden.","n":13},{"w":"malen","art":"","ipa":"/ˈmaːlən/","m":"to paint; to draw, depict","f":"malen","s":"Er half dem Alten manch wichtiges großes Werk vollenden, und es geschah, daß der Schüler, sich hinaufschwingend zu der Höhe des Meisters, berühmt wurde, und manches Altarblatt für Kirchen und Klöster malen mußte.","n":13},{"w":"Trost","art":"der","ipa":"/tʁoːst/","m":"consolation","f":"Trost","s":"— Keine Gnade — kein Trost mehr, hier und dort!","n":8},{"w":"Reue","art":"die","ipa":"/ˈʁɔɪ̯ə/","m":"repentance; remorse, regret","f":"Reue","s":"„Du scheinst, mein Bruder,“ fing er an, „von schwerer Sünde belastet, denn nur die tiefste, trostloseste Reue über eine entsetzliche Tat kann sich so gebärden.","n":8},{"w":"Qual","art":"die","ipa":"/kvaːl/","m":"agony, anguish, torment, torture","f":"Qual","s":"aber das fühlst du nicht, denn das ist nicht deine Qual — de
