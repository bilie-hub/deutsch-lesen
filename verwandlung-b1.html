he table with her hand as introduction, “we can’t carry on like this. Maybe you can’t see it, but I can. I don’t want to call this monster my brother, all I can say is: we have to try and get rid of it. We’ve done all that’s humanly possible to look after it and be patient, I don’t think anyone could accuse us of doing anything wrong.”","“She’s absolutely right”, said Gregor’s father to himself. His mother, who still had not had time to catch her breath, began to cough dully, her hand held out in front of her and a deranged expression in her eyes.","Gregor’s sister rushed to his mother and put her hand on her forehead. Her words seemed to give Gregor’s father some more definite ideas. He sat upright, played with his uniform cap between the plates left by the three gentlemen after their meal, and occasionally looked down at Gregor as he lay there immobile.","“We have to try and get rid of it”, said Gregor’s sister, now speaking only to her father, as her mother was too occupied with coughing to listen, “it’ll be the death of both of you, I can see it coming. We can’t all work as hard as we have to and then come home to be tortured like this, we can’t endure it. I can’t endure it any more.” And she broke out so heavily in tears that they flowed down the face of her mother, and she wiped them away with mechanical hand movements.","“My child”, said her father with sympathy and obvious understanding, “what are we to do?”","His sister just shrugged her shoulders as a sign of the helplessness and tears that had taken hold of her, displacing her earlier certainty.","“If he could just understand us”, said his father almost as a question; his sister shook her hand vigorously through her tears as a sign that of that there was no question.","“If he could just understand us”, repeated Gregor’s father, closing his eyes in acceptance of his sister’s certainty that that was quite impossible, “then perhaps we could come to some kind of arrangement with him. But as it is ...”","“It’s got to go”, shouted his sister, “that’s the only way, Father. You’ve got to get rid of the idea that that’s Gregor. We’ve only harmed ourselves by believing it for so long. How can that be Gregor? If it were Gregor he would have seen long ago that it’s not possible for human beings to live with an animal like that and he would have gone of his own free will. We wouldn’t have a brother any more, then, but we could carry on with our lives and remember him with respect. As it is this animal is persecuting us, it’s driven out our tenants, it obviously wants to take over the whole flat and force us to sleep on the streets. Father, look, just look”, she suddenly screamed, “he’s starting again!” In her alarm, which was totally beyond Gregor’s comprehension, his sister even abandoned his mother as she pushed herself vigorously out of her chair as if more willing to sacrifice her own mother than stay anywhere near Gregor. She rushed over to behind her father, who had become excited merely because she was and stood up half raising his hands in front of Gregor’s sister as if to protect her.","But Gregor had had no intention of frightening anyone, least of all his sister. All he had done was begin to turn round so that he could go back into his room, although that was in itself quite startling as his pain-wracked condition meant that turning round required a great deal of effort and he was using his head to help himself do it, repeatedly raising it and striking it against the floor. He stopped and looked round. They seemed to have realised his good intention and had only been alarmed briefly. Now they all looked at him in unhappy silence. His mother lay in her chair with her legs stretched out and pressed against each other, her eyes nearly closed with exhaustion; his sister sat next to his father with her arms around his neck.","“Maybe now they’ll let me turn round”, thought Gregor and went back to work. He could not help panting loudly with the effort and had sometimes to stop and take a rest. No-one was making him rush any more, everything was left up to him. As soon as he had finally finished turning round he began to move straight ahead. He was amazed at the great distance that separated him from his room, and could not understand how he had covered that distance in his weak state a little while before and almost without noticing it. He concentrated on crawling as fast as he could and hardly noticed that there was not a word, not any cry, from his family to distract him. He did not turn his head until he had reached the doorway. He did not turn it all the way round as he felt his neck becoming stiff, but it was nonetheless enough to see that nothing behind him had changed, only his sister had stood up. With his last glance he saw that his mother had now fallen completely asleep.","He was hardly inside his room before the door was hurriedly shut, bolted and locked. The sudden noise behind Gregor so startled him that his little legs collapsed under him. It was his sister who had been in so much of a rush. She had been standing there waiting and sprung forward lightly, Gregor had not heard her coming at all, and as she turned the key in the lock she said loudly to her parents “At last!”.","“What now, then?”, Gregor asked himself as he looked round in the darkness. He soon made the discovery that he could no longer move at all. This was no surprise to him, it seemed rather that being able to actually move around on those spindly little legs until then was unnatural. He also felt relatively comfortable. It is true that his entire body was aching, but the pain seemed to be slowly getting weaker and weaker and would finally disappear altogether. He could already hardly feel the decayed apple in his back or the inflamed area around it, which was entirely covered in white dust. He thought back of his family with emotion and love. If it was possible, he felt that he must go away even more strongly than his sister. He remained in this state of empty and peaceful rumination until he heard the clock tower strike three in the morning. He watched as it slowly began to get light everywhere outside the window too. Then, without his willing it, his head sank down completely, and his last breath flowed weakly from his nostrils.","When the cleaner came in early in the morning—they’d often asked her not to keep slamming the doors but with her strength and in her hurry she still did, so that everyone in the flat knew when she’d arrived and from then on it was impossible to sleep in peace—she made her usual brief look in on Gregor and at first found nothing special. She thought he was laying there so still on purpose, playing the martyr; she attributed all possible understanding to him. She happened to be holding the long broom in her hand, so she tried to tickle Gregor with it from the doorway. When she had no success with that she tried to make a nuisance of herself and poked at him a little, and only when she found she could shove him across the floor with no resistance at all did she start to pay attention. She soon realised what had really happened, opened her eyes wide, whistled to herself, but did not waste time to yank open the bedroom doors and shout loudly into the darkness of the bedrooms: “Come and ’ave a look at this, it’s dead, just lying there, stone dead!”","Mr. and Mrs. Samsa sat upright there in their marriage bed and had to make an effort to get over the shock caused by the cleaner before they could grasp what she was saying. But then, each from his own side, they hurried out of bed. Mr. Samsa threw the blanket over his shoulders, Mrs. Samsa just came out in her nightdress; and that is how they went into Gregor’s room. On the way they opened the door to the living room where Grete had been sleeping since the three gentlemen had moved in; she was fully dressed as if she had never been asleep, and the paleness of her face seemed to confirm this. “Dead?”, asked Mrs. Samsa, looking at the charwoman enquiringly, even though she could have checked for herself and could have known it even without checking. “That’s what I said”, replied the cleaner, and to prove it she gave Gregor’s body another shove with the broom, sending it sideways across the floor. Mrs. Samsa made a movement as if she wanted to hold back the broom, but did not complete it. “Now then”, said Mr. Samsa, “let’s give thanks to God for that”. He crossed himself, and the three women followed his example. Grete, who had not taken her eyes from the corpse, said: “Just look how thin he was. He didn’t eat anything for so long. The food came out again just the same as when it went in”. Gregor’s body was indeed completely dried up and flat, they had not seen it until then, but now he was not lifted up on his little legs, nor did he do anything to make them look away.","“Grete, come with us in here for a little while”, said Mrs. Samsa with a pained smile, and Grete followed her parents into the bedroom but not without looking back at the body. The cleaner shut the door and opened the window wide. Although it was still early in the morning the fresh air had something of warmth mixed in with it. It was already the end of March, after all.","The three gentlemen stepped out of their room and looked round in amazement for their breakfasts; they had been forgotten about. “Where is our breakfast?”, the middle gentleman asked the cleaner irritably. She just put her finger on her lips and made a quick and silent sign to the men that they might like to come into Gregor’s room. They did so, and stood around Gregor’s corpse with their hands in the pockets of their well-worn coats. It was now quite light in the room.","Then the door of the bedroom opened and Mr. Samsa appeared in his uniform with his wife on one arm and his daughter on the other. All of them had been crying a little; Grete now and then pressed her face against her father’s arm.","“Leave my home. Now!”, said Mr. Samsa, indicating the door and without letting the women from him. “What do you mean?”, asked the middle of the three gentlemen somewhat disconcerted, and he smiled sweetly. The other two held their hands behind their backs and continually rubbed them together in gleeful anticipation of a loud quarrel which could only end in their favour. “I mean just what I said”, answered Mr. Samsa, and, with his two companions, went in a straight line towards the man. At first, he stood there still, looking at the ground as if the contents of his head were rearranging themselves into new positions. “Alright, we’ll go then”, he said, and looked up at Mr. Samsa as if he had been suddenly overcome with humility and wanted permission again from Mr. Samsa for his decision. Mr. Samsa merely opened his eyes wide and briefly nodded to him several times. At that, and without delay, the man actually did take long strides into the front hallway; his two friends had stopped rubbing their hands some time before and had been listening to what was being said. Now they jumped off after their friend as if taken with a sudden fear that Mr. Samsa might go into the hallway in front of them and break the connection with their leader. Once there, all three took their hats from the stand, took their sticks from the holder, bowed without a word and left the premises. Mr. Samsa and the two women followed them out onto the landing; but they had had no reason to mistrust the men’s intentions and as they leaned over the landing they saw how the three gentlemen made slow but steady progress down the many steps. As they turned the corner on each floor they disappeared and would reappear a few moments later; the further down they went, the more that the Samsa family lost interest in them; when a butcher’s boy, proud of posture with his tray on his head, passed them on his way up and came nearer than they were, Mr. Samsa and the women came away from the landing and went, as if relieved, back into the flat.","They decided the best way to make use of that day was for relaxation and to go for a walk; not only had they earned a break from work but they were in serious need of it. So they sat at the table and wrote three letters of excusal, Mr. Samsa to his employers, Mrs. Samsa to her contractor and Grete to her principal. The cleaner came in while they were writing to tell them she was going, she’d finished her work for that morning. The three of them at first just nodded without looking up from what they were writing, and it was only when the cleaner still did not seem to want to leave that they looked up in irritation. “Well?”, asked Mr. Samsa. The charwoman stood in the doorway with a smile on her face as if she had some tremendous good news to report, but would only do it if she was clearly asked to. The almost vertical little ostrich feather on her hat, which had been a source of irritation to Mr. Samsa all the time she had been working for them, swayed gently in all directions. “What is it you want then?”, asked Mrs. Samsa, whom the cleaner had the most respect for. “Yes”, she answered, and broke into a friendly laugh that made her unable to speak straight away, “well then, that thing in there, you needn’t worry about how you’re going to get rid of it. That’s all been sorted out.” Mrs. Samsa and Grete bent down over their letters as if intent on continuing with what they were writing; Mr. Samsa saw that the cleaner wanted to start describing everything in detail but, with outstretched hand, he made it quite clear that she was not to. So, as she was prevented from telling them all about it, she suddenly remembered what a hurry she was in and, clearly peeved, called out “Cheerio then, everyone”, turned round sharply and left, slamming the door terribly as she went.","“Tonight she gets sacked”, said Mr. Samsa, but he received no reply from either his wife or his daughter as the charwoman seemed to have destroyed the peace they had only just gained. They got up and went over to the window where they remained with their arms around each other. Mr. Samsa twisted round in his chair to look at them and sat there watching for a while. Then he called out: “Come here, then. Let’s forget about all that old stuff, shall we. Come and give me a bit of attention”. The two women immediately did as he said, hurrying over to him where they kissed him and hugged him and then they quickly finished their letters.","After that, the three of them left the flat together, which was something they had not done for months, and took the tram out to the open country outside the town. They had the tram, filled with warm sunshine, all to themselves. Leant back comfortably on their seats, they discussed their prospects and found that on closer examination they were not at all bad—until then they had never asked each other about their work but all three had jobs which were very good and held particularly good promise for the future. The greatest improvement for the time being, of course, would be achieved quite easily by moving house; what they needed now was a flat that was smaller and cheaper than the current one which had been chosen by Gregor, one that was in a better location and, most of all, more practical. All the time, Grete was becoming livelier. With all the worry they had been having of late her cheeks had become pale, but, while they were talking, Mr. and Mrs. Samsa were struck, almost simultaneously, with the thought of how their daughter was blossoming into a well built and beautiful young lady. They became quieter. Just from each other’s glance and almost without knowing it they agreed that it would soon be time to find a good man for her. And, as if in confirmation of their new dreams and good intentions, as soon as they reached their destination Grete was the first to get up and stretch out her young body."]]}];</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

const WB = window.WOERTERBUCH || {};
const MISS = new Set(window.WOERTERBUCH_MISS || []);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = d => `<svg class="i" viewBox="0 0 24 24">${d}</svg>`;
const IC = {

  star: '<path d="M6 3h12v18l-6-4-6 4z"/>', speak: '<path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>',
  tr: '<path d="M4 5h9M8.5 3v2M6 5c.6 3 3 6 6 7.5M11 5c-.8 3.6-3.4 6.6-7 8M13 21l4-9 4 9M14.5 18h5"/>',
  go: '<path d="M5 12h14M13 6l6 6-6 6"/>', del: '<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>', copy: '<path d="M8 8h12v12H8zM4 16V4h12"/>',
};

/* ---------------- storage ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('elixiere:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('elixiere:' + k, JSON.stringify(v)); } catch (e) {} },
};
const settings = Object.assign({
  theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper',
  font: 'garamond', fs: 20, autoSent: false, anim: true, bi: true, gram: true,
}, store.get('settings', {}));
let vocab = store.get('vocab', []);
const trCache = store.get('tr', {});
const liveCache = store.get('live', {});

/* ---------------- elements & state ---------------- */
const root = document.documentElement;
const flow = $('#flow'), leafFlow = $('#leafFlow'), leaf = $('#leaf'), book = $('#book');
const CH_LEN = BOOK.map(c => c.html.length), TOTAL = CH_LEN.reduce((a, b) => a + b, 0);
let ch = 0, page = 0, pages = 1, step = 1, words = [], sel = -1, leafCh = -1, leafPages = 1;
let curSentence = null;

/* ---------------- layout ---------------- */
// Side page sources, each aligned paragraph by paragraph: e.g. [{id:'orig', label:'Kafka-Original'}, {id:'en', label:'English'}]
const ALT = window.ALT || [];
let altI = Math.max(0, ALT.findIndex(a => a.id === settings.alt));
const altParas = () => ALT[altI] ? ALT[altI].paras : null;
const hasEN = ci => !!(altParas() && altParas()[ci] && altParas()[ci].length);
const BOOK_HAS_EN = ALT.some(a => a.paras.some(x => x && x.length));
function renderAltHead() {
  const h = $('#enhead');
  if (!ALT.length) return;
  h.innerHTML = ALT.length > 1
    ? ALT.map((a, i) => `<button class="alttab ${i === altI ? 'on' : ''}" data-alt="${i}">${esc(a.label)}</button>`).join('') + (ALT[altI].note ? `<div class="altnote">${esc(ALT[altI].note)}</div>` : '')
    : `${esc(ALT[0].label)} <span>${ALT[0].note ? '· ' + esc(ALT[0].note) : ''}</span>`;
  $('#enpage').lang = ALT[altI].lang || 'en';
  const hasOrig = ALT.some(a => a.id === 'orig');
  $('#biBtn').innerHTML = hasOrig ? '<span class="lng en">Original</span>' : '<span class="lng">DE</span><span class="lng en">EN</span>';
  $('#biBtn').title = hasOrig ? 'Kafka-Original / Englisch daneben (E)' : 'Englisch daneben (E)';
}
const biOn = () => settings.bi && BOOK_HAS_EN;
function measure() {
  const bi = biOn(), side = bi && innerWidth >= 900;
  const wide = innerWidth >= (side ? 1420 : 980);
  document.body.classList.toggle('wide', wide);
  document.body.classList.toggle('bi', side);
  document.body.classList.toggle('bi-narrow', bi && !side);
  if (!(bi && !side)) document.body.classList.remove('show-en');
  const mobile = innerWidth < 640;
  const st = $('#stage').getBoundingClientRect();
  const ph = Math.floor(st.height - (mobile ? 14 : 36));
  // width-driven: ~65 characters per line, never wider than a book page; two pages side by side in bilingual mode
  const avail = st.width - (mobile ? 16 : 130);
  let pw = Math.min(side ? avail / 2 : avail, Math.round(settings.fs * 33), Math.max(Math.round(ph * 0.72), side ? 400 : 520));
  pw = Math.max(260, Math.floor(pw));
  const px = mobile ? 22 : Math.round(Math.max(30, pw * 0.085));
  const pt = mobile ? 42 : 62, pb = mobile ? 42 : 56;
  const W = pw - 2 * px, H = ph - pt - pb, G = 2 * px;
  step = W + G;
  root.style.setProperty('--pw', pw + 'px'); root.style.setProperty('--ph', ph + 'px');
  root.style.setProperty('--px', px + 'px'); root.style.setProperty('--pt', pt + 'px'); root.style.setProperty('--pb', pb + 'px');
  root.style.setProperty('--content-h', H + 'px');
  for (const f of [flow, leafFlow]) { f.style.columnWidth = W + 'px'; f.style.columnGap = G + 'px'; }
}
const pageOfIn = (el) => Math.max(0, Math.floor((el.offsetLeft + 2) / step));
const countPages = f => pageOfIn(f.querySelector('.eoc')) + 1;
const pageOf = el => pageOfIn(el);

function applyLook() {
  root.dataset.theme = settings.theme;
  root.dataset.font = settings.font;
  root.style.setProperty('--fs', settings.fs + 'px');
  document.querySelector('meta[name=viewport]');
}

/* ---------------- chapter rendering ---------------- */
const WORD = /[\p{L}\p{M}]+(?:[-'’][\p{L}\p{M}]+)*/gu;
function wrapWords(el) {
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (tw.nextNode()) nodes.push(tw.currentNode);
  for (const n of nodes) {
    const t = n.nodeValue; WORD.lastIndex = 0;
    let m, last = 0, frag = null;
    while ((m = WORD.exec(t))) {
      frag = frag || document.createDocumentFragment();
      if (m.index > last) frag.append(t.slice(last, m.index));
      const s = document.createElement('span'); s.className = 'w'; s.textContent = m[0]; frag.append(s);
      last = m.index + m[0].length;
    }
    if (!frag) continue;
    if (last < t.length) frag.append(t.slice(last));
    n.replaceWith(frag);
  }
}
function renderChapter(ci) {
  ch = ci; sel = -1; curSentence = null;
  if (window.CSS && CSS.highlights) CSS.highlights.delete('sent');
  flow.innerHTML = BOOK[ci].html + '<span class="eoc"></span>';
  wrapWords(flow);
  words = Array.from(flow.querySelectorAll('.w'));
  words.forEach((w, i) => { w._i = i; });
  flow.querySelectorAll('p').forEach((p, i) => { p._pi = i; });   // paragraph i ↔ English paragraph i
  $('#biBtn').hidden = !BOOK_HAS_EN;
  pages = countPages(flow);
  $('#runhead').textContent = BOOK[ci].title;
  $('#scrub').max = pages;
  renderToc();
  showEmpty();   // the "prepare this chapter" card belongs to the chapter
}
function ensureLeaf(ci) {
  leaf.style.display = 'block';   // must be laid out to count pages
  if (leafCh !== ci) { leafFlow.innerHTML = BOOK[ci].html + '<span class="eoc"></span>'; leafCh = ci; $('#leafHead').textContent = BOOK[ci].title; }
  leafPages = countPages(leafFlow);
}
const setFlowPage = (f, p) => { f.style.transform = `translate3d(${-p * step}px,0,0)`; };

function setPage(p) {
  page = Math.max(0, Math.min(pages - 1, p));
  setFlowPage(flow, page);
  $('#folio').textContent = page + 1;
  updateFoot();
  renderEN();
  savePos();
}

/* ---------------- English page ---------------- */
const enbody = $('#enbody');
let enKey = '';
const paraOf = w => { const p = w && w.closest('p'); return p && p._pi != null ? p._pi : -1; };
function renderEN() {
  if (!biOn()) { enbody.innerHTML = ''; enKey = ''; return; }
  if (!hasEN(ch)) { enKey = ''; enbody.innerHTML = '<p class="note">Für diese Seite gibt es keine Übersetzung.</p>'; return; }
  const E = altParas()[ch];
  const a = firstWordOnPage(page), n = firstWordOnPage(page + 1), b = n < 0 ? words.length - 1 : n - 1;
  const ps = new Set();
  for (let i = Math.max(a, 0); i <= b; i++) { const pi = paraOf(words[i]); if (pi >= 0) ps.add(pi); }
  const list = [...ps].sort((x, y) => x - y);
  const key = ch + ':' + list.join(',');
  if (key === enKey) return markEN();
  enKey = key;
  if (!list.length) { enbody.innerHTML = '<p class="note">(Titel – kein Text auf dieser Seite)</p>'; return; }
  const startsMid = a > 0 && paraOf(words[a - 1]) === list[0];
  const endsMid = b < words.length - 1 && paraOf(words[b + 1]) === list[list.length - 1];
  enbody.innerHTML = list.map((pi, k) => `<p data-pi="${pi}" class="${k === 0 && startsMid ? 'cont' : ''} ${k === list.length - 1 && endsMid ? 'more' : ''}">${E[pi] || ''}</p>`).join('');
  enbody.scrollTop = 0;
  enbody.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease-out' });
  markEN();
}
function markEN() {
  const pi = sel >= 0 ? paraOf(words[sel]) : -1;
  enbody.querySelectorAll('p.hl').forEach(p => p.classList.remove('hl'));
  const t = pi >= 0 && enbody.querySelector(`p[data-pi="${pi}"]`);
  if (t) { t.classList.add('hl'); t.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
let hovP = null;
function hoverPara(pi) {
  if (hovP === pi) return; hovP = pi;
  flow.querySelectorAll('p.hov').forEach(p => p.classList.remove('hov'));
  enbody.querySelectorAll('p.hov').forEach(p => p.classList.remove('hov'));
  if (pi == null || pi < 0 || !biOn()) return;
  const e = enbody.querySelector(`p[data-pi="${pi}"]`); if (e) e.classList.add('hov');
  const d = [...flow.querySelectorAll('p')][pi]; if (d) d.classList.add('hov');
}
flow.addEventListener('mouseover', e => { const p = e.target.closest('p'); hoverPara(p ? p._pi : null); });
flow.addEventListener('mouseleave', () => hoverPara(null));
enbody.addEventListener('mouseover', e => { const p = e.target.closest('p[data-pi]'); hoverPara(p ? +p.dataset.pi : null); });
enbody.addEventListener('mouseleave', () => hoverPara(null));
function toggleBi() {
  if (!BOOK_HAS_EN) return;
  if (innerWidth < 900) {   // small screens: flip between the German and the English page
    if (!settings.bi) { settings.bi = true; store.set('settings', settings); measure(); renderEN(); }
    document.body.classList.toggle('show-en');
    return;
  }
  settings.bi = !settings.bi; store.set('settings', settings);
  relayoutKeepingPlace();
  toast(settings.bi ? 'Englisch daneben – an' : 'Englisch daneben – aus');
}
$('#biBtn').onclick = toggleBi;
$('#enhead').addEventListener('click', e => {
  const b = e.target.closest('[data-alt]'); if (!b) return;
  altI = +b.dataset.alt; settings.alt = ALT[altI].id; store.set('settings', settings);
  enKey = ''; renderAltHead(); renderEN();
});
renderAltHead();
function updateFoot() {
  const done = CH_LEN.slice(0, ch).reduce((a, b) => a + b, 0) + CH_LEN[ch] * ((page + 1) / pages);
  store.set('progress:' + META.id, Math.round(done / TOTAL * 1000) / 10);
  $('#footChap').textContent = BOOK[ch].title;
  $('#footPg').textContent = `Seite ${page + 1} von ${pages} · ${Math.round(done / TOTAL * 100)} %`;
  const sc = $('#scrub'); sc.value = page + 1;
  sc.style.setProperty('--fill', (pages > 1 ? page / (pages - 1) * 100 : 100) + '%');
}
function firstWordOnPage(p) {
  let lo = 0, hi = words.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (pageOf(words[mid]) >= p) { ans = mid; hi = mid - 1; } else lo = mid + 1; }
  return ans;
}
let saveT;
function savePos() {
  clearTimeout(saveT);
  saveT = setTimeout(() => store.set(POS_KEY, { ch, w: sel >= 0 && pageOf(words[sel]) === page ? sel : firstWordOnPage(page) }), 250);
}

/* ---------------- page turning ---------------- */
let running = null;
function finishAnim() {
  if (!running) return;
  const r = running; running = null;
  clearTimeout(r.timer);
  r.anims.forEach(a => a.cancel());
  r.done();
}
const animOn = () => settings.anim && !reducedMotion;
const EASE = 'cubic-bezier(.42,.08,.32,1)', DUR = 640;

// dir>0: the current page lifts away to the left, revealing the next one underneath.
// dir<0: the previous page swings back in on top of the current one.
function flip(dir, target, swapIn) {
  finishAnim();
  if (!animOn()) {
    swapIn && swapIn();
    setPage(target);
    if (settings.anim === false) return;
    flow.parentElement.animate([{ opacity: .3 }, { opacity: 1 }], { duration: 160 });
    return;
  }
  const cast = $('#cast'), shade = $('#shade');
  let done;
  if (dir > 0) {
    ensureLeaf(ch);
    setFlowPage(leafFlow, page);
    $('#leafFolio').textContent = page + 1;
    leaf.style.display = 'block';
    swapIn && swapIn();
    setPage(target);
    done = () => { leaf.style.display = 'none'; };
    running = { done, anims: [
      leaf.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-100deg)' }], { duration: DUR, easing: EASE }),
      shade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DUR, easing: EASE }),
      cast.animate([{ opacity: .9 }, { opacity: .5, offset: .45 }, { opacity: 0 }], { duration: DUR, easing: EASE }),
    ] };
  } else {
    const ci = swapIn ? swapIn.ci : ch;
    ensureLeaf(ci);
    const tp = target < 0 ? leafPages - 1 : target;
    setFlowPage(leafFlow, tp);
    $('#leafFolio').textContent = tp + 1;
    leaf.style.display = 'block';
    done = () => { swapIn && swapIn(); setPage(tp); leaf.style.display = 'none'; if (swapIn && swapIn.after) swapIn.after(); };
    running = { done, anims: [
      leaf.animate([{ transform: 'rotateY(-100deg)' }, { transform: 'rotateY(0deg)' }], { duration: DUR, easing: EASE }),
      shade.animate([{ opacity: 1 }, { opacity: 0 }], { duration: DUR, easing: EASE }),
      cast.animate([{ opacity: 0 }, { opacity: .5, offset: .55 }, { opacity: .9 }], { duration: DUR, easing: EASE }),
    ] };
  }
  const r = running;
  const land = () => { if (running !== r) return; running = null; clearTimeout(r.timer); r.anims.forEach(a => a.cancel()); r.done(); keepVisible(); };
  r.anims[0].onfinish = land;
  r.timer = setTimeout(land, DUR + 150);   // animations can stall in background tabs; always land the page
}

function turn(dir, after) {
  if (dir > 0) {
    if (page < pages - 1) return flip(1, page + 1);
    if (ch < BOOK.length - 1) { const swap = () => { renderChapter(ch + 1); }; return flip(1, 0, swap), after && after(); }
    return toast('Ende des Buches');
  } else {
    if (page > 0) return flip(-1, page - 1);
    if (ch > 0) {
      const ci = ch - 1;
      const swap = () => renderChapter(ci); swap.ci = ci; swap.after = after;
      return flip(-1, -1, swap);
    }
    return toast('Anfang des Buches');
  }
}
function jumpTo(ci, wordIndex) {
  finishAnim();
  if (ci !== ch) renderChapter(ci);

async function mt(q) {
  q = q.slice(0, 480);

  try {
    const r = await fetch('https://api.mymemory.translated.net/get?langpair=de|en&q=' + encodeURIComponent(q));
    const j = await r.json();
    const t = j.responseData && j.responseData.translatedText;
    if (!t || j.responseStatus == 429 || /MYMEMORY WARNING/i.test(t)) return { err: 'Tageslimit der Übersetzung erreicht – morgen wieder verfügbar.' };
    trCache[q] = t;
    const keys = Object.keys(trCache); if (keys.length > 1500) delete trCache[keys[0]];
    store.set('tr', trCache);
    return t;
  } catch (e) { return { err: 'Keine Verbindung zum Übersetzer.' }; }
}

}

dscroll.addEventListener('click', e => {
  const look = e.target.closest('[data-look]');
  if (look) { showWord(look.dataset.look); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'prev') moveWord(-1);
  if (a === 'next') moveWord(1);
  if (a === 'save') toggleSave();
  if (a === 'savePhrase') toggleSave();
  if (a === 'speak') speak(current.word);
  if (a === 'speakPhrase') speak(current.word);
  if (a === 'sent') translateSentence();
  if (a === 'speakSent' && curSentence) speak(curSentence.text);
  if (a === 'gram') toggleGram();
});

/* ---------------- drawer: contents & vocab ---------------- */
let drawerTab = 'toc';
function renderToc() { if ($('#drawer').classList.contains('open')) renderDrawer(); }
function renderDrawer() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === drawerTab));
  const body = $('#drawerBody');
  if (drawerTab === 'toc') {
    const pos = store.get('done', {});
    body.innerHTML = `<div class="toc">${BOOK.map((c, i) => {
      const pct = i < ch ? 100 : i === ch ? Math.round((page + 1) / pages * 100) : (pos[i] || 0);
      return `<button data-ch="${i}" class="${i === ch ? 'cur' : ''}"><div class="t1">${esc(c.title)}</div><div class="t2">${esc(c.sub)}</div><div class="bar2"><i style="width:${pct}%"></i></div></button>`;
    }).join('')}</div>`;
  } else {
    body.innerHTML = vocab.length ? `<div class="vtools"><button class="pill" data-v="copy">${icon(IC.copy)} Liste kopieren (für Anki/Excel)</button></div>
      <div class="vocab">${vocab.map((v, k) => `<div class="item"><div class="vw">${esc(v.w)}</div><div class="vm">${esc(v.m || '–')}</div>${v.s ? `<div class="vs">${esc(v.s.length > 140 ? v.s.slice(0, 140) + ' …' : v.s)}</div>` : ''}
        <div class="ops"><button title="Zur Stelle springen" data-go="${k}">${icon(IC.go)}</button><button title="Anhören" data-say="${k}">${icon(IC.speak)}</button><button title="Löschen" data-del="${k}">${icon(IC.del)}</button></div></div>`).join('')}</div>`
      : `<div class="empty"><div class="mark">★</div><h3>Noch keine Wörter</h3><p>Wähle ein Wort und drücke <kbd>M</kbd><br>oder „Merken“, um es hier zu sammeln.</p></div>`;
  }
}
function openDrawer(tab) { drawerTab = tab; renderDrawer(); $('#drawer').classList.add('open'); $('#scrim').classList.add('show'); closePop(); }
function closeDrawer() { $('#drawer').classList.remove('open'); $('#scrim').classList.remove('show'); }
$('#tocBtn').onclick = () => openDrawer('toc');
$('#vocabBtn').onclick = () => openDrawer('vocab');
$('#scrim').onclick = () => { closeDrawer(); closePop(); };
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { drawerTab = t.dataset.tab; renderDrawer(); });
$('#drawerBody').addEventListener('click', e => {
  const c = e.target.closest('[data-ch]');
  if (c) { closeDrawer(); deselect(); jumpTo(+c.dataset.ch); return; }
  const g = e.target.closest('[data-go]'), d = e.target.closest('[data-del]'), s = e.target.closest('[data-say]'), cp = e.target.closest('[data-v="copy"]');
  if (g) {
    const v = vocab[+g.dataset.go], vb = v.b || 'elixiere';
    if (vb !== META.id) { location.href = vb + '.html#w=' + v.ch + ',' + v.i; return; }
    closeDrawer(); if (v.i >= 0) jumpTo(v.ch, v.i); else jumpTo(v.ch);
  }
  if (s) speak(vocab[+s.dataset.say].w);
  if (d) { vocab.splice(+d.dataset.del, 1); store.set('vocab', vocab); setCount(); renderDrawer(); }
  if (cp) {
    const tsv = vocab.map(v => [v.w, v.m, v.s].map(x => (x || '').replace(/\t|\n/g, ' ')).join('\t')).join('\n');
    navigator.clipboard.writeText(tsv).then(() => toast('Kopiert – in Anki/Excel einfügen'), () => toast('Kopieren nicht möglich'));
  }
});

/* ---------------- settings popover ---------------- */
function closePop() { $('#pop').classList.remove('open'); }
$('#setBtn').onclick = e => { e.stopPropagation(); $('#pop').classList.toggle('open'); syncSettingsUI(); };
document.addEventListener('click', e => { if (!e.target.closest('#pop,#setBtn')) closePop(); });
function syncSettingsUI() {
  document.querySelectorAll('#themes button').forEach(b => b.classList.toggle('on', b.dataset.theme === settings.theme));
  document.querySelectorAll('#fonts button').forEach(b => b.classList.toggle('on', b.dataset.font === settings.font));
  $('#fsVal').textContent = settings.fs + ' px';
  $('#autoSent').checked = settings.autoSent; $('#animTog').checked = settings.anim;
}
function saveSettings(relayout) {
  store.set('settings', settings); applyLook(); syncSettingsUI();
  if (relayout) relayoutKeepingPlace();
}
$('#themes').onclick = e => { const b = e.target.closest('button'); if (b) { settings.theme = b.dataset.theme; saveSettings(); } };
$('#fonts').onclick = e => { const b = e.target.closest('button'); if (b) { settings.font = b.dataset.font; saveSettings(true); } };
$('#fsDown').onclick = () => { settings.fs = Math.max(15, settings.fs - 1); saveSettings(true); };
$('#fsUp').onclick = () => { settings.fs = Math.min(30, settings.fs + 1); saveSettings(true); };
$('#autoSent').onchange = e => { settings.autoSent = e.target.checked; saveSettings(); };
$('#animTog').onchange = e => { settings.anim = e.target.checked; saveSettings(); };

/* ---------------- relayout ---------------- */
function relayoutKeepingPlace() {
  finishAnim();
  const anchor = sel >= 0 ? sel : firstWordOnPage(page);
  const go = () => {
    measure();
    pages = countPages(flow); $('#scrub').max = pages;
    leafCh = -1; enKey = '';
    setPage(anchor >= 0 ? pageOf(words[anchor]) : 0);
  };
  document.fonts ? document.fonts.ready.then(go) : go();
}
let rT, lastSize = '';
new ResizeObserver(() => {
  const r = $('#stage').getBoundingClientRect(), k = Math.round(r.width) + 'x' + Math.round(r.height);
  if (k === lastSize || !words.length) return; lastSize = k;
  clearTimeout(rT); rT = setTimeout(relayoutKeepingPlace, 120);
}).observe(document.body);

/* ---------------- input ---------------- */
$('#page').addEventListener('click', e => {
  if (e.target.tagName === 'IMG') return openLightbox(e.target.src);
  const s = getSelection(); if (s && !s.isCollapsed && s.toString().trim()) return;
  const w = e.target.closest('.w');
  if (w) return w._i === sel ? deselect() : select(w._i);
  const r = $('#page').getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x < .2) turn(-1); else if (x > .8) turn(1); else if (sel >= 0) deselect();
});
$('#page').addEventListener('mouseup', () => setTimeout(() => {
  const s = getSelection(); const t = s ? s.toString().replace(/\s+/g, ' ').trim() : '';
  if (t && /\s/.test(t) && t.length < 480) {
    if (sel >= 0 && words[sel]) words[sel].classList.remove('sel');
    sel = -1; curSentence = null; if (window.CSS && CSS.highlights) CSS.highlights.delete('sent');
    showPhrase(t);
  }
}, 0));
$('#prevBtn').onclick = () => turn(-1);
$('#nextBtn').onclick = () => turn(1);
$('#scrub').addEventListener('input', e => { finishAnim(); setPage(+e.target.value - 1); });
let tx = null, ty = null;
$('#page').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('#page').addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) turn(dx < 0 ? 1 : -1);
});
function openLightbox(src) { const lb = $('#lightbox'); lb.querySelector('img').src = src; lb.classList.add('show'); }
$('#lightbox').onclick = () => $('#lightbox').classList.remove('show');

addEventListener('keydown', e => {
  if ((e.target.matches && e.target.matches('input[type=text],textarea')) || e.ctrlKey || e.metaKey || e.altKey) return;
  const drawerOpen = $('#drawer').classList.contains('open');
  if (e.key === 'Escape') {
    if ($('#lightbox').classList.contains('show')) return $('#lightbox').classList.remove('show');
    if (drawerOpen) return closeDrawer();
    if ($('#pop').classList.contains('open')) return closePop();
    return deselect();
  }
  if (drawerOpen) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowLeft') {
    e.preventDefault();
    const d = k === 'ArrowRight' ? 1 : -1;
    if (sel >= 0 && !e.shiftKey) moveWord(d); else turn(d);
  } else if (k === 'ArrowDown' && sel >= 0) { e.preventDefault(); moveSentence(1); }
  else if (k === 'ArrowUp' && sel >= 0) { e.preventDefault(); moveSentence(-1); }
  else if (k === 'PageDown' || (k === ' ' && sel < 0)) { e.preventDefault(); turn(1); }
  else if (k === 'PageUp') { e.preventDefault(); turn(-1); }
  else if (k === 'Home' && sel < 0) { finishAnim(); setPage(0); }
  else if (k === 'End' && sel < 0) { finishAnim(); setPage(pages - 1); }
  else if ((k === 's' || k === 'S' || k === 'Enter') && curSentence) { e.preventDefault(); translateSentence(); }
  else if ((k === 'm' || k === 'M') && current) toggleSave();
  else if ((k === 'a' || k === 'A') && current) speak(current.word);
  else if (k === 't' || k === 'T') openDrawer('toc');
  else if (k === 'e' || k === 'E') toggleBi();
  else if ((k === 'g' || k === 'G') && curSentence) toggleGram();
});

function setCount() {
  const b = $('#vocabCount'); b.textContent = vocab.length; b.dataset.n = vocab.length;
  const srs = store.get('srs', {}), now = Date.now();
  const due = vocab.filter(v => !srs[v.w] || srs[v.w].due <= now).length;
  const d = $('#dueCount'); d.textContent = due; d.dataset.n = due;
}
/* ---------------- toast ---------------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

/* ---------------- start ---------------- */
applyLook();
setCount();
showEmpty();
const start = () => {
  measure();
  let pos = store.get(POS_KEY, { ch: META.start, w: 0 });
  const h = location.hash.match(/^#w=(d+),(-?d+)/);   // jump from "Meine Wörter" in another book
  if (h) { pos = { ch: +h[1], w: Math.max(0, +h[2]) }; history.replaceState(null, '', location.pathname); }
  renderChapter(Math.min(pos.ch, BOOK.length - 1));
  setPage(words[pos.w] ? pageOf(words[pos.w]) : 0);
  book.classList.add('ready');
  if (!window.WOERTERBUCH) setTimeout(() => toast('Offline-Wörterbuch fehlt – Nachschlagen online (langsamer)'), 800);
};
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 2500))]).then(start);
})();
</script>
