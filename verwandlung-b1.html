","s":"»Das frühe Aufstehen macht einen ganz dumm«, dachte er.","n":4},{"w":"Treppe","art":"die","ipa":"/ˈtʁɛpə/","m":"stairs","f":"Treppe","s":"Man sah die Treppe nach unten.","n":4},{"w":"Stoff","art":"der","ipa":"/ʃtɔf/","m":"stuff, matter, substance; substance; dope","f":"Stoffe","s":"Auf dem Tisch lagen Stoffe – Gregor war Handelsreisender und verkaufte Stoffe.","n":4},{"w":"offen","art":"","ipa":"/ˈɔfən/","m":"open; frank, candid; honest, sincere","f":"offen","s":"Die Wohnungstür blieb offen.","n":3},{"w":"Reise","art":"die","ipa":"/ˈʁaɪ̯zə/","m":"journey, travel; trip","f":"Reisen","s":"Jeden Tag bin ich auf Reisen.","n":3},{"w":"Kraft","art":"die","ipa":"/kʁaft/","m":"power, force, strength; force; worker, employee","f":"Kraft","s":"Am Ende stieß sich Gregor mit aller Kraft nach vorne – in die falsche Richtung.","n":3},{"w":"Rücken","art":"der","ipa":"/ˈʁʏkn̩/","m":"back; back pain, especially chronic back pain","f":"Rücken","s":"Er lag auf seinem harten Rücken.","n":3},{"w":"antworten","art":"","ipa":"/ˈantvɔʁtn̩/","m":"to answer, to reply","f":"antwortete","s":"Gregor antwortete – und erschrak.","n":3},{"w":"Schritt","art":"der","ipa":"[ʃʁɪtʰ]","m":"step, footstep; walk; crotch; a pace","f":"Schritte","s":"Aber als Antwort hörte er nur die festen Schritte des Prokuristen in seinen glänzenden Stiefeln.","n":3},{"w":"Schmerz","art":"der","ipa":"/ʃmɛʁts/","m":"physical pain, ache; physical pain","f":"Schmerz","s":"Erst als er einen neuen, dumpfen Schmerz in der Seite spürte, hörte er auf.","n":3},{"w":"hängen","art":"","ipa":"/ˈhɛŋən/","m":"to hang, to be suspended; to be attached to","f":"hing","s":"Über dem Tisch hing ein Bild in einem schönen goldenen Rahmen.","n":3},{"w":"Zeitung","art":"die","ipa":"/ˈt͡saɪ̯tʊŋ/","m":"newspaper; tidings, news","f":"Zeitung","s":"Er liest die Zeitung oder studiert Fahrpläne.","n":3},{"w":"Stock","art":"der","ipa":"/ʃtɔk/","m":"stick; stick, staff; floor, storey, level","f":"Stock","s":"Er nahm den Stock des Prokuristen in "gesund","s":"Und eigentlich fühlte sich Gregor ganz gesund.","n":2},{"w":"schließen","art":"","ipa":"[ˈʃliːsn̩]","m":"to shut; to close; to shut down; to lock; to end","f":"schloss","s":"Er schloss die Augen, damit er die zappelnden Beine nicht sehen musste.","n":2},{"w":"halb","art":"","ipa":"","m":"half, halfway","f":"halb","s":"Es war halb sieben, schon fast Viertel vor sieben!","n":2},{"w":"verdienen","art":"","ipa":"/fɛɐ̯ˈdiːnən/","m":"to make money, to earn; to deserve","f":"verdiene","s":"Das Reisen ist anstrengend, aber ohne Reisen verdiene ich kein Geld.","n":2},{"w":"Wind","art":"der","ipa":"/vɪnt/","m":"wind","f":"Wind","s":"Es klang wie Wind.","n":2},{"w":"schreien","art":"","ipa":"/ˈʃʁaɪ̯ən/","m":"to shout; to yell; to cry; to scream; to howl","f":"schrie","s":"Sie streckte die Arme aus und schrie: »Hilfe, um Gottes willen, Hilfe!«","n":2},{"w":"Frühstück","art":"das","ipa":"/ˈfʁyːʃtʏk/","m":"breakfast","f":"Frühstück","s":"Wenn ich morgens ins Hotel zurückkomme, sitzen sie noch beim Frühstück.","n":2},{"w":"Schloss","art":"das","ipa":"/ʃlɔs/","m":"lock, padlock; lock; castle","f":"Schloss","s":"Dann wollte er den Schlüssel im Schloss drehen – mit dem Mund.","n":2},{"w":"hinein","art":"","ipa":"[hɪˈnaɪ̯n]","m":"in","f":"hinein","s":"»Darf der Herr Prokurist jetzt zu dir hinein?«","n":2},{"w":"klopfen","art":"","ipa":"/ˈklɔpfən/","m":"to knock, to rap; to throb","f":"klopfte","s":"Jemand klopfte vorsichtig an die Tür.","n":2},{"w":"drücken","art":"","ipa":"/ˈdʁʏkən/","m":"to press, to push; to squeeze; to hug","f":"drückte","s":"Dann drückte er mit dem Kopf die Klinke herunter.","n":2},{"w":"Bauch","art":"der","ipa":"/baʊ̯x/","m":"abdomen, belly","f":"Bauch","s":"Wenn er den Kopf ein wenig hob, sah er seinen braunen, runden Bauch.","n":2},{"w":"springen","art":"","ipa":"/ˈʃpʁɪŋən/","m":"to spring; to leap; to bounce; to dive; to jump","f":"sprang","s":"Da sprang die Mutter plötzlich auf.","n":2},{"w":"treiben","art":"","ipa":"/ˈtʁaɪ̯bm̩/","m":"to drive; to propel; to force; to put forth","f":"trieb","s":"Damit trieb er Gregor in sein Zimmer zurück.","n":2},{"w":"erschrecken","art":"","ipa":"/ɛʁˈʃʁɛkən/","m":"to be frightened; to be startled; to frighten","f":"erschrak","s":"Gregor antwortete – und erschrak.","n":3}],[{"w":"Wand","art":"die","ipa":"/vant/","m":"wall, partition","f":"Wänden","s":"Darum begann er, an den Wänden und an der Decke herumzukriechen.","n":7},{"w":"Möbel","art":"das","ipa":"/ˈmøːbəl/","m":"piece of furniture; furniture","f":"Möbel","s":"Sie wollte ihm mehr Platz machen und die Möbel hinaustragen, vor allem den Kasten und den Schreibtisch.","n":9},{"w":"kriechen","art":"","ipa":"/ˈkʁiːçn̩/","m":"to creep; to crawl","f":"kroch","s":"Langsam kroch er zur Tür.","n":8},{"w":"Kanapee","art":"das","ipa":"/ˈkanapeː/","m":"canapé; hors d'oeuvre; sofa; couch","f":"Kanapee","s":"Ohne viel nachzudenken, kroch er unter das Kanapee, ein altes Sofa.","n":10},{"w":"tief","art":"","ipa":"/tiːf/","m":"deep; deep, profound; low","f":"tiefen","s":"Erst am Abend, als es schon dunkel wurde, wachte Gregor aus einem tiefen, schweren Schlaf auf.","n":5},{"w":"leer","art":"","ipa":"/leːɐ̯/","m":"empty","f":"leere","s":"Aber das hohe, leere Zimmer machte ihm Angst – obwohl er schon fünf Jahre darin wohnte.","n":5},{"w":"hinaus","art":"","ipa":"/hɪˈnaʊ̯s/","m":"out","f":"hinaus","s":"Sie sah den vollen Milchnapf und trug ihn hinaus – mit einem Tuch, nicht mit der bloßen Hand.","n":5},{"w":"Kaste","art":"die","ipa":"/ˈkastə/","m":"caste","f":"Kasten","s":"Sie wollte ihm mehr Platz machen und die Möbel hinaustragen, vor allem den Kasten und den Schreibtisch.","n":7},{"w":"werfen","art":"","ipa":"/ˈvɛrfən/","m":"to throw; to cast; to project; to give birth","f":"warf","s":"Die Schwester fegte alle Reste zusammen, auch das, was er nicht berührt hatte, und warf alles weg.","n":4},{"w":"Schreibtisch","art":"der","ipa":"/ˈʃʁaɪ̯pˌtɪʃ/","m":"desk, cabinet","f":"Schreibtisch","s":"Sie wollte ihm mehr Platz machen und die Möbel ":"nächstes","s":"Gregor hatte einen geheimen Plan: Er wollte sie nächstes Jahr aufs Konservatorium schicken, obwohl das sehr teuer war.","n":2},{"w":"Flasche","art":"die","ipa":"/ˈflaʃə/","m":"bottle; flask; flagon; loser; wimp","f":"Flasche","s":"Eine Flasche fiel auf den Boden und zerbrach.","n":2},{"w":"dankbar","art":"","ipa":"","m":"grateful, thankful","f":"dankbar","s":"Später gewöhnten sich alle daran: Gregor brachte das Geld, und die Familie nahm es dankbar.","n":2},{"w":"nachdenken","art":"","ipa":"/ˈnaːxˌdɛŋkŋ̩/","m":"to think, to reflect, to ponder","f":"nachzudenken","s":"Jetzt hatte er Zeit, über sein neues Leben nachzudenken.","n":2},{"w":"atmen","art":"","ipa":"/ˈaːtmən/","m":"to breathe","f":"atmete","s":"Auch wenn es kalt war, blieb sie eine Weile am Fenster und atmete tief.","n":2},{"w":"Mühe","art":"die","ipa":"/ˈmyːə/","m":"effort, difficulty","f":"Mühe","s":"Oder er schob mit großer Mühe einen Stuhl zum Fenster, kletterte hinauf und sah hinaus.","n":2},{"w":"trauen","art":"","ipa":"/ˈtʁaʊ̯ən/","m":"to trust; to marry; to dare, to be brave enough","f":"traute","s":"Jemand wollte offenbar hereinkommen, traute sich aber nicht.","n":2},{"w":"frisch","art":"","ipa":"/fʁɪʃ/","m":"fresh; recent","f":"frischen","s":"Die frischen Sachen mochte er überhaupt nicht – er konnte nicht einmal ihren Geruch ertragen.","n":2},{"w":"Medizin","art":"die","ipa":"/(ˌ)me.di.ˈtsiːn/","m":"medicine","f":"Medizin","s":"Sie lief ins Nebenzimmer, um Medizin für die Mutter zu holen.","n":2},{"w":"ertragen","art":"","ipa":"/ɛʁˈtʁaːɡən/","m":"to bear, to stand, to endure, to take, to suffer, to tolerate, to handle","f":"ertragen","s":"Die frischen Sachen mochte er überhaupt nicht – er konnte nicht einmal ihren Geruch ertragen.","n":2},{"w":"hinterher","art":"","ipa":"/ˈhɪntɐˌhɛɐ̯/","m":"behind; afterwards","f":"hinterher","s":"Ein Beinchen war am Morgen schwer verletzt worden und schleppte leblos hinterher.","n":2},{"w":"schieben","art":"","ipa":"/ˈʃiːbən/","m":"to push; to shove; to slide; to slip; to put","f":"schob","s":"Oder er schob mit großer Mühe einen Stuhl zum Fenster, kletterte hinauf und sah hinaus.","n":3},{"w":"Wohnzimmer","art":"das","ipa":"/ˈvoːnˌt͡sɪmɐ/","m":"living room","f":"Wohnzimmer","s":"Durch den Türspalt sah Gregor, dass im Wohnzimmer Licht brannte.","n":3},{"w":"Apfel","art":"der","ipa":"/ˈapfəl/","m":"apple; apple tree; breasts","f":"Apfel","s":"Es war ein Apfel.","n":3},{"w":"unruhig","art":"","ipa":"/ˈʊnʁuːɪç/","m":"noisy; anxious, restless","f":"unruhiger","s":"Erst am Mittag kam sie wieder, und sie war unruhiger als sonst.","n":3},{"w":"Anfang","art":"der","ipa":"/ˈʔanfaŋ/","m":"start, beginning, origin","f":"Anfang","s":"Am Anfang sprachen alle fast nur über ihn.","n":1},{"w":"süß","art":"","ipa":"/zyːs/","m":"sweet; cute","f":"süßer","s":"Dort stand ein Napf mit süßer Milch und kleinen Stücken Weißbrot.","n":1},{"w":"herum","art":"","ipa":"/hɛɐ̯ˈʁʊm/","m":"about, around.","f":"herum","s":"Voller Angst und Schuldgefühle kroch er überall herum: über die Wände, die Möbel, die Decke.","n":1}],[{"w":"Geige","art":"die","ipa":"/ˈɡaɪ̯ɡə/","m":"violin, fiddle","f":"Geige","s":"An diesem Abend hörte man aus der Küche die Geige.","n":8},{"w":"mittel","art":"","ipa":"/ˈmɪtəl/","m":"middle, in the middle; average, middling; mid","f":"mittlere","s":"Der mittlere Herr war offenbar der Chef der drei.","n":6},{"w":"Bedienerin","art":"die","ipa":"[bəˈdiːnəʁɪn]","m":"a female assistent; a female help","f":"Bedienerin","s":"Stattdessen kam morgens und abends eine riesige, knochige Bedienerin mit weißen Haaren für die schwerste Arbeit.","n":13},{"w":"Küche","art":"die","ipa":"/ˈkʏçə/","m":"kitchen; cuisine","f":"Küche","s":"Sie wollten überall Ordnung, besonders in der Küche.","n":5},{"w":"lächeln","art":"","ipa":"/ˈlɛçəln/","m":"to smile","f":"lächelten","s":"Dann schlief er gleich wieder ein, und Mutter und Schwester lächelten sich müde an.","n":4},{"w":"schwach","art":"","ipa":"/ˈʃvax/","m":"weak, lacking in strength; weak","f":"schwach","s":"Er war enttäuscht und schwach vor Hunger.","n":4},{"w":"umdrehen","art":"","ipa":"/ˈʔʊmdʁeːən/","m":"to twist, to turn, to turn around","f":"umdrehte","s":", fragte sie, als Gregor sich umdrehte.","n":5},{"w":"Finger","art":"der","ipa":"/ˈfɪŋɐ/","m":"finger","f":"Finger","s":", rief der mittlere Herr und zeigte mit dem Finger auf Gregor.","n":3},{"w":"Fleisch","art":"das","ipa":"/flaɪ̯ʃ/","m":"flesh; meat; pulp","f":"Fleisch","s":"So blieb er im Fleisch stecken.","n":3},{"w":"Tier","art":"das","ipa":"/tiːr/","m":"animal; hind","f":"Tier","s":"War er ein Tier, wenn ihn Musik so ergriff?","n":3},{"w":"stören","art":"","ipa":"/ʃtøːɐ̯n/","m":"to disturb, to interfere, to bother","f":"störte","s":"Das störte ihn nicht sehr.","n":3},{"w":"morgens","art":"","ipa":"/ˈmɔʁɡəns/","m":"in the morning, a.m.","f":"morgens","s":"Stattdessen kam morgens und abends eine riesige, knochige Bedienerin mit weißen Haaren für die schwerste Arbeit.","n":3},{"w":"merken","art":"","ipa":"/ˈmɛʁkŋ̍/","m":"to notice, to sense, to be able to tell","f":"merkte","s":"Bald merkte er, dass er sich gar nicht mehr bewegen konnte.","n":3},{"w":"abends","art":"","ipa":"/ˈaːbən(t)s/","m":"in the evening, at night, see Abend","f":"abends","s":"Stattdessen kam morgens und abends eine riesige, knochige Bedienerin mit weißen Haaren für die schwerste Arbeit.","n":3},{"w":"Uniform","art":"die","ipa":"/ˈʊniˌfɔʁm/","m":"uniform","f":"Uniform","s":"Der Vater zog seine Uniform auch zu Hause nicht aus.","n":3},{"w":"heben","art":"","ipa":"/ˈheːbən/","m":"to lift; to raise; to heave; to hoist; to rise","f":"hob","s":"Sie hob einfach einen Stuhl hoch und wartete, um ihn auf Gregors Rücken zu schlagen.","n":4},{"w":"Besen","art":"der","ipa":"/ˈbeː.zn̩/","m":"broom","f":"Besen","s":"Am Abend kehrte sie es mit dem Besen wieder hinaus – egal, ob er es gegessen hatte oder nicht.","n":4},{"w":"Brief","art":"der","ipa":"/ˈbʁiːf/","m":"letter","f":"Briefe","s":"Frau Samsa und Grete beugten sich über ihre Briefe.","n":2},{"w":"sauber","art":"","ipa":"/ˈzaʊ̯bɐ/","m":"clean; neat, tidy; good, all right; pretty, cute","f":"sauber","s":"Früher hatte er sich mehrmals am Tag am Teppich sauber gerieben.","n":2},{"w":"Hals","art":"der","ipa":"/hals/","m":"neck; throat","f":"Hals","s":"Sie würde vor Rührung weinen, und er würde ihren Hals küssen.","n":2},{"w":"Gespräch","art":"das","ipa":"/ɡəˈʃpʁɛːç/","m":"conversation, chat, talk","f":"Gespräche","s":"Er konnte die Familie am beleuchteten Tisch sehen und ihre Gespräche hören.","n":2},{"w":"Pause","art":"die","ipa":"/ˈpaʊ̯zə/","m":"pause; break; tracing, blueprint","f":"Pause","s":"Er atmete schwer und musste oft eine Pause machen.","n":2},{"w":"Hut","art":"der","ipa":"/huːt/","m":"hat; head, top","f":"Hüte","s":"Alle drei nahmen ihre Hüte und Stöcke, verbeugten sich stumm und verließen die Wohnung.","n":2},{"w":"Haar","art":"das","ipa":"/haːr/","m":"hair","f":"Haaren","s":"Stattdessen kam morgens und abends eine riesige, knochige Bedienerin mit weißen Haaren für die schwerste Arbeit.","n":2},{"w":"geschlossen","art":"","ipa":"/ɡəˈʃlɔ.sn̩/","m":"shut; closed; locked; private, non-public","f":"geschlossenen","s":"Eine Viertelstunde lang schüttelte er mit geschlossenen Augen den Kopf.","n":2},{"w":"küssen","art":"","ipa":"[ˈkʰʏsn̩]","m":"to kiss; to make out","f":"küssen","s":"Sie würde vor Rührung weinen, und er würde ihren Hals küssen.","n":2},{"w":"entlassen","art":"","ipa":"/ˌɛntˈlasn̩/","m":"to release; to dismiss; to fire, to sack","f":"entlassen","s":"Das Dienstmädchen wurde entlassen.","n":2},{"w":"warm","art":"","ipa":"/varm/","m":"warm; mildly hot; keeping the wearer warm","f":"warm","s":"Obwohl es noch früh war, war die Luft schon ein wenig warm.","n":2},{"w":"Geduld","art":"die","ipa":"/ɡəˈdʊlt/","m":"patience","f":"Geduld","s":"Die Familie musste ihren Ekel herunterschlucken und Geduld haben, nur Geduld.","n":2},{"w":"anziehen","art":"","ipa":"/ˈantsiːən/","m":"to get dressed; to dress; to put on","f":"angezogen e Frau.","n":1},{"w":"Tasche","art":"die","ipa":"/ˈtaʃə/","m":"bag; pocket","f":"Taschen","s":"Dort standen sie mit den Händen in den Taschen ihrer alten Röcke um Gregors Leiche herum.","n":1},{"w":"seltsam","art":"","ipa":"/ˈzɛltˌzaːm/","m":"strange, weird, odd, funny, curious","f":"seltsam","s":"Das sah natürlich seltsam aus.","n":1},{"w":"Sonne","art":"die","ipa":"/ˈzɔnə/","m":"a sun; sunshine, sunlight","f":"Sonne","s":"Die Straßenbahn war voll von warmer Sonne, und sie waren allein darin.","n":1},{"w":"nämlich","art":"","ipa":"/ˈnɛːmlɪç/","m":"very same, selfsame","f":"nämlich","s":"Die Familie hatte nämlich ein Zimmer an drei Herren vermietet.","n":1},{"w":"ewig","art":"","ipa":"/ˈeːvɪç/","m":"eternal, everlasting; constant, frequent","f":"ewige","s":"Wenn man so schwer arbeiten muss wie wir, kann man diese ewige Qual zu Hause nicht ertragen.","n":1},{"w":"Bank","art":"die","ipa":"/baŋk/","m":"bench; pew; workbench; bank; substitutes' bench","f":"Bank","s":"Deshalb schrieben sie drei Entschuldigungsbriefe: Herr Samsa an seine Bank, Frau Samsa an ihren Auftraggeber und Grete an ihren Chef.","n":1},{"w":"Geheimnis","art":"das","ipa":"/ɡəˈhaɪmnɪs/","m":"secret; mystery","f":"Geheimnis","s":"Dann wollte er ihr sein Geheimnis erzählen: dass er sie aufs Konservatorium schicken wollte.","n":1},{"w":"stecken","art":"","ipa":"/ˈʃtɛkən/","m":"causative of stecken when intransitive, to stick","f":"stecken","s":"So blieb er im Fleisch stecken.","n":1},{"w":"miteinander","art":"","ipa":"/ˌmɪt.(ʔ)aɪ̯ˈnan.dɐ/","m":"together; with each other","f":"miteinander","s":"Aber bald gingen sie zum Fenster und sprachen leise miteinander.","n":1}]];
window.ALT=[{"id":"orig","label":"Kafka-Original","note":"Der echte Text von 1915","lang":"de","paras":[[],["Als Gregor Samsa eines Morgens aus unruhigen Träumen erwachte, fand er sich in seinem Bett zu einem ungeheueren Ungeziefer verwandelt. Er lag auf seinem panzerartig harten Rücken und sah, wenn er den Kopf ein wenig hob, seinen gewölbten, braunen, von bogenförmigen Versteifungen geteilten Bauch, auf dessen Höhe sich die Bettdecke, zum gänzlichen Niedergleiten bereit, kaum noch erhalten konnte. Seine vielen, im Vergleich zu seinem sonstigen Umfang kläglich dünnen Beine flimmerten ihm hilflos vor den Augen.","»Was ist mit mir geschehen?« dachte er. Es war kein Traum. Sein Zimmer, ein richtiges, nur etwas zu kleines Menschenzimmer, lag ruhig zwischen den vier wohlbekannten Wänden. Über dem Tisch, auf dem eine auseinandergepackte Musterkollektion von Tuchwaren ausgebreitet war – Samsa war Reisender –, hing das Bild, das er vor kurzem aus einer illustrierten Zeitschrift ausgeschnitten und in einem hübschen, vergoldeten Rahmen untergebracht hatte. Es stellte eine Dame dar, die, mit einem Pelzhut und einer Pelzboa versehen, aufrecht dasaß und einen schweren Pelzmuff, in dem ihr ganzer Unterarm verschwunden war, dem Beschauer entgegenhob.","Gregors Blick richtete sich dann zum Fenster, und das trübe Wetter – man hörte Regentropfen auf das Fensterblech aufschlagen – machte ihn ganz melancholisch. »Wie wäre es, wenn ich noch ein wenig weiterschliefe und alle Narrheiten vergäße,« dachte er, aber das war gänzlich undurchführbar, denn er war gewöhnt, auf der rechten Seite zu schlafen, konnte sich aber in seinem gegenwärtigen Zustand nicht in diese Lage bringen. Mit welcher Kraft er sich auch auf die rechte Seite warf, immer wieder schaukelte er in die Rückenlage zurück. Er versuchte es wohl hundertmal, schloß die Augen, um die zappelnden Beine nicht sehen zu müssen, und ließ erst ab, als er in der Seite einen noch nie gefühlten, leichten, dumpfen Schmerz zu fühlen begann.","»Ach Gott,« dachte er, »was für einen anstrengenden Beruf habe ich gewählt! Tag aus, Tag ein auf der Reise. Die geschäftlichen Aufregungen sind viel größer, als im eigentlichen Geschäft zu Hause, und außerdem ist mir noch diese Plage des Reisens auferlegt, die Sorgen um die Zuganschlüsse, das unregelmäßige, schlechte Essen, ein immer wechselnder, nie andauernder, nie herzlich werdender menschlicher Verkehr. Der Teufel soll das alles holen!« Er fühlte ein leichtes Jucken oben auf dem Bauch; schob sich auf dem Rücken langsam näher zum Bettpfosten, um den Kopf besser heben zu können; fand die juckende Stelle, die mit lauter kleinen weißen Pünktchen besetzt war, die er nicht zu beurteilen verstand; und wollte mit einem Bein die Stelle betasten, zog es aber gleich zurück, denn bei der Berührung umwehten ihn Kälteschauer.","Er glitt wieder in seine frühere Lage zurück. »Dies frühzeitige Aufstehen«, dachte er, »macht einen ganz blödsinnig. Der Mensch muß seinen Schlaf haben. Andere Reisende leben wie Haremsfrauen. Wenn ich zum Beispiel im Laufe des Vormittags ins Gasthaus zurückgehe, um die erlangten Aufträge zu überschreiben, sitzen diese Herren erst beim Frühstück. Das sollte ich bei meinem Chef versuchen; ich würde auf der Stelle hinausfliegen. Wer weiß übrigens, ob das nicht sehr gut für mich wäre. Wenn ich mich nicht wegen meiner Eltern zurückhielte, ich hätte längst gekündigt, ich wäre vor den Chef hingetreten und hätte ihm meine Meinung von Grund des Herzens aus gesagt. Vom Pult hätte er fallen müssen! Es ist auch eine sonderbare Art, sich auf das Pult zu setzen und von der Höhe herab mit dem Angestellten zu reden, der überdies wegen der Schwerhörigkeit des Chefs ganz nahe herantreten muß. Nun, die Hoffnung ist noch nicht gänzlich aufgegeben, habe ich einmal das Geld beisammen, um die Schuld der Eltern an ihn abzuzahlen – es dürfte noch fünf bis sechs Jahre dauern –, mache ich die Sache unbedingt. Dann wird der große Schnitt gemacht. Vorläufig allerdings muß ich aufstehen, denn mein Zug fährt um fünf.«","Und er sah zur Weckuhr hinüber, die auf dem Kasten tickte. »Himmlischer Vater!« dachte er, Es war halb sieben Uhr, und die Zeiger gingen ruhig vorwärts, es war sogar halb vorüber, es näherte sich schon dreiviertel. Sollte der Wecker nicht geläutet haben? Man sah vom Bett aus, daß er auf vier Uhr richtig eingestellt war; gewiß hatte er auch geläutet. Ja, aber war es möglich, dieses möbelerschütternde Läuten ruhig zu verschlafen? Nun, ruhig hatte er ja nicht geschlafen, aber wahrscheinlich desto fester. Was aber sollte er jetzt tun? Der nächste Zug ging um sieben Uhr; um den einzuholen, hätte er sich unsinnig beeilen müssen, und die Kollektion war noch nicht eingepackt, und er selbst fühlte sich durchaus nicht besonders frisch und beweglich. Und selbst wenn er den Zug einholte, ein Donnerwetter des Chefs war nicht zu vermeiden, denn der Geschäftsdiener hatte beim Fünfuhrzug gewartet und die Meldung von seiner Versäumnis längst erstattet. Es war eine Kreatur des Chefs, ohne Rückgrat und Verstand. Wie nun, wenn er sich krank meldete? Das wäre aber äußerst peinlich und verdächtig, denn Gregor war während seines fünfjährigen Dienstes noch nicht einmal krank gewesen. Gewiß würde der Chef mit dem Krankenkassenarzt kommen, würde den Eltern wegen des faulen Sohnes Vorwürfe machen und alle Einwände durch den Hinweis auf den Krankenkassenarzt abschneiden, für den es ja überhaupt nur ganz gesunde, aber arbeitsscheue Menschen gibt. Und hätte er übrigens in diesem Falle so ganz unrecht? Gregor fühlte sich tatsächlich, abgesehen von einer nach dem langen Schlaf wirklich überflüssigen Schläfrigkeit, ganz wohl und hatte sogar einen besonders kräftigen Hunger.","Als er dies alles in größter Eile überlegte, ohne sich entschließen zu können, das Bett zu verlassen – gerade schlug der Wecker dreiviertel sieben – klopfte es vorsichtig an die Tür am Kopfende seines Bettes. »Gregor,« rief es – es war die Mutter –, »es ist dreiviertel sieben. Wolltest du nicht wegfahren?« Die sanfte Stimme! Gregor erschrak, als er seine antwortende Stimme hörte, die wohl unverkennbar seine frühere war, in die sich aber, wie von unten her, ein nicht zu unterdrückendes, schmerzliches Piepsen mischte, das die Worte förmlich nur im ersten Augenblick in ihrer Deutlichkeit beließ, um sie im Nachklang derart zu zerstören, daß man nicht wußte, ob man recht gehört hatte. Gregor hatte ausführlich antworten und alles erklären wollen, beschränkte sich aber bei diesen Umständen darauf, zu sagen: »Ja, ja, danke, Mutter, ich stehe schon auf.« Infolge der Holztür war die Veränderung in Gregors Stimme draußen wohl nicht zu merken, denn die Mutter beruhigte sich mit dieser Erklärung und schlürfte davon. Aber durch das kleine Gespräch waren die anderen Familienmitglieder darauf aufmerksam geworden, daß Gregor wider Erwarten noch zu Hause war, und schon klopfte an der einen Seitentür der Vater, schwach, aber mit der Faust. »Gregor, Gregor,« rief er, »was ist denn?« Und nach einer kleinen Weile mahnte er nochmals mit tieferer Stimme: »Gregor! Gregor!« An der anderen Seitentür aber klagte leise die Schwester: »Gregor? Ist dir nicht wohl? Brauchst du etwas?« Nach beiden Seiten hin antwortete Gregor: »Bin schon fertig,« und bemühte sich, durch die sorgfältigste Aussprache und durch Einschaltung von langen Pausen zwischen den einzelnen Worten seiner Stimme alles Auffallende zu nehmen. Der Vater kehrte auch zu seinem Frühstück zurück, die Schwester aber flüsterte: »Gregor, mach auf, ich beschwöre dich.« Gregor aber dachte gar nicht daran aufzumachen, sondern lobte die vom Reisen her übernommene Vorsicht, auch zu Hause alle Türen während der Nacht zu versperren.","Zunächst wollte er ruhig und ungestört aufstehen, sich anziehen und vor allem frühstücken, und dann erst das Weitere überlegen, denn, das merkte er wohl, im Bett würde er mit dem Nachdenken zu keinem vernünftigen Ende kommen. Er erinnerte sich, schon öfters im Bett irgendeinen vielleicht durch ungeschicktes Liegen erzeugten, leichten Schmerz empfunden zu haben, der sich dann beim Aufstehen als reine Einbildung herausstellte, und er war gespannt, wie sich seine heutigen Vorstellungen allmählich auflösen würden. Daß die Veränderung der Stimme nichts anderes war als der Vorbote einer tüchtigen Verkühlung, einer Berufskrankheit der Reisenden, daran zweifelte er nicht im geringsten.","Die Decke abzuwerfen war ganz einfach; er brauchte sich nur ein wenig aufzublasen und sie fiel von selbst. Aber weiterhin wurde es schwierig, besonders weil er so ungemein breit war. Er hätte Arme und Hände gebraucht, um sich aufzurichten; statt dessen aber hatte er nur die vielen Beinchen, die ununterbrochen in der verschiedensten Bewegung waren und die er überdies nicht beherrschen konnte. Wollte er eines einmal einknicken, so war es das erste, daß er sich streckte; und gelang es ihm endlich, mit diesem Bein das auszuführen, was er wollte, so arbeiteten inzwischen alle anderen, wie freigelassen, in höchster, schmerzlicher Aufregung. »Nur sich nicht im Bett unnütz aufhalten,« sagte sich Gregor.","Zuerst wollte er mit dem unteren Teil seines Körpers aus dem Bett hinauskommen, aber dieser untere Teil, den er übrigens noch nicht gesehen hatte und von dem er sich auch keine rechte Vorstellung machen konnte, erwies sich als zu schwer beweglich; es ging so langsam; und als er schließlich, fast wild geworden, mit gesammelter Kraft, ohne Rücksicht sich vorwärtsstieß, hatte er die Richtung falsch gewählt, schlug an den unteren Bettpfosten heftig an, und der brennende Schmerz, den er empfand, belehrte ihn, daß gerade der untere Teil seines Körpers augenblicklich vielleicht der empfindlichste war.","Er versuchte es daher, zuerst den Oberkörper aus dem Bett zu bekommen, und drehte vorsichtig den Kopf dem Bettrand zu. Dies gelang auch leicht, und trotz ihrer Breite und Schwere folgte schließlich die Körpermasse langsam der Wendung des Kopfes. Aber als er den Kopf endlich außerhalb des Bettes in der freien Luft hielt, bekam er Angst, weiter auf diese Weise vorzurücken, denn wenn er sich schließlich so fallen ließ, mußte geradezu ein Wunder geschehen wenn der Kopf nicht verletzt werden sollte. Und die Besinnung durfte er gerade jetzt um keinen Preis verlieren; lieber wollte er im Bett bleiben.","Aber als er wieder nach gleicher Mühe aufseufzend so dalag wie früher, und wieder seine Beinchen womöglich noch ärger gegeneinander kämpfen sah und keine Möglichkeit fand, in diese Willkür Ruhe und Ordnung zu bringen, sagte er sich wieder, daß er unmöglich im Bett bleiben könne und daß es das Vernünftigste sei, alles zu opfern, wenn auch nur die kleinste Hoffnung bestünde, sich dadurch vom Bett zu befreien. Gleichzeitig aber vergaß er nicht, sich zwischendurch daran zu erinnern, daß viel besser als verzweifelte Entschlüsse ruhige und ruhigste Überlegung sei. In solchen Augenblicken richtete er die Augen möglichst scharf auf das Fenster, aber leider war aus dem Anblick des Morgennebels, der sogar die andere Seite der engen Straße verhüllte, wenig Zuversicht und Munterkeit zu holen. »Schon sieben Uhr,« sagte er sich beim neuerlichen Schlagen des Weckers, »schon sieben Uhr und noch immer ein solcher Nebel.« Und ein Weilchen lang lag er ruhig mit schwachem Atem, als erwarte er vielleicht von der völligen Stille die Wiederkehr der wirklichen und selbstverständlichen Verhältnisse.","Dann aber sagte er sich: »Ehe es einviertel acht schlägt, muß ich unbedingt das Bett vollständig verlassen haben. Im übrigen wird auch bis dahin jemand aus dem Geschäft kommen, um nach mir zu fragen, denn das Geschäft wird vor sieben Uhr geöffnet.« Und er machte sich nun daran, den Körper in seiner ganzen Länge vollständig gleichmäßig aus dem Bett hinauszuschaukeln. Wenn er sich auf diese Weise aus dem Bett fallen ließ, blieb der Kopf, den er beim Fall scharf heben wollte, voraussichtlich unverletzt. Der Rücken schien hart zu sein; dem würde wohl bei dem Fall auf den Teppich nichts geschehen. Das größte Bedenken machte ihm die Rücksicht auf den lauten Krach, den es geben müßte und der wahrscheinlich hinter allen Türen wenn nicht Schrecken, so doch Besorgnisse erregen würde. Das mußte aber gewagt werden.","Als Gregor schon zur Hälfte aus dem Bette ragte – die neue Methode war mehr ein Spiel als eine Anstrengung, er brauchte immer nur ruckweise zu schaukeln –, fiel ihm ein, wie einfach alles wäre, wenn man ihm zu Hilfe käme. Zwei starke Leute – er dachte an seinen Vater und das Dienstmädchen – hätten vollständig genügt; sie hätten ihre Arme nur unter seinen gewölbten Rücken schieben, ihn so aus dem Bett schälen, sich mit der Last niederbeugen und dann bloß vorsichtig dulden müssen, daß er den Überschwung auf dem Fußboden vollzog, wo dann die Beinchen hoffentlich einen Sinn bekommen würden. Nun, ganz abgesehen davon, daß die Türen versperrt waren, hätte er wirklich um Hilfe rufen sollen? Trotz aller Not konnte er bei diesem Gedanken ein Lächeln nicht unterdrücken.","Schon war er so weit, daß er bei stärkerem Schaukeln kaum das Gleichgewicht noch erhielt, und sehr bald mußte er sich nun endgültig entscheiden, denn es war in fünf Minuten einviertel acht, – als es an der Wohnungstür läutete. »Das ist jemand aus dem Geschäft,« sagte er sich und erstarrte fast, während seine Beinchen nur desto eiliger tanzten. Einen Augenblick blieb alles still. »Sie öffnen nicht,« sagte sich Gregor, befangen in irgendeiner unsinnigen Hoffnung. Aber dann ging natürlich wie immer das Dienstmädchen festen Schrittes zur Tür und öffnete. Gregor brauchte nur das erste Grußwort des Besuchers zu hören und wußte schon, wer es war – der Prokurist selbst. Warum war nur Gregor dazu verurteilt, bei einer Firma zu dienen, wo man bei der kleinsten Versäumnis gleich den größten Verdacht faßte? Waren denn alle Angestellten samt und sonders Lumpen, gab es denn unter ihnen keinen treuen ergebenen Menschen, den, wenn er auch nur ein paar Morgenstunden für das Geschäft nicht ausgenützt hatte, vor Gewissensbissen närrisch wurde und geradezu nicht imstande war, das Bett zu verlassen? Genügte es wirklich nicht, einen Lehrjungen nachfragen zu lassen – wenn überhaupt diese Fragerei nötig war –, mußte da der Prokurist selbst kommen, und mußte dadurch der ganzen unschuldigen Familie gezeigt werden, daß die Untersuchung dieser verdächtigen Angelegenheit nur dem Verstand des Prokuristen anvertraut werden konnte? Und mehr infolge der Erregung, in welche Gregor durch diese Überlegungen versetzt wurde, als infolge eines richtigen Entschlusses, schwang er sich mit aller Macht aus dem Bett. Es gab einen lauten Schlag, aber ein eigentlicher Krach war es nicht. Ein wenig wurde der Fall durch den Teppich abgeschwächt, auch war der Rücken elastischer, als Gregor gedacht hatte, daher kam der nicht gar so auffallende dumpfe Klang. Nur den Kopf hatte er nicht vorsichtig genug gehalten und ihn angeschlagen; er drehte ihn und rieb ihn an dem Teppich vor Ärger und Schmerz.","»Da drin ist etwas gefallen,« sagte der Prokurist im Nebenzimmer links. Gregor suchte sich vorzustellen, ob nicht auch einmal dem Prokuristen etwas Ähnliches passieren könnte, wie heute ihm; die Möglichkeit dessen mußte man doch eigentlich zugeben. Aber wie zur rohen Antwort auf diese Frage machte jetzt der Prokurist im Nebenzimmer ein paar bestimmte Schritte und ließ seine Lackstiefel knarren. Aus dem Nebenzimmer rechts flüsterte die Schwester, um Gregor zu verständigen: »Gregor, der Prokurist ist da.« »Ich weiß,« sagte Gregor vor sich hin; aber so laut, daß es die Schwester hätte hören können, wagte er die Stimme nicht zu erheben.","»Gregor,« sagte nun der Vater aus dem Nebenzimmer links, »der Herr Prokurist ist gekommen und erkundigt sich, warum du nicht mit dem Frühzug weggefahren bist. Wir wissen nicht, was wir ihm sagen sollen. Übrigens will er auch mit dir persönlich sprechen. Also bitte mach die Tür auf. Er wird die Unordnung im Zimmer zu entschuldigen schon die Güte haben.« »Guten Morgen, Herr Samsa,« rief der Prokurist freundlich dazwischen. »Ihm ist nicht wohl,« sagte die Mutter zum Prokuristen, während der Vater noch an der Tür redete, »ihm ist nicht wohl, glauben Sie mir, Herr Prokurist. Wie würde denn Gregor sonst einen Zug versäumen! Der Junge hat ja nichts im Kopf als das Geschäft. Ich ärgere mich schon fast, daß er abends niemals ausgeht; jetzt war er doch acht Tage in der Stadt, aber jeden Abend war er zu Hause. Da sitzt er bei uns am Tisch und liest still die Zeitung oder studiert Fahrpläne. Es ist schon eine Zerstreuung für ihn, wenn er sich mit Laubsägearbeiten beschäftigt. Da hat er zum Beispiel im Laufe von zwei, drei Abenden einen kleinen Rahmen geschnitzt; Sie werden staunen, wie hübsch er ist; er hängt drin im Zimmer; Sie werden ihn gleich sehen, wenn Gregor aufmacht. Ich bin übrigens glücklich, daß Sie da sind, Herr Prokurist; wir allein hätten Gregor nicht dazu gebracht, die Tür zu öffnen; er ist so hartnäckig; und bestimmt ist ihm nicht wohl, trotzdem er es am Morgen geleugnet hat.« »Ich komme gleich,« sagte Gregor langsam und bedächtig und rührte sich nicht, um kein Wort der Gespräche zu verlieren. »Anders, gnädige Frau, kann ich es mir auch nicht erklären,« sagte der Prokurist, »hoffentlich ist es nichts Ernstes. Wenn ich auch andererseits sagen muß, daß wir Geschäftsleute – wie man will, leider oder glücklicherweise – ein leichtes Unwohlsein sehr oft aus geschäftlichen Rücksichten einfach überwinden müssen.« »Also kann der Herr Prokurist schon zu dir hinein?« fragte der ungeduldige Vater und klopfte wiederum an die Tür. »Nein,« sagte Gregor. Im Nebenzimmer links trat eine peinliche Stille ein, im Nebenzimmer rechts begann die Schwester zu schluchzen.","Warum ging denn die Schwester nicht zu den anderen? Sie war wohl erst jetzt aus dem Bett aufgestanden und hatte noch gar nicht angefangen sich anzuziehen. Und warum weinte sie denn? Weil er nicht aufstand und den Prokuristen nicht hereinließ, weil er in Gefahr war, den Posten zu verlieren und weil dann der Chef die Eltern mit den alten Forderungen wieder verfolgen würde? Das waren doch vorläufig wohl unnötige Sorgen. Noch war Gregor hier und dachte nicht im geringsten daran, seine Familie zu verlassen. Augenblicklich lag er wohl da auf dem Teppich, und niemand, der seinen Zustand gekannt hätte, hätte im Ernst von ihm verlangt, daß er den Prokuristen hereinlasse. Aber wegen dieser kleinen Unhöflichkeit, für die sich ja später leicht eine passende Ausrede finden würde, konnte Gregor doch nicht gut sofort weggeschickt werden. Und Gregor schien es, daß es viel vernünftiger wäre, ihn jetzt in Ruhe zu lassen, statt ihn mit Weinen und Zureden zu stören. Aber es war eben die Ungewißheit, welche die anderen bedrängte und ihr Benehmen entschuldigte.","»Herr Samsa,« rief nun der Prokurist mit erhobener Stimme, »was ist denn los? Sie verbarrikadieren sich da in Ihrem Zimmer, antworten bloß mit ja und nein, machen Ihren Eltern schwere, unnötige Sorgen und versäumen – dies nur nebenbei erwähnt – Ihre geschäftlichen Pflichten in einer eigentlich unerhörten Weise. Ich spreche hier im Namen Ihrer Eltern und Ihres Chefs und bitte Sie ganz ernsthaft um eine augenblickliche, deutliche Erklärung. Ich staune, ich staune. Ich glaubte Sie als einen ruhigen, vernünftigen Menschen zu kennen, und nun scheinen Sie plötzlich anfangen zu wollen, mit sonderbaren Launen zu paradieren. Der Chef deutete mir zwar heute früh eine mögliche Erklärung für Ihre Versäumnis an – sie betraf das Ihnen seit kurzem anvertraute Inkasso –, aber ich legte wahrhaftig fast mein Ehrenwort dafür ein, daß diese Erklärung nicht zutreffen könne. Nun aber sehe ich hier Ihren unbegreiflichen Starrsinn und verliere ganz und gar jede Lust, mich auch nur im geringsten für Sie einzusetzen. Und Ihre Stellung ist durchaus nicht die festeste. Ich hatte ursprünglich die Absicht, Ihnen das alles unter vier Augen zu sagen, aber da Sie mich hier nutzlos meine Zeit versäumen lassen, weiß ich nicht, warum es nicht auch Ihre Herren Eltern erfahren sollen. Ihre Leistungen in der letzten Zeit waren also sehr unbefriedigend; es ist zwar nicht die Jahreszeit, um besondere Geschäfte zu machen, das erkennen wir an; aber eine Jahreszeit, um keine Geschäfte zu machen, gibt es überhaupt nicht, Herr Samsa, darf es nicht geben.«","»Aber Herr Prokurist,« rief Gregor außer sich und vergaß in der Aufregung alles andere, »ich mache ja sofort, augenblicklich auf. Ein leichtes Unwohlsein, ein Schwindelanfall, haben mich verhindert aufzustehen. Ich liege noch jetzt im Bett. Jetzt bin ich aber schon wieder ganz frisch. Eben steige ich aus dem Bett. Nur einen kleinen Augenblick Geduld! Es geht noch nicht so gut, wie ich dachte. Es ist mir aber schon wohl. Wie das nur einen Menschen so überfallen kann! Noch gestern abend war mir ganz gut, meine Eltern wissen es ja, oder besser, schon gestern abend hatte ich eine kleine Vorahnung. Man hätte es mir ansehen müssen. Warum habe ich es nur im Geschäfte nicht gemeldet! Aber man denkt eben immer, daß man die Krankheit ohne Zuhausebleiben überstehen wird. Herr Prokurist! Schonen Sie meine Eltern! Für alle die Vorwürfe, die Sie mir jetzt machen, ist ja kein Grund; man hat mir ja davon auch kein Wort gesagt. Sie haben vielleicht die letzten Aufträge, die ich geschickt habe, nicht gelesen. Übrigens, noch mit dem Achtuhrzug fahre ich auf die Reise, die paar Stunden Ruhe haben mich gekräftigt. Halten Sie sich nur nicht auf, Herr Prokurist; ich bin gleich selbst im Geschäft, und haben Sie die Güte, das zu sagen und mich dem Herrn Chef zu empfehlen!«","Und während Gregor dies alles hastig ausstieß und kaum wußte, was er sprach, hatte er sich leicht, wohl infolge der im Bett bereits erlangten Übung, dem Kasten genähert und versuchte nun, an ihm sich aufzurichten. Er wollte tatsächlich die Tür aufmachen, tatsächlich sich sehen lassen und mit dem Prokuristen sprechen; er war begierig zu erfahren, was die anderen, die jetzt so nach ihm verlangten, bei seinem Anblick sagen würden. Würden sie erschrecken, dann hatte Gregor keine Verantwortung mehr und konnte ruhig sein. Würden sie aber alles ruhig hinnehmen, dann hatte auch er keinen Grund sich aufzuregen, und konnte, wenn er sich beeilte, um acht Uhr tatsächlich auf dem Bahnhof sein. Zuerst glitt er nun einigemale von dem glatten Kasten ab, aber endlich gab er sich einen letzten Schwung und stand aufrecht da; auf die Schmerzen im Unterleib achtete er gar nicht mehr, so sehr sie auch brannten. Nun ließ er sich gegen die Rücklehne eines nahen Stuhles fallen, an deren Rändern er sich mit seinen Beinchen festhielt. Damit hatte er aber auch die Herrschaft über sich erlangt und verstummte, denn nun konnte er den Prokuristen anhören.","»Haben Sie auch nur ein Wort verstanden?« fragte der Prokurist die Eltern, »er macht sich doch wohl nicht einen Narren aus uns?« »Um Gottes willen,« rief die Mutter schon unter Weinen, »er ist vielleicht schwer krank, und wir quälen ihn. Grete! Grete!« schrie sie dann. »Mutter?« rief die Schwester von der anderen Seite. Sie verständigten sich durch Gregors Zimmer. »Du mußt augenblicklich zum Arzt. Gregor ist krank. Rasch um den Arzt. Hast du Gregor jetzt reden hören?« »Das war eine Tierstimme,« sagte der Prokurist, auffallend leise gegenüber dem Schreien der Mutter. »Anna! Anna!« rief der Vater durch das Vorzimmer in die Küche und klatschte in die Hände, »sofort einen Schlosser holen!« Und schon liefen die zwei Mädchen mit rauschenden Röcken durch das Vorzimmer – wie hatte sich die Schwester denn so schnell angezogen? – und rissen die Wohnungstüre auf. Man hörte gar nicht die Türe zuschlagen; sie hatten sie wohl offen gelassen, wie es in Wohnungen zu sein pflegt, in denen ein großes Unglück geschehen ist.","Gregor war aber viel ruhiger geworden. Man verstand zwar also seine Worte nicht mehr, trotzdem sie ihm genug klar, klarer als früher, vorgekommen waren, vielleicht infolge der Gewöhnung des Ohres. Aber immerhin glaubte man nun schon daran, daß es mit ihm nicht ganz in Ordnung war, und war bereit, ihm zu helfen. Die Zuversicht und Sicherheit, womit die ersten Anordnungen getroffen worden waren, taten ihm wohl. Er fühlte sich wieder einbezogen in den menschlichen Kreis und erhoffte von beiden, vom Arzt und vom Schlosser, ohne sie eigentlich genau zu scheiden, großartige und überraschende Leistungen. Um für die sich nähernden entscheidenden Besprechungen eine möglichst klare Stimme zu bekommen, hustete er ein wenig ab, allerdings bemüht, dies ganz gedämpft zu tun, da möglicherweise auch schon dieses Geräusch anders als menschlicher Husten klang, was er selbst zu entscheiden sich nicht mehr getraute. Im Nebenzimmer war es inzwischen ganz still geworden. Vielleicht saßen die Eltern mit dem Prokuristen beim Tisch und tuschelten, vielleicht lehnten alle an der Türe und horchten.","Gregor schob sich langsam mit dem Sessel zur Tür hin, ließ ihn dort los, warf sich gegen die Tür, hielt sich an ihr aufrecht – die Ballen seiner Beinchen hatten ein wenig Klebstoff – und ruhte sich dort einen Augenblick lang von der Anstrengung aus. Dann aber machte er sich daran, mit dem Mund den Schlüssel im Schloß umzudrehen. Es schien leider, daß er keine eigentlichen Zähne hatte, – womit sollte er gleich den Schlüssel fassen? – aber dafür waren die Kiefer freilich sehr stark, mit ihrer Hilfe brachte er auch wirklich den Schlüssel in Bewegung und achtete nicht darauf, daß er sich zweifellos irgendeinen Schaden zufügte, denn eine braune Flüssigkeit kam ihm aus dem Mund, floß über den Schlüssel und tropfte auf den Boden. »Hören Sie nur,« sagte der Prokurist im Nebenzimmer, »er dreht den Schlüssel um.« Das war für Gregor eine große Aufmunterung; aber alle hätten ihm zurufen sollen, auch der Vater und die Mutter: »Frisch, Gregor,« hätten sie rufen sollen, »immer nur heran, fest an das Schloß heran!« Und in der Vorstellung, daß alle seine Bemühungen mit Spannung verfolgten, verbiß er sich mit allem, was er an Kraft aufbringen konnte, besinnungslos in den Schlüssel. Je nach dem Fortschreiten der Drehung des Schlüssels umtanzte er das Schloß, hielt sich jetzt nur noch mit dem Munde aufrecht, und je nach Bedarf hing er sich an den Schlüssel oder drückte ihn dann wieder nieder mit der ganzen Last seines Körpers. Der hellere Klang des endlich zurückschnappenden Schlosses erweckte Gregor förmlich. Aufatmend sagte er sich: »Ich habe also den Schlosser nicht gebraucht,« und legte den Kopf auf die Klinke, um die Türe gänzlich zu öffnen.","Da er die Türe auf diese Weise öffnen mußte, war sie eigentlich schon recht weit geöffnet, und er selbst noch nicht zu sehen. Er mußte sich erst langsam um den einen Türflügel herumdrehen, und zwar sehr vorsichtig, wenn er nicht gerade vor dem Eintritt ins Zimmer plump auf den Rücken fallen wollte. Er war noch mit jener schwierigen Bewegung beschäftigt und hatte nicht Zeit, auf anderes zu achten, da hörte er schon den Prokuristen ein lautes »Oh!« ausstoßen – es klang, wie wenn der Wind saust – und nun sah er ihn auch, wie er, der der Nächste an der Türe war, die Hand gegen den offenen Mund drückte und langsam zurückwich, als vertreibe ihn eine unsichtbare, gleichmäßig fortwirkende Kraft. Die Mutter – sie stand hier trotz der Anwesenheit des Prokuristen mit von der Nacht her noch aufgelösten, hoch sich sträubenden Haaren – sah zuerst mit gefalteten Händen den Vater an, ging dann zwei Schritte zu Gregor hin und fiel inmitten ihrer rings um sie herum sich ausbreitenden Röcke nieder, das Gesicht ganz unauffindbar zu ihrer Brust gesenkt. Der Vater ballte mit feindseligem Ausdruck die Faust, als wolle er Gregor in sein Zimmer zurückstoßen, sah sich dann unsicher im Wohnzimmer um, beschattete dann mit den Händen die Augen und weinte, daß sich seine mächtige Brust schüttelte.","Gregor trat nun gar nicht in das Zimmer, sondern lehnte sich von innen an den festgeriegelten Türflügel, so daß sein Leib nur zur Hälfte und darüber der seitlich geneigte Kopf zu sehen war, mit dem er zu den anderen hinüberlugte. Es war inzwischen viel heller geworden; klar stand auf der anderen Straßenseite ein Ausschnitt des gegenüberliegenden, endlosen, grauschwarzen Hauses – es war ein Krankenhaus – mit seinen hart die Front durchbrechenden regelmäßigen Fenstern; der Regen fiel noch nieder, aber nur mit großen, einzeln sichtbaren und förmlich auch einzelnweise auf die Erde hinuntergeworfenen Tropfen. Das Frühstücksgeschirr stand in überreicher Zahl auf dem Tisch, denn für den Vater war das Frühstück die wichtigste Mahlzeit des Tages, die er bei der Lektüre verschiedener Zeitungen stundenlang hinzog. Gerade an der gegenüberliegenden Wand hing eine Photographie Gregors aus seiner Militärzeit, die ihn als Leutnant darstellte, wie er, die Hand am Degen, sorglos lächelnd, Respekt für seine Haltung und Uniform verlangte. Die Tür zum Vorzimmer war geöffnet, und man sah, da auch die Wohnungstür offen war, auf den Vorplatz der Wohnung hinaus und auf den Beginn der abwärts führenden Treppe.","»Nun,« sagte Gregor und war sich dessen wohl bewußt, daß er der einzige war, der die Ruhe bewahrt hatte, »ich werde mich gleich anziehen, die Kollektion zusammenpacken und wegfahren. Wollt ihr, wollt ihr mich wegfahren lassen? Nun, Herr Prokurist, Sie sehen, ich bin nicht starrköpfig und ich arbeite gern; das Reisen ist beschwerlich, aber ich könnte ohne das Reisen nicht leben. Wohin gehen Sie denn, Herr Prokurist? Ins Geschäft? Ja? Werden Sie alles wahrheitsgetreu berichten? Man kann im Augenblick unfähig sein zu arbeiten, aber dann ist gerade der richtige Zeitpunkt, sich an die früheren Leistungen zu erinnern und zu bedenken, daß man später, nach Beseitigung des Hindernisses, gewiß desto fleißiger und gesammelter arbeiten wird. Ich bin ja dem Herrn Chef so sehr verpflichtet, das wissen Sie doch recht gut. Andererseits habe ich die Sorge um meine Eltern und die Schwester. Ich bin in der Klemme, ich werde mich aber auch wieder herausarbeiten. Machen Sie es mir aber nicht schwieriger, als es schon ist. Halten Sie im Geschäft meine Partei! Man liebt den Reisenden nicht, ich weiß. Man denkt, er verdient ein Heidengeld und führt dabei ein schönes Leben. Man hat eben keine besondere Veranlassung, dieses Vorurteil besser zu durchdenken. Sie aber, Herr Prokurist, Sie haben einen besseren Überblick über die Verhältnisse, als das sonstige Personal, ja sogar, ganz im Vertrauen gesagt, einen besseren Überblick, als der Herr Chef selbst, der in seiner Eigenschaft als Unternehmer sich in seinem Urteil leicht zuungunsten eines Angestellten beirren läßt. Sie wissen auch sehr wohl, daß der Reisende, der fast das ganze Jahr außerhalb des Geschäftes ist, so leicht ein Opfer von Klatschereien, Zufälligkeiten und grundlosen Beschwerden werden kann, gegen die sich zu wehren ihm ganz unmöglich ist, da er von ihnen meistens gar nichts erfährt und nur dann, wenn er erschöpft eine Reise beendet hat, zu Hause die schlimmen, auf ihre Ursachen hin nicht mehr zu durchschauenden Folgen am eigenen Leibe zu spüren bekommt. Herr Prokurist, gehen Sie nicht weg, ohne mir ein Wort gesagt zu haben, das mir zeigt, daß Sie mir wenigstens zu einem kleinen Teil recht geben!«","Aber der Prokurist hatte sich schon bei den ersten Worten Gregors abgewendet, und nur über die zuckende Schulter hinweg sah er mit aufgeworfenen Lippen nach Gregor zurück. Und während Gregors Rede stand er keinen Augenblick still, sondern verzog sich, ohne Gregor aus den Augen zu lassen, gegen die Tür, aber ganz allmählich, als bestehe ein geheimes Verbot, das Zimmer zu verlassen. Schon war er im Vorzimmer, und nach der plötzlichen Bewegung, mit der er zum letztenmal den Fuß aus dem Wohnzimmer zog, hätte man glauben können, er habe sich soeben die Sohle verbrannt. Im Vorzimmer aber streckte er die rechte Hand weit von sich zur Treppe hin, als warte dort auf ihn eine geradezu überirdische Erlösung.","Gregor sah ein, daß er den Prokuristen in dieser Stimmung auf keinen Fall weggehen lassen dürfe, wenn dadurch seine Stellung im Geschäft nicht aufs äußerste gefährdet werden sollte. Die Eltern verstanden das alles nicht so gut; sie hatten sich in den langen Jahren die Überzeugung gebildet, daß Gregor in diesem Geschäft für sein Leben versorgt war, und hatten außerdem jetzt mit den augenblicklichen Sorgen so viel zu tun, daß ihnen jede Voraussicht abhanden gekommen war. Aber Gregor hatte diese Voraussicht. Der Prokurist mußte gehalten, beruhigt, überzeugt und schließlich gewonnen werden; die Zukunft Gregors und seiner Familie hing doch davon ab! Wäre doch die Schwester hier gewesen! Sie war klug; sie hatte schon geweint, als Gregor noch ruhig auf dem Rücken lag. Und gewiß hätte der Prokurist, dieser Damenfreund, sich von ihr lenken lassen; sie hätte die Wohnungstür zugemacht und ihm im Vorzimmer den Schrecken ausgeredet. Aber die Schwester war eben nicht da, Gregor selbst mußte handeln. Und ohne daran zu denken, daß er seine gegenwärtigen Fähigkeiten, sich zu bewegen, noch gar nicht kannte, ohne auch daran zu denken, daß seine Rede möglicher- ja wahrscheinlicherweise wieder nicht verstanden worden war, verließ er den Türflügel; schob sich durch die Öffnung; wollte zum Prokuristen hingehen, der sich schon am Geländer des Vorplatzes lächerlicherweise mit beiden Händen festhielt; fiel aber sofort, nach einem Halt suchend, mit einem kleinen Schrei auf seine vielen Beinchen nieder. Kaum war das geschehen, fühlte er zum erstenmal an diesem Morgen ein körperliches Wohlbehagen; die Beinchen hatten festen Boden unter sich; sie gehorchten vollkommen, wie er zu seiner Freude merkte; strebten sogar darnach, ihn fortzutragen, wohin er wollte; und schon glaubte er, die endgültige Besserung alles Leidens stehe unmittelbar bevor. Aber im gleichen Augenblick, als er da schaukelnd vor verhaltener Bewegung, gar nicht weit von seiner Mutter entfernt, ihr gerade gegenüber auf dem Boden lag, sprang diese, die doch so ganz in sich versunken schien, mit einemmale in die Höhe, die Arme weit ausgestreckt, die Finger gespreizt, rief: »Hilfe, um Gottes willen Hilfe!«, hielt den Kopf geneigt, als wolle sie Gregor besser sehen, lief aber, im Widerspruch dazu, sinnlos zurück; hatte vergessen, daß hinter ihr der gedeckte Tisch stand; setzte sich, als sie bei ihm angekommen war, wie in Zerstreutheit, eilig auf ihn, und schien gar nicht zu merken, daß neben ihr aus der umgeworfenen großen Kanne der Kaffee in vollem Strome auf den Teppich sich ergoß.","»Mutter, Mutter,« sagte Gregor leise und sah zu ihr hinauf. Der Prokurist war ihm für einen Augenblick ganz aus dem Sinn gekommen; dagegen konnte er sich nicht versagen, im Anblick des fließenden Kaffees mehrmals mit den Kiefern ins Leere zu schnappen. Darüber schrie die Mutter neuerdings auf, flüchtete vom Tisch und fiel dem ihr entgegeneilenden Vater in die Arme. Aber Gregor hatte jetzt keine Zeit für seine Eltern; der Prokurist war schon auf der Treppe; das Kinn auf dem Geländer, sah er noch zum letzten Male zurück. Gregor nahm einen Anlauf, um ihn möglichst sicher einzuholen; der Prokurist mußte etwas ahnen, denn er machte einen Sprung über mehrere Stufen und verschwand; »Huh!« aber schrie er noch, es klang durchs ganze Treppenhaus. Leider schien nun auch diese Flucht des Prokuristen den Vater, der bisher verhältnismäßig gefaßt gewesen war, völlig zu verwirren, denn statt selbst dem Prokuristen nachzulaufen oder wenigstens Gregor in der Verfolgung nicht zu hindern, packte er mit der Rechten den Stock des Prokuristen, den dieser mit Hut und Überzieher auf einem Sessel zurückgelassen hatte, holte mit der Linken eine große Zeitung vom Tisch und machte sich unter Füßestampfen daran, Gregor durch Schwenken des Stockes und der Zeitung in sein Zimmer zurückzutreiben. Kein Bitten Gregors half, kein Bitten wurde auch verstanden, er mochte den Kopf noch so demütig drehen, der Vater stampfte nur stärker mit den Füßen. Drüben hatte die Mutter trotz des kühlen Wetters ein Fenster aufgerissen, und hinausgelehnt drückte sie ihr Gesicht weit außerhalb des Fensters in ihre Hände. Zwischen Gasse und Treppenhaus entstand eine starke Zugluft, die Fenstervorhänge flogen auf, die Zeitungen auf dem Tische rauschten, einzelne Blätter wehten über den Boden hin. Unerbittlich drängte der Vater und stieß Zischlaute aus, wie ein Wilder. Nun hatte aber Gregor noch gar keine Übung im Rückwärtsgehen, es ging wirklich sehr langsam. Wenn sich Gregor nur hätte umdrehen dürfen, er wäre gleich in seinem Zimmer gewesen, aber er fürchtete sich, den Vater durch die zeitraubende Umdrehung ungeduldig zu machen, und jeden Augenblick drohte ihm doch von dem Stock in des Vaters Hand der tödliche Schlag auf den Rücken oder auf den Kopf. Endlich aber blieb Gregor doch nichts anderes übrig, denn er merkte mit Entsetzen, daß er im Rückwärtsgehen nicht einmal die Richtung einzuhalten verstand; und so begann er, unter unaufhörlichen ängstlichen Seitenblicken nach dem Vater, sich nach Möglichkeit rasch, in Wirklichkeit aber doch nur sehr langsam umzudrehen. Vielleicht merkte der Vater seinen guten Willen, denn er störte ihn hierbei nicht, sondern dirigierte sogar hie und da die Drehbewegung von der Ferne mit der Spitze seines Stockes. Wenn nur nicht dieses unerträgliche Zischen des Vaters gewesen wäre! Gregor verlor darüber ganz den Kopf. Er war schon fast ganz umgedreht, als er sich, immer auf dieses Zischen horchend, sogar irrte und sich wieder ein Stück zurückdrehte. Als er aber endlich glücklich mit dem Kopf vor der Türöffnung war, zeigte es sich, daß sein Körper zu breit war, um ohne weiteres durchzukommen. Dem Vater fiel es natürlich in seiner gegenwärtigen Verfassung auch nicht entfernt ein, etwa den anderen Türflügel zu öffnen, um für Gregor einen genügenden Durchgang zu schaffen. Seine fixe Idee war bloß, daß Gregor so rasch als möglich in sein Zimmer müsse. Niemals hätte er auch die umständlichen Vorbereitungen gestattet, die Gregor brauchte, um sich aufzurichten und vielleicht auf diese Weise durch die Tür zu kommen. Vielleicht trieb er, als gäbe es kein Hindernis, Gregor jetzt unter besonderem Lärm vorwärts; es klang schon hinter Gregor gar nicht mehr wie die Stimme bloß eines einzigen Vaters; nun gab es wirklich keinen Spaß mehr, und Gregor drängte sich – geschehe was wolle – in die Tür. Die eine Seite seines Körpers hob sich, er lag schief in der Türöffnung, seine eine Flanke war ganz wundgerieben, an der weißen Tür blieben häßliche Flecke, bald steckte er fest und hätte sich allein nicht mehr rühren können, die Beinchen auf der einen Seite hingen zitternd oben in der Luft, die auf der anderen waren schmerzhaft zu Boden gedrückt – da gab ihm der Vater von hinten einen jetzt wahrhaftig erlösenden starken Stoß, und er flog, heftig blutend, weit in sein Zimmer hinein. Die Tür wurde noch mit dem Stock zugeschlagen, dann war es endlich still."],["Erst in der Abenddämmerung erwachte Gregor aus seinem schweren ohnmachtähnlichen Schlaf. Er wäre gewiß nicht viel später auch ohne Störung erwacht, denn er fühlte sich genügend ausgeruht und ausgeschlafen, doch schien es ihm, als hätte ihn ein flüchtiger Schritt und ein vorsichtiges Schließen der zum Vorzimmer führenden Tür geweckt. Der Schein der elektrischen Straßenbahn lag bleich hier und da auf der Zimmerdecke und auf den höheren Teilen der Möbel, aber unten bei Gregor war es finster. Langsam schob er sich, noch ungeschickt mit seinen Fühlern tastend, die er jetzt erst schätzen lernte, zur Türe hin, um nachzusehen, was dort geschehen war. Seine linke Seite schien eine einzige lange, unangenehm spannende Narbe, und er mußte auf seinen zwei Beinreihen regelrecht hinken. Ein Beinchen war übrigens im Laufe der vormittägigen Vorfälle schwer verletzt worden – es war fast ein Wunder, daß nur eines verletzt worden war – und schleppte leblos nach.","Erst bei der Tür merkte er, was ihn dorthin eigentlich gelockt hatte; es war der Geruch von etwas Eßbarem gewesen. Denn dort stand ein Napf mit süßer Milch gefüllt, in der kleine Schnitte von Weißbrot schwammen. Fast hätte er vor Freude gelacht, denn er hatte noch größeren Hunger als am Morgen, und gleich tauchte er seinen Kopf fast bis über die Augen in die Milch hinein. Aber bald zog er ihn enttäuscht wieder zurück; nicht nur, daß ihm das Essen wegen seiner heiklen linken Seite Schwierigkeiten machte – und er konnte nur essen, wenn der ganze Körper schnaufend mitarbeitete –, so schmeckte ihm überdies die Milch, die sonst sein Lieblingsgetränk war und die ihm gewiß die Schwester deshalb hereingestellt hatte, gar nicht, ja er wandte sich fast mit Widerwillen von dem Napf ab und kroch in die Zimmermitte zurück.","Im Wohnzimmer war, wie Gregor durch die Türspalte sah, das Gas angezündet, aber während sonst zu dieser Tageszeit der Vater seine nachmittags erscheinende Zeitung der Mutter und manchmal auch der Schwester mit erhobener Stimme vorzulesen pflegte, hörte man jetzt keinen Laut. Nun vielleicht war dieses Vorlesen, von dem ihm die Schwester immer erzählte und schrieb, in der letzten Zeit überhaupt aus der Übung gekommen. Aber auch ringsherum war es so still, trotzdem doch gewiß die Wohnung nicht leer war. »Was für ein stilles Leben die Familie doch führte,« sagte sich Gregor und fühlte, während er starr vor sich ins Dunkle sah, einen großen Stolz darüber, daß er seinen Eltern und seiner Schwester ein solches Leben in einer so schönen Wohnung hatte verschaffen können. Wie aber, wenn jetzt alle Ruhe, aller Wohlstand, alle Zufriedenheit ein Ende mit Schrecken nehmen sollte? Um sich nicht in solche Gedanken zu verlieren, setzte sich Gregor lieber in Bewegung und kroch im Zimmer auf und ab.","Einmal während des langen Abends wurde die eine Seitentüre und einmal die andere bis zu einer kleinen Spalte geöffnet und rasch wieder geschlossen; jemand hatte wohl das Bedürfnis hereinzukommen, aber auch wieder zu viele Bedenken. Gregor machte nun unmittelbar bei der Wohnzimmertür Halt, entschlossen, den zögernden Besucher doch irgendwie hereinzubringen oder doch wenigstens zu erfahren, wer es sei; aber nun wurde die Tür nicht mehr geöffnet und Gregor wartete vergebens. Früh, als die Türen versperrt waren, hatten alle zu ihm hereinkommen wollen, jetzt, da er die eine Tür geöffnet hatte und die anderen offenbar während des Tages geöffnet worden waren, kam keiner mehr, und die Schlüssel steckten nun auch von außen.","Spät erst in der Nacht wurde das Licht im Wohnzimmer ausgelöscht, und nun war leicht festzustellen, daß die Eltern und die Schwester so lange wachgeblieben waren, denn wie man genau hören konnte, entfernten sich jetzt alle drei auf den Fußspitzen. Nun kam gewiß bis zum Morgen niemand mehr zu Gregor herein; er hatte also eine lange Zeit, um ungestört zu überlegen, wie er sein Leben jetzt neu ordnen sollte. Aber das hohe freie Zimmer, in dem er gezwungen war, flach auf dem Boden zu liegen, ängstigte ihn, ohne daß er die Ursache herausfinden konnte, denn es war ja sein seit fünf Jahren von ihm bewohntes Zimmer – und mit einer halb unbewußten Wendung und nicht ohne eine leichte Scham eilte er unter das Kanapee, wo er sich, trotzdem sein Rücken ein wenig gedrückt wurde und trotzdem er den Kopf nicht mehr erheben konnte, gleich sehr behaglich fühlte und nur bedauerte, daß sein Körper zu breit war, um vollständig unter dem Kanapee untergebracht zu werden.","Dort blieb er die ganze Nacht, die er zum Teil im Halbschlaf, aus dem ihn der Hunger immer wieder aufschreckte, verbrachte, zum Teil aber in Sorgen und undeutlichen Hoffnungen, die aber alle zu dem Schlusse führten, daß er sich vorläufig ruhig verhalten und durch Geduld und größte Rücksichtnahme der Familie die Unannehmlichkeiten erträglich machen müsse, die er ihr in seinem gegenwärtigen Zustand nun einmal zu verursachen gezwungen war.","Schon am frühen Morgen, es war fast noch Nacht, hatte Gregor Gelegenheit, die Kraft seiner eben gefaßten Entschlüsse zu prüfen, denn vom Vorzimmer her öffnete die Schwester, fast völlig angezogen, die Tür und sah mit Spannung herein. Sie fand ihn nicht gleich, aber als sie ihn unter dem Kanapee bemerkte – Gott, er mußte doch irgendwo sein, er hatte doch nicht wegfliegen können – erschrak sie so sehr, daß sie, ohne sich beherrschen zu können, die Tür von außen wieder zuschlug. Aber als bereue sie ihr Benehmen, öffnete sie die Tür sofort wieder und trat, als sei sie bei einem Schwerkranken oder gar bei einem Fremden, auf den Fußspitzen herein. Gregor hatte den Kopf bis knapp zum Rande des Kanapees vorgeschoben und beobachtete sie. Ob sie wohl bemerken würde, daß er die Milch stehen gelassen hatte, und zwar keineswegs aus Mangel an Hunger, und ob sie eine andere Speise hereinbringen würde, die ihm besser entsprach? Täte sie es nicht von selbst, er wollte lieber verhungern, als sie darauf aufmerksam machen, trotzdem es ihn eigentlich ungeheuer drängte, unterm Kanapee vorzuschießen, sich der Schwester zu Füßen zu werfen und sie um irgend etwas Gutes zum Essen zu bitten. Aber die Schwester bemerkte sofort mit Verwunderung den noch vollen Napf, aus dem nur ein wenig Milch ringsherum verschüttet war, sie hob ihn gleich auf, zwar nicht mit den bloßen Händen, sondern mit einem Fetzen, und trug ihn hinaus. Gregor war äußerst neugierig, was sie zum Ersatze bringen würde, und er machte sich die verschiedensten Gedanken darüber. Niemals aber hätte er erraten können, was die Schwester in ihrer Güte wirklich tat. Sie brachte ihm, um seinen Geschmack zu prüfen, eine ganze Auswahl, alles auf einer alten Zeitung ausgebreitet. Da war altes halbverfaultes Gemüse; Knochen vom Nachtmahl her, die von festgewordener weißer Sauce umgeben waren; ein paar Rosinen und Mandeln; ein Käse, den Gregor vor zwei Tagen für ungenießbar erklärt hatte; ein trockenes Brot, ein mit Butter beschmiertes Brot und ein mit Butter beschmiertes und gesalzenes Brot. Außerdem stellte sie zu dem allen noch den wahrscheinlich ein für allemal für Gregor bestimmten Napf, in den sie Wasser gegossen hatte. Und aus Zartgefühl, da sie wußte, daß Gregor vor ihr nicht essen würde, entfernte sie sich eiligst und drehte sogar den Schlüssel um, damit nur Gregor merken könne, daß er es sich so behaglich machen dürfe, wie er wolle. Gregors Beinchen schwirrten, als es jetzt zum Essen ging. Seine Wunden mußten übrigens auch schon vollständig geheilt sein, er fühlte keine Behinderung mehr, er staunte darüber und dachte daran, wie er vor mehr als einem Monat sich mit dem Messer ganz wenig in den Finger geschnitten, und wie ihm diese Wunde noch vorgestern genug wehgetan hatte. »Sollte ich jetzt weniger Feingefühl haben?« dachte er und saugte schon gierig an dem Käse, zu dem es ihn vor allen anderen Speisen sofort und nachdrücklich gezogen hatte. Rasch hintereinander und mit vor Befriedigung tränenden Augen verzehrte er den Käse, das Gemüse und die Sauce; die frischen Speisen dagegen schmeckten ihm nicht, er konnte nicht einmal ihren Geruch vertragen und schleppte sogar die Sachen, die er essen wollte, ein Stückchen weiter weg. Er war schon längst mit allem fertig und lag nur noch faul auf der gleichen Stelle, als die Schwester zum Zeichen, daß er sich zurückziehen solle, langsam den Schlüssel umdrehte. Das schreckte ihn sofort auf, trotzdem er schon fast schlummerte, und er eilte wieder unter das Kanapee. Aber es kostete ihn große Selbstüberwindung, auch nur die kurze Zeit, während welcher die Schwester im Zimmer war, unter dem Kanapee zu bleiben, denn von dem reichlichen Essen hatte sich sein Leib ein wenig gerundet, und er konnte dort in der Enge kaum atmen. Unter kleinen Erstickungsanfällen sah er mit etwas hervorgequollenen Augen zu, wie die nichtsahnende Schwester mit einem Besen nicht nur die Überbleibsel zusammenkehrte, sondern selbst die von Gregor gar nicht berührten Speisen, als seien also auch diese nicht mehr zu gebrauchen, und wie sie alles hastig in einen Kübel schüttete, den sie mit einem Holzdeckel schloß, worauf sie alles hinaustrug. Kaum hatte sie sich umgedreht, zog sich schon Gregor unter dem Kanapee hervor und streckte und blähte sich.","Auf diese Weise bekam nun Gregor täglich sein Essen, einmal am Morgen, wenn die Eltern und das Dienstmädchen noch schliefen, das zweitemal nach dem allgemeinen Mittagessen, denn dann schliefen die Eltern gleichfalls noch ein Weilchen, und das Dienstmädchen wurde von der Schwester mit irgendeiner Besorgung weggeschickt. Gewiß wollten auch sie nicht, daß Gregor verhungere, aber vielleicht hätten sie es nicht ertragen können, von seinem Essen mehr als durch Hörensagen zu erfahren, vielleicht wollte die Schwester ihnen auch eine möglicherweise nur kleine Trauer ersparen, denn tatsächlich litten sie ja gerade genug.","Mit welchen Ausreden man an jenem ersten Vormittag den Arzt und den Schlosser wieder aus der Wohnung geschafft hatte, konnte Gregor gar nicht erfahren, denn da er nicht verstanden wurde, dachte niemand daran, auch die Schwester nicht, daß er die anderen verstehen könne, und so mußte er sich, wenn die Schwester in seinem Zimmer war, damit begnügen, nur hier und da ihre Seufzer und Anrufe der Heiligen zu hören. Erst später, als sie sich ein wenig an alles gewöhnt hatte – von vollständiger Gewöhnung konnte natürlich niemals die Rede sein –, erhaschte Gregor manchmal eine Bemerkung, die freundlich gemeint war oder so gedeutet werden konnte. »Heute hat es ihm aber geschmeckt,« sagte sie, wenn Gregor unter dem Essen tüchtig aufgeräumt hatte, während sie im gegenteiligen Fall, der sich allmählich immer häufiger wiederholte, fast traurig zu sagen pflegte: »Nun ist wieder alles stehengeblieben.«","Während aber Gregor unmittelbar keine Neuigkeit erfahren konnte, erhorchte er manches aus den Nebenzimmern, und wo er nun einmal Stimmen hörte, lief er gleich zu der betreffenden Tür und drückte sich mit ganzem Leib an sie. Besonders in der ersten Zeit gab es kein Gespräch, das nicht irgendwie wenn auch nur im geheimen, von ihm handelte. Zwei Tage lang waren bei allen Mahlzeiten Beratungen darüber zu hören, wie man sich jetzt verhalten solle; aber auch zwischen den Mahlzeiten sprach man über das gleiche Thema, denn immer waren zumindest zwei Familienmitglieder zu Hause, da wohl niemand allein zu Hause bleiben wollte und man die Wohnung doch auf keinen Fall gänzlich verlassen konnte. Auch hatte das Dienstmädchen gleich am ersten Tag – es war nicht ganz klar, was und wieviel sie von dem Vorgefallenen wußte – kniefällig die Mutter gebeten, sie sofort zu entlassen, und als sie sich eine Viertelstunde danach verabschiedete, dankte sie für die Entlassung unter Tränen, wie für die größte Wohltat, die man ihr hier erwiesen hatte, und gab, ohne daß man es von ihr verlangte, einen fürchterlichen Schwur ab, niemandem auch nur das geringste zu verraten.","Nun mußte die Schwester im Verein mit der Mutter auch kochen; allerdings machte das nicht viel Mühe, denn man aß fast nichts. Immer wieder hörte Gregor, wie der eine den anderen vergebens zum Essen aufforderte und keine andere Antwort bekam, als: »Danke ich habe genug« oder etwas Ähnliches. Getrunken wurde vielleicht auch nichts. Öfters fragte die Schwester den Vater, ob er Bier haben wolle, und herzlich erbot sie sich, es selbst zu holen, und als der Vater schwieg, sagte sie, um ihm jedes Bedenken zu nehmen, sie könne auch die Hausmeisterin darum schicken, aber dann sagte der Vater schließlich ein großes »Nein«, und es wurde nicht mehr davon gesprochen.","Schon im Laufe des ersten Tages legte der Vater die ganzen Vermögensverhältnisse und Aussichten sowohl der Mutter als auch der Schwester dar. Hie und da stand er vom Tische auf und holte aus seiner kleinen Wertheimkassa, die er aus dem vor fünf Jahren erfolgten Zusammenbruch seines Geschäftes gerettet hatte, irgendeinen Beleg oder irgendein Vormerkbuch. Man hörte, wie er das komplizierte Schloß aufsperrte und nach Entnahme des Gesuchten wieder verschloß. Diese Erklärungen des Vaters waren zum Teil das erste Erfreuliche, was Gregor seit seiner Gefangenschaft zu hören bekam. Er war der Meinung gewesen, daß dem Vater von jenem Geschäft her nicht das Geringste übriggeblieben war, zumindest hatte ihm der Vater nichts Gegenteiliges gesagt, und Gregor allerdings hatte ihn auch nicht darum gefragt. Gregors Sorge war damals nur gewesen, alles daranzusetzen, um die Familie das geschäftliche Unglück, das alle in eine vollständige Hoffnungslosigkeit gebracht hatte, möglichst rasch vergessen zu lassen. Und so hatte er damals mit ganz besonderem Feuer zu arbeiten angefangen und war fast über Nacht aus einem kleinen Kommis ein Reisender geworden, der natürlich ganz andere Möglichkeiten des Geldverdienens hatte, und dessen Arbeitserfolge sich sofort in Form der Provision zu Bargeld verwandelten, das der erstaunten und beglückten Familie zu Hause auf den Tisch gelegt werden konnte. Es waren schöne Zeiten gewesen, und niemals nachher hatten sie sich, wenigstens in diesem Glanze, wiederholt, trotzdem Gregor später so viel Geld verdiente, daß er den Aufwand der ganzen Familie zu tragen imstande war und auch trug. Man hatte sich eben daran gewöhnt, sowohl die Familie, als auch Gregor, man nahm das Geld dankbar an, er lieferte es gern ab, aber eine besondere Wärme wollte sich nicht mehr ergeben. Nur die Schwester war Gregor doch noch nahe geblieben, und es war sein geheimer Plan, sie, die zum Unterschied von Gregor Musik sehr liebte und rührend Violine zu spielen verstand, nächstes Jahr, ohne Rücksicht auf die großen Kosten, die das verursachen mußte, und die man schon auf andere Weise hereinbringen würde, auf das Konservatorium zu schicken. Öfters während der kurzen Aufenthalte Gregors in der Stadt wurde in den Gesprächen mit der Schwester das Konservatorium erwähnt, aber immer nur als schöner Traum, an dessen Verwirklichung nicht zu denken war, und die Eltern hörten nicht einmal diese unschuldigen Erwähnungen gern; aber Gregor dachte sehr bestimmt daran und beabsichtigte, es am Weihnachtsabend feierlich zu erklären.","Solche in seinem gegenwärtigen Zustand ganz nutzlose Gedanken gingen ihm durch den Kopf, während er dort aufrecht an der Türe klebte und horchte. Manchmal konnte er vor allgemeiner Müdigkeit gar nicht mehr zuhören und ließ den Kopf nachlässig gegen die Tür schlagen, hielt ihn aber sofort wieder fest, denn selbst das kleine Geräusch, das er damit verursacht hatte, war nebenan gehört worden und hatte alle verstummen lassen. »Was er nur wieder treibt,« sagte der Vater nach einer Weile, offenbar zur Türe hingewendet, und dann erst wurde das unterbrochene Gespräch allmählich wieder aufgenommen.","Gregor erfuhr nun zur Genüge – denn der Vater pflegte sich in seinen Erklärungen öfters zu wiederholen, teils, weil er selbst sich mit diesen Dingen schon lange nicht beschäftigt hatte, teils auch, weil die Mutter nicht alles gleich beim erstenmal verstand –, daß trotz allen Unglücks ein allerdings ganz kleines Vermögen aus der alten Zeit noch vorhanden war, das die nicht angerührten Zinsen in der Zwischenzeit ein wenig hatten anwachsen lassen. Außerdem aber war das Geld, das Gregor allmonatlich nach Hause gebracht hatte – er selbst hatte nur ein paar Gulden für sich behalten –, nicht vollständig aufgebraucht worden und hatte sich zu einem kleinen Kapital angesammelt. Gregor, hinter seiner Türe, nickte eifrig, erfreut über diese unerwartete Vorsicht und Sparsamkeit. Eigentlich hätte er ja mit diesen überschüssigen Geldern die Schuld des Vaters gegenüber dem Chef weiter abgetragen haben können, und jener Tag, an dem er diesen Posten hätte loswerden können, wäre weit näher gewesen, aber jetzt war es zweifellos besser so, wie es der Vater eingerichtet hatte.","Nun genügte dieses Geld aber ganz und gar nicht, um die Familie etwa von den Zinsen leben zu lassen; es genügte vielleicht, um die Familie ein, höchstens zwei Jahre zu erhalten, mehr war es nicht. Es war also bloß eine Summe, die man eigentlich nicht angreifen durfte, und die für den Notfall zurückgelegt werden mußte; das Geld zum Leben aber mußte man verdienen. Nun war aber der Vater ein zwar gesunder, aber alter Mann, der schon fünf Jahre nichts gearbeitet hatte und sich jedenfalls nicht viel zutrauen durfte; er hatte in diesen fünf Jahren, welche die ersten Ferien seines mühevollen und doch erfolglosen Lebens waren, viel Fett angesetzt und war dadurch recht schwerfällig geworden. Und die alte Mutter sollte nun vielleicht Geld verdienen, die an Asthma litt, der eine Wanderung durch die Wohnung schon Anstrengung verursachte, und die jeden zweiten Tag in Atembeschwerden auf dem Sofa beim offenen Fenster verbrachte? Und die Schwester sollte Geld verdienen, die noch ein Kind war mit ihren siebzehn Jahren, und der ihre bisherige Lebensweise so sehr zu gönnen war, die daraus bestanden hatte, sich nett zu kleiden, lange zu schlafen, in der Wirtschaft mitzuhelfen, an ein paar bescheidenen Vergnügungen sich zu beteiligen und vor allem Violine zu spielen? Wenn die Rede auf diese Notwendigkeit des Geldverdienens kam, ließ zuerst immer Gregor die Türe los und warf sich auf das neben der Tür befindliche kühle Ledersofa, denn ihm war ganz heiß vor Beschämung und Trauer.","Oft lag er dort die ganzen langen Nächte über, schlief keinen Augenblick und scharrte nur stundenlang auf dem Leder. Oder er scheute nicht die große Mühe, einen Sessel zum Fenster zu schieben, dann die Fensterbrüstung hinaufzukriechen und, in den Sessel gestemmt, sich ans Fenster zu lehnen, offenbar nur in irgendeiner Erinnerung an das Befreiende, das früher für ihn darin gelegen war, aus dem Fenster zu schauen. Denn tatsächlich sah er von Tag zu Tag die auch nur ein wenig entfernten Dinge immer undeutlicher; das gegenüberliegende Krankenhaus, dessen nur allzu häufigen Anblick er früher verflucht hatte, bekam er überhaupt nicht mehr zu Gesicht, und wenn er nicht genau gewußt hätte, daß er in der stillen, aber völlig städtischen Charlottenstraße wohnte, hätte er glauben können, von seinem Fenster aus in eine Einöde zu schauen in welcher der graue Himmel und die graue Erde ununterscheidbar sich vereinigten. Nur zweimal hatte die aufmerksame Schwester sehen müssen, daß der Sessel beim Fenster stand, als sie schon jedesmal, nachdem sie das Zimmer aufgeräumt hatte, den Sessel wieder genau zum Fenster hinschob, ja sogar von nun ab den inneren Fensterflügel offen ließ.","Hätte Gregor nur mit der Schwester sprechen und ihr für alles danken können, was sie für ihn machen mußte, er hätte ihre Dienste leichter ertragen; so aber litt er darunter. Die Schwester suchte freilich die Peinlichkeit des Ganzen möglichst zu verwischen, und je längere Zeit verging, desto besser gelang es ihr natürlich auch, aber auch Gregor durchschaute mit der Zeit alles viel genauer. Schon ihr Eintritt war für ihn schrecklich. Kaum war sie eingetreten, lief sie, ohne sich Zeit zu nehmen, die Türe zu schließen, so sehr sie sonst darauf achtete, jedem den Anblick von Gregors Zimmer zu ersparen, geradewegs zum Fenster und riß es, als ersticke sie fast, mit hastigen Händen auf, blieb auch, selbst wenn es noch so kalt war, ein Weilchen beim Fenster und atmete tief. Mit diesem Laufen und Lärmen erschreckte sie Gregor täglich zweimal; die ganze Zeit über zitterte er unter dem Kanapee und wußte doch sehr gut, daß sie ihn gewiß gerne damit verschont hätte, wenn es ihr nur möglich gewesen wäre, sich in einem Zimmer, in dem sich Gregor befand, bei geschlossenem Fenster aufzuhalten.","Einmal, es war wohl schon ein Monat seit Gregors Verwandlung vergangen, und es war doch schon für die Schwester kein besonderer Grund mehr, über Gregors Aussehen in Erstaunen zu geraten, kam sie ein wenig früher als sonst und traf Gregor noch an, wie er, unbeweglich und so recht zum Erschrecken aufgestellt, aus dem Fenster schaute. Es wäre für Gregor nicht unerwartet gewesen, wenn sie nicht eingetreten wäre, da er sie durch seine Stellung verhinderte, sofort das Fenster zu öffnen, aber sie trat nicht nur nicht ein, sie fuhr sogar zurück und schloß die Tür; ein Fremder hätte geradezu denken können, Gregor habe ihr aufgelauert und habe sie beißen wollen. Gregor versteckte sich natürlich sofort unter dem Kanapee, aber er mußte bis zum Mittag warten, ehe die Schwester wiederkam, und sie schien viel unruhiger als sonst. Er erkannte daraus, daß ihr sein Anblick noch immer unerträglich war und ihr auch weiterhin unerträglich bleiben müsse, und daß sie sich wohl sehr überwinden mußte, vor dem Anblick auch nur der kleinen Partie seines Körpers nicht davonzulaufen, mit der er unter dem Kanapee hervorragte. Um ihr auch diesen Anblick zu ersparen, trug er eines Tages auf seinem Rücken – er brauchte zu dieser Arbeit vier Stunden – das Leintuch auf das Kanapee und ordnete es in einer solchen Weise an, daß er nun gänzlich verdeckt war, und daß die Schwester, selbst wenn sie sich bückte, ihn nicht sehen konnte. Wäre dieses Leintuch ihrer Meinung nach nicht nötig gewesen, dann hätte sie es ja entfernen können, denn daß es nicht zum Vergnügen Gregors gehören konnte, sich so ganz und gar abzusperren, war doch klar genug, aber sie ließ das Leintuch, so wie es war, und Gregor glaubte sogar einen dankbaren Blick erhascht zu haben, als er einmal mit dem Kopf vorsichtig das Leintuch ein wenig lüftete, um nachzusehen, wie die Schwester die neue Einrichtung aufnahm.","In den ersten vierzehn Tagen konnten es die Eltern nicht über sich bringen, zu ihm hereinzukommen, und er hörte oft, wie sie die jetzige Arbeit der Schwester völlig anerkannten, während sie sich bisher häufig über die Schwester geärgert hatten, weil sie ihnen als ein etwas nutzloses Mädchen erschienen war. Nun aber warteten oft beide, der Vater und die Mutter, vor Gregors Zimmer, während die Schwester dort aufräumte, und kaum war sie herausgekommen, mußte sie ganz genau erzählen, wie es in dem Zimmer aussah, was Gregor gegessen hatte, wie er sich diesmal benommen hatte, und ob vielleicht eine kleine Besserung zu bemerken war. Die Mutter übrigens wollte verhältnismäßig bald Gregor besuchen, aber der Vater und die Schwester hielten sie zuerst mit Vernunftgründen zurück, denen Gregor sehr aufmerksam zuhörte, und die er vollständig billigte. Später aber mußte man sie mit Gewalt zurückhalten, und wenn sie dann rief: »Laßt mich doch zu Gregor, er ist ja mein unglücklicher Sohn! Begreift ihr es denn nicht, daß ich zu ihm muß?«, dann dachte Gregor, daß es vielleicht doch gut wäre, wenn die Mutter hereinkäme, nicht jeden Tag natürlich, aber vielleicht einmal in der Woche; sie verstand doch alles viel besser als die Schwester, die trotz all ihrem Mute doch nur ein Kind war und im letzten Grunde vielleicht nur aus kindlichem Leichtsinn eine so schwere Aufgabe übernommen hatte.","Der Wunsch Gregors, die Mutter zu sehen, ging bald in Erfüllung. Während des Tages wollte Gregor schon aus Rücksicht auf seine Eltern sich nicht beim Fenster zeigen, kriechen konnte er aber auf den paar Quadratmetern des Fußbodens auch nicht viel, das ruhige Liegen ertrug er schon während der Nacht schwer, das Essen machte ihm bald nicht mehr das geringste Vergnügen, und so nahm er zur Zerstreuung die Gewohnheit an, kreuz und quer über Wände und Plafond zu kriechen. Besonders oben an der Decke hing er gern; es war ganz anders, als das Liegen auf dem Fußboden; man atmete freier; ein leichtes Schwingen ging durch den Körper, und in der fast glücklichen Zerstreutheit, in der sich Gregor dort oben befand, konnte es geschehen, daß er zu seiner eigenen Überraschung sich losließ und auf den Boden klatschte. Aber nun hatte er natürlich seinen Körper ganz anders in der Gewalt als früher und beschädigte sich selbst bei einem so großen Falle nicht. Die Schwester nun bemerkte sofort die neue Unterhaltung, die Gregor für sich gefunden hatte – er hinterließ ja auch beim Kriechen hie und da Spuren seines Klebstoffes –, und da setzte sie es sich in den Kopf, Gregor das Kriechen in größtem Ausmaße zu ermöglichen und die Möbel, die es verhinderten, also vor allem den Kasten und den Schreibtisch, wegzuschaffen. Nun war sie aber nicht imstande, dies allein zu tun; den Vater wagte sie nicht um
