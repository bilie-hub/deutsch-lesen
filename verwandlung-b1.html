<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Die Verwandlung – leicht erzählt</title>
<link rel="icon" href="images/cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #e7e0d3; --desk2: #d6ccba;
  --page: #fbf7ee; --ink: #2a2520; --muted: #8a7f72;
  --accent: #9b2c1f; --accent-soft: rgba(155, 44, 31, .10);
  --sel: #f5d77a; --sel-ink: #1d160a; --sent: rgba(245, 215, 122, .30); --hover: rgba(155, 44, 31, .09);
  --panel: #fffdf8; --panel-ink: #2a2520; --line: rgba(42, 37, 32, .11); --chip: #f2ebdd;
  --shadow: 0 1px 2px rgba(60, 40, 20, .08), 0 18px 50px -10px rgba(60, 40, 20, .28);
  --serif: "EB Garamond", Georgia, serif; --ui: Inter, system-ui, "Segoe UI", sans-serif;
  --fraktur: "Cormorant Garamond", "EB Garamond", serif;
  --book: var(--serif); --fs: 20px; --lh: 1.55;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme: light;
}
[data-theme="sepia"] {
  --desk: #cdbb98; --desk2: #b9a47f; --page: #f4e7cc; --ink: #3a2c1c; --muted: #8c7556;
  --panel: #f9efda; --panel-ink: #3a2c1c; --chip: #ecdcbd; --line: rgba(58, 44, 28, .13);
}
[data-theme="night"] {
  --desk: #121215; --desk2: #0b0b0d; --page: #1d1c20; --ink: #ddd5c8; --muted: #8d867c;
  --accent: #e58b6b; --accent-soft: rgba(229, 139, 107, .13);
  --sel: #d9b257; --sel-ink: #17120a; --sent: rgba(217, 178, 87, .09); --hover: rgba(229, 139, 107, .14);
  --panel: #18171b; --panel-ink: #e6dfd3; --line: rgba(255, 255, 255, .08); --chip: #26242a;
  --shadow: 0 18px 50px -10px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
[data-font="literata"] { --book: "Literata", Georgia, serif; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse 120% 90% at 50% 35%, var(--desk), var(--desk2));
  color: var(--ink); font-family: var(--ui); overflow: hidden;
  -webkit-font-smoothing: antialiased; transition: background .5s;
}
button { font: inherit; color: inherit; }
kbd {
  font: 600 10.5px var(--ui); padding: 2px 6px; border-radius: 5px; background: var(--chip);
  border: 1px solid var(--line); border-bottom-width: 2px; color: var(--panel-ink); white-space: nowrap;
}
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- app frame ---------- */
.app { display: grid; grid-template-rows: 56px minmax(0, 1fr) 52px; grid-template-columns: minmax(0, 1fr); height: 100dvh; }
body.wide .app { grid-template-columns: minmax(0, 1fr) clamp(330px, 28vw, 400px); }
body.wide .bar, body.wide .foot { grid-column: 1; }
.bar { display: flex; align-items: center; gap: 6px; padding: 0 14px; position: relative; z-index: 5; }
.bar .title { flex: 1; text-align: center; line-height: 1.1; min-width: 0; }
.bar .title b { font: 600 23px var(--fraktur); color: var(--accent); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title span { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.ibtn {
  display: inline-flex; align-items: center; gap: 6px; height: 38px; min-width: 38px; padding: 0 10px; justify-content: center;
  border: 0; border-radius: 10px; background: transparent; color: var(--ink); cursor: pointer; font-size: 13px; font-weight: 500;
  transition: background .2s, transform .1s;
}
.ibtn:hover { background: var(--hover); }
.ibtn:active { transform: scale(.96); }
.badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 7px; }

/* ---------- stage & page ---------- */
.stage { position: relative; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 0; }
body:not(.wide) .stage { overflow: hidden; }
/* English page next to the German one */
.enpage {
  display: none; position: relative; width: var(--pw); height: var(--ph); flex: none; border-radius: 10px 4px 4px 10px;
  background: var(--grain), var(--page); box-shadow: var(--shadow); overflow: hidden; transition: background-color .5s;
}
.enpage::before { content: ""; position: absolute; inset: 0 0 0 auto; width: 30px; pointer-events: none; background: linear-gradient(270deg, rgba(0, 0, 0, .08), transparent); }
body.bi .enpage { display: flex; flex-direction: column; }
body.bi .stage { gap: 0; }
body.bi .book .page { border-radius: 4px 0 0 4px; }
body.bi .book { margin-right: 2px; }
body.bi-narrow .enpage { display: flex; flex-direction: column; position: absolute; z-index: 7; opacity: 0; pointer-events: none; transform: rotateY(-8deg) scale(.98); transition: opacity .3s, transform .35s; }
body.bi-narrow.show-en .enpage { opacity: 1; pointer-events: auto; transform: none; }
.enhead { padding: 22px var(--px) 10px; font: 600 10px var(--ui); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); text-align: center; flex: none; }
.enhead span { letter-spacing: .04em; text-transform: none; font-weight: 400; }
.alttab { border: 0; background: transparent; cursor: pointer; font: 600 10.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 6px 10px; border-radius: 8px; }
.alttab.on { background: var(--accent-soft); color: var(--accent); }
.alttab:hover { color: var(--ink); }
.altnote { font: 400 11px var(--ui); letter-spacing: .02em; text-transform: none; margin-top: 6px; }
#enpage:lang(de) .enbody p { font-size: calc(var(--fs) * .82); }
.enbody { flex: 1; overflow-y: auto; padding: 6px var(--px) 28px; scrollbar-width: thin; }
.enbody p {
  margin: 0 0 .75em; font: calc(var(--fs) * .84) / 1.55 var(--book); color: var(--ink); border-radius: 8px; padding: 4px 8px; margin-left: -8px; margin-right: -8px;
  transition: background-color .25s, opacity .25s;
}
.enbody p.cont, .enbody p.more { opacity: .72; }
.enbody p.cont::before { content: "… "; }
.enbody p.hl { background: var(--sent); opacity: 1; }
.enbody p.hov { background: var(--hover); opacity: 1; }
.enbody .note { font: italic 14px/1.5 var(--serif); color: var(--muted); text-align: center; margin-top: 30%; }
.flow p.hov { background: linear-gradient(var(--hover), var(--hover)); border-radius: 4px; }
.lng { font: 700 11px var(--ui); letter-spacing: .06em; padding: 3px 5px; border-radius: 5px; }
.lng.en { margin-left: -4px; opacity: .45; }
body.bi .lng.en, body.show-en .lng.en { background: var(--accent); color: #fff; opacity: 1; }
/* grammar explainer */
.gnotes { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.55; display: grid; gap: 8px; }
.gnotes li::marker { color: var(--accent); }
.gnotes b { font-weight: 600; }
.gnotes i { font-family: var(--serif); font-size: 1.08em; }
.gword { font-size: 14px; }
.who { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.glink { color: var(--accent); font-size: 12px; font-weight: 600; text-decoration: none; white-space: nowrap; }
.glink:hover { text-decoration: underline; }
.gram { margin-top: 12px; padding: 14px 14px 12px; border-radius: 12px; background: var(--chip); }
.glegend { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; font-size: 11px; }
.glegend span { padding: 1px 7px; border-radius: 6px; }
.gsent { font: 17px/1.75 var(--serif); margin: 0 0 6px; }
.gv { color: var(--accent); font-weight: 700; background: var(--accent-soft); border-radius: 4px; padding: 0 2px; }
.gv2 { color: var(--accent); border-bottom: 2px dotted var(--accent); }
.gc { color: #2f6fb3; font-weight: 600; background: rgba(47, 111, 179, .1); border-radius: 4px; padding: 0 2px; }
[data-theme="night"] .gc { color: #8ab4f8; background: rgba(138, 180, 248, .12); }
.gq { font-family: var(--serif); font-size: 1.08em; font-style: italic; background: var(--page); padding: 0 4px; border-radius: 4px; }
.gnote-foot { font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.prepcard { text-align: left; border-radius: 14px; padding: 16px 18px; margin: 0 0 26px; background: var(--accent-soft); border: 1px solid var(--line); }
.prepcard .t1 { font: 600 10.5px var(--ui); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.prepcard .t2 { font: 500 19px/1.3 var(--serif); margin: 6px 0 12px; }
.prepcard a { text-decoration: none; }
.turn {
  width: 46px; height: 96px; border: 0; border-radius: 14px; background: transparent; color: var(--muted);
  cursor: pointer; opacity: .55; transition: opacity .2s, background .2s, transform .15s; display: grid; place-items: center;
}
.turn:hover { opacity: 1; background: var(--hover); }
.turn:active { transform: scale(.94); }
.turn svg { width: 30px; height: 30px; }
.book { position: relative; width: var(--pw); height: var(--ph); perspective: 2600px; opacity: 0; transition: translate .38s cubic-bezier(.2, .8, .2, 1); }
.book.ready { opacity: 1; transition: opacity .6s; }
.page, .leaf {
  position: absolute; inset: 0; background: var(--grain), var(--page);
  border-radius: 4px 10px 10px 4px; overflow: hidden;
}
.page { box-shadow: var(--shadow); transition: background-color .5s; }
.page::before, .leaf::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 34px; pointer-events: none; z-index: 1;
  background: linear-gradient(90deg, rgba(0, 0, 0, .10), rgba(0, 0, 0, .03) 40%, transparent);
}
.page::after {   /* stacked pages on the right edge */
  content: ""; position: absolute; top: 6px; bottom: 6px; right: 0; width: 5px; pointer-events: none;
  background: repeating-linear-gradient(90deg, transparent 0 1px, rgba(0, 0, 0, .05) 1px 2px);
}
.leaf {
  z-index: 4; display: none; pointer-events: none; transform-origin: left center; backface-visibility: hidden;
  box-shadow: 0 0 30px rgba(0, 0, 0, .18); will-change: transform;
}
.leaf .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .05), rgba(0, 0, 0, .35)); opacity: 0; z-index: 2; }
.cast { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .28), rgba(0, 0, 0, .06) 55%, transparent); }
.vp { position: absolute; left: var(--px); right: var(--px); top: var(--pt); bottom: var(--pb); overflow: hidden; }
.runhead {
  position: absolute; top: calc(var(--pt) * .42); left: var(--px); right: var(--px); text-align: center;
  font: 600 10px var(--ui); letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.folio { position: absolute; bottom: calc(var(--pb) * .32); left: 0; right: 0; text-align: center; font: italic 15px var(--serif); color: var(--muted); }

/* ---------- typography inside the book ---------- */
.flow {
  position: relative; height: 100%; column-fill: auto;
  font-family: var(--book); font-size: var(--fs); line-height: var(--lh);
  hyphens: auto; -webkit-hyphens: auto; font-kerning: normal; font-variant-ligatures: common-ligatures;
  text-rendering: optimizeLegibility; overflow-wrap: break-word;
}
.flow p { margin: 0; text-indent: 1.4em; text-align: justify; orphans: 2; widows: 2; }
.flow h1 + p, .flow h2 + p, .flow h3 + p, .flow figure + p, .flow div + p, .flow p.center, .flow p.right, .flow p.p0 { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-weight: 400; text-align: center; break-after: avoid; hyphens: none; }
.flow h1 { font: 600 2.4em/1.1 var(--fraktur); letter-spacing: .02em; color: var(--accent); margin: .8em 0 .5em; }
.flow h2 { font: 600 2em/1.15 var(--fraktur); color: var(--accent); margin: 1.4em 0 .4em; }
.flow h2 .s3 { font-size: inherit; }
.flow h3 { font: 600 1.55em/1.25 var(--fraktur); margin: .3em 0 1.3em; }
.flow h3 .s5 {
  display: block; font: 600 11px var(--ui); letter-spacing: .28em; text-transform: uppercase; color: var(--accent); margin-bottom: 1em;
}
.flow h3 + p::first-letter, .flow h2 + p::first-letter {
  float: left; font-family: var(--fraktur); font-size: 3.5em; line-height: .82; padding: .06em .09em 0 0; color: var(--accent);
}
.flow .center { text-align: center; text-indent: 0; }
.flow .right { text-align: right; text-indent: 0; }
.flow .s2 { font-size: 1.45em; } .flow .s3 { font-size: 1.22em; } .flow .s4 { font-size: 1.08em; } .flow .s5 { font-size: .88em; }
.flow .mtop1, .flow .mtop3, .flow .padtop1, .flow .padtop3, .flow .padtop5 { margin-top: .8em; }
.flow .gesperrt { letter-spacing: .13em; font-style: normal; }
.flow .antiqua { font-style: italic; }
.flow .transnote { font: 13px/1.55 var(--ui); background: var(--chip); padding: 14px 16px; border-radius: 10px; margin-bottom: 1.4em; break-inside: avoid; }
.flow .transnote p { text-align: left; text-indent: 0; margin-bottom: .5em; }
.flow .transnote .s3 { font-size: 14px; }
.flow .eng > div:first-child { font-size: .85em; text-align: center; color: var(--muted); margin: 1em 0; }
.flow figure { margin: 1.1em 0; text-align: center; break-inside: avoid; }
.flow figure img {
  max-width: 100%; max-height: calc(var(--content-h) * .8); height: auto; border-radius: 3px; cursor: zoom-in; vertical-align: top;
}
.flow .figleft img { width: 28%; }
.flow figcaption { font: 500 10.5px var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: .7em; }
.flow figcaption .u { text-decoration: none; }
[data-theme="night"] .flow img { filter: brightness(.82) contrast(1.05); }
.eoc { display: block; height: 1px; }

.w { border-radius: 3px; cursor: pointer; transition: background-color .15s, box-shadow .15s, color .15s; }
@media (hover: hover) { .w:hover { background: var(--hover); } }
.w.sel { background: var(--sel); box-shadow: 0 0 0 2px var(--sel); color: var(--sel-ink); }
.w.sel2 { background: var(--sel); box-shadow: 0 0 0 2px var(--sel); color: var(--sel-ink); opacity: .75; }
.sepcard { margin: 14px 0 4px; padding: 14px 16px; border-radius: 14px; background: var(--sel); color: var(--sel-ink); }
.sepcard .t1 { font: 600 10.5px var(--ui); letter-spacing: .16em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; opacity: .85; }
.sepcard .t1 .glink { color: inherit; letter-spacing: 0; text-transform: none; }
.sepcard .sw { font: 500 26px/1.2 var(--serif); margin-top: 6px; }
.sepcard .sw span { font: italic 16px var(--serif); opacity: .7; }
.sepcard .sw a { color: inherit; text-decoration: none; border-bottom: 2px solid currentColor; cursor: pointer; }
.sepcard .sm { font: 18px/1.4 var(--serif); margin-top: 4px; }
.sepcard .sm small { font: 11.5px var(--ui); opacity: .7; }
.sepcard .sx { font-size: 12.5px; line-height: 1.5; margin-top: 8px; opacity: .85; }
::highlight(sent) { background-color: var(--sent); }

/* ---------- footer ---------- */
.foot { display: flex; align-items: center; gap: 14px; padding: 0 22px; font-size: 12px; color: var(--muted); }
.foot .chap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30%; font-weight: 500; }
.foot .pg { white-space: nowrap; font-variant-numeric: tabular-nums; }
.scrub { flex: 1; -webkit-appearance: none; appearance: none; height: 22px; background: transparent; cursor: pointer; }
.scrub::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--fill, 0%), var(--line) var(--fill, 0%)); }
.scrub::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--fill, 0%), var(--line) var(--fill, 0%)); }
.scrub::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5.5px; border-radius: 50%; background: var(--accent); border: 2px solid var(--page); box-shadow: 0 1px 4px rgba(0, 0, 0, .3); transition: transform .15s; }
.scrub::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--page); }
.scrub:hover::-webkit-slider-thumb { transform: scale(1.25); }

/* ---------- dictionary panel ---------- */
.dict {
  background: var(--panel); color: var(--panel-ink); display: flex; flex-direction: column; min-height: 0; z-index: 6;
  transition: background .5s;
}
body.wide .dict { grid-column: 2; grid-row: 1 / 4; border-left: 1px solid var(--line); box-shadow: -10px 0 40px -20px rgba(0, 0, 0, .25); }
body:not(.wide) .dict {
  position: fixed; left: 0; right: 0; bottom: 0; max-height: 56dvh; border-radius: 20px 20px 0 0;
  box-shadow: 0 -12px 40px rgba(0, 0, 0, .25); transform: translateY(105%); transition: transform .38s cubic-bezier(.2, .8, .2, 1);
}
body:not(.wide) .dict.open { transform: none; }
.grab { display: none; width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; flex: none; }
body:not(.wide) .grab { display: block; }
.dscroll { overflow-y: auto; padding: 22px 24px 28px; flex: 1; scrollbar-width: thin; }
body:not(.wide) .dscroll { padding: 10px 18px 22px; }
.swap { animation: swapIn .22s ease-out; }
@keyframes swapIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.empty { text-align: center; padding: 40px 10px 10px; }
.empty .mark { font: 600 64px/1 var(--fraktur); color: var(--accent); opacity: .85; }
.empty h3 { font: 500 22px var(--serif); margin: 14px 0 6px; }
.empty p { color: var(--muted); font-size: 14px; margin: 0 0 26px; line-height: 1.5; }
.keys { list-style: none; padding: 0; margin: 0 auto; text-align: left; display: grid; gap: 11px; font-size: 13px; max-width: 290px; }
.keys li { display: flex; align-items: center; gap: 10px; }
.keys li span:first-child { display: inline-flex; gap: 4px; min-width: 78px; }
.empty .hint { font-size: 12.5px; margin: 22px 0 0; }
.badge:empty, .badge[data-n="0"] { display: none; }

.dhead { display: flex; align-items: center; gap: 6px; }
.dhead .nav { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--panel-ink); flex: none; transition: background .2s; }
.dhead .nav:hover { background: var(--hover); }
.dhead .nav svg { width: 18px; height: 18px; }
.dhead .wt { flex: 1; text-align: center; min-width: 0; }
.dword { font: 500 34px/1.1 var(--serif); color: var(--accent); overflow-wrap: anywhere; }
.dword.phrase { font-size: 21px; line-height: 1.3; font-style: italic; }
.dlemma { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.dlemma a { color: var(--accent); cursor: pointer; text-decoration: none; border-bottom: 1px dashed currentColor; }
.dclose { position: absolute; right: 10px; top: 10px; }
.acts { display: flex; gap: 8px; justify-content: center; margin: 14px 0 6px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; font-size: 12.5px; font-weight: 500; color: var(--panel-ink); transition: background .2s, color .2s, border-color .2s;
}
.pill:hover { background: var(--hover); }
.pill svg.i { width: 16px; height: 16px; }
.pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.pill.on svg.i { fill: currentColor; }
.pill:disabled { opacity: .5; cursor: default; }
.sect { margin-top: 18px; }
.lbl { font: 600 10.5px var(--ui); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.lbl::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.pos { display: inline-block; font: 600 10.5px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 6px; margin: 10px 0 6px; }
.defs { margin: 0; padding-left: 22px; font: 17.5px/1.45 var(--serif); }
.defs li { margin: 3px 0; padding-left: 2px; }
.defs li::marker { color: var(--muted); font: 500 12px var(--ui); }
.defs .form { color: var(--muted); font-style: italic; }
.defs a { color: var(--accent); cursor: pointer; font-style: normal; text-decoration: none; border-bottom: 1px dashed currentColor; }
.base { margin-top: 14px; padding: 12px 14px 8px; border-radius: 12px; background: var(--chip); }
.base .bw { font: 500 21px var(--serif); }
.base .bw .ipa { font-size: 12px; }

<script>window.BOOK_META={"id":"verwandlung-b1","title":"Die Verwandlung – leicht erzählt","author":"nach Franz Kafka","start":1};window.BOOK=[{"title":"Titelseite","sub":"Die Verwandlung – leicht erzählt","html":"<h1>Die Verwandlung<\/h1>\n<p class=\"center s3\">leicht erzählt<\/p>\n<p class=\"center\">nach der Erzählung von<br>FRANZ KAFKA (1915)<\/p>\n<div class=\"transnote\"><p><b>Was ist das?<\/b> Eine vereinfachte Nacherzählung für Lernende auf Niveau B1 – geschrieben von einer KI (Claude), nicht von Kafka.<\/p>\n<p>Jeder Absatz hier gehört zu genau einem Absatz im Original. Tippe oben auf <b>Original<\/b> (oder drücke <b>E<\/b>), dann siehst du daneben Kafkas echten Text oder die englische Übersetzung – der passende Absatz leuchtet auf.<\/p>\n<p>Wenn dir diese Version leicht fällt: Lies dasselbe Kapitel danach im Original!<\/p><\/div>"},{"title":"Erstes Kapitel","sub":"Das Erwachen","html":"<h2>I.<\/h2>\n<p>Eines Morgens wachte Gregor Samsa nach schlechten Träumen auf. Er lag in seinem Bett – aber er war kein Mensch mehr. Er war ein riesiges, ekliges Ungeziefer – eine Art großes Insekt. Er lag auf seinem harten Rücken. Wenn er den Kopf ein wenig hob, sah er seinen braunen, runden Bauch. Die Bettdecke lag kaum noch auf ihm und wollte gleich herunterrutschen. Er hatte viele dünne Beine. Sie bewegten sich vor seinen Augen, und er konnte nichts dagegen tun.<\/p>\n<p>»Was ist mit mir passiert?«, dachte er. Es war kein Traum. Sein Zimmer sah aus wie immer. Es war ein normales Zimmer, nur ein bisschen zu klein. Auf dem Tisch lagen Stoffe – Gregor war Handelsreisender und verkaufte Stoffe. Über dem Tisch hing ein Bild in einem schönen goldenen Rahmen. Gregor hatte es vor kurzem aus einer Zeitschrift ausgeschnitten. Es zeigte eine Dame mit einem Pelzhut und einem Pelzschal.<\/p>\n<p>Dann sah Gregor zum Fenster. Das Wetter war trüb, und man hörte den Regen. Das machte ihn traurig. »Vielleicht schlafe ich noch ein bisschen und vergesse diesen Unsinn«, dachte er. Aber das ging nicht. Gregor schlief immer auf der rechten Seite. Doch mit diesem Körper konnte er sich nicht auf die Seite drehen. Er versuchte es hundertmal. Immer wieder schaukelte er zurück auf den Rücken. Er schloss die Augen, damit er die zappelnden Beine nicht sehen musste. Erst als er einen neuen, dumpfen Schmerz in der Seite spürte, hörte er auf.<\/p>\n<p>»Ach Gott«, dachte er, »was für einen anstrengenden Beruf habe ich! Jeden Tag bin ich auf Reisen. Ich muss immer an die Züge denken, das Essen ist schlecht, und ich treffe ständig neue Menschen. Echte Freunde habe ich nie. Der Teufel soll das alles holen!« Da juckte es ihn oben am Bauch. Er schob sich langsam nach oben, um besser zu sehen. Die Stelle war voller kleiner weißer Punkte. Er wollte sie mit einem Bein berühren – aber sofort zog er das Bein zurück. Ein kalter Schauer lief durch seinen Körper.<\/p>\n<p>Er rutschte zurück in seine alte Position. »Das frühe Aufstehen macht einen ganz dumm«, dachte er. »Der Mensch braucht seinen Schlaf. Andere Reisende leben wie im Luxus. Wenn ich morgens ins Hotel zurückkomme, sitzen sie noch beim Frühstück. Das sollte ich mal bei meinem Chef versuchen – ich würde sofort rausfliegen. Wer weiß, vielleicht wäre das sogar gut für mich. Ohne meine Eltern hätte ich schon lange gekündigt. Ich würde zum Chef gehen und ihm sagen, was ich denke. Er würde vom Pult fallen! Aber meine Eltern haben Schulden bei ihm. Wenn ich das Geld zusammen habe, in fünf oder sechs Jahren, dann kündige ich. Aber jetzt muss ich aufstehen. Mein Zug fährt um fünf.«<\/p>\n<p>Er sah zum Wecker auf dem Kasten. »Himmlischer Vater!«, dachte er. Es war halb sieben, schon fast Viertel vor sieben! Hatte der Wecker nicht geklingelt? Doch, er war auf vier Uhr gestellt. Hatte Gregor ihn einfach nicht gehört? Was sollte er jetzt tun? Der nächste Zug fuhr um sieben. Dafür musste er sich sehr beeilen, und seine Stoffe waren noch nicht eingepackt. Außerdem wartete der Diener der Firma sicher am Bahnhof. Er hatte dem Chef bestimmt schon gemeldet, dass Gregor nicht da war. Sollte Gregor sagen, dass er krank war? Aber in fünf Jahren war er nie krank gewesen. Der Chef würde mit dem Arzt der Krankenkasse kommen. Und der Arzt würde sagen: Er ist nicht krank, er ist nur faul. Und eigentlich fühlte sich Gregor ganz gesund. Er hatte sogar großen Hunger.<\/p>\n<p>Da schlug die Uhr Viertel vor sieben. Jemand klopfte vorsichtig an die Tür. »Gregor«, rief seine Mutter, »es ist Viertel vor sieben. Wolltest du nicht wegfahren?« Gregor antwortete – und erschrak. Das war nicht mehr seine Stimme! Unter den Wörtern war ein schreckliches Piepsen. Man konnte die Wörter nur am Anfang verstehen. »Ja, ja, danke, Mutter, ich stehe schon auf«, sagte er kurz. Die Mutter ging zufrieden weg. Aber jetzt wusste die ganze Familie, dass Gregor noch zu Hause war. Der Vater klopfte an die andere Tür: »Gregor, was ist los?« Und die Schwester fragte leise: »Gregor? Ist dir nicht wohl? Brauchst du etwas?« »Ich bin schon fertig«, antwortete Gregor langsam und deutlich. Die Schwester flüsterte: »Gregor, mach auf, ich bitte dich.« Aber Gregor wollte die Tür nicht öffnen. Er war froh, dass er nachts immer alle Türen abschloss.<\/p>\n<p>Zuerst wollte er in Ruhe aufstehen, sich anziehen und frühstücken. Danach wollte er über alles nachdenken. Im Bett konnte man nicht klar denken. Die Sache mit seiner Stimme war bestimmt nur eine starke Erkältung. Das hatten Handelsreisende oft.<\/p>\n<p>Die Decke wegzuwerfen war leicht. Er musste sich nur ein bisschen aufblasen, dann fiel sie von selbst herunter. Aber dann wurde es schwer, denn er war sehr breit. Ein Mensch hätte Arme und Hände benutzt. Gregor hatte nur viele kleine Beine, und sie bewegten sich alle in verschiedene Richtungen. Wollte er ein Bein beugen, dann streckte es sich. »Im Bett schaffe ich das nicht«, sagte er sich.<\/p>\n<p>Zuerst versuchte er, den unteren Teil seines Körpers aus dem Bett zu bringen. Aber diesen Teil hatte er noch nie gesehen. Er war schwer und bewegte sich nur sehr langsam. Am Ende stieß sich Gregor mit aller Kraft nach vorne – in die falsche Richtung. Er schlug hart gegen das Bettende. Ein brennender Schmerz zeigte ihm: Dieser Teil seines Körpers war im Moment der empfindlichste.<\/p>\n<p>Also versuchte er es mit dem oberen Teil. Er drehte den Kopf vorsichtig zur Seite. Das ging gut, und der schwere Körper folgte langsam dem Kopf. Aber dann bekam er Angst: Wenn er jetzt aus dem Bett fiel, verletzte er sich vielleicht am Kopf. Er durfte auf keinen Fall ohnmächtig werden. Lieber blieb er im Bett.<\/p>\n<p>Mühsam lag er wieder da wie vorher. Seine Beine kämpften noch wilder miteinander. Er musste aus dem Bett heraus, das war klar. Aber er wollte ruhig bleiben und nichts Dummes tun. Er sah zum Fenster, aber draußen war nur Nebel. Man sah nicht einmal die andere Seite der Straße. »Schon sieben Uhr«, sagte er sich, als die Uhr schlug, »und noch immer so ein Nebel.« Er lag still da und atmete leise. Vielleicht wurde in der Stille alles wieder normal.<\/p>\n<p>Dann sagte er sich: »Vor Viertel nach sieben muss ich unbedingt aus dem Bett sein. Bis dahin kommt sicher auch jemand aus der Firma und fragt nach mir.« Er wollte jetzt den ganzen Körper auf einmal aus dem Bett schaukeln. Wenn er dabei den Kopf hochhielt, passierte dem Kopf nichts. Sein Rücken war hart, der Teppich weich. Das Problem war nur der Lärm. Die Familie würde den Krach hören und erschrecken. Aber er musste es riskieren.<\/p>\n<p>Bald hing Gregor schon halb aus dem Bett. Er musste nur hin und her schaukeln, fast wie ein Spiel. Da dachte er: Wie einfach wäre alles, wenn ihm jemand helfen würde! Zwei starke Menschen – der Vater und das Dienstmädchen – könnten ihn einfach herausheben. Sollte er um Hilfe rufen? Trotz allem musste er bei diesem Gedanken lächeln.<\/p>\n<p>Es war jetzt zehn nach sieben. Gregor schaukelte schon so stark, dass er fast herunterfiel. Da klingelte es an der Wohnungstür. »Das ist jemand aus dem Geschäft«, dachte er und erstarrte. Das Dienstmädchen öffnete die Tür. Schon beim ersten Wort wusste Gregor, wer da war: der Prokurist selbst, der wichtige Mann aus der Firma! Warum musste Gregor in so einer Firma arbeiten? Bei dem kleinsten Fehler kam sofort der Verdacht. Musste wirklich der Prokurist persönlich kommen? Gregor wurde so aufgeregt, dass er sich mit aller Kraft aus dem Bett schwang. Es gab einen dumpfen Schlag, aber keinen großen Lärm, denn der Teppich war weich. Nur den Kopf hatte er nicht gut gehalten. Er schlug ihn an und rieb ihn vor Ärger und Schmerz am Teppich.<\/p>\n<p>»Da drin ist etwas gefallen«, sagte der Prokurist im Zimmer links. Gregor fragte sich: Konnte so etwas wie heute auch dem Prokuristen passieren? Möglich war es. Aber als Antwort hörte er nur die festen Schritte des Prokuristen in seinen glänzenden Stiefeln. Im Zimmer rechts flüsterte die Schwester: »Gregor, der Prokurist ist da.« »Ich weiß«, sagte Gregor leise zu sich selbst. Laut genug für die Schwester sprach er nicht.<\/p>\n<p>»Gregor«, sagte jetzt der Vater, »der Herr Prokurist ist da. Er fragt, warum du nicht mit dem Frühzug gefahren bist. Er will mit dir persönlich sprechen. Also bitte öffne die Tür.« »Guten Morgen, Herr Samsa!«, rief der Prokurist freundlich. Die Mutter sagte zum Prokuristen: »Er ist krank, glauben Sie mir! Sonst hätte er nie einen Zug verpasst. Der Junge denkt nur an das Geschäft. Abends geht er nie aus. Er liest die Zeitung oder studiert Fahrpläne. Als Hobby macht er Laubsägearbeiten. Er hat zum Beispiel einen kleinen Rahmen gemacht. Der ist so schön! Sie sehen ihn gleich, wenn Gregor aufmacht.« »Ich komme gleich«, sagte Gregor langsam. »Ich hoffe, es ist nichts Ernstes«, sagte der Prokurist. »Aber wir Geschäftsleute müssen eine kleine Krankheit oft einfach überwinden.« »Darf der Herr Prokurist jetzt zu dir hinein?«, fragte der Vater ungeduldig. »Nein«, sagte Gregor. Im linken Zimmer wurde es still. Im rechten Zimmer begann die Schwester zu weinen.<\/p>\n<p>Warum weinte die Schwester? Weil Gregor nicht aufstand? Weil er vielleicht seine Stelle verlor? Dann kam der Chef wieder mit den alten Schulden zu den Eltern. Aber noch war ja nichts passiert. Gregor war noch da, und er wollte seine Familie nicht im Stich lassen. Dass er den Prokuristen nicht hereinließ, war nur ein bisschen unhöflich. Dafür fand man später leicht eine Entschuldigung. Gregor dachte: Es wäre besser, wenn alle ihn in Ruhe ließen, anstatt zu reden und zu weinen. Aber sie wussten ja nicht, was los war.<\/p>\n<p>Jetzt sprach der Prokurist lauter: »Herr Samsa, was ist los? Sie schließen sich in Ihrem Zimmer ein und antworten nur mit Ja und Nein. Ihre Eltern machen sich große Sorgen. Und Sie vernachlässigen Ihre Arbeit! Ich bin sehr erstaunt. Ich dachte, Sie sind ein ruhiger, vernünftiger Mensch. Der Chef hatte heute Morgen einen Verdacht. Es ging um das Geld, das Sie vor kurzem bekommen haben. Ich habe Sie verteidigt. Aber jetzt, bei Ihrem Starrsinn, will ich das nicht mehr. Und Ihre Stelle ist nicht sicher. Ihre Geschäfte waren in letzter Zeit sehr schlecht. Gut, es ist keine gute Jahreszeit für Geschäfte. Aber gar keine Geschäfte – das gibt es nicht, Herr Samsa!«<\/p>\n<p>»Aber Herr Prokurist«, rief Gregor ganz aufgeregt, »ich mache sofort auf! Ich war nur ein bisschen krank, mir war schwindlig. Ich liege noch im Bett. Aber jetzt geht es mir wieder gut. Ich stehe gerade auf. Einen Augenblick noch! Es geht nicht so schnell, wie ich dachte. Gestern Abend war ich noch gesund. Bitte machen Sie meinen Eltern keinen Kummer! Ihre Vorwürfe sind nicht wahr. Ich fahre mit dem Acht-Uhr-Zug. Ich bin bald im Geschäft. Bitte sagen Sie das dem Chef!«<\/p>\n<p>Während Gregor das alles schnell sagte, kroch er zum Kasten. Er wollte sich daran hochziehen. Er wollte die Tür wirklich öffnen. Er war neugierig: Was sagten die anderen, wenn sie ihn sahen? Wenn sie erschraken, war es nicht mehr seine Schuld. Wenn sie ruhig blieben, konnte er um acht am Bahnhof sein. Zuerst rutschte er am glatten Kasten immer wieder hinunter. Aber dann stand er aufrecht da. Sein Unterkörper tat sehr weh, aber das war ihm egal. Dann hielt er sich mit den kleinen Beinen an einem Stuhl fest. Er war jetzt ruhig und hörte dem Prokuristen zu.<\/p>\n<p>»Haben Sie ein Wort verstanden?«, fragte der Prokurist die Eltern. »Er macht sich doch nicht über uns lustig?« »Um Gottes willen«, rief die Mutter weinend, »er ist vielleicht schwer krank! Grete! Grete! Hol sofort den Arzt! Hast du Gregor gerade reden hören?« »Das war die Stimme eines Tieres«, sagte der Prokurist ruhig. »Anna! Anna!«, rief der Vater in die Küche. »Hol sofort einen Schlosser!« Die zwei Mädchen liefen durch den Flur und aus der Wohnung. Die Wohnungstür blieb offen. Das ist oft so in Wohnungen, in denen ein großes Unglück passiert ist.<\/p>\n<p>Gregor war jetzt viel ruhiger. Die anderen verstanden seine Worte nicht mehr, obwohl er selbst sie klar hörte. Aber sie wussten jetzt, dass etwas nicht stimmte, und wollten ihm helfen. Das tat ihm gut. Er fühlte sich wieder als Teil der Menschen. Vom Arzt und vom Schlosser erwartete er große Dinge. Er hustete leise, damit seine Stimme klarer wurde. Vielleicht klang sogar sein Husten nicht mehr menschlich. Im Nebenzimmer war es jetzt ganz still. Vielleicht flüsterten die Eltern mit dem Prokuristen, oder alle horchten an der Tür.<\/p>\n<p>Gregor schob sich mit dem Stuhl langsam zur Tür. Dort ließ er den Stuhl los und hielt sich an der Tür fest. Seine Beinchen waren ein bisschen klebrig. Dann wollte er den Schlüssel im Schloss drehen – mit dem Mund. Leider hatte er keine richtigen Zähne. Aber er hatte sehr starke Kiefer. Damit bewegte er den Schlüssel tatsächlich. Dabei lief eine braune Flüssigkeit aus seinem Mund und tropfte auf den Boden. »Hören Sie«, sagte der Prokurist nebenan, »er dreht den Schlüssel um.« Das machte Gregor Mut. Er biss mit aller Kraft in den Schlüssel, obwohl es wehtat. Dann klickte das Schloss. »Ich habe den Schlosser also nicht gebraucht«, dachte er stolz. Dann drückte er mit dem Kopf die Klinke herunter.<\/p>\n<p>Die Tür ging auf, aber zuerst konnte man Gregor noch nicht sehen. Er musste sich langsam um den Türflügel herumdrehen. Da hörte er den Prokuristen laut »Oh!« rufen. Es klang wie Wind. Der Prokurist stand der Tür am nächsten. Er hielt die Hand vor den offenen Mund und ging langsam rückwärts. Die Mutter sah zuerst den Vater an. Dann ging sie zwei Schritte auf Gregor zu und fiel zu Boden. Ihr Kopf sank auf die Brust. Der Vater ballte die Faust, als wollte er Gregor in sein Zimmer zurückstoßen. Dann sah er sich unsicher um, hielt die Hände vor die Augen und weinte.<\/p>\n<p>Gregor ging nicht ins Zimmer. Er lehnte sich innen an den anderen Türflügel. So sah man nur die Hälfte von seinem Körper und den schief gehaltenen Kopf. Draußen war es jetzt heller. Gegenüber sah man ein langes, grauschwarzes Haus – ein Krankenhaus. Es regnete noch immer, in großen, einzelnen Tropfen. Auf dem Tisch stand noch viel Frühstücksgeschirr. Das Frühstück war für den Vater die wichtigste Mahlzeit. Er saß oft stundenlang dabei und las Zeitungen. An der Wand hing ein Foto von Gregor als Soldat, mit Säbel und einem fröhlichen Lächeln. Die Wohnungstür war offen. Man sah die Treppe nach unten.<\/p>\n<p>»Nun«, sagte Gregor. Er wusste, dass er als Einziger ruhig geblieben war. »Ich ziehe mich jetzt an, packe die Stoffe ein und fahre los. Darf ich fahren? Sie sehen, Herr Prokurist, ich bin nicht stur. Ich arbeite gern. Das Reisen ist anstrengend, aber ohne Reisen verdiene ich kein Geld. Man ist mal kurz krank, aber dann arbeitet man umso fleißiger. Ich habe Schulden beim Chef und muss meine Eltern und meine Schwester versorgen. Bitte helfen Sie mir im Geschäft! Niemand mag die Reisenden. Alle denken, wir verdienen viel Geld und haben ein schönes Leben. Wir sind fast das ganze Jahr unterwegs. So hört man nicht, wenn andere schlecht über uns reden. Bitte gehen Sie nicht weg! Sagen Sie mir zuerst, dass ich ein bisschen recht habe!«<\/p>\n<p>Aber der Prokurist hatte sich schon bei den ersten Worten umgedreht. Er sah Gregor nur über die zitternde Schulter an. Langsam, ganz langsam ging er zur Tür, ohne Gregor aus den Augen zu lassen. Erst im Flur machte er eine plötzliche Bewegung und lief los. Seine rechte Hand streckte er weit zur Treppe aus, als ob dort draußen eine Rettung auf ihn wartete.<\/p>\n<p>Gregor verstand: Der Prokurist durfte so nicht gehen! Sonst war seine Stelle in großer Gefahr. Die Eltern verstanden das nicht so gut. Aber Gregor dachte an die Zukunft. Man musste den Prokuristen beruhigen und überzeugen. Wenn nur die Schwester hier wäre! Sie war klug, und der Prokurist mochte Frauen. Aber sie war nicht da. Also ließ Gregor die Tür los und wollte zum Prokuristen. Doch er fiel sofort hin und landete auf seinen vielen Beinchen. Und zum ersten Mal an diesem Tag fühlte er sich wohl in seinem Körper! Die Beinchen hatten festen Boden unter sich. Sie machten genau, was er wollte. Er glaubte schon, dass jetzt alles gut wurde. Da sprang die Mutter plötzlich auf. Sie streckte die Arme aus und schrie: »Hilfe, um Gottes willen, Hilfe!« Sie lief rückwärts und setzte sich auf den Tisch. Dabei fiel die Kaffeekanne um, und der Kaffee floss auf den Teppich.<\/p>\n<p>»Mutter, Mutter«, sagte Gregor leise und sah zu ihr hoch. Als er den Kaffee sah, schnappte er ein paar Mal mit dem Mund in die Luft. Da schrie die Mutter wieder und lief zum Vater. Aber Gregor hatte keine Zeit für die Eltern. Der Prokurist war schon auf der Treppe. Gregor lief schnell zu ihm, aber der Prokurist sprang mit großen Schritten die Treppe hinunter und war weg. Man hörte nur noch sein Schreien. Jetzt verlor auch der Vater die Ruhe. Er nahm den Stock des Prokuristen in die rechte Hand und eine große Zeitung in die linke. Damit trieb er Gregor in sein Zimmer zurück. Er stampfte mit den Füßen und zischte wie ein Wilder. Gregor bat ihn, aber der Vater verstand ihn nicht. Die Mutter hatte das Fenster aufgerissen, ein kalter Wind wehte durch die Wohnung. Rückwärts konnte Gregor nur sehr langsam gehen. Er hatte Angst vor einem tödlichen Schlag mit dem Stock. Also drehte er sich langsam um. Endlich war sein Kopf vor der Tür – aber die Tür war zu schmal für seinen breiten Körper! Der Vater dachte nicht daran, den zweiten Türflügel zu öffnen. Er trieb Gregor nur noch lauter vorwärts. Gregor drückte sich in die Tür. Er blieb stecken, eine Seite seines Körpers wurde verletzt, und braune Flecken blieben an der weißen Tür. Dann gab ihm der Vater einen starken Stoß von hinten. Gregor flog blutend weit in sein Zimmer hinein. Die Tür wurde mit dem Stock zugeschlagen. Dann war es endlich still.<\/p>"},{"title":"Zweites Kapitel","sub":"Die Schwester","html":"<h2>II.<\/h2>\n<p>Erst am Abend, als es schon dunkel wurde, wachte Gregor aus einem tiefen, schweren Schlaf auf. Er hatte das Gefühl, dass ihn Schritte geweckt hatten – und das leise Schließen einer Tür. Das Licht der Straßenlampen fiel blass an die Decke, aber unten, wo Gregor lag, war es dunkel. Langsam kroch er zur Tür. Er tastete sich mit seinen Fühlern vorwärts. Seine ganze linke Seite war eine lange, schmerzende Narbe. Er hinkte auf seinen zwei Reihen Beinchen. Ein Beinchen war am Morgen schwer verletzt worden und schleppte leblos hinterher.<\/p>\n<p>Erst an der Tür merkte er, was ihn angelockt hatte: der Geruch von Essen. Dort stand ein Napf mit süßer Milch und kleinen Stücken Weißbrot. Gregor freute sich sehr, denn er hatte noch mehr Hunger als am Morgen. Sofort tauchte er den Kopf tief in die Milch. Aber schnell zog er ihn enttäuscht zurück. Das Essen war schwer, weil seine linke Seite so wehtat. Und die Milch schmeckte ihm gar nicht – obwohl sie früher sein Lieblingsgetränk war. Die Schwester hatte sie sicher deshalb hingestellt. Aber Gregor drehte sich fast mit Widerwillen weg und kroch zurück in die Mitte des Zimmers.<\/p>\n<p>Durch den Türspalt sah Gregor, dass im Wohnzimmer Licht brannte. Sonst las der Vater um diese Zeit laut aus der Abendzeitung vor. Aber heute hörte man keinen Ton. Es war ganz still in der Wohnung. »Was für ein ruhiges Leben die Familie führt«, dachte Gregor. Er war stolz, dass er seinen Eltern und seiner Schwester so ein Leben in einer so schönen Wohnung bieten konnte. Aber was, wenn jetzt diese Ruhe, dieser Wohlstand mit Schrecken endete? Daran wollte Gregor lieber nicht denken. Deshalb kroch er im Zimmer hin und her.<\/p>\n<p>Einmal an diesem langen Abend öffnete jemand die eine Seitentür ein kleines Stück und schloss sie schnell wieder. Später passierte das Gleiche an der anderen Tür. Jemand wollte offenbar hereinkommen, traute sich aber nicht. Gregor wartete sofort an der Tür, aber niemand kam mehr. Am Morgen, als die Türen verschlossen waren, wollten alle zu ihm hinein. Jetzt waren die Türen offen – und keiner kam.<\/p>\n<p>Erst spät in der Nacht ging das Licht im Wohnzimmer aus. Gregor hörte, wie die drei auf Zehenspitzen weggingen. Bis zum Morgen kam sicher niemand mehr. Jetzt hatte er Zeit, über sein neues Leben nachzudenken. Aber das hohe, leere Zimmer machte ihm Angst – obwohl er schon fünf Jahre darin wohnte. Ohne viel nachzudenken, kroch er unter das Kanapee, ein altes Sofa. Dort drückte es ein bisschen auf seinen Rücken, aber er fühlte sich sofort wohl. Schade war nur, dass er zu breit war und nicht ganz darunter passte.<\/p>\n<p>Dort blieb er die ganze Nacht. Manchmal schlief er ein wenig, aber der Hunger weckte ihn immer wieder. Er machte sich Sorgen und hatte unklare Hoffnungen. Am Ende dachte er immer dasselbe: Er musste ruhig bleiben und Geduld haben. Er wollte seiner Familie das Leben mit ihm so leicht wie möglich machen.<\/p>\n<p>Schon früh am nächsten Morgen öffnete die Schwester die Tür und sah ängstlich herein. Zuerst sah sie ihn nicht. Als sie ihn dann unter dem Kanapee entdeckte, erschrak sie so sehr, dass sie die Tür sofort wieder zuschlug. Aber gleich danach tat es ihr leid. Sie kam auf Zehenspitzen herein, wie bei einem Schwerkranken. Sie sah den vollen Milchnapf und trug ihn hinaus – mit einem Tuch, nicht mit der bloßen Hand. Dann brachte sie viele verschiedene Dinge auf einer alten Zeitung: altes, halb verfaultes Gemüse, Knochen vom Abendessen, ein paar Rosinen und Mandeln, einen alten Käse, ein trockenes Brötchen und Butterbrot mit Salz. Dazu stellte sie Wasser hin. Dann ging sie schnell hinaus und schloss sogar die Tür ab. Sie wusste: Vor ihr würde Gregor nicht essen. Jetzt konnte er essen! Seine Wunden taten nicht mehr weh. Am liebsten mochte er den alten Käse. Gierig aß er den Käse, das Gemüse und die Soße. Die frischen Sachen mochte er überhaupt nicht – er konnte nicht einmal ihren Geruch ertragen. Später drehte die Schwester langsam den Schlüssel als Zeichen. Gregor kroch schnell unter das Kanapee zurück. Weil er so viel gegessen hatte, bekam er dort kaum Luft. Die Schwester fegte alle Reste zusammen, auch das, was er nicht berührt hatte, und warf alles weg.<\/p>\n<p>So bekam Gregor jetzt jeden Tag sein Essen: einmal früh am Morgen, wenn die Eltern noch schliefen, und einmal nach dem Mittagessen. Die Eltern wollten natürlich nicht, dass Gregor verhungerte. Aber sie wollten nicht sehen, wie er aß. Sie wollten nur davon hören. Und die Schwester wollte ihnen Kummer ersparen.<\/p>\n<p>Niemand verstand Gregor. Darum dachte auch niemand, dass er die anderen verstand – nicht einmal die Schwester. Gregor hörte nur ihr Seufzen. Erst später, als sie sich ein wenig an alles gewöhnt hatte, sagte sie manchmal etwas Freundliches. »Heute hat es ihm aber geschmeckt«, sagte sie, wenn er alles aufgegessen hatte. Später aß er immer weniger. Dann sagte sie traurig: »Jetzt ist wieder alles stehen geblieben.«<\/p>\n<p>Gregor hörte viel von dem, was in den anderen Zimmern gesprochen wurde. Sobald er Stimmen hörte, lief er zur Tür und drückte sich daran. Am Anfang sprachen alle fast nur über ihn. Zwei Tage lang diskutierte die Familie bei jedem Essen, was sie jetzt tun sollte. Niemand wollte allein zu Hause bleiben. Das Dienstmädchen bat schon am ersten Tag auf den Knien darum, gehen zu dürfen. Eine Viertelstunde später war sie weg. Sie dankte unter Tränen und versprach, niemandem etwas zu erzählen.<\/p>\n<p>Jetzt musste die Schwester mit der Mutter kochen. Aber das war nicht viel Arbeit, denn alle aßen fast nichts. Immer wieder hörte Gregor: »Nein, danke, ich bin satt.« Auch Bier wollte der Vater nicht mehr. Wenn die Schwester fragte, ob sie Bier holen sollte, sagte er nur laut: »Nein.«<\/p>\n<p>Schon am ersten Tag erklärte der Vater der Mutter und der Schwester, wie viel Geld die Familie hatte. Ab und zu holte er Papiere aus einer kleinen Kasse. Diese Kasse hatte er aus seinem Geschäft gerettet, als es vor fünf Jahren pleiteging. Was Gregor jetzt hörte, war die erste gute Nachricht seit langem. Damals, nach der Pleite, war die Familie verzweifelt. Gregor begann deshalb sehr hart zu arbeiten. Bald wurde er Reisender und verdiente viel mehr Geld. Er legte das Geld zu Hause auf den Tisch, und die Familie war glücklich und überrascht. Das waren schöne Zeiten. Später gewöhnten sich alle daran: Gregor brachte das Geld, und die Familie nahm es dankbar. Aber besondere Wärme gab es nicht mehr. Nur mit seiner Schwester war Gregor noch eng verbunden. Sie liebte Musik und spielte wunderschön Geige. Gregor hatte einen geheimen Plan: Er wollte sie nächstes Jahr aufs Konservatorium schicken, obwohl das sehr teuer war. An Weihnachten wollte er es der Familie feierlich sagen.<\/p>\n<p>Solche Gedanken – jetzt völlig nutzlos – gingen ihm durch den Kopf, während er an der Tür horchte. Manchmal wurde er so müde, dass sein Kopf gegen die Tür fiel. Sofort waren alle nebenan still. »Was er wieder treibt«, sagte der Vater nach einer Weile. Erst dann sprachen sie langsam weiter.<\/p>\n<p>Der Vater erklärte alles mehrmals, denn die Mutter verstand nicht alles beim ersten Mal. So erfuhr Gregor zu seiner Freude: Es gab noch etwas Geld aus der alten Zeit. Es war nicht viel, aber es waren Zinsen dazugekommen. Außerdem hatte die Familie nicht das ganze Geld ausgegeben, das Gregor jeden Monat nach Hause brachte. Hinter der Tür nickte Gregor eifrig. Mit diesem Geld hätte er die Schulden beim Chef schneller bezahlen und früher kündigen können. Aber er dachte: So, wie der Vater es gemacht hat, ist es sicher besser.<\/p>\n<p>Aber von diesem Geld allein konnte die Familie nicht leben. Es reichte vielleicht für ein oder zwei Jahre. Es war Geld für den Notfall – Geld zum Leben musste man verdienen. Der Vater war gesund, aber alt. In den fünf Jahren ohne Arbeit war er dick und langsam geworden. Sollte die alte Mutter Geld verdienen? Sie hatte Asthma und bekam schon in der Wohnung kaum Luft. Sollte die Schwester arbeiten gehen? Sie war erst siebzehn und hatte bisher ein schönes Leben gehabt: hübsche Kleider, lange schlafen und Geige spielen. Immer wenn die Familie über das Geldverdienen sprach, ließ Gregor die Tür los. Er warf sich auf das kühle Ledersofa daneben, denn er wurde ganz heiß vor Scham und Trauer.<\/p>\n<p>Oft lag er die ganze Nacht dort und kratzte stundenlang am Leder. Oder er schob mit großer Mühe einen Stuhl zum Fenster, kletterte hinauf und sah hinaus. Früher hatte ihm das ein Gefühl von Freiheit gegeben. Aber jetzt sah er jeden Tag schlechter. Das Krankenhaus gegenüber, das er früher gehasst hatte, sah er gar nicht mehr. Er hätte glauben können, dass draußen nur eine graue Wüste war, in der Himmel und Erde ineinander übergingen. Die Schwester bemerkte den Stuhl am Fenster zweimal. Danach schob sie ihn nach dem Aufräumen immer selbst wieder ans Fenster. Und sie ließ das innere Fenster offen.<\/p>\n<p>Wenn Gregor nur mit der Schwester sprechen und ihr danken könnte! Dann wäre alles leichter. Die Schwester tat so, als ob die Arbeit für ihn nicht schwer wäre. Aber Gregor sah immer besser, wie schwer es für sie war. Wenn sie ins Zimmer kam, schloss sie sofort die Tür, damit niemand hineinsehen musste. Dann lief sie zum Fenster und riss es auf, als ob sie keine Luft bekäme. Auch wenn es kalt war, blieb sie eine Weile am Fenster und atmete tief. Gregor zitterte die ganze Zeit unter dem Kanapee. Er wusste: Sie konnte einfach nicht mit ihm in einem Zimmer mit geschlossenem Fenster sein.<\/p>\n<p>Etwa einen Monat nach der Verwandlung kam die Schwester einmal etwas früher. Gregor stand noch am Fenster und sah hinaus – unbeweglich und schrecklich anzusehen. Die Schwester kam nicht herein. Sie sprang zurück und schloss die Tür, als ob er sie beißen wollte. Gregor versteckte sich sofort unter dem Kanapee. Erst am Mittag kam sie wieder, und sie war unruhiger als sonst. Da verstand Gregor: Sie konnte seinen Anblick immer noch nicht ertragen. Deshalb trug er an einem Tag ein Leintuch auf seinem Rücken zum Kanapee. Das dauerte vier Stunden. Er legte es so hin, dass die Schwester ihn gar nicht mehr sehen konnte. Die Schwester ließ das Tuch liegen. Einmal glaubte Gregor sogar, einen dankbaren Blick bei ihr zu sehen.<\/p>\n<p>In den ersten vierzehn Tagen kamen die Eltern nicht zu Gregor ins Zimmer. Sie lobten jetzt die Schwester für ihre Arbeit. Früher hatten sie sich oft über sie geärgert. Jetzt warteten beide vor der Tür, wenn die Schwester aufräumte. Danach musste sie genau erzählen: Wie sah es aus? Was hatte Gregor gegessen? Ging es ihm vielleicht etwas besser? Die Mutter wollte Gregor bald besuchen, aber der Vater und die Schwester hielten sie zurück. Später musste man sie mit Gewalt festhalten. Sie rief: »Lasst mich doch zu Gregor, er ist ja mein unglücklicher Sohn!« Gregor dachte: Vielleicht wäre es gut, wenn die Mutter manchmal käme. Die Schwester war mutig, aber sie war doch noch ein Kind.<\/p>\n<p>Bald wurde Gregors Wunsch erfüllt. Am Tag wollte er nicht mehr ans Fenster gehen, damit ihn niemand sah. Das Essen machte ihm keine Freude mehr. Darum begann er, an den Wänden und an der Decke herumzukriechen. Am liebsten hing er an der Decke. Dort atmete er freier, und sein Körper schaukelte leicht. Manchmal ließ er sich glücklich fallen und landete mit einem Knall auf dem Boden – aber er verletzte sich nicht. Die Schwester bemerkte das, denn seine Füße hinterließen klebrige Spuren. Sie wollte ihm mehr Platz machen und die Möbel hinaustragen, vor allem den Kasten und den Schreibtisch. Allein konnte sie das nicht. Den Vater wollte sie nicht fragen. Das neue Dienstmädchen, erst sechzehn Jahre alt, hatte zu viel Angst. Also holte die Schwester die Mutter, als der Vater nicht da war. Gregor zog das Tuch noch tiefer herunter, damit man ihn nicht sah. »Komm nur, man sieht ihn nicht«, sagte die Schwester. Die beiden Frauen schoben den schweren Kasten mit großer Mühe. Nach einer Viertelstunde sagte die Mutter: »Lassen wir den Kasten lieber hier. Die leeren Wände machen mich so traurig. Gregor kennt diese Möbel schon so lange. Ohne sie fühlt er sich vielleicht allein.« Und dann flüsterte sie: »Wenn wir die Möbel wegnehmen – zeigen wir dann nicht, dass wir keine Hoffnung mehr haben? Wir sollten alles so lassen, wie es war. Wenn Gregor zu uns zurückkommt, findet er alles unverändert.«<\/p>\n<p>Als Gregor diese Worte hörte, verstand er etwas. Zwei Monate lang hatte niemand mit ihm gesprochen. Das hatte ihn verwirrt. Warum hatte er sich ein leeres Zimmer gewünscht? Wollte er wirklich eine Höhle? Dann hätte er schnell vergessen, dass er einmal ein Mensch war. Fast hatte er es schon vergessen. Erst die Stimme der Mutter hatte ihn aufgeweckt. Nichts durfte weg! Die Möbel waren gut für ihn. Und wenn sie ihn beim sinnlosen Herumkriechen störten, war das kein Nachteil, sondern ein großer Vorteil.<\/p>\n<p>Aber die Schwester sah das anders. Sie war inzwischen die Expertin für alles, was Gregor betraf. Jetzt wollte sie nicht nur den Kasten und den Schreibtisch hinaustragen, sondern alle Möbel – nur das Kanapee sollte bleiben. Sie hatte ja recht: Gregor brauchte viel Platz zum Kriechen, und die Möbel nützten ihm nichts. Aber Mädchen in diesem Alter wollen auch gern ihren Willen bekommen. Vielleicht wollte Grete auch, dass Gregors Lage noch schrecklicher aussah. Dann konnte sie noch mehr für ihn tun. In ein leeres Zimmer, in dem Gregor allein an den Wänden kroch, würde sich außer ihr niemand trauen.<\/p>\n<p>Die Mutter konnte die Schwester nicht umstimmen. Sie war unruhig in Gregors Zimmer, sagte bald nichts mehr und half beim Hinaustragen des Kastens. Auf den Kasten konnte Gregor zur Not verzichten, aber der Schreibtisch musste bleiben. Kaum war der Kasten draußen, sah Gregor vorsichtig unter dem Kanapee hervor. Leider kam zuerst die Mutter zurück. Gregor wollte sie nicht erschrecken und lief schnell zurück. Dabei bewegte sich das Tuch ein wenig. Die Mutter blieb stehen, wartete einen Moment und ging dann zu Grete hinaus.<\/p>\n<p>Gregor sagte sich immer wieder: Es passiert nichts Besonderes, man stellt nur ein paar Möbel um. Aber das Hin und Her der Frauen, ihre Rufe, das Kratzen der Möbel auf dem Boden – das alles machte ihn ganz krank. Er drückte sich auf den Boden und wusste: Lange halte ich das nicht mehr aus. Sie räumten sein Zimmer aus. Sie nahmen ihm alles, was er liebte. Der Kasten mit seiner Laubsäge war schon weg. Jetzt wollten sie den Schreibtisch holen. An diesem Schreibtisch hatte er als Kind seine Hausaufgaben gemacht. Gregor konnte nicht länger warten.<\/p>\n<p>Während die Frauen im Nebenzimmer Pause machten, kam Gregor hervor. Er wusste nicht, was er zuerst retten sollte. Da sah er an der leeren Wand das Bild der Dame im Pelz. Schnell kroch er hinauf und drückte sich an das Glas. Das Glas war kühl und tat seinem heißen Bauch gut. Dieses Bild, das er jetzt ganz bedeckte, würde ihm niemand wegnehmen. Er drehte den Kopf zur Tür, um die Frauen zu sehen, wenn sie zurückkamen.<\/p>\n<p>Die Frauen kamen bald zurück. Grete hatte den Arm um die Mutter gelegt und trug sie fast. »Was nehmen wir jetzt?«, fragte Grete und sah sich um. Da trafen sich ihre Blicke mit Gregors Blick an der Wand. Wegen der Mutter blieb sie ruhig. Sie sagte schnell und mit zitternder Stimme: »Komm, gehen wir lieber noch einen Augenblick ins Wohnzimmer zurück.« Gregor verstand ihren Plan: Sie wollte die Mutter in Sicherheit bringen und ihn dann von der Wand jagen. Das sollte sie nur versuchen! Er saß fest auf seinem Bild. Lieber wollte er Grete ins Gesicht springen.<\/p>\n<p>Aber jetzt war die Mutter unruhig geworden. Sie trat zur Seite und sah den riesigen braunen Fleck auf der Blumentapete. Noch bevor sie verstand, dass es Gregor war, schrie sie: »Ach Gott, ach Gott!« Sie fiel mit ausgebreiteten Armen auf das Kanapee und bewegte sich nicht mehr. »Du, Gregor!«, rief die Schwester mit erhobener Faust. Das waren ihre ersten Worte direkt an ihn seit der Verwandlung. Sie lief ins Nebenzimmer, um Medizin für die Mutter zu holen. Gregor wollte helfen und lief hinterher. Aber er konnte nur hinter ihr stehen. Als sie sich umdrehte, erschrak sie. Eine Flasche fiel auf den Boden und zerbrach. Ein Splitter verletzte Gregors Gesicht, und eine scharfe Medizin lief über ihn. Grete nahm schnell alle Flaschen und lief zur Mutter. Mit dem Fuß schlug sie die Tür zu. Jetzt war Gregor von seiner Mutter getrennt – und sie war vielleicht wegen ihm dem Tod nahe. Voller Angst und Schuldgefühle kroch er überall herum: über die Wände, die Möbel, die Decke. Am Ende drehte sich alles um ihn, und er fiel mitten auf den großen Tisch.<\/p>\n<p>Eine Weile lag er dort ganz still. Dann klingelte es. Der Vater kam nach Hause. »Was ist geschehen?«, fragte er sofort. Grete antwortete leise und drückte ihr Gesicht an seine Brust: »Die Mutter war ohnmächtig, aber es geht ihr schon besser. Gregor ist ausgebrochen.« »Das habe ich doch immer gesagt«, rief der Vater, »aber ihr Frauen wollt ja nicht hören.« Gregor verstand: Der Vater dachte jetzt, dass Gregor etwas Schlimmes getan hatte. Er musste den Vater beruhigen. Deshalb lief er zu seiner Zimmertür und drückte sich daran. Der Vater sollte sehen: Gregor will sofort in sein Zimmer zurück. Man muss nur die Tür öffnen.<\/p>\n<p>Aber der Vater hatte keinen Sinn für solche Feinheiten. »Ah!«, rief er laut, wütend und froh zugleich. Gregor hob den Kopf und sah den Vater an. War das wirklich sein Vater? Früher war der Vater ein müder, alter Mann. Er lag im Bett, wenn Gregor von der Reise zurückkam. Er saß im Schlafrock im Sessel. Beim Spaziergang ging er langsamer als alle anderen. Jetzt aber stand er gerade und kräftig da. Er trug eine blaue Uniform mit Goldknöpfen, wie die Diener einer Bank. Seine dunklen Augen sahen frisch und wach aus, die weißen Haare waren ordentlich gekämmt. Er warf seine Mütze quer durch das Zimmer auf das Kanapee und kam mit bösem Gesicht auf Gregor zu. Gregor sah die riesigen Sohlen seiner Stiefel. Er wusste: Der Vater war immer sehr streng mit ihm. Also lief Gregor vor ihm weg. Wenn der Vater stehen blieb, blieb er auch stehen. So gingen sie mehrmals langsam um das Zimmer. Gregor bekam bald keine Luft mehr. Da flog plötzlich etwas neben ihm auf den Boden und rollte vor ihn. Es war ein Apfel. Sofort flog ein zweiter. Gregor blieb vor Schreck stehen. Der Vater hatte seine Taschen mit Äpfeln gefüllt und warf jetzt einen nach dem anderen. Ein Apfel streifte Gregors Rücken, ohne ihm zu schaden. Aber der nächste drang tief in seinen Rücken ein. Der Schmerz war unglaublich. Gregor konnte sich nicht mehr bewegen. Als Letztes sah er noch, wie die Mutter schreiend aus dem Zimmer lief. Sie lief zum Vater, umarmte ihn und bat ihn, Gregors Leben zu schonen. Dann sah Gregor nichts mehr.<\/p>"},{"title":"Drittes Kapitel","sub":"Das Ende","html":"<h2>III.<\/h2>\n<p>Niemand wagte, den Apfel aus Gregors Rücken zu nehmen. So blieb er im Fleisch stecken. Über einen Monat lang litt Gregor an dieser schweren Wunde. Sie erinnerte sogar den Vater daran, dass Gregor ein Mitglied der Familie war – trotz seiner ekligen Gestalt. Man durfte ihn nicht wie einen Feind behandeln. Die Familie musste ihren Ekel herunterschlucken und Geduld haben, nur Geduld.<\/p>\n<p>Wegen seiner Wunde konnte sich Gregor kaum noch bewegen, vielleicht für immer. Er war wie ein alter, kranker Mann. Er brauchte lange Minuten, um durch sein Zimmer zu kriechen. An die Decke kam er nicht mehr. Aber dafür bekam er etwas Neues: Jeden Abend stand die Tür zum Wohnzimmer offen. Gregor lag dann im Dunkeln, wo ihn niemand sah. Er konnte die Familie am beleuchteten Tisch sehen und ihre Gespräche hören.<\/p>\n<p>Lebhafte Gespräche wie früher gab es nicht mehr. Alle waren sehr still. Nach dem Abendessen schlief der Vater im Sessel ein. Die Mutter nähte feine Wäsche für ein Modegeschäft. Die Schwester hatte eine Stelle als Verkäuferin gefunden. Am Abend lernte sie Stenographie und Französisch, um später eine bessere Stelle zu bekommen. Manchmal wachte der Vater auf und sagte: »Wie lange du heute wieder nähst!« Dann schlief er gleich wieder ein, und Mutter und Schwester lächelten sich müde an.<\/p>\n<p>Der Vater zog seine Uniform auch zu Hause nicht aus. Er schlief vollständig angezogen auf seinem Platz, als ob er immer bereit für den Dienst wäre. So wurde die Uniform, die schon nicht mehr neu war, immer schmutziger. Nur die goldenen Knöpfe glänzten immer. Gregor sah oft den ganzen Abend auf die vielen Flecken des Mantels, während der alte Mann darin schlief.<\/p>\n<p>Um zehn Uhr weckte die Mutter den Vater leise. Er sollte ins Bett gehen, denn er musste um sechs Uhr zur Arbeit. Aber der Vater wollte immer noch länger am Tisch bleiben. Eine Viertelstunde lang schüttelte er mit geschlossenen Augen den Kopf. Die Mutter zog an seinem Ärmel, die Schwester half ihr, aber es nützte nichts. Erst wenn die beiden Frauen ihn unter den Armen fassten, öffnete er die Augen und sagte: »Das ist ein Leben. Das ist die Ruhe meiner alten Tage.« Dann ließ er sich mühsam zur Tür bringen.<\/p>\n<p>Wer in dieser müden, überarbeiteten Familie hatte noch Zeit für Gregor? Das Geld wurde immer knapper. Das Dienstmädchen wurde entlassen. Stattdessen kam morgens und abends eine riesige, knochige Bedienerin mit weißen Haaren für die schwerste Arbeit. Die Familie verkaufte sogar ihren Schmuck. Am meisten klagten alle, dass sie die zu große Wohnung nicht verlassen konnten – wegen Gregor. Aber Gregor wusste: Man hätte ihn leicht in einer Kiste mit Luftlöchern transportieren können. Der wahre Grund war die Verzweiflung der Familie. Sie dachten, dass niemand sonst so ein Unglück hatte. Der Vater brachte den Bankangestellten das Frühstück, die Mutter wusch fremde Wäsche, die Schwester lief für die Kunden hin und her. Mehr Kraft hatten sie nicht. Manchmal saßen Mutter und Schwester abends eng zusammen. Die Mutter zeigte auf Gregors Zimmer und sagte: »Mach dort die Tür zu, Grete.« Dann war Gregor wieder im Dunkeln, und nebenan weinten die Frauen.<\/p>\n<p>Gregor schlief kaum noch, weder in der Nacht noch am Tag. Manchmal dachte er an früher: an den Chef, den Prokuristen, die Kollegen, an ein Zimmermädchen aus einem Hotel, an eine Kassiererin aus einem Hutgeschäft. Aber sie alle konnten ihm nicht helfen. Dann wieder war er voller Wut, weil sich niemand um ihn kümmerte. Die Schwester schob ihm jetzt morgens und mittags nur schnell mit dem Fuß irgendein Essen ins Zimmer. Am Abend kehrte sie es mit dem Besen wieder hinaus – egal, ob er es gegessen hatte oder nicht. Meistens hatte er es nicht gegessen. Sie räumte das Zimmer nur noch schnell auf. Überall waren Schmutz und Staub. Aber das Zimmer aufräumen durfte nur sie. Einmal putzte die Mutter Gregors Zimmer gründlich mit viel Wasser. Als die Schwester am Abend nach Hause kam und das sah, weinte sie laut vor Wut. Es gab einen großen Streit. Der Vater schimpfte mit der Mutter, die Schwester schrie, und niemand dachte daran, Gregors Tür zu schließen. Gregor zischte vor Ärger.<\/p>\n<p>Die Schwester war von der Arbeit erschöpft. Aber jetzt gab es ja die Bedienerin. Diese alte Witwe hatte keinen Ekel vor Gregor. Eines Tages öffnete sie zufällig seine Tür und stand vor ihm. Gregor lief überrascht hin und her, aber sie blieb ruhig stehen. Seitdem öffnete sie jeden Morgen und Abend kurz die Tür und sah hinein. Sie rief Dinge wie: »Komm mal her, alter Mistkäfer!« oder »Seht mal den alten Mistkäfer!« Gregor antwortete nie und bewegte sich nicht. Einmal, an einem regnerischen Morgen, ärgerte er sich so sehr, dass er langsam auf sie zukroch. Aber die Bedienerin hatte keine Angst. Sie hob einfach einen Stuhl hoch und wartete, um ihn auf Gregors Rücken zu schlagen. »Also weiter geht es nicht?«, fragte sie, als Gregor sich umdrehte. Dann stellte sie den Stuhl ruhig in die Ecke.<\/p>\n<p>Gregor aß fast nichts mehr. Manchmal nahm er einen Bissen in den Mund, behielt ihn stundenlang und spuckte ihn dann wieder aus. Zuerst dachte er, das kam von der Unordnung in seinem Zimmer. Die Familie hatte nämlich ein Zimmer an drei Herren vermietet. Diese ernsten Herren hatten alle drei einen Vollbart. Sie wollten überall Ordnung, besonders in der Küche. Unnötige oder schmutzige Dinge konnten sie nicht ertragen. Deshalb kam alles, was man nicht mehr brauchte, in Gregors Zimmer. Auch die Mülleimer aus der Küche. Die Bedienerin warf einfach alles hinein. So stand bald überall Gerümpel. Gregor musste sich zwischen den Sachen durchschieben. Am Anfang tat er es, weil er keinen Platz hatte. Später machte es ihm fast Spaß. Aber danach war er immer traurig und todmüde.<\/p>\n<p>Die Zimmerherren aßen manchmal abends im Wohnzimmer. Dann blieb Gregors Tür meistens geschlossen. Das störte ihn nicht sehr. Aber an einem Abend ließ die Bedienerin die Tür einen Spalt offen. Die drei Herren setzten sich an den Tisch, wo früher Gregor mit seinen Eltern gegessen hatte. Die Mutter brachte Fleisch, die Schwester Kartoffeln. Das Essen dampfte und roch gut. Der mittlere Herr war offenbar der Chef der drei. Er schnitt ein Stück Fleisch ab und prüfte es. Es war gut. Die Mutter und die Schwester atmeten auf und lächelten.<\/p>\n<p>Die Familie selbst aß in der Küche. Vorher kam der Vater aber noch ins Wohnzimmer, verbeugte sich mit der Mütze in der Hand und ging einmal um den Tisch. Die Herren standen auf und murmelten etwas in ihre Bärte. Dann aßen sie fast ohne ein Wort. Gregor hörte vor allem ihre kauenden Zähne. Es war, als ob sie ihm zeigen wollten: Zum Essen braucht man Zähne. »Ich habe ja Appetit«, dachte Gregor traurig, »aber nicht auf diese Dinge. Wie sich diese Herren ernähren – und ich verhungere!«<\/p>\n<p>An diesem Abend hörte man aus der Küche die Geige. Gregor hatte sie schon lange nicht mehr gehört. Die drei Herren hatten fertig gegessen, lasen Zeitung und rauchten. Als die Geige spielte, standen sie auf und gingen leise zur Tür. »Stört die Musik die Herren?«, fragte der Vater aus der Küche. »Wir können sofort aufhören.« »Im Gegenteil«, sagte der mittlere Herr. »Möchte das Fräulein nicht hier im Wohnzimmer spielen? Hier ist es doch viel gemütlicher.« »Oh bitte!«, rief der Vater. Bald kam er mit dem Notenpult, die Mutter mit den Noten und die Schwester mit der Geige. Die Eltern waren so höflich zu den Herren, dass sie sich nicht einmal auf ihre eigenen Stühle setzten.<\/p>\n<p>Die Schwester begann zu spielen. Die Eltern beobachteten genau ihre Hände. Die Musik zog Gregor an. Er kroch ein Stück vor und hatte schon den Kopf im Wohnzimmer. Früher hatte er immer Rücksicht auf die anderen genommen. Jetzt dachte er kaum noch daran. Dabei war er voller Staub. Auf seinem Rücken klebten Fäden, Haare und Essensreste. Früher hatte er sich mehrmals am Tag am Teppich sauber gerieben. Jetzt war ihm alles egal. Trotzdem kroch er auf den sauberen Boden des Wohnzimmers.<\/p>\n<p>Niemand bemerkte ihn. Die Familie hörte nur auf die Geige. Die drei Herren standen zuerst ganz nah bei den Noten. Aber bald gingen sie zum Fenster und sprachen leise miteinander. Man sah deutlich: Die Musik gefiel ihnen nicht, sie langweilten sich. Sie bliesen den Rauch ihrer Zigarren nach oben. Und dabei spielte die Schwester so schön! Ihr Gesicht war zur Seite geneigt, ihr Blick war traurig. Gregor kroch noch ein Stück weiter vor. War er ein Tier, wenn ihn Musik so ergriff? Er hatte das Gefühl, dass er endlich die unbekannte Nahrung gefunden hatte, nach der er sich sehnte. Er wollte zur Schwester kriechen und an ihrem Rock ziehen. Sie sollte mit ihrer Geige in sein Zimmer kommen, denn niemand hier verstand ihr Spiel so gut wie er. Dann wollte er ihr sein Geheimnis erzählen: dass er sie aufs Konservatorium schicken wollte. Sie würde vor Rührung weinen, und er würde ihren Hals küssen.<\/p>\n<p>»Herr Samsa!«, rief der mittlere Herr und zeigte mit dem Finger auf Gregor. Die Geige verstummte. Der Vater lief sofort zu den Herren. Er breitete die Arme aus und wollte sie in ihr Zimmer zurückdrängen. Jetzt wurden die Herren ärgerlich. Sie hatten nicht gewusst, dass sie so einen Nachbarn hatten! Die Schwester legte die Geige der Mutter auf den Schoß und lief schnell ins Zimmer der Herren, um ihre Betten zu machen. Der Vater drängte die Herren immer weiter. An der Tür stampfte der mittlere Herr laut mit dem Fuß. »Ich erkläre hiermit«, sagte er, »dass ich wegen der widerlichen Verhältnisse in dieser Wohnung und Familie« – dabei spuckte er kurz auf den Boden – »mein Zimmer sofort kündige. Ich zahle natürlich nichts. Vielleicht verlange ich sogar Schadenersatz von Ihnen.« Seine zwei Freunde sagten: »Auch wir kündigen sofort.« Dann schlug er die Tür zu.<\/p>\n<p>Der Vater tastete sich zu seinem Sessel und fiel hinein. Es sah aus, als wollte er schlafen, aber sein Kopf nickte unruhig. Gregor lag noch immer an derselben Stelle. Er war enttäuscht und schwach vor Hunger. Er konnte sich nicht bewegen. Er wartete darauf, dass sich gleich alle auf ihn stürzten. Da fiel die Geige aus den zitternden Fingern der Mutter laut auf den Boden.<\/p>\n<p>»Liebe Eltern«, sagte die Schwester und schlug mit der Hand auf den Tisch, »so geht es nicht weiter. Ich will vor diesem Untier nicht den Namen meines Bruders aussprechen. Ich sage nur: Wir müssen versuchen, es loszuwerden. Wir haben alles Menschenmögliche getan, um es zu pflegen. Niemand kann uns etwas vorwerfen.«<\/p>\n<p>»Sie hat tausendmal recht«, sagte der Vater leise zu sich. Die Mutter hatte noch immer keine Luft. Sie hustete dumpf und hatte einen wirren Blick.<\/p>\n<p>Die Schwester lief zur Mutter und hielt ihr die Stirn. Der Vater saß jetzt aufrecht. Er spielte mit seiner Mütze zwischen den Tellern der Herren und sah manchmal auf Gregor, der still dalag.<\/p>\n<p>»Wir müssen es loswerden«, sagte die Schwester jetzt nur zum Vater, »sonst bringt es euch beide um. Wenn man so schwer arbeiten muss wie wir, kann man diese ewige Qual zu Hause nicht ertragen. Ich kann es auch nicht mehr.« Und sie weinte so stark, dass ihre Tränen auf das Gesicht der Mutter fielen.<\/p>\n<p>»Kind«, sagte der Vater mitleidig, »was sollen wir aber tun?«<\/p>\n<p>Die Schwester zuckte nur mit den Schultern. Sie war jetzt ratlos und weinte.<\/p>\n<p>»Wenn er uns verstehen würde«, sagte der Vater halb fragend. Die Schwester schüttelte heftig die Hand. Das war ganz unmöglich.<\/p>\n<p>»Wenn er uns verstehen würde«, wiederholte der Vater und schloss die Augen, »dann könnte man vielleicht mit ihm sprechen. Aber so …«<\/p>\n<p>»Weg muss es«, rief die Schwester, »das ist die einzige Lösung, Vater. Du musst nur aufhören zu glauben, dass es Gregor ist. Das war unser großes Unglück. Wie kann es Gregor sein? Wenn es Gregor wäre, hätte er schon lange verstanden, dass Menschen nicht mit so einem Tier leben können. Dann wäre er freiwillig gegangen. Wir hätten keinen Bruder mehr, aber wir könnten weiterleben und an ihn denken. Aber dieses Tier verfolgt uns. Es vertreibt die Zimmerherren. Es will die ganze Wohnung für sich haben, und wir sollen auf der Straße schlafen. Sieh nur, Vater!«, schrie sie plötzlich, »er fängt schon wieder an!« Voller Angst sprang sie auf, ließ sogar die Mutter allein und lief hinter den Vater. Der Vater stand auf und hob die Arme, als ob er sie schützen wollte.<\/p>\n<p>Aber Gregor wollte niemanden erschrecken, am wenigsten seine Schwester. Er hatte nur angefangen, sich umzudrehen, um in sein Zimmer zurückzukriechen. Weil er so schwach war, half er mit dem Kopf nach: Er hob ihn immer wieder und schlug ihn auf den Boden. Das sah natürlich seltsam aus. Er hielt an und sah sich um. Die Familie hatte seine gute Absicht wohl verstanden. Alle sahen ihn jetzt still und traurig an. Die Mutter lag erschöpft in ihrem Sessel, fast mit geschlossenen Augen. Die Schwester saß neben dem Vater und hatte den Arm um seinen Hals gelegt.<\/p>\n<p>»Jetzt darf ich mich vielleicht schon umdrehen«, dachte Gregor und arbeitete weiter. Er atmete schwer und musste oft eine Pause machen. Niemand trieb ihn an. Endlich hatte er sich umgedreht und kroch geradeaus. Er staunte, wie weit sein Zimmer entfernt war. Wie hatte er diesen langen Weg vorhin geschafft? Niemand sagte ein Wort, niemand rief. Erst in der Tür drehte er den Kopf ein wenig. Er sah: Hinter ihm war alles wie vorher, nur die Schwester war aufgestanden. Sein letzter Blick fiel auf die Mutter, die jetzt ganz eingeschlafen war.<\/p>\n<p>Kaum war er in seinem Zimmer, wurde die Tür schnell zugeschlagen und abgeschlossen. Gregor erschrak so sehr, dass seine Beinchen einknickten. Es war die Schwester. Sie hatte schon gewartet und war leise nach vorne gesprungen. Als sie den Schlüssel umdrehte, rief sie den Eltern zu: »Endlich!«<\/p>\n<p>»Und jetzt?«, fragte sich Gregor im Dunkeln. Bald merkte er, dass er sich gar nicht mehr bewegen konnte. Das wunderte ihn nicht. Eher wunderte er sich, dass er sich bisher mit diesen dünnen Beinchen bewegt hatte. Sonst fühlte er sich ziemlich wohl. Sein ganzer Körper tat weh, aber der Schmerz wurde langsam schwächer. Den faulen Apfel in seinem Rücken spürte er kaum noch. Er dachte voller Rührung und Liebe an seine Familie. Er war selbst überzeugt, dass er verschwinden musste – vielleicht noch mehr als die Schwester. So lag er ruhig da und dachte nach, bis die Turmuhr drei Uhr morgens schlug. Draußen vor dem Fenster wurde es langsam hell. Dann sank sein Kopf ohne seinen Willen ganz nach unten. Aus seinen Nasenlöchern kam schwach sein letzter Atem.<\/p>\n<p>Früh am Morgen kam die Bedienerin. Sie schlug wie immer laut die Türen zu, obwohl man sie oft gebeten hatte, leise zu sein. Wie immer sah sie kurz in Gregors Zimmer. Zuerst fand sie nichts Besonderes. Sie dachte, er liegt absichtlich so still da und spielt den Beleidigten. Mit dem langen Besen kitzelte sie ihn ein bisschen. Als nichts passierte, stieß sie ihn fester. Erst als sie ihn ganz leicht über den Boden schieben konnte, wurde sie aufmerksam. Bald verstand sie, was passiert war. Sie riss die Augen auf und pfiff leise. Dann öffnete sie die Tür zum Schlafzimmer und rief laut in das Dunkel: »Sehen Sie nur mal an, es ist krepiert; da liegt es, ganz und gar krepiert!«<\/p>\n<p>Herr und Frau Samsa saßen erschrocken im Ehebett. Dann standen sie schnell auf. Herr Samsa legte sich die Decke um die Schultern, Frau Samsa kam im Nachthemd. So gingen sie in Gregors Zimmer. Auch Grete kam. Sie war schon ganz angezogen, als hätte sie gar nicht geschlafen. Ihr Gesicht war blass. »Tot?«, fragte Frau Samsa. »Das sage ich doch«, antwortete die Bedienerin. Zum Beweis schob sie Gregors Leiche mit dem Besen ein Stück zur Seite. Frau Samsa wollte den Besen zurückhalten, tat es aber nicht. »Nun«, sagte Herr Samsa, »jetzt können wir Gott danken.« Er bekreuzigte sich, und die drei Frauen machten es ihm nach. Grete sah die ganze Zeit auf die Leiche und sagte: »Seht nur, wie mager er war. Er hat ja so lange nichts gegessen.« Wirklich: Gregors Körper war ganz flach und trocken.<\/p>\n<p>»Grete, komm ein bisschen zu uns herein«, sagte Frau Samsa mit einem traurigen Lächeln. Grete ging mit den Eltern ins Schlafzimmer, sah aber noch einmal zurück auf die Leiche. Die Bedienerin schloss die Tür und öffnete das Fenster weit. Obwohl es noch früh war, war die Luft schon ein wenig warm. Es war ja schon Ende März.<\/p>\n<p>Die drei Zimmerherren kamen aus ihrem Zimmer und suchten ihr Frühstück. Man hatte sie vergessen. »Wo ist das Frühstück?«, fragte der mittlere Herr ärgerlich. Die Bedienerin legte den Finger auf den Mund und winkte sie in Gregors Zimmer. Dort standen sie mit den Händen in den Taschen ihrer alten Röcke um Gregors Leiche herum. Im Zimmer war es jetzt ganz hell.<\/p>\n<p>Da öffnete sich die Schlafzimmertür. Herr Samsa kam in seiner Uniform heraus, an einem Arm seine Frau, am anderen seine Tochter. Alle hatten ein wenig geweint. Grete drückte manchmal ihr Gesicht an den Arm des Vaters.<\/p>\n<p>»Verlassen Sie sofort meine Wohnung!«, sagte Herr Samsa und zeigte auf die Tür. »Wie meinen Sie das?«, fragte der mittlere Herr etwas unsicher und lächelte süßlich. »Ich meine es genau so, wie ich es sage«, antwortete Herr Samsa und ging mit den zwei Frauen direkt auf den Herrn zu. Der Herr sah zuerst still auf den Boden. Dann sagte er: »Dann gehen wir also.« Herr Samsa nickte nur mehrmals kurz mit großen Augen. Sofort ging der Herr mit langen Schritten ins Vorzimmer. Seine zwei Freunde liefen schnell hinterher. Alle drei nahmen ihre Hüte und Stöcke, verbeugten sich stumm und verließen die Wohnung. Die Familie Samsa sah ihnen vom Treppenhaus nach, wie sie langsam die vielen Stufen hinuntergingen. Bald interessierten sie sich nicht mehr für die drei. Als ein Fleischergeselle mit seiner Last auf dem Kopf die Treppe heraufkam, gingen sie erleichtert in die Wohnung zurück.<\/p>\n<p>Sie beschlossen, diesen Tag zum Ausruhen und für einen Spaziergang zu nutzen. Sie hatten diese Pause verdient – und sie brauchten sie. Deshalb schrieben sie drei Entschuldigungsbriefe: Herr Samsa an seine Bank, Frau Samsa an ihren Auftraggeber und Grete an ihren Chef. Da kam die Bedienerin herein. Sie wollte sagen, dass sie mit ihrer Arbeit fertig war. Sie lächelte, als hätte sie eine große, gute Nachricht. Die kleine Straußenfeder auf ihrem Hut schaukelte hin und her. »Also was wollen Sie eigentlich?«, fragte Frau Samsa. »Ja«, sagte die Bedienerin und lachte freundlich, »also darum, wie man das Zeug von nebenan wegschafft, müssen Sie sich keine Sorgen machen. Das ist schon in Ordnung.« Frau Samsa und Grete beugten sich über ihre Briefe. Herr Samsa merkte, dass die Bedienerin alles genau erzählen wollte. Aber er hob die Hand: Er wollte es nicht hören. Da wurde sie beleidigt, rief »Adieu allerseits«, drehte sich um und schlug die Tür furchtbar laut zu.<\/p>\n<p>»Heute Abend wird sie entlassen«, sagte Herr Samsa. Aber seine Frau und seine Tochter antworteten nicht. Die Bedienerin hatte ihre neue Ruhe gestört. Die beiden Frauen standen auf, gingen zum Fenster und hielten sich umarmt. Herr Samsa sah ihnen eine Weile zu. Dann rief er: »Also kommt doch her. Lasst endlich die alten Sachen. Und nehmt auch ein bisschen Rücksicht auf mich.« Sofort liefen die Frauen zu ihm, küssten und streichelten ihn und schrieben dann schnell ihre Briefe fertig.<\/p>\n<p>Dann verließen alle drei zusammen die Wohnung. Das hatten sie seit Monaten nicht mehr getan. Sie fuhren mit der Straßenbahn ins Freie vor die Stadt. Die Straßenbahn war voll von warmer Sonne, und sie waren allein darin. Bequem zurückgelehnt sprachen sie über die Zukunft. Sie merkten: Eigentlich sah sie gar nicht schlecht aus. Alle drei hatten gute Stellen mit guten Aussichten. Am meisten würde ein Umzug helfen. Sie wollten eine kleinere, billigere und praktischere Wohnung – nicht die alte, die Gregor ausgesucht hatte. Grete wurde immer lebhafter. Plötzlich sahen Herr und Frau Samsa fast gleichzeitig, wie schön ihre Tochter geworden war, eine junge, hübsche Frau. Sie wurden still und dachten beide dasselbe: Bald war es Zeit, einen guten Mann für sie zu finden. Und als sie am Ziel ankamen, stand die Tochter als Erste auf und streckte ihren jungen Körper – wie eine Bestätigung ihrer neuen Träume.<\/p>"}];
