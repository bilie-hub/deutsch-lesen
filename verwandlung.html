  if (!biOn()) { enbody.innerHTML = ''; enKey = ''; return; }
  if (!hasEN(ch)) { enKey = ''; enbody.innerHTML = '<p class="note">Für diese Seite gibt es keine Übersetzung.</p>'; return; }
  const E = altParas()[ch];
  const a = firstWordOnPage(page), n = firstWordOnPage(page + 1), b = n < 0 ? words.length - 1 : n - 1;
  const ps = new Set();
  for (let i = Math.max(a, 0); i <= b; i++) { const pi = paraOf(words[i]); if (pi >= 0) ps.add(pi); }
  const list = [...ps].sort((x, y) => x - y);
  const key = ch + ':' + list.join(',');
  if (key === enKey) return markEN();
  enKey = key;
  if (!list.length) { enbody.innerHTML = '<p class="note">(Titel – kein Text auf dieser Seite)</p>'; return; }
  const startsMid = a > 0 && paraOf(words[a - 1]) === list[0];
  const endsMid = b < words.length - 1 && paraOf(words[b + 1]) === list[list.length - 1];
  enbody.innerHTML = list.map((pi, k) => `<p data-pi="${pi}" class="${k === 0 && startsMid ? 'cont' : ''} ${k === list.length - 1 && endsMid ? 'more' : ''}">${E[pi] || ''}</p>`).join('');
  enbody.scrollTop = 0;
  enbody.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease-out' });
  markEN();
}
function markEN() {
  const pi = sel >= 0 ? paraOf(words[sel]) : -1;
  enbody.querySelectorAll('p.hl').forEach(p => p.classList.remove('hl'));
  const t = pi >= 0 && enbody.querySelector(`p[data-pi="${pi}"]`);
  if (t) { t.classList.add('hl'); t.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
let hovP = null;
function hoverPara(pi) {
  if (hovP === pi) return; hovP = pi;
  flow.querySelectorAll('p.hov').forEach(p => p.classList.remove('hov'));
  enbody.querySelectorAll('p.hov').forEach(p => p.classList.remove('hov'));
  if (pi == null || pi < 0 || !biOn()) return;
  const e = enbody.querySelector(`p[data-pi="${pi}"]`); if (e) e.classList.add('hov');
  const d = [...flow.querySelectorAll('p')][pi]; if (d) d.classList.add('hov');
}
flow.addEventListener('mouseover', e => { const p = e.target.closest('p'); hoverPara(p ? p._pi : null); });
flow.addEventListener('mouseleave', () => hoverPara(null));
enbody.addEventListener('mouseover', e => { const p = e.target.closest('p[data-pi]'); hoverPara(p ? +p.dataset.pi : null); });
enbody.addEventListener('mouseleave', () => hoverPara(null));
function toggleBi() {
  if (!BOOK_HAS_EN) return;
  if (innerWidth < 900) {   // small screens: flip between the German and the English page
    if (!settings.bi) { settings.bi = true; store.set('settings', settings); measure(); renderEN(); }
    document.body.classList.toggle('show-en');
    return;
  }
  settings.bi = !settings.bi; store.set('settings', settings);
  relayoutKeepingPlace();
  toast(settings.bi ? 'Englisch daneben – an' : 'Englisch daneben – aus');
}
$('#biBtn').onclick = toggleBi;
$('#enhead').addEventListener('click', e => {
  const b = e.target.closest('[data-alt]'); if (!b) return;
  altI = +b.dataset.alt; settings.alt = ALT[altI].id; store.set('settings', settings);
  enKey = ''; renderAltHead(); renderEN();
});
renderAltHead();
function updateFoot() {
  const done = CH_LEN.slice(0, ch).reduce((a, b) => a + b, 0) + CH_LEN[ch] * ((page + 1) / pages);
  store.set('progress:' + META.id, Math.round(done / TOTAL * 1000) / 10);
  $('#footChap').textContent = BOOK[ch].title;
  $('#footPg').textContent = `Seite ${page + 1} von ${pages} · ${Math.round(done / TOTAL * 100)} %`;
  const sc = $('#scrub'); sc.value = page + 1;
  sc.style.setProperty('--fill', (pages > 1 ? page / (pages - 1) * 100 : 100) + '%');
}
function firstWordOnPage(p) {
  let lo = 0, hi = words.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (pageOf(words[mid]) >= p) { ans = mid; hi = mid - 1; } else lo = mid + 1; }
  return ans;
}
let saveT;
function savePos() {
  clearTimeout(saveT);
  saveT = setTimeout(() => store.set(POS_KEY, { ch, w: sel >= 0 && pageOf(words[sel]) === page ? sel : firstWordOnPage(page) }), 250);
}

/* ---------------- page turning ---------------- */
let running = null;
function finishAnim() {
  if (!running) return;
  const r = running; running = null;
  clearTimeout(r.timer);
  r.anims.forEach(a => a.cancel());
  r.done();
}
const animOn = () => settings.anim && !reducedMotion;
const EASE = 'cubic-bezier(.42,.08,.32,1)', DUR = 640;

// dir>0: the current page lifts away to the left, revealing the next one underneath.
// dir<0: the previous page swings back in on top of the current one.
function flip(dir, target, swapIn) {
  finishAnim();
  if (!animOn()) {
    swapIn && swapIn();
    setPage(target);
    if (settings.anim === false) return;
    flow.parentElement.animate([{ opacity: .3 }, { opacity: 1 }], { duration: 160 });
    return;
  }
  const cast = $('#cast'), shade = $('#shade');
  let done;
  if (dir > 0) {
    ensureLeaf(ch);
    setFlowPage(leafFlow, page);
    $('#leafFolio').textContent = page + 1;
    leaf.style.display = 'block';
    swapIn && swapIn();
    setPage(target);
    done = () => { leaf.style.display = 'none'; };
    running = { done, anims: [
      leaf.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-100deg)' }], { duration: DUR, easing: EASE }),
      shade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: DUR, easing: EASE }),
      cast.animate([{ opacity: .9 }, { opacity: .5, offset: .45 }, { opacity: 0 }], { duration: DUR, easing: EASE }),
    ] };
  } else {
    const ci = swapIn ? swapIn.ci : ch;
    ensureLeaf(ci);
    const tp = target < 0 ? leafPages - 1 : target;
    setFlowPage(leafFlow, tp);
    $('#leafFolio').textContent = tp + 1;
    leaf.style.display = 'block';
    done = () => { swapIn && swapIn(); setPage(tp); leaf.style.display = 'none'; if (swapIn && swapIn.after) swapIn.after(); };
    running = { done, anims: [
      leaf.animate([{ transform: 'rotateY(-100deg)' }, { transform: 'rotateY(0deg)' }], { duration: DUR, easing: EASE }),
      shade.animate([{ opacity: 1 }, { opacity: 0 }], { duration: DUR, easing: EASE }),
      cast.animate([{ opacity: 0 }, { opacity: .5, offset: .55 }, { opacity: .9 }], { duration: DUR, easing: EASE }),
    ] };
  }
  const r = running;
  const land = () => { if (running !== r) return; running = null; clearTimeout(r.timer); r.anims.forEach(a => a.cancel()); r.done(); keepVisible(); };
  r.anims[0].onfinish = land;
  r.timer = setTimeout(land, DUR + 150);   // animations can stall in background tabs; always land the page
}

function turn(dir, after) {
  if (dir > 0) {
    if (page < pages - 1) return flip(1, page + 1);
    if (ch < BOOK.length - 1) { const swap = () => { renderChapter(ch + 1); }; return flip(1, 0, swap), after && after(); }
    return toast('Ende des Buches');
  } else {
    if (page > 0) return flip(-1, page - 1);
    if (ch > 0) {
      const ci = ch - 1;
      const swap = () => renderChapter(ci); swap.ci = ci; swap.after = after;
      return flip(-1, -1, swap);
    }
    return toast('Anfang des Buches');
  }
}
function jumpTo(ci, wordIndex) {
  finishAnim();
  if (ci !== ch) renderChapter(ci);
  const p = wordIndex != null && words[wordIndex] ? pageOf(words[wordIndex]) : 0;
  setPage(p);
  book.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'ease-out' });
  if (wordIndex != null && words[wordIndex]) select(wordIndex, { noTurn: true });
}

/* ---------------- sentences ---------------- */
const BLOCK = 'p,h1,h2,h3,figcaption,li,div';
const ABBR = /^(hl|St|Dr|Sr|S|u|z|B|vgl|bzw|usw|etc|ca|Nr|geb|gest|Hr|Fr|Th|Ew|Se|Sw|SW)$/;
function gapAfter(i) {
  const a = words[i], b = words[i + 1];
  const r = document.createRange(); r.setStartAfter(a);
  if (b && a.closest(BLOCK) === b.closest(BLOCK)) r.setEndBefore(b);
  else { const blk = a.closest(BLOCK) || flow; r.setEnd(blk, blk.childNodes.length); }
  return r.toString();
}
function boundaryAfter(i) {
  if (i >= words.length - 1) return true;
  if (words[i].closest(BLOCK) !== words[i + 1].closest(BLOCK)) return true;
  const g = gapAfter(i);
  if (!/[.!?…]/.test(g)) return false;
  const w = words[i].textContent;
  if (/^\./.test(g.trim()) && (ABBR.test(w) || /^\p{Lu}$/u.test(w))) return false;
  return true;
}
function sentenceAround(i) {
  let a = i, b = i;
  while (a > 0 && i - a < 120 && !boundaryAfter(a - 1)) a--;
  while (b < words.length - 1 && b - i < 120 && !boundaryAfter(b)) b++;
  const r = document.createRange(); r.setStartBefore(words[a]); r.setEndAfter(words[b]);
  const tail = (gapAfter(b).match(/^[^\p{L}]*?[.!?…]+["“”»«’)]*/u) || [''])[0];
  const text = (r.toString() + tail).replace(/\s+/g, ' ').trim();
  return { a, b, text, range: r };
}

/* ---------------- selection & navigation ---------------- */
function select(i, opt = {}) {
  if (i < 0 || i >= words.length) return;
  if (sel >= 0 && words[sel]) words[sel].classList.remove('sel');

/* ---------------- separable verbs ----------------

const PMEAN = { an: 'on, at', auf: 'up, open', aus: 'out', ab: 'off, away', ein: 'in', mit: 'along, with', vor: 'forward, before', zu: 'shut, to', zurück: 'back',
  weg: 'away', hin: 'there, towards', her: 'here, this way', nach: 'after', los: 'off, loose', fort: 'away', heraus: 'out', hinaus: 'out', herein: 'in', hinein: 'in',
  herauf: 'up', hinauf: 'up', herunter: 'down', hinunter: 'down', vorbei: 'past', weiter: 'on, further', fest: 'firmly', nieder: 'down', um: 'around, over',
  zusammen: 'together', entgegen: 'towards', wieder: 'again, back', durch: 'through', hervor: 'out, forth', herum: 'around', davon: 'away', hoch: 'up' };

  // 1) joined: aufstand / aufgestanden / aufzustehen (but not if the dictionary already knows this verb form)
  if (w === low && !isVerbEntry(low)) {
    for (const p of SEP_P) {
      if (!low.startsWith(p) || low.length - p.length < 3) continue;
      let rest = low.slice(p.length);
      if (rest.startsWith('zu') && isVerbEntry(rest.slice(2))) rest = rest.slice(2);
      if (!isVerbEntry(rest)) continue;
      const lem = G.info(rest).lemma.toLowerCase();
      if (!/(en|ern|eln)$/.test(lem) || !isVerbEntry(p + lem)) continue;
      return { combo: p + lem, p, lem, verb: i, part: -1, joined: true };
    }
  }
  // 2) split: the finite verb … the particle at the end of the same clause
  const { a, b } = curSentence;

  if (!SEP_P.includes(last)) return null;
  for (let k = s; k < e; k++) {
    const inf = G.info(words[k].textContent);
    if (!G.isFinite(inf)) continue;

    const lem = (inf.lemma || '').toLowerCase();

    <div class="t1">Trennbares Verb <a class="glink" href="grammar.html#trennbar" target="_blank">Was ist das? →</a></div>
    <div class="sw"><span>Hier:</span> <a data-look="${esc(sep.combo)}">${esc(sep.combo)}</a></div>
    <div class="sm">${meaning === parts ? '≈ ' : ''}${esc(meaning)}${meaning === parts ? ' <small>(nicht im Wörterbuch – aus den Teilen erklärt)</small>' : ''}</div>

async function showWord(word, sep) {
  const my = ++lookToken;

  const acts = () => `<div class="acts">
      <button class="pill ${isSaved(saveKey) ? 'on' : ''}" data-act="save" id="saveBtn">${icon(IC.star)} ${isSaved(saveKey) ? 'Gemerkt' : 'Merken'}${sep ? ': ' + esc(sep.combo) : ''} <kbd>M</kbd></button>

    if (r.ipa) bits.push(`<span class="ipa">${esc(r.ipa)}</span>`);

      body += `<div class="base"><div class="bw">${withArt(lr)}<small>Grundform</small>${lr.ipa ? `<span class="ipa">${esc(lr.ipa)}</span>` : ''}</div>${defsHtml(lr, 2, 3)}</div>`;

async function mt(q) {
  q = q.slice(0, 480);
  if (trCache[q]) return trCache[q];
  try {
    const r = await fetch('https://api.mymemory.translated.net/get?langpair=de|en&q=' + encodeURIComponent(q));
    const j = await r.json();
    const t = j.responseData && j.responseData.translatedText;
    if (!t || j.responseStatus == 429 || /MYMEMORY WARNING/i.test(t)) return { err: 'Tageslimit der Übersetzung erreicht – morgen wieder verfügbar.' };
    trCache[q] = t;
    const keys = Object.keys(trCache); if (keys.length > 1500) delete trCache[keys[0]];
    store.set('tr', trCache);
    return t;
  } catch (e) { return { err: 'Keine Verbindung zum Übersetzer.' }; }
}

  const t = await mt(s);

}

let deVoice = null;
function speak(text) {

  const u = new SpeechSynthesisUtterance(text);

function openDict() { $('#dict').classList.add('open'); keepVisible(); }
function keepVisible() {

    const wb = words[sel].getBoundingClientRect().bottom - cur;
    const shift = Math.max(0, Math.min(wb + 28 - sheetTop, book.offsetHeight * .75));
    book.style.translate = shift ? `0 ${-Math.round(shift)}px` : '';

dscroll.addEventListener('click', e => {
  const look = e.target.closest('[data-look]');
  if (look) { showWord(look.dataset.look); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'prev') moveWord(-1);
  if (a === 'next') moveWord(1);
  if (a === 'save') toggleSave();
  if (a === 'savePhrase') toggleSave();
  if (a === 'speak') speak(current.word);
  if (a === 'speakPhrase') speak(current.word);
  if (a === 'sent') translateSentence();
  if (a === 'speakSent' && curSentence) speak(curSentence.text);
  if (a === 'gram') toggleGram();

  } else {
    body.innerHTML = vocab.length ? `<div class="vtools"><button class="pill" data-v="copy">${icon(IC.copy)} Liste kopieren (für Anki/Excel)</button></div>
      <div class="vocab">${vocab.map((v, k) => `<div class="item"><div class="vw">${esc(v.w)}</div><div class="vm">${esc(v.m || '–')}</div>${v.s ? `<div class="vs">${esc(v.s.length > 140 ? v.s.slice(0, 140) + ' …' : v.s)}</div>` : ''}
        <div class="ops"><button title="Zur Stelle springen" data-go="${k}">${icon(IC.go)}</button><button title="Anhören" data-say="${k}">${icon(IC.speak)}</button><button title="Löschen" data-del="${k}">${icon(IC.del)}</button></div></div>`).join('')}</div>`
      : `<div class="empty"><div class="mark">★</div><h3>Noch keine Wörter</h3><p>Wähle ein Wort und drücke <kbd>M</kbd><br>oder „Merken“, um es hier zu sammeln.</p></div>`;
  }
}
function openDrawer(tab) { drawerTab = tab; renderDrawer(); $('#drawer').classList.add('open'); $('#scrim').classList.add('show'); closePop(); }
function closeDrawer() { $('#drawer').classList.remove('open'); $('#scrim').classList.remove('show'); }
$('#tocBtn').onclick = () => openDrawer('toc');
$('#vocabBtn').onclick = () => openDrawer('vocab');
$('#scrim').onclick = () => { closeDrawer(); closePop(); };
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { drawerTab = t.dataset.tab; renderDrawer(); });
$('#drawerBody').addEventListener('click', e => {
  const c = e.target.closest('[data-ch]');
  if (c) { closeDrawer(); deselect(); jumpTo(+c.dataset.ch); return; }
  const g = e.target.closest('[data-go]'), d = e.target.closest('[data-del]'), s = e.target.closest('[data-say]'), cp = e.target.closest('[data-v="copy"]');
  if (g) {
    const v = vocab[+g.dataset.go], vb = v.b || 'elixiere';
    if (vb !== META.id) { location.href = vb + '.html#w=' + v.ch + ',' + v.i; return; }
    closeDrawer(); if (v.i >= 0) jumpTo(v.ch, v.i); else jumpTo(v.ch);
  }
  if (s) speak(vocab[+s.dataset.say].w);
  if (d) { vocab.splice(+d.dataset.del, 1); store.set('vocab', vocab); setCount(); renderDrawer(); }
  if (cp) {
    const tsv = vocab.map(v => [v.w, v.m, v.s].map(x => (x || '').replace(/\t|\n/g, ' ')).join('\t')).join('\n');
    navigator.clipboard.writeText(tsv).then(() => toast('Kopiert – in Anki/Excel einfügen'), () => toast('Kopieren nicht möglich'));
  }
});

/* ---------------- settings popover ---------------- */
function closePop() { $('#pop').classList.remove('open'); }
$('#setBtn').onclick = e => { e.stopPropagation(); $('#pop').classList.toggle('open'); syncSettingsUI(); };
document.addEventListener('click', e => { if (!e.target.closest('#pop,#setBtn')) closePop(); });
function syncSettingsUI() {
  document.querySelectorAll('#themes button').forEach(b => b.classList.toggle('on', b.dataset.theme === settings.theme));
  document.querySelectorAll('#fonts button').forEach(b => b.classList.toggle('on', b.dataset.font === settings.font));
  $('#fsVal').textContent = settings.fs + ' px';
  $('#autoSent').checked = settings.autoSent; $('#animTog').checked = settings.anim;
}
function saveSettings(relayout) {
  store.set('settings', settings); applyLook(); syncSettingsUI();
  if (relayout) relayoutKeepingPlace();
}
$('#themes').onclick = e => { const b = e.target.closest('button'); if (b) { settings.theme = b.dataset.theme; saveSettings(); } };
$('#fonts').onclick = e => { const b = e.target.closest('button'); if (b) { settings.font = b.dataset.font; saveSettings(true); } };
$('#fsDown').onclick = () => { settings.fs = Math.max(15, settings.fs - 1); saveSettings(true); };
$('#fsUp').onclick = () => { settings.fs = Math.min(30, settings.fs + 1); saveSettings(true); };
$('#autoSent').onchange = e => { settings.autoSent = e.target.checked; saveSettings(); };
$('#animTog').onchange = e => { settings.anim = e.target.checked; saveSettings(); };

/* ---------------- relayout ---------------- */
function relayoutKeepingPlace() {
  finishAnim();
  const anchor = sel >= 0 ? sel : firstWordOnPage(page);
  const go = () => {
    measure();
    pages = countPages(flow); $('#scrub').max = pages;
    leafCh = -1; enKey = '';
    setPage(anchor >= 0 ? pageOf(words[anchor]) : 0);
  };
  document.fonts ? document.fonts.ready.then(go) : go();
}
let rT, lastSize = '';
new ResizeObserver(() => {
  const r = $('#stage').getBoundingClientRect(), k = Math.round(r.width) + 'x' + Math.round(r.height);
  if (k === lastSize || !words.length) return; lastSize = k;
  clearTimeout(rT); rT = setTimeout(relayoutKeepingPlace, 120);
}).observe(document.body);

/* ---------------- input ---------------- */
$('#page').addEventListener('click', e => {
  if (e.target.tagName === 'IMG') return openLightbox(e.target.src);
  const s = getSelection(); if (s && !s.isCollapsed && s.toString().trim()) return;
  const w = e.target.closest('.w');
  if (w) return w._i === sel ? deselect() : select(w._i);
  const r = $('#page').getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  if (x < .2) turn(-1); else if (x > .8) turn(1); else if (sel >= 0) deselect();
});
$('#page').addEventListener('mouseup', () => setTimeout(() => {
  const s = getSelection(); const t = s ? s.toString().replace(/\s+/g, ' ').trim() : '';
  if (t && /\s/.test(t) && t.length < 480) {
    if (sel >= 0 && words[sel]) words[sel].classList.remove('sel');
    sel = -1; curSentence = null; if (window.CSS && CSS.highlights) CSS.highlights.delete('sent');
    showPhrase(t);
  }
}, 0));
$('#prevBtn').onclick = () => turn(-1);
$('#nextBtn').onclick = () => turn(1);
$('#scrub').addEventListener('input', e => { finishAnim(); setPage(+e.target.value - 1); });
let tx = null, ty = null;
$('#page').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('#page').addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) turn(dx < 0 ? 1 : -1);
});
function openLightbox(src) { const lb = $('#lightbox'); lb.querySelector('img').src = src; lb.classList.add('show'); }
$('#lightbox').onclick = () => $('#lightbox').classList.remove('show');

addEventListener('keydown', e => {
  if ((e.target.matches && e.target.matches('input[type=text],textarea')) || e.ctrlKey || e.metaKey || e.altKey) return;
  const drawerOpen = $('#drawer').classList.contains('open');
  if (e.key === 'Escape') {
    if ($('#lightbox').classList.contains('show')) return $('#lightbox').classList.remove('show');
    if (drawerOpen) return closeDrawer();
    if ($('#pop').classList.contains('open')) return closePop();
    return deselect();
  }
  if (drawerOpen) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowLeft') {
    e.preventDefault();
    const d = k === 'ArrowRight' ? 1 : -1;
    if (sel >= 0 && !e.shiftKey) moveWord(d); else turn(d);
  } else if (k === 'ArrowDown' && sel >= 0) { e.preventDefault(); moveSentence(1); }
  else if (k === 'ArrowUp' && sel >= 0) { e.preventDefault(); moveSentence(-1); }
  else if (k === 'PageDown' || (k === ' ' && sel < 0)) { e.preventDefault(); turn(1); }
  else if (k === 'PageUp') { e.preventDefault(); turn(-1); }
  else if (k === 'Home' && sel < 0) { finishAnim(); setPage(0); }
  else if (k === 'End' && sel < 0) { finishAnim(); setPage(pages - 1); }
  else if ((k === 's' || k === 'S' || k === 'Enter') && curSentence) { e.preventDefault(); translateSentence(); }
  else if ((k === 'm' || k === 'M') && current) toggleSave();
  else if ((k === 'a' || k === 'A') && current) speak(current.word);
  else if (k === 't' || k === 'T') openDrawer('toc');
  else if (k === 'e' || k === 'E') toggleBi();
  else if ((k === 'g' || k === 'G') && curSentence) toggleGram();
});

function setCount() {
  const b = $('#vocabCount'); b.textContent = vocab.length; b.dataset.n = vocab.length;
  const srs = store.get('srs', {}), now = Date.now();
  const due = vocab.filter(v => !srs[v.w] || srs[v.w].due <= now).length;
  const d = $('#dueCount'); d.textContent = due; d.dataset.n = due;
}
/* ---------------- toast ---------------- */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

/* ---------------- start ---------------- */
applyLook();
setCount();
showEmpty();
const start = () => {
  measure();
  let pos = store.get(POS_KEY, { ch: META.start, w: 0 });
  const h = location.hash.match(/^#w=(d+),(-?d+)/);   // jump from "Meine Wörter" in another book
  if (h) { pos = { ch: +h[1], w: Math.max(0, +h[2]) }; history.replaceState(null, '', location.pathname); }
  renderChapter(Math.min(pos.ch, BOOK.length - 1));
  setPage(words[pos.w] ? pageOf(words[pos.w]) : 0);
  book.classList.add('ready');
  if (!window.WOERTERBUCH) setTimeout(() => toast('Offline-Wörterbuch fehlt – Nachschlagen online (langsamer)'), 800);
};
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 2500))]).then(start);
})();
</script>
