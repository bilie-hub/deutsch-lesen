{"w":"leise","art":"","ipa":"/ˈlaɪ.zə/","m":"quiet, soft, low; slight, faint, light","f":"leise","s":"An der anderen Seitentür aber klagte leise die Schwester: »Gregor?","n":3},{"w":"schreien","art":"","ipa":"/ˈʃʁaɪ̯ən/","m":"to shout; to yell; to cry; to scream; to howl","f":"schrie","s":"schrie sie dann.","n":3},{"w":"Frühstück","art":"das","ipa":"/ˈfʁyːʃtʏk/","m":"breakfast","f":"Frühstück","s":"Wenn ich zum Beispiel im Laufe des Vormittags ins Gasthaus zurückgehe, um die erlangten Aufträge zu überschreiben, sitzen diese Herren erst beim Frühstück.","n":3},{"w":"weinen","art":"","ipa":"/ˈvaɪ̯nən/","m":"to weep, cry","f":"weinte","s":"Und warum weinte sie denn?","n":3},{"w":"verlangen","art":"","ipa":"/fɛʁˈlaŋən/","m":"to ask for, demand","f":"verlangt","s":"Augenblicklich lag er wohl da auf dem Teppich, und niemand, der seinen Zustand gekannt hätte, hätte im Ernst von ihm verlangt, daß er den Prokuristen hereinlasse.","n":3},{"w":"außerhalb","art":"","ipa":"/ˈaʊ̯sɐhalp/","m":"outside, beyond; outside","f":"außerhalb","s":"Aber als er den Kopf endlich außerhalb des Bettes in der freien Luft hielt, bekam er Angst, weiter auf diese Weise vorzurücken, denn wenn er sich schließlich so fallen ließ, mußte geradezu ein Wunder geschehen wenn der Kopf nicht verletzt werden sollte.","n":3},{"w":"desto","art":"","ipa":"/ˈdɛstoː/","m":"the","f":"desto","s":"Nun, ruhig hatte er ja nicht geschlafen, aber wahrscheinlich desto fester.","n":3}],[{"w":"allerdings","art":"","ipa":"/ˈʔalɐdɪŋs/","m":"but, however; indeed!","f":"allerdings","s":"Nun mußte die Schwester im Verein mit der Mutter auch kochen; allerdings machte das nicht viel Mühe, denn man aß fast nichts.","n":8},{"w":"Wand","art":"die","ipa":"/vant/","m":"wall, partition","f":"Wände","s":"Während des Tages wollte Gregor schon aus Rücksicht auf seine Eltern sich nicht beim Fenster zeigen, kriechen konnte er aber auf den paar Quadratmetern des Fußbodens auch nicht viel, das ruhige Liegen ertrug er schon während der Nacht schwer, das Essen macht…","n":9},{"w":"irgendein","art":"","ipa":"/ˈɪrɡəntˌaɪ̯n/","m":"some; any","f":"irgendeiner","s":"Auf diese Weise bekam nun Gregor täglich sein Essen, einmal am Morgen, wenn die Eltern und das Dienstmädchen noch schliefen, das zweitemal nach dem allgemeinen Mittagessen, denn dann schliefen die Eltern gleichfalls noch ein Weilchen, und das Dienstmädchen w…","n":8},{"w":"gewiss","art":"","ipa":"/ɡəˈvɪs/","m":"certain","f":"gewiß","s":"Er wäre gewiß nicht viel später auch ohne Störung erwacht, denn er fühlte sich genügend ausgeruht und ausgeschlafen, doch schien es ihm, als hätte ihn ein flüchtiger Schritt und ein vorsichtiges Schließen der zum Vorzimmer führenden Tür geweckt.","n":8},{"w":"Möbel","art":"das","ipa":"/ˈmøːbəl/","m":"piece of furniture; furniture","f":"Möbel","s":"Der Schein der elektrischen Straßenbahn lag bleich hier und da auf der Zimmerdecke und auf den höheren Teilen der Möbel, aber unten bei Gregor war es finster.","n":13},{"w":"Anblick","art":"der","ipa":"/ˈʔanblɪk/","m":"view, sight, look","f":"Anblick","s":"Denn tatsächlich sah er von Tag zu Tag die auch nur ein wenig entfernten Dinge immer undeutlicher; das gegenüberliegende Krankenhaus, dessen nur allzu häufigen Anblick er früher verflucht hatte, bekam er überhaupt nicht mehr zu Gesicht, und wenn er nicht gen…","n":7},{"w":"vollständig","art":"","ipa":"/ˈfɔlˌʃtɛndɪç/","m":"complete; entire","f":"vollständig","s":"Aber das hohe freie Zimmer, in dem er gezwungen war, flach auf dem Boden zu liegen, ängstigte ihn, ohne daß er die Ursache herausfinden konnte, denn es war ja sein seit fünf Jahren von ihm bewohntes Zimmer – und mit einer halb unbewußten Wendung und nicht oh…","n":7},{"w":"kriechen","art":"","ipa":"/ˈkʁiːçn̩/","m":"to creep; to crawl","f":"kroch","s":"Aber bald zog er ihn enttäuscht wieder zurück; nicht nur, daß ihm das Essen wegen seiner heiklen linken Seite Schwierigkeiten machte – und er konnte nur essen, wenn der ganze Körper schnaufend mitarbeitete –, so schmeckte ihm überdies die Milch, die sonst se…","n":7},{"w":"Kaste","art":"die","ipa":"/ˈkastə/","m":"caste","f":"Kasten","s":"Die Schwester nun bemerkte sofort die neue Unterhaltung, die Gregor für sich gefunden hatte – er hinterließ ja auch beim Kriechen hie und da Spuren seines Klebstoffes –, und da setzte sie es sich in den Kopf, Gregor das Kriechen in größtem Ausmaße zu ermögli…","n":8},{"w":"Kanapee","art":"das","ipa":"/ˈkanapeː/","m":"canapé; hors d'oeuvre; sofa; couch","f":"Kanapee","s":"Aber das hohe freie Zimmer, in dem er gezwungen war, flach auf dem Boden zu liegen, ängstigte ihn, ohne daß er die Ursache herausfinden konnte, denn es war ja sein seit fünf Jahren von ihm bewohntes Zimmer – und mit einer halb unbewußten Wendung und nicht oh…","n":18},{"w":"Leintuch","art":"das","ipa":"/ˈlaɪ̯nˌtuːx/","m":"bed sheet","f":"Leintuch","s":"Um ihr auch diesen Anblick zu ersparen, trug er eines Tages auf seinem Rücken – er brauchte zu dieser Arbeit vier Stunden – das Leintuch auf das Kanapee und ordnete es in einer solchen Weise an, daß er nun gänzlich verdeckt war, und daß die Schwester, selbst…","n":8},{"w":"Lauf","art":"der","ipa":"/laʊ̯f/","m":"run, race; leg of certain animals; barrel","f":"Laufe","s":"Ein Beinchen war übrigens im Laufe der vormittägigen Vorfälle schwer verletzt worden – es war fast ein Wunder, daß nur eines verletzt worden war – und schleppte leblos nach.","n":5},{"w":"Blick","art":"der","ipa":"[blɪk]","m":"glance, look; view","f":"Blick","s":"Wäre dieses Leintuch ihrer Meinung nach nicht nötig gewesen, dann hätte sie es ja entfernen können, denn daß es nicht zum Vergnügen Gregors gehören konnte, sich so ganz und gar abzusperren, war doch klar genug, aber sie ließ das Leintuch, so wie es war, und …","n":5},{"w":"offenbar","art":"","ipa":"/ˈɔfn̩baːɐ̯/","m":"apparent","f":"offenbar","s":"Früh, als die Türen versperrt waren, hatten alle zu ihm hereinkommen wollen, jetzt, da er die eine Tür geöffnet hatte und die anderen offenbar während des Tages geöffnet worden waren, kam keiner mehr, und die Schlüssel steckten nun auch von außen.","n":5},{"w":"Milch","art":"die","ipa":"/mɪlç/","m":"milk; white semen of a male fish","f":"Milch","s":"Denn dort stand ein Napf mit süßer Milch gefüllt, in der kleine Schnitte von Weißbrot schwammen.","n":5},{"w":"bemerken","art":"","ipa":"/bəˈmɛʁkən/","m":"to notice, to perceive","f":"bemerkte","s":"Sie fand ihn nicht gleich, aber als sie ihn unter dem Kanapee bemerkte – Gott, er mußte doch irgendwo sein, er hatte doch nicht wegfliegen können – erschrak sie so sehr, daß sie, ohne sich beherrschen zu können, die Tür von außen wieder zuschlug.","n":6},{"w":"Weile","art":"die","ipa":"/ˈvaɪ̯lə/","m":"while","f":"Weilchen","s":"Auf diese Weise bekam nun Gregor täglich sein Essen, einmal am Morgen, wenn die Eltern und das Dienstmädchen noch schliefen, das zweitemal nach dem allgemeinen Mittagessen, denn dann schliefen die Eltern gleichfalls noch ein Weilchen, und das Dienstmädchen w…","n":4},{"w":"Fuß","art":"der","ipa":"/fuːs/","m":"foot; footing; pedestal; metrical foot","f":"Füßen","s":"Täte sie es nicht von selbst, er wollte lieber verhungern, als sie darauf aufmerksam machen, trotzdem es ihn eigentlich ungeheuer drängte, unterm Kanapee vorzuschießen, sich der Schwester zu Füßen zu werfen und sie um irgend etwas Gutes zum Essen zu bitten.","n":4},{"w":"werfen","art":"","ipa":"/ˈvɛrfən/","m":"to throw; to cast; to project; to give birth","f":"werfen","s":"Täte sie es nicht von selbst, er wollte lieber verhungern, als sie darauf aufmerksam machen, trotzdem es ihn eigentlich ungeheuer drängte, unterm Kanapee vorzuschießen, sich der Schwester zu Füßen zu werfen und sie um irgend etwas Gutes zum Essen zu bitten.","n":4},{"w":"leer","art":"","ipa":"/leːɐ̯/","m":"empty","f":"leeren","s":"Ihr scheine das Gegenteil der Fall zu sein; ihr bedrücke der Anblick der leeren Wand geradezu das Herz; und warum solle nicht auch Gregor diese Empfindung haben, da er doch an die Zimmermöbel längst gewöhnt sei und sich deshalb im leeren Zimmer verlassen füh…","n":4},{"w":"Zustand","art":"der","ipa":"/ˈt͡suːˌʃtant/","m":"condition; state; state pattern","f":"Zustand","s":"Dort blieb er die ganze Nacht, die er zum Teil im Halbschlaf, aus dem ihn der Hunger immer wieder aufschreckte, verbrachte, zum Teil aber in Sorgen und undeutlichen Hoffnungen, die aber alle zu dem Schlusse führten, daß er sich vorläufig ruhig verhalten und …","n":4},{"w":"Schreibtisch","art":"der","ipa":"/ˈʃʁaɪ̯pˌtɪʃ/","m":"desk, cabinet","f":"Schreibtisch","s":"Die Schwester nun bemerkte sofort die neue Unterhaltung, die Gregor für sich gefunden hatte – er hinterließ ja auch beim Kriechen hie und da Spuren seines Klebstoffes –, und da setzte sie es sich in den Kopf, Gregor das Kriechen in größtem Ausmaße zu ermögli…","n":5},{"w":"besondere","art":"","ipa":"","m":"special, particular, extraordinary","f":"besonderem","s":"Und so hatte er damals mit ganz besonderem Feuer zu arbeiten angefangen und war fast über Nacht aus einem kleinen Kommis ein Reisender geworden, der natürlich ganz andere Möglichkeiten des Geldverdienens hatte, und dessen Arbeitserfolge sich sofort in Form d…","n":5},{"w":"aufmerksam","art":"","ipa":"[ˈaʊ̯fˌmɛʁkzaːm]","m":"attentive, alert, observant","f":"aufmerksam","s":"Täte sie es nicht von selbst, er wollte lieber verhungern, als sie darauf aufmerksam machen, trotzdem es ihn eigentlich ungeheuer drängte, unterm Kanapee vorzuschießen, sich der Schwester zu Füßen zu werfen und sie um irgend etwas Gutes zum Essen zu bitten.","n":5},{"w":"erschrecken","art":"","ipa":"/ɛʁˈʃʁɛkən/","m":"to be frightened; to be startled; to frighten","f":"erschrak","s":"Sie fand ihn nicht gleich, aber als sie ihn unter dem Kanapee bemerkte – Gott, er mußte doch irgendwo sein, er hatte doch nicht wegfliegen können – erschrak sie so sehr, daß sie, ohne sich beherrschen zu können, die Tür von außen wieder zuschlug.","n":5},{"w":"Apfel","art":"der","ipa":"/ˈapfəl/","m":"apple; apple tree; breasts","f":"Apfel","s":"Es war ein Apfel; gleich flog ihm ein zweiter nach; Gregor blieb vor Schrecken stehen; ein Weiterlaufen war nutzlos, denn der Vater hatte sich entschlossen, ihn zu bombardieren.","n":5},{"w":"legen","art":"","ipa":"/ˈleːɡən/","m":"causative of liegen: to lay; to lie down","f":"legte","s":"Schon im Laufe des ersten Tages legte der Vater die ganzen Vermögensverhältnisse und Aussichten sowohl der Mutter als auch der Schwester dar.","n":3},{"w":"Hunger","art":"der","ipa":"/ˈhʊŋɐ/","m":"hunger","f":"Hunger","s":"Fast hätte er vor Freude gelacht, denn er hatte noch größeren Hunger als am Morgen, und gleich tauchte er seinen Kopf fast bis über die Augen in die Milch hinein.","n":3},{"w":"diesmal","art":"","ipa":"","m":"this time","f":"diesmal","s":"Nun aber warteten oft beide, der Vater und die Mutter, vor Gregors Zimmer, während die Schwester dort aufräumte, und kaum war sie herausgekommen, mußte sie ganz genau erzählen, wie es in dem Zimmer aussah, was Gregor gegessen hatte, wie er sich diesmal benom…","n":3},{"w":"entfernt","art":"","ipa":"","m":"distant; away","f":"entfernten","s":"Spät erst in der Nacht wurde das Licht im Wohnzimmer ausgelöscht, und nun war leicht festzustellen, daß die Eltern und die Schwester so lange wachgeblieben waren, denn wie man genau hören konnte, entfernten sich jetzt alle drei auf den Fußspitzen.","n":3},{"w":"gegenüber","art":"","ipa":"[ɡeːɡŋ̍ˈʔyːbɐ]","m":"opposite; to, toward, towards; compared to","f":"gegenüber","s":"Eigentlich hätte er ja mit diesen überschüssigen Geldern die Schuld des Vaters gegenüber dem Chef weiter abgetragen haben können, und jener Tag, an dem er diesen Posten hätte loswerden können, wäre weit näher gewesen, aber jetzt war es zweifellos besser so, …","n":3},{"w":"Zeichen","art":"das","ipa":"/ˈt͡saɪ̯çən/","m":"sign, token; signal; sign, indication; character","f":"Zeichen","s":"Er war schon längst mit allem fertig und lag nur noch faul auf der gleichen Stelle, als die Schwester zum Zeichen, daß er sich zurückziehen solle, langsam den Schlüssel umdrehte.","n":3},{"w":"herein","art":"","ipa":"[hɛˈʁaɪ̯n]","m":"in","f":"herein","s":"Nun kam gewiß bis zum Morgen niemand mehr zu Gregor herein; er hatte also eine lange Zeit, um ungestört zu überlegen, wie er sein Leben jetzt neu ordnen sollte.","n":3},{"w":"übrig","art":"","ipa":"/ˈyːbʁɪç/","m":"rest of, remaining; left, left over; spare","f":"übrig","s":"Nun war sie aber nicht imstande, dies allein zu tun; den Vater wagte sie nicht um Hilfe zu bitten; das Dienstmädchen hätte ihr ganz gewiß nicht geholfen, denn dieses etwa sechzehnjährige Mädchen harrte zwar tapfer seit Entlassung der früheren Köchin aus, hat…","n":3},{"w":"Freude","art":"die","ipa":"/ˈfʁɔɪ̯də/","m":"joy, delight, glee","f":"Freude","s":"Fast hätte er vor Freude gelacht, denn er hatte noch größeren Hunger als am Morgen, und gleich tauchte er seinen Kopf fast bis über die Augen in die Milch hinein.","n":3},{"w":"verdienen","art":"","ipa":"/fɛɐ̯ˈdiːnən/","m":"to make money, to earn; to deserve","f":"verdienen","s":"Es war also bloß eine Summe, die man eigentlich nicht angreifen durfte, und die für den Notfall zurückgelegt werden mußte; das Geld zum Leben aber mußte man verdienen.","n":3},{"w":"Gespräch","art":"das","ipa":"/ɡəˈʃpʁɛːç/","m":"conversation, chat, talk","f":"Gespräch","s":"Besonders in der ersten Zeit gab es kein Gespräch, das nicht irgendwie wenn auch nur im geheimen, von ihm handelte.","n":3},{"w":"leiden","art":"","ipa":"/ˈlaɪ̯dən/","m":"to suffer, to experience pain, sorrow, etc.","f":"litten","s":"Gewiß wollten auch sie nicht, daß Gregor verhungere, aber vielleicht hätten sie es nicht ertragen können, von seinem Essen mehr als durch Hörensagen zu erfahren, vielleicht wollte die Schwester ihnen auch eine möglicherweise nur kleine Trauer ersparen, denn …","n":3},{"w":"treten","art":"","ipa":"[ˈtʰʁ̥eːtn̩]","m":"to step, to walk; to appear; to step; to tread","f":"trat","s":"Aber als bereue sie ihr Benehmen, öffnete sie die Tür sofort wieder und trat, als sei sie bei einem Schwerkranken oder gar bei einem Fremden, auf den Fußspitzen herein.","n":3},{"w":"Flasche","art":"die","ipa":"/ˈflaʃə/","m":"bottle; flask; flagon; loser; wimp","f":"Fläschchen","s":"Sie lief ins Nebenzimmer, um irgendeine Essenz zu holen, mit der sie die Mutter aus ihrer Ohnmacht wecken könnte; Gregor wollte auch helfen – zur Rettung des Bildes war noch Zeit –; er klebte aber fest an dem Glas und mußte sich mit Gewalt losreißen; er lief…","n":3},{"w":"Gewalt","art":"die","ipa":"/ɡəˈvalt/","m":"strong or violent force; violence; authority","f":"Gewalt","s":"Später aber mußte man sie mit Gewalt zurückhalten, und wenn sie dann rief: »Laßt mich doch zu Gregor, er ist ja mein unglücklicher Sohn!","n":3},{"w":"atmen","art":"","ipa":"/ˈaːtmən/","m":"to breathe","f":"atmen","s":"Aber es kostete ihn große Selbstüberwindung, auch nur die kurze Zeit, während welcher die Schwester im Zimmer war, unter dem Kanapee zu bleiben, denn von dem reichlichen Essen hatte sich sein Leib ein wenig gerundet, und er konnte dort in der Enge kaum atmen.","n":3},{"w":"verhindern","art":"","ipa":"/fɛɐ̯ˈhɪndɐn/","m":"to prevent, to inhibit, to keep from happening.","f":"verhinderte","s":"Es wäre für Gregor nicht unerwartet gewesen, wenn sie nicht eingetreten wäre, da er sie durch seine Stellung verhinderte, sofort das Fenster zu öffnen, aber sie trat nicht nur nicht ein, sie fuhr sogar zurück und schloß die Tür; ein Fremder hätte geradezu de…","n":3},{"w":"immerhin","art":"","ipa":"[ˈɪmɐˈhɪn]","m":"after all; at least, anyway, on the bright side","f":"immerhin","s":"Gregor hörte nun, wie die zwei schwachen Frauen den immerhin schweren alten Kasten von seinem Platze rückten, und wie die Schwester immerfort den größten Teil der Arbeit für sich beanspruchte, ohne auf die Warnungen der Mutter zu hören, welche fürchtete, daß…","n":3},{"w":"Absicht","art":"die","ipa":"/ˈapzɪçt/","m":"intention; intent","f":"Absichten","s":"Sie räumten ihm sein Zimmer aus; nahmen ihm alles, was ihm lieb war; den Kasten, in dem die Laubsäge und andere Werkzeuge lagen, hatten sie schon hinausgetragen; lockerten jetzt den schon im Boden fest eingegrabenen Schreibtisch, an dem er als Handelsakademi…","n":3},{"w":"ertragen","art":"","ipa":"/ɛʁˈtʁaːɡən/","m":"to bear, to stand, to endure, to take, to suffer, to tolerate, to handle","f":"ertragen","s":"Gewiß wollten auch sie nicht, daß Gregor verhungere, aber vielleicht hätten sie es nicht ertragen können, von seinem Essen mehr als durch Hörensagen zu erfahren, vielleicht wollte die Schwester ihnen auch eine möglicherweise nur kleine Trauer ersparen, denn …","n":3},{"w":"beobachten","art":"","ipa":"/bəˈoːbaxtən/","m":"to watch, to observe","f":"beobachtete","s":"Gregor hatte den Kopf bis knapp zum Rande des Kanapees vorgeschoben und beobachtete sie.","n":3},{"w":"Rock","art":"der","ipa":"/ʁɔk/","m":"skirt; jacket; dress; rock","f":"Rockes","s":"Nun aber war er doch gut aufgerichtet; in eine straffe blaue Uniform mit Goldknöpfen gekleidet, wie sie Diener der Bankinstitute tragen; über dem hohen steifen Kragen des Rockes entwickelte sich sein starkes Doppelkinn; unter den buschigen Augenbrauen drang …","n":3},{"w":"öfter","art":"","ipa":"[ˈʔœftɐ]","m":"ofttimes, from time to time","f":"Öfters","s":"Öfters fragte die Schwester den Vater, ob er Bier haben wolle, und herzlich erbot sie sich, es selbst zu holen, und als der Vater schwieg, sagte sie, um ihm jedes Bedenken zu nehmen, sie könne auch die Hausmeisterin darum schicken, aber dann sagte der Vater …","n":3},{"w":"Brot","art":"das","ipa":"/bʁoːt/","m":"bread; loaf of bread; slice of bread; sandwich","f":"Brot","s":"Da war altes halbverfaultes Gemüse; Knochen vom Nachtmahl her, die von festgewordener weißer Sauce umgeben waren; ein paar Rosinen und Mandeln; ein Käse, den Gregor vor zwei Tagen für ungenießbar erklärt hatte; ein trockenes Brot, ein mit Butter beschmiertes…","n":3}],[{"w":"Küche","art":"die","ipa":"/ˈkʏçə/","m":"kitchen; cuisine","f":"Küche","s":"Diese ernsten Herren, – alle drei hatten Vollbärte, wie Gregor einmal durch eine Türspalte feststellte – waren peinlich auf Ordnung, nicht nur in ihrem Zimmer, sondern, da sie sich nun einmal hier eingemietet hatten, in der ganzen Wirtschaft, also insbesonde…","n":7},{"w":"mittel","art":"","ipa":"/ˈmɪtəl/","m":"middle, in the middle; average, middling; mid","f":"mittlere","s":"Die Zimmerherren hatten schon ihr Nachtmahl beendet, der mittlere hatte eine Zeitung hervorgezogen, den zwei anderen je ein Blatt gegeben, und nun lasen sie zurückgelehnt und rauchten.","n":7},{"w":"Sessel","art":"der","ipa":"/ˈzɛsəl/","m":"armchair, easy chair; chair","f":"Sessel","s":"Der Vater schlief bald nach dem Nachtessen in seinem Sessel ein; die Mutter und Schwester ermahnten einander zur Stille; die Mutter nähte, weit über das Licht vorgebeugt, feine Wäsche für ein Modengeschäft; die Schwester, die eine Stellung als Verkäuferin an…","n":14},{"w":"stören","art":"","ipa":"/ʃtøːɐ̯n/","m":"to disturb, to interfere, to bother","f":"stören","s":"Hätte man doch dieser Bedienerin, statt sie nach ihrer Laune ihn nutzlos stören zu lassen, lieber den Befehl gegeben, sein Zimmer täglich zu reinigen!","n":6},{"w":"Wohnzimmer","art":"das","ipa":"/ˈvoːnˌt͡sɪmɐ/","m":"living room","f":"Wohnzimmer","s":"Und wenn nun auch Gregor durch seine Wunde an Beweglichkeit wahrscheinlich für immer verloren hatte und vorläufig zur Durchquerung seines Zimmers wie ein alter Invalide lange, lange Minuten brauchte – an das Kriechen in der Höhe war nicht zu denken –, so bek…","n":7},{"w":"erheben","art":"","ipa":"[ʔɛʁˈheːbn̩]","m":"to raise, lift; to levy, charge; to bring","f":"erhob","s":"Und auf die beiden Frauen gestützt, erhob er sich, umständlich, als sei er für sich selbst die größte Last, ließ sich von den Frauen bis zur Türe führen, winkte ihnen dort ab und ging nun selbständig weiter, während die Mutter ihr Nähzeug, die Schwester ihre…","n":7},{"w":"Bedienerin","art":"die","ipa":"[bəˈdiːnəʁɪn]","m":"a female assistent; a female help","f":"Bedienerin","s":"Der Haushalt wurde immer mehr eingeschränkt; das Dienstmädchen wurde nun doch entlassen; eine riesige knochige Bedienerin mit weißem, den Kopf umflatterndem Haar kam des Morgens und des Abends, um die schwerste Arbeit zu leisten; alles andere besorgte die Mu…","n":21},{"w":"gänzlich","art":"","ipa":"/ˈɡɛntslɪç/","m":"completely, totally, altogether; fully","f":"gänzlich","s":"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgülti…","n":7},{"w":"Violine","art":"die","ipa":"/vi̯oˈliːnə/","m":"violin","f":"Violine","s":"Gerade an diesem Abend – Gregor erinnerte sich nicht, während der ganzen Zeit die Violine gehört zu haben – ertönte sie von der Küche her.","n":7},{"w":"schließen","art":"","ipa":"[ˈʃliːsn̩]","m":"to shut; to close; to shut down; to lock; to end","f":"geschlossen","s":"Da mochten Mutter und Schwester mit kleinen Ermahnungen noch so sehr auf ihn eindringen, viertelstundenlang schüttelte er langsam den Kopf, hielt die Augen geschlossen und stand nicht auf.","n":5},{"w":"ehe","art":"","ipa":"/ˈʔeːə/","m":"before, ere; rather than","f":"ehe","s":"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgülti…","n":4},{"w":"traurig","art":"","ipa":"/ˈtʁaʊ̯.ʁɪç/","m":"sad","f":"traurigen","s":"Die schwere Verwundung Gregors, an der er über einen Monat litt – der Apfel blieb, da ihn niemand zu entfernen wagte, als sichtbares Andenken im Fleische sitzen –, schien selbst den Vater daran erinnert zu haben, daß Gregor trotz seiner gegenwärtigen traurig…","n":4},{"w":"erkennen","art":"","ipa":"/ɛɐ̯ˈkɛnən/","m":"to recognize, perceive","f":"erkannt","s":"Seine gute Absicht schien erkannt worden zu sein; es war nur ein augenblicklicher Schrecken gewesen.","n":4},{"w":"zufällig","art":"","ipa":"/ˈt͡suːfɛlɪç/","m":"random, by chance or stochastic","f":"zufällig","s":"Ohne irgendwie neugierig zu sein, hatte sie zufällig einmal die Tür von Gregors Zimmer aufgemacht und war im Anblick Gregors, der, gänzlich überrascht, trotzdem ihn niemand jagte, hin- und herzulaufen begann, die Hände im Schoß gefaltet staunend stehen gebli…","n":4},{"w":"lächeln","art":"","ipa":"/ˈlɛçəln/","m":"to smile","f":"lächeln","s":"Er war befriedigt, und Mutter und Schwester, die gespannt zugesehen hatten, begannen aufatmend zu lächeln.","n":4},{"w":"Schlafzimmer","art":"das","ipa":"/ˈʃlaːfˌt͡sɪmɐ/","m":"bedroom, bedchamber","f":"Schlafzimmer","s":"Denn kaum hatte am Abend die Schwester die Veränderung in Gregors Zimmer bemerkt, als sie, aufs höchste beleidigt, ins Wohnzimmer lief und, trotz der beschwörend erhobenen Hände der Mutter, in einen Weinkrampf ausbrach, dem die Eltern – der Vater war natürli…","n":4},{"w":"solch","art":"","ipa":"/zɔlç/","m":"such","f":"solcher","s":"Man hatte sich angewöhnt, Dinge, die man anderswo nicht unterbringen konnte, in dieses Zimmer hineinzustellen, und solcher Dinge gab es nun viele, da man ein Zimmer der Wohnung an drei Zimmerherren vermietet hatte.","n":4},{"w":"heben","art":"","ipa":"/ˈheːbən/","m":"to lift; to raise; to heave; to hoist; to rise","f":"hob","s":"Die Bedienerin aber, statt sich zu fürchten, hob bloß einen in der Nähe der Tür befindlichen Stuhl hoch empor, und wie sie mit groß geöffnetem Munde dastand, war ihre Absicht klar, den Mund erst zu schließen, wenn der Sessel in ihrer Hand auf Gregors Rücken …","n":5},{"w":"ergreifen","art":"","ipa":"/ɛʁˈɡʁaɪfən/","m":"to seize, capture; to take up","f":"ergriffen","s":"Aber in dem Eigensinn, der ihn, seitdem er Diener war, ergriffen hatte, bestand er immer darauf, noch länger bei Tisch zu bleiben, trotzdem er regelmäßig einschlief, und war dann überdies nur mit der größten Mühe zu bewegen, den Sessel mit dem Bett zu vertau…","n":5},{"w":"trotzen","art":"","ipa":"","m":"to defy, to brave","f":"trotz","s":"Die schwere Verwundung Gregors, an der er über einen Monat litt – der Apfel blieb, da ihn niemand zu entfernen wagte, als sichtbares Andenken im Fleische sitzen –, schien selbst den Vater daran erinnert zu haben, daß Gregor trotz seiner gegenwärtigen traurig…","n":5},{"w":"müde","art":"","ipa":"/ˈmyːdə/","m":"tired; tired of it, tired of","f":"müde","s":"Freilich waren es nicht mehr die lebhaften Unterhaltungen der früheren Zeiten, an die Gregor in den kleinen Hotelzimmern stets mit einigem Verlangen gedacht hatte, wenn er sich müde in das feuchte Bettzeug hatte werfen müssen.","n":3},{"w":"Schlaf","art":"der","ipa":"/ʃlaːf/","m":"sleep; temple","f":"Schlaf","s":"Sobald die Uhr zehn schlug, suchte die Mutter durch leise Zusprache den Vater zu wecken und dann zu überreden, ins Bett zu gehen, denn hier war es doch kein richtiger Schlaf und diesen hatte der Vater, der um sechs Uhr seinen Dienst antreten mußte, äußerst n…","n":3},{"w":"Hals","art":"der","ipa":"/hals/","m":"neck; throat","f":"Hals","s":"Nach dieser Erklärung würde die Schwester in Tränen der Rührung ausbrechen, und Gregor würde sich bis zu ihrer Achsel erheben und ihren Hals küssen, den sie, seitdem sie ins Geschäft ging, frei ohne Band oder Kragen trug.","n":3},{"w":"beenden","art":"","ipa":"[bəˈʔɛndn̩]","m":"to finish, to complete, to end; to terminate","f":"beendet","s":"Die Zimmerherren hatten schon ihr Nachtmahl beendet, der mittlere hatte eine Zeitung hervorgezogen, den zwei anderen je ein Blatt gegeben, und nun lasen sie zurückgelehnt und rauchten.","n":3},{"w":"Fleisch","art":"das","ipa":"/flaɪ̯ʃ/","m":"flesh; meat; pulp","f":"Fleische","s":"Die schwere Verwundung Gregors, an der er über einen Monat litt – der Apfel blieb, da ihn niemand zu entfernen wagte, als sichtbares Andenken im Fleische sitzen –, schien selbst den Vater daran erinnert zu haben, daß Gregor trotz seiner gegenwärtigen traurig…","n":3},{"w":"Tier","art":"das","ipa":"/tiːr/","m":"animal; hind","f":"Tier","s":"War er ein Tier, da ihn Musik so ergriff?","n":3},{"w":"seitdem","art":"","ipa":"","m":"since, ever since; since that","f":"seitdem","s":"Aber in dem Eigensinn, der ihn, seitdem er Diener war, ergriffen hatte, bestand er immer darauf, noch länger bei Tisch zu bleiben, trotzdem er regelmäßig einschlief, und war dann überdies nur mit der größten Mühe zu bewegen, den Sessel mit dem Bett zu vertau…","n":3},{"w":"schwach","art":"","ipa":"/ˈʃvax/","m":"weak, lacking in strength; weak","f":"schwächer","s":"Er hatte zwar Schmerzen im ganzen Leib, aber ihm war, als würden sie allmählich schwächer und schwächer und würden schließlich ganz vergehen.","n":3},{"w":"hinein","art":"","ipa":"[hɪˈnaɪ̯n]","m":"in","f":"hinein","s":"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgülti…","n":3},{"w":"schweigen","art":"","ipa":"/ˈʃvaɪ̯ɡən/","m":"to be silent; to keep quiet; to stop talking","f":"schwieg","s":"Er schwieg und sah gerade vor sich hin, als erwarte er etwas.","n":3},{"w":"Dunkel","art":"das","ipa":"/ˈdʊŋkl̩/","m":"dark, darkness","f":"Dunkel","s":"Und wenn nun auch Gregor durch seine Wunde an Beweglichkeit wahrscheinlich für immer verloren hatte und vorläufig zur Durchquerung seines Zimmers wie ein alter Invalide lange, lange Minuten brauchte – an das Kriechen in der Höhe war nicht zu denken –, so bek…","n":3},{"w":"einander","art":"","ipa":"/aɪ̯ˈnandɐ/","m":"Reciprocal pronoun of all three plural persons: each other","f":"einander","s":"Der Vater schlief bald nach dem Nachtessen in seinem Sessel ein; die Mutter und Schwester ermahnten einander zur Stille; die Mutter nähte, weit über das Licht vorgebeugt, feine Wäsche für ein Modengeschäft; die Schwester, die eine Stellung als Verkäuferin an…","n":3},{"w":"loswerden","art":"","ipa":"/ˈloːsˌveːɐ̯dn̩/","m":"to get rid of; to get off one's chest; to lose","f":"loszuwerden","s":"Ich will vor diesem Untier nicht den Namen meines Bruders aussprechen und sage daher bloß: wir müssen versuchen es loszuwerden.","n":3},{"w":"gleichzeitig","art":"","ipa":"[ˈɡlaɪ̯çˌtsaɪ̯tɪç]","m":"simultaneous, concurrent, coincident, concomitant","f":"gleichzeitig","s":"Er wollte sie nicht mehr aus seinem Zimmer lassen, wenigstens nicht, solange er lebte; seine Schreckgestalt sollte ihm zum erstenmal nützlich werden; an allen Türen seines Zimmers wollte er gleichzeitig sein und den Angreifern entgegenfauchen; die Schwester …","n":3},{"w":"stets","art":"","ipa":"/ʃteːts/","m":"always; constantly; the whole time; every time","f":"stets","s":"Freilich waren es nicht mehr die lebhaften Unterhaltungen der früheren Zeiten, an die Gregor in den kleinen Hotelzimmern stets mit einigem Verlangen gedacht hatte, wenn er sich müde in das feuchte Bettzeug hatte werfen müssen.","n":4},{"w":"erscheinen","art":"","ipa":"/ɛɐ̯ˈʃaɪ̯nən/","m":"to appear; to come out, be released","f":"erschienen","s":"Manchmal dachte er daran, beim nächsten Öffnen der Tür die Angelegenheiten der Familie ganz so wie früher wieder in die Hand zu nehmen; in seinen Gedanken erschienen wieder nach langer Zeit der Chef und der Prokurist, die Kommis und die Lehrjungen, der so be…","n":4},{"w":"umdrehen","art":"","ipa":"/ˈʔʊmdʁeːən/","m":"to twist, to turn, to turn around","f":"umdrehte","s":"fragte sie, als Gregor sich wieder umdrehte, und stellte den Sessel ruhig in die Ecke zurück.","n":4},{"w":"heftig","art":"","ipa":"/ˈhɛftɪç/","m":"fierce, heavy, vehement, severe, violent","f":"heftiger","s":"Einmal am frühen Morgen – ein heftiger Regen, vielleicht schon ein Zeichen des kommenden Frühjahrs, schlug an die Scheiben – war Gregor, als die Bedienerin mit ihren Redensarten wieder begann, derartig erbittert, daß er, wie zum Angriff, allerdings langsam u…","n":4},{"w":"aufrecht","art":"","ipa":"/ˈaʊ̯fˌʁɛçt/","m":"upright, erect, tall; unbowed, brave, resolute","f":"aufrecht","s":"Der Vater schien durch die Worte der Schwester auf bestimmtere Gedanken gebracht zu sein, hatte sich aufrecht gesetzt, spielte mit seiner Dienermütze zwischen den Tellern, die noch vom Nachtmahl der Zimmerherren her auf dem Tische standen, und sah bisweilen …","n":4},{"w":"drängen","art":"","ipa":"/ˈdʁɛŋən/","m":"to push, press; to push, press, to throng, crowd","f":"drängen","s":"Er eilte zu ihnen und suchte sie mit ausgebreiteten Armen in ihr Zimmer zu drängen und gleichzeitig mit seinem Körper ihnen den Ausblick auf Gregor zu nehmen.","n":4},{"w":"Schüssel","art":"die","ipa":"/ˈʃʏsəl/","m":"bowl, platter; basin; car; dish","f":"Schüssel","s":"Sofort erschien in der Tür die Mutter mit einer Schüssel Fleisch und knapp hinter ihr die Schwester mit einer Schüssel hochgeschichteter Kartoffeln.","n":4},{"w":"Rücksicht","art":"die","ipa":"/ˈʁʏkzɪçt/","m":"consideration","f":"Rücksicht","s":"Aber Gregor sah wohl ein, daß es nicht nur die Rücksicht auf ihn war, welche eine Übersiedlung verhinderte, denn ihn hätte man doch in einer passenden Kiste mit ein paar Luftlöchern leicht transportieren können; was die Familie hauptsächlich vom Wohnungswech…","n":4},{"w":"Besen","art":"der","ipa":"/ˈbeː.zn̩/","m":"broom","f":"Besens","s":"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgülti…","n":4},{"w":"allgemein","art":"","ipa":"/ˌalɡəˈmaɪ̯n/","m":"general, universal","f":"allgemeiner","s":"Und wenn nun auch Gregor durch seine Wunde an Beweglichkeit wahrscheinlich für immer verloren hatte und vorläufig zur Durchquerung seines Zimmers wie ein alter Invalide lange, lange Minuten brauchte – an das Kriechen in der Höhe war nicht zu denken –, so bek…","n":4},{"w":"eilen","art":"","ipa":"[ˈaɪ̯lən]","m":"to hurry, to rush; to hurry, to hasten, to rush","f":"eilte","s":"Er eilte zu ihnen und suchte sie mit ausgebreiteten Armen in ihr Zimmer zu drängen und gleichzeitig mit seinem Körper ihnen den Ausblick auf Gregor zu nehmen.","n":4},{"w":"Speise","art":"die","ipa":"/ˈʃpaɪ̯zə/","m":"meal, fare","f":"Speise","s":"Ohne jetzt mehr nachzudenken, womit man Gregor einen besonderen Gefallen machen könnte, schob die Schwester eiligst, ehe sie morgens und mittags ins Geschäft lief, mit dem Fuß irgendeine beliebige Speise in Gregors Zimmer hinein, um sie am Abend, gleichgülti…","n":4},{"w":"derartig","art":"","ipa":"","m":"such, suchlike","f":"derartige","s":"In der ersten Zeit stellte sich Gregor bei der Ankunft der Schwester in derartige besonders bezeichnende Winkel, um ihr durch diese Stellung gewissermaßen einen Vorwurf zu machen.","n":4},{"w":"Anfang","art":"der","ipa":"/ˈʔanfaŋ/","m":"start, beginning, origin","f":"Anfangs","s":"Anfangs rief sie ihn auch zu sich herbei, mit Worten, die sie wahrscheinlich für freundlich hielt, wie »Komm mal herüber, alter Mistkäfer!«","n":2},{"w":"klein","art":"","ipa":"/klaɪ̯n/","m":"small, little, wee; small, little, young","f":"kleinsten","s":"Und dabei hätte er gerade jetzt mehr Grund gehabt, sich zu verstecken, denn infolge des Staubes, der in seinem Zimmer überall lag und bei der kleinsten Bewegung umherflog, war auch er ganz staubbedeckt; Fäden, Haare, Speiseüberreste schleppte er auf seinem R…","n":2},{"w":"herum","art":"","ipa":"/hɛɐ̯ˈʁʊm/","m":"about, around.","f":"herum","s":"Und dabei hätte er gerade jetzt mehr Grund gehabt, sich zu verstecken, denn infolge des Staubes, der in seinem Zimmer überall lag und bei der kleinsten Bewegung umherflog, war auch er ganz staubbedeckt; Fäden, Haare, Speiseüberreste schleppte er auf seinem R…","n":2}]];
window.ALT=[{"id":"en","label":"English","note":"Übersetzung: David Wyllie","lang":"en","paras":[[],["One morning, when Gregor Samsa woke from troubled dreams, he found himself transformed in his bed into a horrible vermin. He lay on his armour-like back, and if he lifted his head a little he could see his brown belly, slightly domed and divided by arches into stiff sections. The bedding was hardly able to cover it and seemed ready to slide off any moment. His many legs, pitifully thin compared with the size of the rest of him, waved about helplessly as he looked.","“What’s happened to me?” he thought. It wasn’t a dream. His room, a proper human room although a little too small, lay peacefully between its four familiar walls. A collection of textile samples lay spread out on the table—Samsa was a travelling salesman—and above it there hung a picture that he had recently cut out of an illustrated magazine and housed in a nice, gilded frame. It showed a lady fitted out with a fur hat and fur boa who sat upright, raising a heavy fur muff that covered the whole of her lower arm towards the viewer.","Gregor then turned to look out the window at the dull weather. Drops of rain could be heard hitting the pane, which made him feel quite sad. “How about if I sleep a little bit longer and forget all this nonsense”, he thought, but that was something he was unable to do because he was used to sleeping on his right, and in his present state couldn’t get into that position. However hard he threw himself onto his right, he always rolled back to where he was. He must have tried it a hundred times, shut his eyes so that he wouldn’t have to look at the floundering legs, and only stopped when he began to feel a mild, dull pain there that he had never felt before.","“Oh, God”, he thought, “what a strenuous career it is that I’ve chosen! Travelling day in and day out. Doing business like this takes much more effort than doing your own business at home, and on top of that there’s the curse of travelling, worries about making train connections, bad and irregular food, contact with different people all the time so that you can never get to know anyone or become friendly with them. It can all go to Hell!” He felt a slight itch up on his belly; pushed himself slowly up on his back towards the headboard so that he could lift his head better; found where the itch was, and saw that it was covered with lots of little white spots which he didn’t know what to make of; and when he tried to feel the place with one of his legs he drew it quickly back because as soon as he touched it he was overcome by a cold shudder.","He slid back into his former position. “Getting up early all the time”, he thought, “it makes you stupid. You’ve got to get enough sleep. Other travelling salesmen live a life of luxury. For instance, whenever I go back to the guest house during the morning to copy out the contract, these gentlemen are always still sitting there eating their breakfasts. I ought to just try that with my boss; I’d get kicked out on the spot. But who knows, maybe that would be the best thing for me. If I didn’t have my parents to think about I’d have given in my notice a long time ago, I’d have gone up to the boss and told him just what I think, tell him everything I would, let him know just what I feel. He’d fall right off his desk! And it’s a funny sort of business to be sitting up there at your desk, talking down at your subordinates from up there, especially when you have to go right up close because the boss is hard of hearing. Well, there’s still some hope; once I’ve got the money together to pay off my parents’ debt to him—another five or six years I suppose—that’s definitely what I’ll do. That’s when I’ll make the big change. First of all though, I’ve got to get up, my train leaves at five.”","And he looked over at the alarm clock, ticking on the chest of drawers. “God in Heaven!” he thought. It was half past six and the hands were quietly moving forwards, it was even later than half past, more like quarter to seven. Had the alarm clock not rung? He could see from the bed that it had been set for four o’clock as it should have been; it certainly must have rung. Yes, but was it possible to quietly sleep through that furniture-rattling noise? True, he had not slept peacefully, but probably all the more deeply because of that. What should he do now? The next train went at seven; if he were to catch that he would have to rush like mad and the collection of samples was still not packed, and he did not at all feel particularly fresh and lively. And even if he did catch the train he would not avoid his boss’s anger as the office assistant would have been there to see the five o’clock train go, he would have put in his report about Gregor’s not being there a long time ago. The office assistant was the boss’s man, spineless, and with no understanding. What about if he reported sick? But that would be extremely strained and suspicious as in five years of service Gregor had never once yet been ill. His boss would certainly come round with the doctor from the medical insurance company, accuse his parents of having a lazy son, and accept the doctor’s recommendation not to make any claim as the doctor believed that no-one was ever ill but that many were workshy. And what’s more, would he have been entirely wrong in this case? Gregor did in fact, apart from excessive sleepiness after sleeping for so long, feel completely well and even felt much hungrier than usual.","He was still hurriedly thinking all this through, unable to decide to get out of the bed, when the clock struck quarter to seven. There was a cautious knock at the door near his head. “Gregor”, somebody called—it was his mother—“it’s quarter to seven. Didn’t you want to go somewhere?” That gentle voice! Gregor was shocked when he heard his own voice answering, it could hardly be recognised as the voice he had had before. As if from deep inside him, there was a painful and uncontrollable squeaking mixed in with it, the words could be made out at first but then there was a sort of echo which made them unclear, leaving the hearer unsure whether he had heard properly or not. Gregor had wanted to give a full answer and explain everything, but in the circumstances contented himself with saying: “Yes, mother, yes, thank-you, I’m getting up now.” The change in Gregor’s voice probably could not be noticed outside through the wooden door, as his mother was satisfied with this explanation and shuffled away. But this short conversation made the other members of the family aware that Gregor, against their expectations was still at home, and soon his father came knocking at one of the side doors, gently, but with his fist. “Gregor, Gregor”, he called, “what’s wrong?” And after a short while he called again with a warning deepness in his voice: “Gregor! Gregor!” At the other side door his sister came plaintively: “Gregor? Aren’t you well? Do you need anything?” Gregor answered to both sides: “I’m ready, now”, making an effort to remove all the strangeness from his voice by enunciating very carefully and putting long pauses between each, individual word. His father went back to his breakfast, but his sister whispered: “Gregor, open the door, I beg of you.” Gregor, however, had no thought of opening the door, and instead congratulated himself for his cautious habit, acquired from his travelling, of locking all doors at night even when he was at home.","The first thing he wanted to do was to get up in peace without being disturbed, to get dressed, and most of all to have his breakfast. Only then would he consider what to do next, as he was well aware that he would not bring his thoughts to any sensible conclusions by lying in bed. He remembered that he had often felt a slight pain in bed, perhaps caused by lying awkwardly, but that had always turned out to be pure imagination and he wondered how his imaginings would slowly resolve themselves today. He did not have the slightest doubt that the change in his voice was nothing more than the first sign of a serious cold, which was an occupational hazard for travelling salesmen.","It was a simple matter to throw off the covers; he only had to blow himself up a little and they fell off by themselves. But it became difficult after that, especially as he was so exceptionally broad. He would have used his arms and his hands to push himself up; but instead of them he only had all those little legs continuously moving in different directions, and which he was moreover unable to control. If he wanted to bend one of them, then that was the first one that would stretch itself out; and if he finally managed to do what he wanted with that leg, all the others seemed to be set free and would move about painfully. “This is something that can’t be done in bed”, Gregor said to himself, “so don’t keep trying to do it”.","The first thing he wanted to do was get the lower part of his body out of the bed, but he had never seen this lower part, and could not imagine what it looked like; it turned out to be too hard to move; it went so slowly; and finally, almost in a frenzy, when he carelessly shoved himself forwards with all the force he could gather, he chose the wrong direction, hit hard against the lower bedpost, and learned from the burning pain he felt that the lower part of his body might well, at present, be the most sensitive.","So then he tried to get the top part of his body out of the bed first, carefully turning his head to the side. This he managed quite easily, and despite its breadth and its weight, the bulk of his body eventually followed slowly in the direction of the head. But when he had at last got his head out of the bed and into the fresh air it occurred to him that if he let himself fall it would be a miracle if his head were not injured, so he became afraid to carry on pushing himself forward the same way. And he could not knock himself out now at any price; better to stay in bed than lose consciousness.","It took just as much effort to get back to where he had been earlier, but when he lay there sighing, and was once more watching his legs as they struggled against each other even harder than before, if that was possible, he could think of no way of bringing peace and order to this chaos. He told himself once more that it was not possible for him to stay in bed and that the most sensible thing to do would be to get free of it in whatever way he could at whatever sacrifice. At the same time, though, he did not forget to remind himself that calm consideration was much better than rushing to desperate conclusions. At times like this he would direct his eyes to the window and look out as clearly as he could, but unfortunately, even the other side of the narrow street was enveloped in morning fog and the view had little confidence or cheer to offer him. “Seven o’clock, already”, he said to himself when the clock struck again, “seven o’clock, and there’s still a fog like this.” And he lay there quietly a while longer, breathing lightly as if he perhaps expected the total stillness to bring things back to their real and natural state.","But then he said to himself: “Before it strikes quarter past seven I’ll definitely have to have got properly out of bed. And by then somebody will have come round from work to ask what’s happened to me as well, as they open up at work before seven o’clock.” And so he set himself to the task of swinging the entire length of his body out of the bed all at the same time. If he succeeded in falling out of bed in this way and kept his head raised as he did so he could probably avoid injuring it. His back seemed to be quite hard, and probably nothing would happen to it falling onto the carpet. His main concern was for the loud noise he was bound to make, and which even through all the doors would probably raise concern if not alarm. But it was something that had to be risked.","When Gregor was already sticking half way out of the bed—the new method was more of a game than an effort, all he had to do was rock back and forth—it occurred to him how simple everything would be if somebody came to help him. Two strong people—he had his father and the maid in mind—would have been more than enough; they would only have to push their arms under the dome of his back, peel him away from the bed, bend down with the load and then be patient and careful as he swang over onto the floor, where, hopefully, the little legs would find a use. Should he really call for help though, even apart from the fact that all the doors were locked? Despite all the difficulty he was in, he could not suppress a smile at this thought.","After a while he had already moved so far across that it would have been hard for him to keep his balance if he rocked too hard. The time was now ten past seven and he would have to make a final decision very soon. Then there was a ring at the door of the flat. “That’ll be someone from work”, he said to himself, and froze very still, although his little legs only became all the more lively as they danced around. For a moment everything remained quiet. “They’re not opening the door”, Gregor said to himself, caught in some nonsensical hope. But then of course, the maid’s firm steps went to the door as ever and opened it. Gregor only needed to hear the visitor’s first words of greeting and he knew who it was—the chief clerk himself. Why did Gregor have to be the only one condemned to work for a company where they immediately became highly suspicious at the slightest shortcoming? Were all employees, every one of them, louts, was there not one of them who was faithful and devoted who would go so mad with pangs of conscience that he couldn’t get out of bed if he didn’t spend at least a couple of hours in the morning on company business? Was it really not enough to let one of the trainees make enquiries—assuming enquiries were even necessary—did the chief clerk have to come himself, and did they have to show the whole, innocent family that this was so suspicious that only the chief clerk could be trusted to have the wisdom to investigate it? And more because these thoughts had made him upset than through any proper decision, he swang himself with all his force out of the bed. There was a loud thump, but it wasn’t really a loud noise. His fall was softened a little by the carpet, and Gregor’s back was also more elastic than he had thought, which made the sound muffled and not too noticeable. He had not held his head carefully enough, though, and hit it as he fell; annoyed and in pain, he turned it and rubbed it against the carpet.","“Something’s fallen down in there”, said the chief clerk in the room on the left. Gregor tried to imagine whether something of the sort that had happened to him today could ever happen to the chief clerk too; you had to concede that it was possible. But as if in gruff reply to this question, the chief clerk’s firm footsteps in his highly polished boots could now be heard in the adjoining room. From the room on his right, Gregor’s sister whispered to him to let him know: “Gregor, the chief clerk is here.” “Yes, I know”, said Gregor to himself; but without daring to raise his voice loud enough for his sister to hear him.","“Gregor”, said his father now from the room to his left, “the chief clerk has come round and wants to know why you didn’t leave on the early train. We don’t know what to say to him. And anyway, he wants to speak to you personally. So please open up this door. I’m sure he’ll be good enough to forgive the untidiness of your room.” Then the chief clerk called “Good morning, Mr. Samsa”. “He isn’t well”, said his mother to the chief clerk, while his father continued to speak through the door. “He isn’t well, please believe me. Why else would Gregor have missed a train! The lad only ever thinks about the business. It nearly makes me cross the way he never goes out in the evenings; he’s been in town for a week now but stayed home every evening. He sits with us in the kitchen and just reads the paper or studies train timetables. His idea of relaxation is working with his fretsaw. He’s made a little frame, for instance, it only took him two or three evenings, you’ll be amazed how nice it is; it’s hanging up in his room; you’ll see it as soon as Gregor opens the door. Anyway, I’m glad you’re here; we wouldn’t have been able to get Gregor to open the door by ourselves; he’s so stubborn; and I’m sure he isn’t well, he said this morning that he is, but he isn’t.” “I’ll be there in a moment”, said Gregor slowly and thoughtfully, but without moving so that he would not miss any word of the conversation. “Well I can’t think of any other way of explaining it, Mrs. Samsa”, said the chief clerk, “I hope it’s nothing serious. But on the other hand, I must say that if we people in commerce ever become slightly unwell then, fortunately or unfortunately as you like, we simply have to overcome it because of business considerations.” “Can the chief clerk come in to see you now then?”, asked his father impatiently, knocking at the door again. “No”, said Gregor. In the room on his right there followed a painful silence; in the room on his left his sister began to cry.","So why did his sister not go and join the others? She had probably only just got up and had not even begun to get dressed. And why was she crying? Was it because he had not got up, and had not let the chief clerk in, because he was in danger of losing his job and if that happened his boss would once more pursue their parents with the same demands as before? There was no need to worry about things like that yet. Gregor was still there and had not the slightest intention of abandoning his family. For the time being he just lay there on the carpet, and no-one who knew the condition he was in would seriously have expected him to let the chief clerk in. It was only a minor discourtesy, and a suitable excuse could easily be found for it later on, it was not something for which Gregor could be sacked on the spot. And it seemed to Gregor much more sensible to leave him now in peace instead of disturbing him with talking at him and crying. But the others didn’t know what was happening, they were worried, that would excuse their behaviour.","The chief clerk now raised his voice, “Mr. Samsa”, he called to him, “what is wrong? You barricade yourself in your room, give us no more than yes or no for an answer, you are causing serious and unnecessary concern to your parents and you fail—and I mention this just by the way—you fail to carry out your business duties in a way that is quite unheard of. I’m speaking here on behalf of your parents and of your employer, and really must request a clear and immediate explanation. I am astonished, quite astonished. I thought I knew you as a calm and sensible person, and now you suddenly seem to be showing off with peculiar whims. This morning, your employer did suggest a possible reason for your failure to appear, it’s true—it had to do with the money that was recently entrusted to you—but I came near to giving him my word of honour that that could not be the right explanation. But now that I see your incomprehensible stubbornness I no longer feel any wish whatsoever to intercede on your behalf. And nor is your position all that secure. I had originally intended to say all this to you in private, but since you cause me to waste my time here for no good reason I don’t see why your parents should not also learn of it. Your turnover has been very unsatisfactory of late; I grant you that it’s not the time of year to do especially good business, we recognise that; but there simply is no time of year to do no business at all, Mr. Samsa, we cannot allow there to be.”","“But Sir”, called Gregor, beside himself and forgetting all else in the excitement, “I’ll open up immediately, just a moment. I’m slightly unwell, an attack of dizziness, I haven’t been able to get up. I’m still in bed now. I’m quite fresh again now, though. I’m just getting out of bed. Just a moment. Be patient! It’s not quite as easy as I’d thought. I’m quite alright now, though. It’s shocking, what can suddenly happen to a person! I was quite alright last night, my parents know about it, perhaps better than me, I had a small symptom of it last night already. They must have noticed it. I don’t know why I didn’t let you know at work! But you always think you can get over an illness without staying at home. Please, don’t make my parents suffer! There’s no basis for any of the accusations you’re making; nobody’s ever said a word to me about any of these things. Maybe you haven’t read the latest contracts I sent in. I’ll set off with the eight o’clock train, as well, these few hours of rest have given me strength. You don’t need to wait, sir; I’ll be in the office soon after you, and please be so good as to tell that to the boss and recommend me to him!”","And while Gregor gushed out these words, hardly knowing what he was saying, he made his way over to the chest of drawers—this was easily done, probably because of the practise he had already had in bed—where he now tried to get himself upright. He really did want to open the door, really did want to let them see him and to speak with the chief clerk; the others were being so insistent, and he was curious to learn what they would say when they caught sight of him. If they were shocked then it would no longer be Gregor’s responsibility and he could rest. If, however, they took everything calmly he would still have no reason to be upset, and if he hurried he really could be at the station for eight o’clock. The first few times he tried to climb up on the smooth chest of drawers he just slid down again, but he finally gave himself one last swing and stood there upright; the lower part of his body was in serious pain but he no longer gave any attention to it. Now he let himself fall against the back of a nearby chair and held tightly to the edges of it with his little legs. By now he had also calmed down, and kept quiet so that he could listen to what the chief clerk was saying.","“Did you understand a word of all that?” the chief clerk asked his parents, “surely he’s not trying to make fools of us”. “Oh, God!” called his mother, who was already in tears, “he could be seriously ill and we’re making him suffer. Grete! Grete!” she then cried. “Mother?” his sister called from the other side. They communicated across Gregor’s room. “You’ll have to go for the doctor straight away. Gregor is ill. Quick, get the doctor. Did you hear the way Gregor spoke just now?” “That was the voice of an animal”, said the chief clerk, with a calmness that was in contrast with his mother’s screams. “Anna! Anna!” his father called into the kitchen through the entrance hall, clapping his hands, “get a locksmith here, now!” And the two girls, their skirts swishing, immediately ran out through the hall, wrenching open the front door of the flat as they went. How had his sister managed to get dressed so quickly? There was no sound of the door banging shut again; they must have left it open; people often do in homes where something awful has happened.","Gregor, in contrast, had become much calmer. So they couldn’t understand his words any more, although they seemed clear enough to him, clearer than before—perhaps his ears had become used to the sound. They had realised, though, that there was something wrong with him, and were ready to help. The first response to his situation had been confident and wise, and that made him feel better. He felt that he had been drawn back in among people, and from the doctor and the locksmith he expected great and surprising achievements—although he did not really distinguish one from the other. Whatever was said next would be crucial, so, in order to make his voice as clear as possible, he coughed a little, but taking care to do this not too loudly as even this might well sound different from the way that a human coughs and he was no longer sure he could judge this for himself. Meanwhile, it had become very quiet in the next room. Perhaps his parents were sat at the table whispering with the chief clerk, or perhaps they were all pressed against the door and listening.","Gregor slowly pushed his way over to the door with the chair. Once there he let go of it and threw himself onto the door, holding himself upright against it using the adhesive on the tips of his legs. He rested there a little while to recover from the effort involved and then set himself to the task of turning the key in the lock with his mouth. He seemed, unfortunately, to have no proper teeth—how was he, then, to grasp the key?—but the lack of teeth was, of course, made up for with a very strong jaw; using the jaw, he really was able to start the key turning, ignoring the fact that he must have been causing some kind of damage as a brown fluid came from his mouth, flowed over the key and dripped onto the floor. “Listen”, said the chief clerk in the next room, “he’s turning the key.” Gregor was greatly encouraged by this; but they all should have been calling to him, his father and his mother too: “Well done, Gregor”, they should have cried, “keep at it, keep hold of the lock!” And with the idea that they were all excitedly following his efforts, he bit on the key with all his strength, paying no attention to the pain he was causing himself. As the key turned round he turned around the lock with it, only holding himself upright with his mouth, and hung onto the key or pushed it down again with the whole weight of his body as needed. The clear sound of the lock as it snapped back was Gregor’s sign that he could break his concentration, and as he regained his breath he said to himself: “So, I didn’t need the locksmith after all”. Then he lay his head on the handle of the door to open it completely.","Because he had to open the door in this way, it was already wide open before he could be seen. He had first to slowly turn himself around one of the double doors, and he had to do it very carefully if he did not want to fall flat on his back before entering the room. He was still occupied with this difficult movement, unable to pay attention to anything else, when he heard the chief clerk exclaim a loud “Oh!”, which sounded like the soughing of the wind. Now he also saw him—he was the nearest to the door—his hand pressed against his open mouth and slowly retreating as if driven by a steady and invisible force. Gregor’s mother, her hair still dishevelled from bed despite the chief clerk’s being there, looked at his father. Then she unfolded her arms, took two steps forward towards Gregor and sank down onto the floor into her skirts that spread themselves out around her as her head disappeared down onto her breast. His father looked hostile, and clenched his fists as if wanting to knock Gregor back into his room. Then he looked uncertainly round the living room, covered his eyes with his hands and wept so that his powerful chest shook.","So Gregor did not go into the room, but leant against the inside of the other door which was still held bolted in place. In this way only half of his body could be seen, along with his head above it which he leant over to one side as he peered out at the others. Meanwhile the day had become much lighter; part of the endless, grey-black building on the other side of the street—which was a hospital—could be seen quite clearly with the austere and regular line of windows piercing its façade; the rain was still falling, now throwing down large, individual droplets which hit the ground one at a time. The washing up from breakfast lay on the table; there was so much of it because, for Gregor’s father, breakfast was the most important meal of the day and he would stretch it out for several hours as he sat reading a number of different newspapers. On the wall exactly opposite there was photograph of Gregor when he was a lieutenant in the army, his sword in his hand and a carefree smile on his face as he called forth respect for his uniform and bearing. The door to the entrance hall was open and as the front door of the flat was also open he could see onto the landing and the stairs where they began their way down below.","“Now, then”, said Gregor, well aware that he was the only one to have kept calm, “I’ll get dressed straight away now, pack up my samples and set off. Will you please just let me leave? You can see”, he said to the chief clerk, “that I’m not stubborn and I like to do my job; being a commercial traveller is arduous but without travelling I couldn’t earn my living. So where are you going, in to the office? Yes? Will you report everything accurately, then? It’s quite possible for someone to be temporarily unable to work, but that’s just the right time to remember what’s been achieved in the past and consider that later on, once the difficulty has been removed, he will certainly work with all the more diligence and concentration. You’re well aware that I’m seriously in debt to our employer as well as having to look after my parents and my sister, so that I’m trapped in a difficult situation, but I will work my way out of it again. Please don’t make things any harder for me than they are already, and don’t take sides against me at the office. I know that nobody likes the travellers. They think we earn an enormous wage as well as having a soft time of it. That’s just prejudice but they have no particular reason to think better of it. But you, sir, you have a better overview than the rest of the staff, in fact, if I can say this in confidence, a better overview than the boss himself—it’s very easy for a businessman like him to make mistakes about his employees and judge them more harshly than he should. And you’re also well aware that we travellers spend almost the whole year away from the office, so that we can very easily fall victim to gossip and chance and groundless complaints, and it’s almost impossible to defend yourself from that sort of thing, we don’t usually even hear about them, or if at all it’s when we arrive back home exhausted from a trip, and that’s when we feel the harmful effects of what’s been going on without even knowing what caused them. Please, don’t go away, at least first say something to show that you grant that I’m at least partly right!”","But the chief clerk had turned away as soon as Gregor had started to speak, and, with protruding lips, only stared back at him over his trembling shoulders as he left. He did not keep still for a moment while Gregor was speaking, but moved steadily towards the door without taking his eyes off him. He moved very gradually, as if there had been some secret prohibition on leaving the room. It was only when he had reached the entrance hall that he made a sudden movement, drew his foot from the living room, and rushed forward in a panic. In the hall, he stretched his right hand far out towards the stairway as if out there, there were some supernatural force waiting to save him.","Gregor realised that it was out of the question to let the chief clerk go away in this mood if his position in the firm was not to be put into extreme danger. That was something his parents did not understand very well; over the years, they had become convinced that this job would provide for Gregor for his entire life, and besides, they had so much to worry about at present that they had lost sight of any thought for the future. Gregor, though, did think about the future. The chief clerk had to be held back, calmed down, convinced and finally won over; the future of Gregor and his family depended on it! If only his sister were here! She was clever; she was already in tears while Gregor was still lying peacefully on his back. And the chief clerk was a lover of women, surely she could persuade him; she would close the front door in the entrance hall and talk him out of his shocked state. But his sister was not there, Gregor would have to do the job himself. And without considering that he still was not familiar with how well he could move about in his present state, or that his speech still might not—or probably would not—be understood, he let go of the door; pushed himself through the opening; tried to reach the chief clerk on the landing who, ridiculously, was holding on to the banister with both hands; but Gregor fell immediately over and, with a little scream as he sought something to hold onto, landed on his numerous little legs. Hardly had that happened than, for the first time that day, he began to feel alright with his body; the little legs had the solid ground under them; to his pleasure, they did exactly as he told them; they were even making the effort to carry him where he wanted to go; and he was soon believing that all his sorrows would soon be finally at an end. He held back the urge to move but swayed from side to side as he crouched there on the floor. His mother was not far away in front of him and seemed, at first, quite engrossed in herself, but then she suddenly jumped up with her arms outstretched and her fingers spread shouting: “Help, for pity’s sake, Help!” The way she held her head suggested she wanted to see Gregor better, but the unthinking way she was hurrying backwards showed that she did not; she had forgotten that the table was behind her with all the breakfast things on it; when she reached the table she sat quickly down on it without knowing what she was doing; without even seeming to notice that the coffee pot had been knocked over and a gush of coffee was pouring down onto the carpet.","“Mother, mother”, said Gregor gently, looking up at her. He had completely forgotten the chief clerk for the moment, but could not help himself snapping in the air with his jaws at the sight of the flow of coffee. That set his mother screaming anew, she fled from the table and into the arms of his father as he rushed towards her. Gregor, though, had no time to spare for his parents now; the chief clerk had already reached the stairs; with his chin on the banister, he looked back for the last time. Gregor made a run for him; he wanted to be sure of reaching him; the chief clerk must have expected something, as he leapt down several steps at once and disappeared; his shouts resounding all around the staircase. The flight of the chief clerk seemed, unfortunately, to put Gregor’s father into a panic as well. Until then he had been relatively self controlled, but now, instead of running after the chief clerk himself, or at least not impeding Gregor as he ran after him, Gregor’s father seized the chief clerk’s stick in his right hand (the chief clerk had left it behind on a chair, along with his hat and overcoat), picked up a large newspaper from the table with his left, and used them to drive Gregor back into his room, stamping his foot at him as he went. Gregor’s appeals to his father were of no help, his appeals were simply not understood, however much he humbly turned his head his father merely stamped his foot all the harder. Across the room, despite the chilly weather, Gregor’s mother had pulled open a window, leant far out of it and pressed her hands to her face. A strong draught of air flew in from the street towards the stairway, the curtains flew up, the newspapers on the table fluttered and some of them were blown onto the floor. Nothing would stop Gregor’s father as he drove him back, making hissing noises at him like a wild man. Gregor had never had any practice in moving backwards and was only able to go very slowly. If Gregor had only been allowed to turn round he would have been back in his room straight away, but he was afraid that if he took the time to do that his father would become impatient, and there was the threat of a lethal blow to his back or head from the stick in his father’s hand any moment. Eventually, though, Gregor realised that he had no choice as he saw, to his disgust, that he was quite incapable of going backwards in a straight line; so he began, as quickly as possible and with frequent anxious glances at his father, to turn himself round. It went very slowly, but perhaps his father was able to see his good intentions as he did nothing to hinder him, in fact now and then he used the tip of his stick to give directions from a distance as to which way to turn. If only his father would stop that unbearable hissing! It was making Gregor quite confused. When he had nearly finished turning round, still listening to that hissing, he made a mistake and turned himself back a little the way he had just come. He was pleased when he finally had his head in front of the doorway, but then saw that it was too narrow, and his body was too broad to get through it without further difficulty. In his present mood, it obviously did not occur to his father to open the other of the double doors so that Gregor would have enough space to get through. He was merely fixed on the idea that Gregor should be got back into his room as quickly as possible. Nor would he ever have allowed Gregor the time to get himself upright as preparation for getting through the doorway. What he did, making more noise than ever, was to drive Gregor forwards all the harder as if there had been nothing in the way; it sounded to Gregor as if there was now more than one father behind him; it was not a pleasant experience, and Gregor pushed himself into the doorway without regard for what might happen. One side of his body lifted itself, he lay at an angle in the doorway, one flank scraped on the white door and was painfully injured, leaving vile brown flecks on it, soon he was stuck fast and would not have been able to move at all by himself, the little legs along one side hung quivering in the air while those on the other side were pressed painfully against the ground. Then his father gave him a hefty shove from behind which released him from where he was held and sent him flying, and heavily bleeding, deep into his room. The door was slammed shut with the stick, then, finally, all was quiet."],["It was not until it was getting dark that evening that Gregor awoke from his deep and coma-like sleep. He would have woken soon afterwards anyway even if he hadn’t been disturbed, as he had had enough sleep and felt fully rested. But he had the impression that some hurried steps and the sound of the door leading into the front room being carefully shut had woken him. The light from the electric street lamps shone palely here and there onto the ceiling and tops of the furniture, but down below, where Gregor was, it was dark. He pushed himself over to the door, feeling his way clumsily with his antennae—of which he was now beginning to learn the value—in order to see what had been happening there. The whole of his left side seemed like one, painfully stretched scar, and he limped badly on his two rows of legs. One of the legs had been badly injured in the events of that morning—it was nearly a miracle that only one of them had been—and dragged along lifelessly.","It was only when he had reached the door that he realised what it actually was that had drawn him over to it; it was the smell of something to eat. By the door there was a dish filled with sweetened milk with little pieces of white bread floating in it. He was so pleased he almost laughed, as he was even hungrier than he had been that morning, and immediately dipped his head into the milk, nearly covering his eyes with it. But he soon drew his head back again in disappointment; not only did the pain in his tender left side make it difficult to eat the food—he was only able to eat if his whole body worked together as a snuffling whole—but the milk did not taste at all nice. Milk like this was normally his favourite drink, and his sister had certainly left it there for him because of that, but he turned, almost against his own will, away from the dish and crawled back into the centre of the room.","Through the crack in the door, Gregor could see that the gas had been lit in the living room. His father at this time would normally be sat with his evening paper, reading it out in a loud voice to Gregor’s mother, and sometimes to his sister, but there was now not a sound to be heard. Gregor’s sister would often write and tell him about this reading, but maybe his father had lost the habit in recent times. It was so quiet all around too, even though there must have been somebody in the flat. “What a quiet life it is the family lead”, said Gregor to himself, and, gazing into the darkness, felt a great pride that he was able to provide a life like that in such a nice home for his sister and parents. But what now, if all this peace and wealth and comfort should come to a horrible and frightening end? That was something that Gregor did not want to think about too much, so he started to move about, crawling up and down the room.","Once during that long evening, the door on one side of the room was opened very slightly and hurriedly closed again; later on the door on the other side did the same; it seemed that someone needed to enter the room but thought better of it. Gregor went and waited immediately by the door, resolved either to bring the timorous visitor into the room in some way or at least to find out who it was; but the door was opened no more that night and Gregor waited in vain. The previous morning while the doors were locked everyone had wanted to get in there to him, but now, now that he had opened up one of the doors and the other had clearly been unlocked some time during the day, no-one came, and the keys were in the other sides.","It was not until late at night that the gaslight in the living room was put out, and now it was easy to see that his parents and sister had stayed awake all that time, as they all could be distinctly heard as they went away together on tip-toe. It was clear that no-one would come into Gregor’s room any more until morning; that gave him plenty of time to think undisturbed about how he would have to re-arrange his life. For some reason, the tall, empty room where he was forced to remain made him feel uneasy as he lay there flat on the floor, even though he had been living in it for five years. Hardly aware of what he was doing other than a slight feeling of shame, he hurried under the couch. It pressed down on his back a little, and he was no longer able to lift his head, but he nonetheless felt immediately at ease and his only regret was that his body was too broad to get it all underneath.","He spent the whole night there. Some of the time he passed in a light sleep, although he frequently woke from it in alarm because of his hunger, and some of the time was spent in worries and vague hopes which, however, always led to the same conclusion: for the time being he must remain calm, he must show patience and the greatest consideration so that his family could bear the unpleasantness that he, in his present condition, was forced to impose on them.","Gregor soon had the opportunity to test the strength of his decisions, as early the next morning, almost before the night had ended, his sister, nearly fully dressed, opened the door from the front room and looked anxiously in. She did not see him straight away, but when she did notice him under the couch—he had to be somewhere, for God’s sake, he couldn’t have flown away—she was so shocked that she lost control of herself and slammed the door shut again from outside. But she seemed to regret her behaviour, as she opened the door again straight away and came in on tip-toe as if entering the room of someone seriously ill or even of a stranger. Gregor had pushed his head forward, right to the edge of the couch, and watched her. Would she notice that he had left the milk as it was, realise that it was not from any lack of hunger and bring him in some other food that was more suitable? If she didn’t do it herself he would rather go hungry than draw her attention to it, although he did feel a terrible urge to rush forward from under the couch, throw himself at his sister’s feet and beg her for something good to eat. However, his sister noticed the full dish immediately and looked at it and the few drops of milk splashed around it with some surprise. She immediately picked it up—using a rag, not her bare hands—and carried it out. Gregor was extremely curious as to what she would bring in its place, imagining the wildest possibilities, but he never could have guessed what his sister, in her goodness, actually did bring. In order to test his taste, she brought him a whole selection of things, all spread out on an old newspaper. There were old, half-rotten vegetables; bones from the evening meal, covered in white sauce that had gone hard; a few raisins and almonds; some cheese that Gregor had declared inedible two days before; a dry roll and some bread spread with butter and salt. As well as all that she had poured some water into the dish, which had probably been permanently set aside for Gregor’s use, and placed it beside them. Then, out of consideration for Gregor’s feelings, as she knew that he would not eat in front of her, she hurried out again and even turned the key in the lock so that Gregor would know he could make things as comfortable for himself as he liked. Gregor’s little legs whirred, at last he could eat. What’s more, his injuries must already have completely healed as he found no difficulty in moving. This amazed him, as more than a month earlier he had cut his finger slightly with a knife, he thought of how his finger had still hurt the day before yesterday. “Am I less sensitive than I used to be, then?”, he thought, and was already sucking greedily at the cheese which had immediately, almost compellingly, attracted him much more than the other foods on the newspaper. Quickly one after another, his eyes watering with pleasure, he consumed the cheese, the vegetables and
